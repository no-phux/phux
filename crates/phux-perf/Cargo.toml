[package]
name = "phux-perf"
description = "phux in-process performance telemetry: lock-free log2 histograms, counters, gauges, process statistics, and the snapshot/report types the GET_PERF command and `phux perf` render."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# The report crosses the wire as JSON (`CommandValue::Json`) and lands in
# logs as JSON, so the snapshot types derive `Serialize`/`Deserialize`.
# Both are already workspace dependencies of every crate that embeds this
# one; no new dependency enters the graph.
serde = { workspace = true }
serde_json.workspace = true
# `getrusage(2)` for the process section of a report (CPU split, peak RSS,
# context switches). Same crate and version phux-server already pins for its
# own syscalls; `resource` is the only feature this crate needs, and it keeps
# the call safe.
nix = { version = "0.29", default-features = false, features = ["resource"] }
# `pthread_set_qos_class_self_np` for `sched::promote_current_thread` on
# macOS; `nix` exposes no binding for it. Already in the graph through
# `nix`, `phux-crash`, and `portable-pty-adopt`; not a new dependency.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.186"
