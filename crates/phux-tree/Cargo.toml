[package]
name = "phux-tree"
description = "The replicated-document engine behind the AccessibilityTree, PixelSurface and Document resource kinds."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
phux-core.workspace = true
phux-resource.workspace = true
# The text-family rule a viewer shares (`typed_document::is_textual`);
# already in the graph through phux-resource.
phux-protocol.workspace = true
bytes.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
