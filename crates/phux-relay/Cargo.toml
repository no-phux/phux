[package]
name = "phux-relay"
description = "phux reference relay (ADR-0051/0052): a single-tenant byte relay bridging dial-out connector tunnels to inbound consumers, with SNI routing and route-bound enrollment tokens."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# ALPN constants only (default features): the relay never decodes frames.
phux-protocol.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# One QUIC endpoint terminates both relay legs.
quinn.workspace = true
# TLS 1.3 server config with the SNI cert-resolver gate (ADR-0052).
rustls.workspace = true
# Certificate provisioning/fingerprints (shared with phux-server; ADR-0051
# forbids depending on it) and the tunnel connection-ID tag.
phux-dial = { workspace = true, features = ["provision"] }
# Named by `RelayError::Rcgen`; same version/features as phux-dial's.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# Hex encode/decode of route-bound enrollment tokens.
hex = "0.4"
# Constant-time token comparison (no timing oracle).
subtle = "2"
# OS CSPRNG for token minting; `std` for `std::error::Error`.
getrandom = { version = "0.4", features = ["std"] }

[dev-dependencies]
tempfile.workspace = true
# Adds `testing` (`DropProxy`) for the backpressure test.
phux-dial = { workspace = true, features = ["provision", "testing"] }
