[package]
name = "phux-relay"
description = "phux reference relay (ADR-0051/0052/0057): quictun's blind QUIC relay bound to phux's ALPNs, connection-ID tag, and state directory."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# The relay itself; it depends on no phux crate (ADR-0181).
quictun = { workspace = true, features = ["relay"] }
# ALPN constants only (default features): the relay never decodes frames.
phux-protocol.workspace = true
# The `phxT` tunnel tag the dialer puts on a connector's connection ID.
phux-dial.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
quinn.workspace = true
# Adds `testing` (`DropProxy`) for the backpressure test.
phux-dial = { workspace = true, features = ["provision", "testing"] }
