# Kotlin-only UniFFI config for the Android artifact. Passed via --config so
# the crate's Swift uniffi.toml stays the Apple producer.
[bindings.kotlin]
package_name = "dev.phux.mobile.ffi"
android = true
# The built cdylib is renamed to libphux_mobile_ffi.so after linking (build
# script), so the generated `loadLibrary` call has to ask for that name
# rather than the crate's own (ADR-0135; phux-mobile-ffi era parity).
cdylib_name = "phux_mobile_ffi"
