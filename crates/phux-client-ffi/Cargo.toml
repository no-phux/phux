[package]
name = "phux-client-ffi"
description = "The phux binding crate: one runtime projection, a C ABI and a UniFFI encoder."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
# staticlib for Cockpit's linker and the Apple archives the xcframework
# carries, cdylib for the Android jniLibs and the library-mode bindgen, rlib
# so the in-crate `uniffi-bindgen` bin can link this crate.
crate-type = ["rlib", "staticlib", "cdylib"]

# `cargo run --bin uniffi-bindgen -- generate --library ...` emits the Swift
# and Kotlin that ship inside the mobile artifacts. Proc-macro mode: the
# exported surface is `#[uniffi::export]` in `src/uniffi/`, with no UDL to
# keep in sync.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi"]

# The rig seeder speaks the runtime directly; it stays out of C-only builds.
[[example]]
name = "rig_seed"
required-features = ["uniffi"]

[features]
# Cockpit's lane and the shipped default: the `extern "C"` surface
# `include/phux/client.h` declares. `cargo build -p phux-client-ffi` links no
# UniFFI scaffolding and no proc-macro generator.
default = ["c-abi"]
# `dep:` deps here are used only under `src/c/`: JSON-lines re-encoding
# (bytes), create-operation nonces (uuid), the `[[remote]]`/`[[satellite]]`
# registry schema (phux-config) and the embedder-facing log init (tracing,
# tracing-subscriber). Gating them keeps the mobile artifact's dependency
# closure the same size it was as `phux-mobile-ffi`.
c-abi = ["dep:bytes", "dep:uuid", "dep:phux-config", "dep:tracing", "dep:tracing-subscriber"]
# The mobile lane: the Swift/Kotlin surface UniFFI generates. Off by default
# so Cockpit's `ffi-release` archive never carries it (ADR-0135). Kitty
# graphics stays on for parity with the `phux-mobile-ffi` era artifact (its
# `engine` feature carried `libghostty-vt/kitty-graphics` so the artifact
# exposed the image surface); nothing on this side reads placements yet, but
# the capability isn't dropped silently in a shipped artifact.
uniffi = [
    "dep:uniffi",
    "dep:thiserror",
    "dep:unicode-segmentation",
    "libghostty-vt/kitty-graphics",
]

[dependencies]
libghostty-vt.workspace = true
phux-client-core = { workspace = true, features = ["native-engine"] }
phux-protocol.workspace = true
# The kernel hands the bridge decoded AgentEventsJsonlV1 records; the C ABI
# carries them as JSON lines again, so the same workspace-pinned encoder
# re-emits them. No new crate enters the lockfile.
serde_json.workspace = true
# The C ABI re-encodes the bridge's decoded records as JSON-line bytes.
# Optional: `c-abi` only, see [features].
bytes = { workspace = true, optional = true }
# The server requires UUID-shaped create-operation nonces, just as the CLI
# emits. Reuse the already-locked workspace v4 implementation rather than
# inventing a second collision-prone generator for concurrent native clients.
# Optional: `c-abi` only, see [features].
uuid = { workspace = true, optional = true }
# Remote hosts (`remote` module, ADR-0007/ADR-0031/ADR-0093 rung 1) are the
# runtime's relay tunnel behind a C handle (ADR-0133): resolution, dial
# planning, trust rules and the relay live there, so an embedder never
# carries a second registry reader or a second dialer. The machine-registry
# snapshot still reads `[[remote]]` and `[[satellite]]` entries through the
# CLI's own schema. Always on: the runtime layer both encoders sit on.
phux-client-runtime.workspace = true
# The `[[remote]]`/`[[satellite]]` registry schema `src/c/remote/registry.rs`
# reads. Optional: `c-abi` only, see [features].
phux-config = { workspace = true, optional = true }
# `phux_client_log_init` gives an embedder the tunnel's lifecycle on its own
# stderr, and the dial stacks (quinn, rustls, phux-dial) already speak
# `tracing`, so without a subscriber their spans are dropped. Both crates are
# workspace deps already locked through phux-server at these exact features
# (env-filter + fmt); nothing new enters Cargo.lock. tracing's `log` feature
# stays off: feature unification would switch it on workspace-wide. Optional:
# `c-abi` only, see [features].
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# The binding generator and its runtime scaffolding, behind the `uniffi`
# feature. It is new to this workspace's DEFAULT graph only when that feature
# is on: no shipped phux executable depends on this crate, and Cockpit's
# `just cockpit-ffi` builds the default features, so the proc-macro generator
# stack (uniffi_bindgen/uniffi_meta/uniffi_macros plus askama, weedle2,
# camino, clap and cargo_metadata) is compiled only for the mobile artifact
# jobs. In the library it adds a small lowering/lifting runtime over `bytes`
# and `once_cell`, both already locked here. 0.28 is the exact version the
# mobile artifact has always shipped, kept so merging the two shims changes
# ownership and not generated output. The `cli` feature is what lets the
# in-crate `uniffi-bindgen` bin drive generation from the built library, which
# is how the artifact's Swift is guaranteed to come from this revision.
uniffi = { version = "0.28", features = ["cli"], optional = true }
# Error-derive for the UniFFI-facing error enums.
thiserror = { workspace = true, optional = true }
# Grapheme segmentation for the mobile text-commit path into the shared
# predictor.
unicode-segmentation = { workspace = true, optional = true }

[dev-dependencies]
# The connected lane's e2e test runs the real server the TUI runs.
phux-server-testkit.workspace = true
# A registry fixture file for the resolution and relay tests.
tempfile.workspace = true
# `TunnelShared::inject_failure` for the captured-tunnel test.
phux-client-runtime = { workspace = true, features = ["testing"] }
# The relay tests run a loopback WebSocket echo server against the tunnel.
tokio.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
