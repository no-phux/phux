[package]
name = "phux-client-ffi"
description = "The phux mobile binding crate: the UniFFI surface over the client runtime."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
# staticlib for the Apple archives the xcframework carries, cdylib for the
# Android jniLibs and the library-mode bindgen, rlib so the in-crate
# `uniffi-bindgen` bin can link this crate.
crate-type = ["rlib", "staticlib", "cdylib"]

# `cargo run --bin uniffi-bindgen -- generate --library ...` emits the Swift
# and Kotlin that ship inside the mobile artifacts. Proc-macro mode: the
# exported surface is `#[uniffi::export]` in `src/uniffi/`, with no UDL to
# keep in sync.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi"]

[features]
# The binding generator CLI the `uniffi-bindgen` bin drives. The exported
# surface itself is always built; this only adds the generator stack
# (uniffi_bindgen, askama, clap, cargo_metadata) for the artifact jobs, which
# build with `--no-default-features --features uniffi`.
uniffi = ["uniffi/cli"]

[dependencies]
# Kitty graphics stays on for parity with the `phux-mobile-ffi` era artifact,
# which exposed the image surface.
libghostty-vt = { workspace = true, features = ["kitty-graphics"] }
phux-client-core = { workspace = true, features = ["native-engine"] }
phux-client-runtime.workspace = true
phux-protocol.workspace = true
# The surface carries the kernel's decoded agent records as JSON lines again.
serde_json.workspace = true
thiserror.workspace = true
uniffi = "0.32"

[dev-dependencies]
# The live QUIC and relay tests run the real server and relay.
phux-server.workspace = true
phux-server-testkit.workspace = true
phux-relay.workspace = true
phux-config.workspace = true
tempfile.workspace = true
tokio.workspace = true
# Test-only signers and publication seams.
phux-client-runtime = { workspace = true, features = ["testing"] }
