# Agent-state detection manifest for Cursor Agent CLI (ADR-0046).
#
# Identity is verified: `cursor-agent` is a bash wrapper that `exec -a "$0"`s
# the bundled Node entry, so argv[0] is `cursor-agent`. The login splash was
# observed from Cursor Agent 2026.09.10-fd3934; tests use compact text samples
# for the rule contract rather than pinning incidental viewport chrome.
#
# No working or blocked screen was observed. This environment's CLI stopped
# at "Press any key to log in..." / a browser sign-in URL. The working and
# blocked rules at the end of this file are adapted from herdr instead.
# Identity still publishes: an identified pane whose manifest matches nothing
# is idle, never blocked (ADR-0046 §D).

kind = "cursor-agent"
name = "cursor-agent"

# The PATH shim is `cursor-agent`; `exec -a "$0"` keeps that basename on
# the node process. Do not list `cursor` or `agent`: the former is a data
# directory (`.cursor/`) and the latter is generic.
binaries = ["cursor-agent"]

# --- Screen rules ------------------------------------------------------------
#
# The captured login splash is not a lifecycle state. Matching it as
# `blocked` would paint every unauthenticated pane red. The rule carries
# no `state` so a match is evidence of nothing: the detector fails safe
# to idle and still publishes identity. That is the point — a cursor-agent
# pane waiting on browser login should appear in Agents, not vanish.

[[rules]]
id = "login-splash"
priority = 50
region = "viewport"
match = { any = [
  { contains = "press any key to log in" },
  { contains = "signing in with the browser" },
] }

# --- Patterns adopted from herdr ----------------------------------------------
#
# Adapted from herdr's cursor manifest, version 2026.08.03.1
# (https://github.com/ogulcancelik/herdr, Apache-2.0; see
# THIRD-PARTY-NOTICES.md). They are NOT verified against a phux capture: the
# CLI here stopped at its login splash. The screens that pin them are under
# `src/fixtures/herdr/cursor-agent/`, assembled from the strings the herdr
# manifest names. herdr reads the command approval from the whole screen;
# here it reads the last 12 non-empty rows.

# The file-write approval: "Write to this file?" with its "Proceed (y)" option
# and one of its reject/keep hints.
[[rules]]
id = "write-file-approval"
state = "blocked"
priority = 80
region = "bottom-lines(8)"
match = { all = [
  { contains = "write to this file?" },
  { contains = "proceed (y)" },
  { any = [
    { contains = "reject & propose changes" },
    { contains = "esc or n or p" },
    { contains = "add write(" },
  ] },
] }

# A command approval and its key-labelled options ("Run (once) (y)", "Skip
# (esc or n)", "Allow … (y)").
[[rules]]
id = "command-approval"
state = "blocked"
priority = 75
region = "bottom-lines(12)"
match = { any = [
  { all = [
    { contains = "waiting for approval" },
    { contains = "run this command?" },
    { any = [{ contains = "run (once) (y)" }, { contains = "skip (esc or n)" }] },
  ] },
  { contains = "(y) (enter)" },
  { line-regex = '(?i)^\s*allow .*\(y\)' },
  { contains = "keep (n)" },
  { contains = "skip (esc or n)" },
  { line-regex = '(?i)^\s*(?:→\s*)?run .*\(y\)' },
] }

# "ctrl+c to stop" under a live turn.
[[rules]]
id = "stop-hint"
state = "working"
priority = 60
region = "bottom-lines(6)"
match = { contains = "ctrl+c to stop" }

[[rules]]
id = "background-tasks"
state = "working"
priority = 55
region = "bottom-lines(5)"
match = { line-regex = '(?i)\b[1-9][0-9]*\s+background\s+tasks?\b' }

# A hexagon or braille spinner ahead of an -ing word: "⬢ Generating".
[[rules]]
id = "spinner-status"
state = "working"
priority = 50
region = "bottom-lines(8)"
match = { line-regex = '^\s*(⬡|⬢|[\x{2800}-\x{28FF}]+)\s+\p{Alphabetic}+\w*ing\b' }
