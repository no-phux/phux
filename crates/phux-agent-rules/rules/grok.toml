# Agent-state detection manifest for Grok Build TUI (ADR-0046).
#
# The rules below are verified against sanitized 120x40 `phux snapshot --json`
# viewports captured from Grok 1.0.30. Fixtures retain the rendered viewport;
# only machine-specific paths are replaced.
#
# The governing doctrine (ADR-0046 §D): a MISSED signal is cheap, a FALSE
# `blocked` is not. Tool approval was not observed under this installation's
# effective mode, but the startup folder-trust chooser was captured and is a
# stable blocking surface.

kind = "grok"
name = "grok"

# Native `grok` argv[0] basename. The Homebrew/internal installer puts a
# symlink at ~/.local/bin/grok -> ~/.grok/bin/grok.
binaries = ["grok"]

# --- Title rules -------------------------------------------------------------
#
# While a turn runs, Grok writes an animated braille spinner into the OSC
# title, then a dash, then a status verb, then the conversation title, then
# ` - grok`. Captured frames from Grok 1.0.30:
#
#     '⠋ - Waiting for response… - grok'
#     '⠙ - Waiting for response… - grok'
#     '⠼ - Thinking - Migrate Phux CLI to usage-rs, scorched-e… - grok'
#
# When no turn is running the title is the bare `grok` (startup splash) or
# the conversation title with a trailing ` - grok` and no spinner:
#
#     'grok'
#     'Count Slowly from 1 to 80 Line by Line - grok'
#
# The rule matches a Braille Patterns prefix followed by ` - `, not the
# status verb: the verb set is already two members and is likely to grow,
# while no idle title begins with a braille glyph and a dash. The bare
# title is deliberately NOT given an `idle` rule: it means "not running a
# turn", which would cover a permission dialog if one is ever captured.

[[rules]]
id = "title-busy-spinner"
state = "working"
priority = 100
region = "title"
match = { line-regex = "^[⠀-⣿] - " }

# --- Screen rules ------------------------------------------------------------
#
# A screen-side `working` backstop for a terminal that suppresses the OSC
# title. Grok paints a braille spinner, status text, and elapsed seconds while
# a turn runs. The rule matches that stable structure.
#
# An observed mid-session pane painted `⠼ Thinking… 18s`. The rule matches
# by structure: a braille spinner, a status token with an ellipsis, and an
# elapsed-seconds figure. The `bottom-lines(14)` window reaches that status
# row without depending on unrelated transcript content or banner placement.

[[rules]]
id = "screen-status-elapsed-backstop"
state = "working"
priority = 60
region = "bottom-lines(14)"
match = { line-regex = '^\s*[⠀-⣿]\s+\S.*…\s+\d' }

# VERIFIED: before Grok opens a folder containing project instructions, it
# replaces the composer with this trust chooser. Pair the question with both
# hotkey-anchored choices and require the normal composer hint to be absent, so
# ordinary transcript prose quoting the chooser cannot assert blocked. The
# chooser is vertically centered, so use the viewport rather than a fixed
# bottom window that would miss it on taller terminals.
[[rules]]
id = "folder-trust-dialog"
state = "blocked"
priority = 80
region = "viewport"
match = { all = [
  { contains = "Do you trust the contents of this directory?" },
  { line-regex = '^\s*Yes, proceed\s+y\s*$' },
  { line-regex = '^\s*No, quit\s+n\s*$' },
  { not = { contains = "Shift+Tab:mode" } },
] }

# --- Patterns adopted from herdr ----------------------------------------------
#
# Adapted from herdr's grok manifest, version 2026.10.05.1
# (https://github.com/ogulcancelik/herdr, Apache-2.0; see
# THIRD-PARTY-NOTICES.md), which tracks Grok releases after 1.0.30. NOT
# verified against a phux capture; the screens that pin them are under
# `src/fixtures/herdr/grok/` and are herdr's test excerpts or are assembled
# from the strings the herdr manifest names. Each working rule sits below the
# captured backstop above, so the captured rule still names its own matches.

# "⚠ Action Required - project" while a dialog waits. Outranks the spinner.
[[rules]]
id = "title-action-required"
state = "blocked"
priority = 110
region = "title"
match = { contains = "Action Required" }

# Later titles carry the spinner as a word anywhere ("project - ⠹ - session"),
# not only as the prefix the captured rule above anchors on.
[[rules]]
id = "title-spinner-word"
state = "working"
priority = 90
region = "title"
match = { line-regex = '(?:^|\s)[\x{2801}-\x{28FF}](?:\s|$)' }

# OSC 9;4 indeterminate progress while a turn runs.
[[rules]]
id = "osc-progress-working"
state = "working"
priority = 55
region = "osc-progress"
match = { line-regex = '^4;1;-1$' }

# An option dialog: heavy-bar rows with a key and a radio mark,
# "┃ y (●) Yes, proceed".
[[rules]]
id = "option-dialog"
state = "blocked"
priority = 85
region = "viewport"
match = { line-regex = '^\s*┃\s+[0-9a-z]+\s+\([●○]\)\s' }

# The permission prompt's key-hint footer ("↑↓:select │ Ctrl+o:yolo │
# Ctrl+c:cancel") and the question dialog's ("Tab:scrollback │
# Shift+x:dismiss").
[[rules]]
id = "permission-hints"
state = "blocked"
priority = 85
region = "bottom-lines(2)"
match = { any = [
  { all = [{ contains = ":select" }, { contains = "ctrl+o:yolo" }, { contains = "ctrl+c:cancel" }] },
  { all = [{ contains = "tab:scrollback" }, { contains = "shift+x:dismiss" }] },
] }

# The permission-scope selector.
[[rules]]
id = "permission-scope-selector"
state = "blocked"
priority = 85
region = "viewport"
match = { all = [
  { contains = "yes, proceed" },
  { contains = "no, reject" },
  { any = [
    { contains = "use ← → to choose permission whitelist scope" },
    { contains = "←/→:scope" },
  ] },
] }

# A spinner status row ending in its "[stop]" control, or a spinner ahead of a
# tool verb.
[[rules]]
id = "spinner-status"
state = "working"
priority = 55
region = "bottom-lines(14)"
match = { any = [
  { line-regex = '^\s*[\x{2801}-\x{28FF}]\s.*\[stop\]\s*$' },
  { line-regex = '^\s*[\x{2801}-\x{28FF}]\s+(Run|Read|Search|List)\b' },
] }

# The composer's key hints while a turn runs gain a cancel key:
# "Shift+Tab:mode │ Ctrl+c:cancel │ Ctrl+.:shortcuts".
[[rules]]
id = "cancel-hints"
state = "working"
priority = 54
region = "bottom-lines(2)"
match = { all = [
  { contains = "ctrl+.:shortcuts" },
  { any = [{ contains = "esc:cancel" }, { contains = "ctrl+c:cancel" }] },
] }

# --- Rules deliberately NOT written ------------------------------------------
#
# No `idle` rule. The composer and the opt-in banner are painted identically
# whether or not a turn is running. `idle` is the detector's fail-safe
# default (ADR-0046 §D). herdr's `osc_title_idle`, `osc_progress_idle` and
# `prompt_hints_idle` are dropped for the same reason.
#
# No captured tool-permission rule. This installation ran tool calls without
# painting one; the blocked rules above come from herdr.
