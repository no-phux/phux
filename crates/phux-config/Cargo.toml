[package]
name = "phux-config"
description = "Config (TOML) loader + status-bar widget specs for phux."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# The client-neutral half of the file (layers, `[[remote]]`, `[organize]`,
# instance paths), re-exported so every `phux_config::` path keeps working.
phux-config-core.workspace = true
phux-protocol.workspace = true
serde.workspace = true
toml.workspace = true
# Comment-preserving edits to the user's config.toml for the settings
# catalogue's writer (`settings::write_edit`, phux-u1tq.3). A settings page
# must round-trip through the file (ADR-0023), and re-serializing the typed
# `Config` would flatten a hand-commented file into a generated one; the
# mutable document keeps every untouched byte. Already a workspace
# dependency (the phux binary's plugin / satellite / remote registries edit
# the same file the same way), so this adds a consumer, not a new crate.
toml_edit.workspace = true
# Full dotted paths on schema errors, for `phux config check` and for the
# loader's own message.
serde_path_to_error.workspace = true
# `overlay::detect_magic_dns` reads `tailscale status --json`. Already a
# workspace dependency (and this crate's dev-dependency), so this adds a
# consumer, not new third-party code.
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Validates the `time` status-bar widget's strftime `format`.
jiff.workspace = true
# `json_schema`: the editor schemas under `docs/spec/`, derived from the
# serde types (phux-protocol already builds it at this spec).
schemars = "1.2.3"

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
