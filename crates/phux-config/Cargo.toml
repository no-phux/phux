[package]
name = "phux-config"
description = "Config (TOML) loader + status-bar widget contract for phux."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
phux-protocol = { workspace = true, features = ["server"] }
serde.workspace = true
# Used to build `Cell::text` inline; matches phux-protocol's storage type
# for `Cell::text` (see phux-x7a).
smallvec.workspace = true
# `WidgetCells::cells.len()` IS the status bar's width contract — the
# fitting pass, the narrowing order, the elastic-spacer slack (ADR-0087)
# and the click-target map all measure in cells. A window name is
# arbitrary text, so that count is only true if a double-width character
# occupies two cells: counting it as one made a CJK window name render
# about twice as wide as the bar believed, overflow the row, and wrap
# into the pane grid. Already a workspace dependency (vendored and pinned
# for phux-client-core's predict layer and phux-client's chrome), so this
# adds a consumer rather than new third-party code.
unicode-width = { workspace = true }
toml.workspace = true
# Comment-preserving edits to the user's config.toml for the settings
# catalogue's writer (`settings::write_edit`, phux-u1tq.3). A settings page
# must round-trip through the file (ADR-0023), and re-serializing the typed
# `Config` would flatten a hand-commented file into a generated one; the
# mutable document keeps every untouched byte. Already a workspace
# dependency (the phux binary's plugin / satellite / remote registries edit
# the same file the same way), so this adds a consumer, not a new crate.
toml_edit.workspace = true
# Full dotted paths on schema errors, for `phux config check` and for the
# loader's own message.
serde_path_to_error.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Inline (scoped to this crate) per phux-nz4.4 guidance: used only by the
# `time` status-bar widget for strftime-style formatting. No workspace dep
# yet because no other crate consumes chrono.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
serde_json.workspace = true
insta.workspace = true
tempfile.workspace = true
