[package]
name = "phux-protocol"
description = "Wire protocol for phux: frame format, message catalog, codec."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["terminal", "multiplexer", "protocol", "pty", "tui"]
categories = ["command-line-interface", "network-programming", "encoding"]

[lints]
workspace = true

[features]
# The default wire codec and input atoms are pure Rust, with no git-only
# dependencies, so browser consumers and crates.io need no native VT build.
default = []
# `server` adds libghostty conversions and rendering/replay helpers. Native
# terminal consumers enable it; the codec itself does not require it.
server = ["dep:libghostty-vt", "dep:png", "libghostty-vt/kitty-graphics", "libghostty-vt/png"]

[dependencies]
thiserror.workspace = true
bytes.workspace = true
bitflags = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { workspace = true }
# Trailing additive JSON on `SessionSnapshot` (remote listener bind report,
# phux-kyna) and any future open-shaped diagnostic field on the state reply.
serde_json = { workspace = true }
# Derives TryFrom<u32> for the wire's PhysicalKey enum (ADR-0024). Pure Rust,
# wasm-safe; the same crate libghostty-vt uses for its key discriminants.
int-enum = "1.2"
# DEFLATE for the negotiated FRAME_COMPRESSED envelope; see the workspace
# manifest for the justification and the measured ratio.
flate2.workspace = true
libghostty-vt = { workspace = true, optional = true }
png = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
insta.workspace = true

[package.metadata.docs.rs]
# Render the full API on docs.rs, including the libghostty-backed surface,
# with the "Available on feature ..." badge enabled via `--cfg docsrs`.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
