[package]
name = "phux-vt"
description = "libghostty glue shared by phux's native crates: render pool, SGR and Kitty replay, the GHOSTSNP snapshot codec, cell styles, and input-atom conversions."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# `render-pool` keeps the build to `render_pool` over plain libghostty-vt, with
# no kitty graphics and no png. Walkers that pool a render trio without the
# image or snapshot surface (phux-record and the testkit oracle) enable only
# this. See ADR-0086.
render-pool = []
# `kitty` adds Kitty graphics replay, the SGR encoder, and the GHOSTSNP
# snapshot codec, over libghostty-vt's kitty-graphics and png decoder.
kitty = ["render-pool", "libghostty-vt/kitty-graphics", "libghostty-vt/png"]

[dependencies]
# A leaf: never phux-client-core, whose engine adapters build on this crate.
libghostty-vt.workspace = true
# Default (pure-Rust) wire atoms, for the input conversions.
phux-protocol.workspace = true
# `CellStyle` / `CellColor`, the projection target of `cell_style`.
phux-core.workspace = true
bytes.workspace = true
flate2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Kitty tests hand-build PNG payloads.
png.workspace = true
