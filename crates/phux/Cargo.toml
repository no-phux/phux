[package]
name = "phux"
description = "phux — a terminal multiplexer built on libghostty-vt."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "phux"
path = "src/main.rs"

[dependencies]
phux-protocol = { workspace = true, features = ["server"] }
phux-core.workspace = true
phux-server.workspace = true
phux-client.workspace = true
phux-config.workspace = true
phux-plugin.workspace = true
# `phux relay` fronts the reference relay: `run` drives its runtime in the
# foreground and `pair` mints route-bound tunnel tokens (workspace crate;
# no new third-party dependency enters).
phux-relay.workspace = true
# `phux rec` and `phux --rec` export half: the asciicast codec, the offline
# VT replayer, and the in-process GIF/APNG encoders. Taken with its default
# `render` feature ON — the binary is the one consumer that must be able to
# produce an animation, and doing it in-process is the whole point (ADR-0060:
# no agg/vhs/ffmpeg at runtime). Workspace crate; the only third-party rows it
# adds to the lockfile are `gif` and its single dependency `weezl`.
phux-record.workspace = true
clap.workspace = true
# `phux completion <shell>` generates the completion script from the same
# clap tree the binary already parses with, so the two can never drift.
clap_complete.workspace = true
# `phux pair --qr` renders the pairing connect-link as a scannable terminal QR.
qrcode.workspace = true
dhat = { workspace = true, optional = true }
# `phux snapshot --json` emits the stable ScreenState contract (ADR-0022).
serde.workspace = true
serde_json.workspace = true
# `phux config show` renders the effective merged config table as TOML.
toml.workspace = true
toml_edit.workspace = true
# `phux update` verifies a downloaded release archive against the `.sha256`
# sidecar `release.yml` publishes beside it, BEFORE unpacking anything. That
# checksum is the trust anchor of the whole self-update path, so the digest is
# computed in-process rather than by shelling out to `shasum`/`sha256sum` and
# parsing their output — one fewer external program whose absence, version, or
# output format could turn "verify" into "skip". `sha2` is already a direct
# dependency of phux-server, phux-relay, phux-dial, and phux-client-core (cert
# fingerprints, ADR-0031), so this adds no new row to Cargo.lock; it is the
# RustCrypto reference implementation, pure-safe Rust, no C deps.
sha2 = "0.10"
# `phux status` renders the server's up-since wall-clock timestamp. Already a
# workspace dependency (protocol/server/config); no new third-party row
# enters the lockfile.
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Generate provider-native session ids before spawning integrations whose
# documented CLI accepts a caller-supplied fresh UUID.
uuid.workspace = true
# `process`: `setsid(2)` to detach an auto-spawned server from the launching
# client's controlling terminal so it survives the terminal closing.
# `termios`: `phux play`'s in-pane writer clears OPOST and ECHO on its own
# PTY, so the line discipline cannot rewrite the recorded bytes (ONLCR turns
# a bare LF into CR LF) or echo a stray keystroke into the middle of a frame.
# Same crate and the same two features phux-client already uses; no new
# third-party dependency enters the workspace.
rustix = { version = "0.38", default-features = false, features = ["std", "process", "termios"] }

[dev-dependencies]
# The one scripted server (`phux_client::testkit`), where the reference
# server's frame ORDER is written down once with a handler citation per
# entry. The verb tests for partial-fleet reporting need a server that pushes
# a hub's uncorrelated degradation ERRORs *ahead of* the GET_STATE ack — the
# ordering a hand-rolled fake in this crate would have to re-guess, which is
# the class of lie the harness exists to prevent. Opting in from
# `[dev-dependencies]` keeps it out of the shipped binary; it is a workspace
# crate behind a feature flag, so no third-party row enters the lockfile.
phux-client = { workspace = true, features = ["testkit"] }
# Command-level wire mocks encode framed replies with the protocol's native
# BytesMut API; bytes is already a workspace/runtime dependency.
bytes.workspace = true
# Raw-PTY black-box harnesses (examples/) that spawn the real `phux attach`
# binary in a pseudoterminal, drive it, resize the PTY, and inspect what the
# client paints via a libghostty oracle. Used to reproduce/verify
# host-terminal rendering bugs (e.g. phux-8v1 resize duplication) that the
# tmux probe masks because tmux reflows + reinterprets the byte stream itself.
portable-pty.workspace = true
libghostty-vt.workspace = true
# Unique per-test socket directories for the `phux run`/`phux wait`
# end-to-end harness (tests/run_wait_e2e.rs), which spawns the real
# binary against a real PTY-backed server. Already a workspace dep used
# by the phux-server wire tests; no new third-party crate enters.
tempfile.workspace = true

[features]
# Heap profiling via dhat. Swaps the global allocator for `dhat::Alloc`
# and installs a `dhat::Profiler` guard for the lifetime of `main()`.
# On clean shutdown, the guard's Drop writes `./dhat-heap.json` (viewable
# at https://nnethercote.github.io/dh_view/dh_view.html).
#
# Run with: cargo run --features dhat-heap -- server
# Warning: the instrumented allocator is significantly slower than the
# system allocator; do not use in production builds.
dhat-heap = ["dep:dhat"]
