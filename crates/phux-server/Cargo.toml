[package]
name = "phux-server"
description = "phux daemon: owns PTYs, terminal grids, and client IPC."
publish = false
autobenches = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["webtransport", "native-engine"]
# WebTransport (HTTP/3 over QUIC) listener: the browser's QUIC-class door,
# which `phux-web` dials before falling back to WebSocket.
webtransport = ["dep:wtransport-proto", "dep:httlib-huffman"]
# tokio-console debugger. Requires `RUSTFLAGS='--cfg tokio_unstable'`.
tokio-console = ["dep:console-subscriber"]
# Incremental native checkpoint capture/advertisement.
native-engine = []
# Benchmark/example tooling, opt-in so default test builds skip Criterion
# and DHAT.
capture-bench = ["dep:criterion", "dep:dhat"]
ack-allocations-example = ["dep:dhat"]


[dependencies]
# Optional (not dev-dependencies) so default test builds do not compile them.
criterion = { workspace = true, optional = true }
dhat = { workspace = true, optional = true }
phux-protocol = { workspace = true, features = ["server"] }
phux-core.workspace = true
# Agent manifests and the region matcher the detector evaluates.
phux-agent-rules.workspace = true
# `GET_SCREEN --format vt` capture encoding.
base64.workspace = true
# Canonical scrollback bounds and config schema defaults.
phux-config.workspace = true
# The shared child-process runner behind event hooks.
phux-plugin.workspace = true
# Hook `when` predicates are `toml::Value`s.
toml.workspace = true
# `GET_SCREEN` JSON timestamps and workload certificate dates.
chrono.workspace = true
# The graceful-upgrade state blob and JSON records.
serde.workspace = true
serde_json.workspace = true
# SIMD byte search on the PTY ingest hot path.
memchr.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Non-blocking log file sink.
tracing-appender.workspace = true
tokio.workspace = true
# `CancellationToken` (the `rt` feature gates it).
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
# Safe POSIX wrappers: process-group signals (`signal`), foreground pgid
# (`term`), `fpathconf(_PC_MAX_CANON)` (`fs` + `feature`), the detached
# reaper's `waitpid` (`process`), and whoami's uid/login/host (`user`,
# `hostname`). `libc` is macOS-only here, so these go through `nix`.
nix = { version = "0.31", default-features = false, features = [
    "signal",
    "term",
    "fs",
    "feature",
    "process",
    "user",
    "hostname",
] }
bytes.workspace = true
# In-process performance telemetry (`GET_PERF`, `phux perf`).
phux-perf.workspace = true
# `FuturesUnordered` for concurrent per-pane attach snapshots.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# WebSocket transport; TLS is terminated by rustls below, not by tungstenite.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Remote-consumer auth and encryption (ADR-0031), vetted crates only: rustls
# with the cmake-free `ring` provider for `wss://`, `subtle` for
# constant-time token checks, `getrandom` for tokens, `sha2` + `hex` for
# fingerprints.
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
subtle = "2"
getrandom = "0.4"
sha2 = "0.11"
hex = "0.4"
# `TlsError::Rcgen` and the workload CA's CSR signing (same version and
# `ring` backend as phux-dial, so one type).
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
# SubjectPublicKeyInfo from a verified mTLS leaf (workload credential ids).
x509-parser = "0.18"
# QUIC transport (ADR-0007) on the same rustls/`ring` stack; the `log`
# feature is omitted because it would enable `tracing/log` workspace-wide.
quinn.workspace = true
# Shared dial/TLS stack for hub links; `provision` shares the self-signed
# certificate generator with phux-relay.
phux-dial = { workspace = true, features = ["provision"] }
# WebTransport CONNECT parsing on a phux-owned accept path (duplicate
# `Authorization` fields are refused before QPACK collapses them). Already in
# the graph via the test dialer.
wtransport-proto = { version = "0.7.2", optional = true, features = ["async"] }
# Decodes Huffman-coded literal header names for that duplicate check.
httlib-huffman = { version = "0.3.4", optional = true }
console-subscriber = { version = "0.5", optional = true }
# The PTY backend; blocking halves bridge to async via threads.
portable-pty.workspace = true
# Re-adopt inherited PTY masters and children after an upgrade re-exec.
portable-pty-adopt.workspace = true
# Upgrade handoff: clear FD_CLOEXEC and carry the blob in a temp file.
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }
tempfile.workspace = true

# The native terminal engine (needs zig 0.16.x); target-gated to keep its
# C/Zig library off wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libghostty-vt.workspace = true


# macOS `proc_pidinfo` FFI for cwd and start-time queries (Linux uses /proc).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
# `test-util`: paused time for tick and deadline tests.
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
# Drive the production server through the native session kernel.
phux-client-ffi.workspace = true
phux-client-core.workspace = true
# The relay e2e test runs the production relay. Dev-only: phux-relay must
# never depend on phux-server (ADR-0051).
phux-relay.workspace = true
# Shared integration-test scaffolding, built once as an rlib.
phux-server-testkit.workspace = true
# `testing` adds `DropProxy` for the send-window tests.
phux-dial = { workspace = true, features = ["provision", "testing"] }
# WebTransport test client; `dangerous-configuration` trusts the throwaway
# self-signed leaf.
wtransport = { version = "0.7.2", default-features = false, features = ["ring", "dangerous-configuration"] }

[[example]]
name = "ack_allocations"
required-features = ["ack-allocations-example"]

[[bench]]
name = "capture"
harness = false
required-features = ["native-engine", "capture-bench"]
