[package]
name = "quictun"
description = "A blind QUIC tunnel relay: services behind NAT dial out, consumers dial in by route name in the TLS server name, and the relay splices their streams without reading them. Depends on no phux crate."
# Publish-ready (ADR-0181): no path dependencies, its own README and
# docs.rs config. Remove this line to publish to crates.io.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["quic", "tunnel", "relay", "nat-traversal", "reverse-proxy"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
quinn.workspace = true
rustls.workspace = true
# SHA-256 leaf fingerprints, for pinning and for printing a pin.
sha2 = "0.11"
# Self-signed certificate generation (`provision`).
rcgen = { version = "0.14", default-features = false, features = [
    "ring",
    "pem",
], optional = true }
# The effective uid a secret file's owner is checked against (`provision`).
rustix = { version = "1.1", default-features = false, features = [
    "std",
    "process",
], optional = true }
# Hex encode/decode of route tokens (`relay`).
hex = { version = "0.4", optional = true }
# Constant-time token comparison, so lookup has no timing oracle (`relay`).
subtle = { version = "2", optional = true }
# OS CSPRNG for token minting; `std` for `std::error::Error` (`relay`).
getrandom = { version = "0.4", features = ["std"], optional = true }
# TCP keepalive on ingress sockets, so a vanished peer frees its slot
# (`relay`); already in this graph through quinn and tokio.
socket2 = { version = "0.6", optional = true }
# The TLS session a forwarder runs inside a bridged stream (`forward`); the
# same version and features phux-dial and phux-server already use.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
], optional = true }
# Mozilla's roots, for a CA-issued service certificate (`forward`) and the
# ACME CA's own HTTPS (`acme`); data only, as phux-server uses it.
webpki-roots = { version = "1", optional = true }
# The ACME account key's ES256 signatures (`acme`); rustls's own backend.
ring = { version = "0.17", optional = true }
# ACME's JSON and JOSE base64url (`acme`).
serde_json = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# A stored certificate's expiry, for renewal (`acme`).
x509-parser = { version = "0.18", optional = true }
# The binary's log output (`cli`); already in the tree through phux.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "std",
    "fmt",
    "env-filter",
], optional = true }

[features]
default = ["relay", "forward", "cli"]
# Certificate provisioning and secret-file checks, for whoever terminates TLS.
provision = ["dep:rcgen", "dep:rustix"]
# The relay itself: the endpoint, the SNI gate, the route-token store, and
# the optional TCP ingress.
relay = ["provision", "dep:hex", "dep:subtle", "dep:getrandom", "dep:socket2"]
# TCP forwarding through a relay, TLS end to end: `expose` and `connect`.
forward = ["provision", "dep:tokio-rustls", "dep:webpki-roots"]
# Public certificates for an exposed service by ACME (TLS-ALPN-01).
acme = [
    "forward",
    "dep:ring",
    "dep:serde_json",
    "dep:base64",
    "dep:x509-parser",
]
# The `quictun` binary.
cli = ["relay", "forward", "acme", "dep:tracing-subscriber"]
# Test-only `testing::DropProxy` UDP impairment; off in shipped builds.
testing = []

[dev-dependencies]
tempfile.workspace = true
# The mock ACME CA in tests/acme.rs signs the client's CSR (the
# `x509-parser` feature reads it); same version phux-server uses.
rcgen = { version = "0.14", default-features = false, features = [
    "ring",
    "pem",
    "x509-parser",
] }
# Self dev-dependency so crate-scoped test runs build every module.
quictun = { path = ".", features = ["relay", "forward", "acme", "testing"] }

[[bin]]
name = "quictun"
path = "src/main.rs"
required-features = ["cli"]

[package.metadata.docs.rs]
# Render every module, the relay and provisioning included.
all-features = true
