[package]
name = "phux-client-core"
description = "Frontend-neutral synchronous session kernel and reusable client-side terminal policies."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# Safe native libghostty checkpoint host. The target-qualified optional
# dependency below keeps wasm builds, including `--all-features`, off the
# native C/Zig linkage graph.
native-engine = ["dep:libghostty-vt"]

[dependencies]
# Stable IDs, ungated wire/input atoms, bootstrap profiles, and layout records.
# Engine-specific server conversions remain disabled so the default core stays
# native/wasm portable.
phux-protocol.workspace = true
# phux-9gw.1.4: width-aware UTF-8 prediction. The predict layer must know
# how many terminal cells a Unicode scalar consumes before queueing a
# prediction. `unicode-width` is the canonical zero-dep crate (Unicode 16).
unicode-width = { workspace = true }
# phux-9gw.1.6: multi-codepoint grapheme prediction. Splits a key event's
# `text` into grapheme clusters so the predict layer queues one Insert per
# visual cell. Complementary to `unicode-width`.
unicode-segmentation = { workspace = true }
# phux-4li.3: the client-side layout mirror persists itself server-side via
# the L3 metadata key `phux.tui.layout/v1` (ADR-0019 decision 1). CBOR
# envelope encode/decode for the `{version, root, focus}` layout shape.
ciborium = "0.2"
# phux-4li.3: serde-derive shims for the CBOR envelope; the wire-side
# `LayoutNode`/`TerminalId` don't derive serde (phux-protocol stays a
# near-empty shell per ADR-0011), so this crate mirrors the shapes locally.
serde = { workspace = true }
thiserror.workspace = true
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libghostty-vt = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
insta.workspace = true
criterion.workspace = true

[[bench]]
name = "history"
harness = false
