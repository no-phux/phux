[package]
name = "phux-dial"
description = "phux shared outbound dialer: QUIC and WebSocket transport establishment with bearer-token auth and certificate-fingerprint pinning (ADR-0007, ADR-0031, ADR-0038)."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# ALPN constants only (default features): the dialer never decodes frames.
phux-protocol.workspace = true
thiserror.workspace = true
tokio.workspace = true
quinn.workspace = true
# TLS 1.3 with the fingerprint-pinning verifier.
rustls.workspace = true
# TLS-over-TCP for `wss://` dialing; same features as the server side.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
# Native WebSocket client handshake; one binary message per phux frame.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# SHA-256 leaf fingerprints for pinning.
sha2 = "0.11"
# Decode the pairing token (hex) into the raw bytes the QUIC preamble carries.
hex = "0.4"
# Self-signed certificate generation (`provision` feature only).
rcgen = { version = "0.14", default-features = false, features = [
    "ring",
    "pem",
], optional = true }

[features]
# The `cert` module, for the crates that terminate TLS (server, relay).
provision = ["dep:rcgen"]
# Test-only `testing::DropProxy` UDP impairment; off in shipped builds.
testing = []

[dev-dependencies]
# Provisioning tests write real cert/key pairs to a scratch directory.
tempfile.workspace = true
# Self dev-dependency so crate-scoped test runs build the `cert` module.
phux-dial = { path = ".", features = ["provision", "testing"] }
