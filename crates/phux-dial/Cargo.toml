[package]
name = "phux-dial"
description = "phux shared outbound dialer: QUIC and WebSocket transport establishment with bearer-token auth and certificate-fingerprint pinning (ADR-0007, ADR-0031, ADR-0038)."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# The ALPN constants (`QUIC_ALPN`, `QUIC_RELAY_ALPN`) live in
# `phux_protocol::policy`, which sits on the crate's default (ungated)
# shell — the dialer needs no features and stays off the libghostty
# graph; it moves bytes, it never decodes frames.
phux-protocol.workspace = true
thiserror.workspace = true
tokio.workspace = true
# QUIC dialer (ADR-0007): same quinn stack + features as the server's
# `QuicListener` and the client's attach loop (workspace dep).
quinn.workspace = true
# rustls client config: TLS 1.3 with a fingerprint-pinning (or loopback
# skip-verify) server-cert verifier. Same `ring` provider both ends.
rustls.workspace = true
# TLS-over-TCP for `wss://` dialing; same features as the server side.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Native WebSocket client handshake; one binary message per phux frame.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# SHA-256 of the server's leaf certificate, matched against the
# out-of-band fingerprint pin `phux pair` prints.
sha2 = "0.10"
# Decode the pairing token (hex) into the raw bytes the QUIC preamble carries.
hex = "0.4"
# Mints the persisted self-signed certificate whose fingerprint this crate's
# verifier pins (`cert` module, `provision` feature). Not a new workspace
# dependency: phux-server and phux-relay each already carried this exact line
# for the copy of the generator they used to keep privately. Optional so a
# build that only *dials* -- phux-client -- never pulls a certificate
# generator it has no use for.
rcgen = { version = "0.13", default-features = false, features = [
    "ring",
    "pem",
], optional = true }

[features]
# Server-side certificate provisioning: the `cert` module. Off by default so
# the dialer stays a dialer for consumers that only pin; enabled by the two
# crates that terminate TLS (phux-server, phux-relay).
provision = ["dep:rcgen"]

[dev-dependencies]
# Provisioning tests write real cert/key pairs to a scratch directory.
tempfile.workspace = true
# Self dev-dependency (a cycle cargo permits by design) so `cargo test -p
# phux-dial` builds the `cert` module and its tests even though `provision` is
# off by default. Without it the module's tests are silently cfg'd out of a
# crate-scoped run and only reappear under `--workspace`, where phux-server
# happens to turn the feature on -- exactly the kind of coverage that looks
# green while testing nothing.
phux-dial = { path = ".", features = ["provision"] }
