# Use the system `git` for crate-graph fetches. More reliable than libgit2
# under corp proxies / SSH agents; matches the nix dev shell's git.
[net]
git-fetch-with-cli = true

# The libghostty-vt build script selects Zig Debug mode whenever Cargo enables
# debug assertions. That turns realistic PTY bursts into multi-second blocking
# parses, starving the current-thread terminal actor and making async tests
# time out. The Rust test harness retains its assertions; only the vendored
# terminal engine uses the same optimized mode as the production binary.
# libghostty-vt-sys downloads its prebuilt archive only for this mode, so it
# also lets dev builds link the download instead of running Zig.
[env]
LIBGHOSTTY_VT_SYS_OPTIMIZE = "ReleaseFast"
# Only scripts/test-env-runner.sh removes this, so a test that still sees it
# was started without the runner (crates/phux-config-core/tests/test_env_runner.rs).
PHUX_SCRUB_CANARY = "planted"

# Every `cargo test` and `cargo nextest run` test process starts through this,
# which strips inherited PHUX_* so a run inside a production pane cannot reach
# production. Windows has no pane environment to inherit and no Bash to rely on.
[target.'cfg(unix)']
runner = "scripts/test-env-runner.sh"

# Fast linker on Linux. `mold` replaces the bottleneck link step of
# incremental dev/test builds (every `cargo check --all-targets` /
# `nextest run` relinks dozens of test binaries); it routinely cuts link
# time by an order of magnitude versus bfd/gold. Provided by the nix dev
# shell on Linux only (flake.nix gates `mold` on stdenv.isLinux). This does
# NOT touch libghostty-vt's zig-built static lib — zig does its own linking
# in build.rs — so the dominant cold-build cost is unaffected; this speeds
# the Rust relink, which is what iteration actually pays for.
#
# macOS is intentionally absent: Apple's default linker (ld-prime, Xcode
# 15+) is already fast, and forcing ld64.lld there risks framework/dylib
# link breakage for no real gain.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
