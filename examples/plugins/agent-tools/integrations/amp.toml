schema_version = 1
id = "amp"
display_name = "Amp"
kind = "terminal-agent"
description = "Amp with an interactive terminal or an operator-installed ACP adapter."
package_version = "0.1.0"
package_status = "public"
first_party = true
capabilities = ["terminal-control", "code-editing", "human-question"]

[detect]
mode = "opt-in"
command = "amp"
env = "PHUX_AGENT_TOOLS_DETECT"

[link]
mode = "state-file"
default_session = "agent-bench-amp"

[agent_identity]
name = "amp"
kind = "amp"

[launch]
command = ["sh", "${PHUX_PLUGIN_ROOT}/scripts/phux-agent-wrap.sh", "--name", "amp", "--kind", "amp", "--", "amp"]
required_executables = ["amp"]
working_directory = "workspace"


# ACP executable is installed and authenticated by the operator.
[acp]
provider = "amp"
command = ["amp-acp"]
required_executables = ["amp-acp","amp"]
working_directory = "workspace"
