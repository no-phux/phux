schema_version = 1
id = "codex"
display_name = "Codex"
kind = "terminal-agent"
description = "OpenAI Codex CLI running inside a phux-managed terminal."
package_version = "0.2.0"
package_status = "public"
first_party = true
capabilities = ["terminal-control", "code-editing", "human-question"]

[detect]
mode = "opt-in"
command = "codex"
env = "PHUX_AGENT_TOOLS_DETECT"

[link]
mode = "state-file"
default_session = "agent-bench-codex"

[session_identity]
mode = "native-or-phux"
native_env = "PHUX_CODEX_SESSION_ID"
restore = "external-cli"
# Codex has no documented caller-supplied fresh interactive thread id. Setting
# PHUX_CODEX_SESSION_ID explicitly resumes and persists an existing UUID/name;
# a plain fresh Codex launch therefore remains non-restorable.
resume_args = ["resume", "${PHUX_AGENT_SESSION_ID}"]

# phux-r82.11: launch through the agent wrapper so the pane self-declares
# a `phux.agent/v1` record (ADR-0040) — name + kind — instead of the
# OSC-title substring heuristic. Clearing on exit is handled by the
# wrapper's trap. The wrapper targets its own pane via PHUX_TERMINAL_ID and
# writes nothing if it cannot resolve the pane (never a focused-pane guess).
#
# NOTE: `phux launch <id>` (ADR-0042) now runs this `command` as a pane's
# program, so an installed + enabled plugin makes `phux launch codex` open a
# self-identifying pane. The path is anchored to ${PHUX_PLUGIN_ROOT} (the
# launch executor expands it to the absolute plugin root before spawning),
# so the wrapper script resolves from any cwd while the agent itself runs in
# the caller's workspace (`working_directory = "workspace"`).
[agent_identity]
name = "codex"
kind = "codex"

[launch]
command = ["sh", "${PHUX_PLUGIN_ROOT}/scripts/phux-agent-wrap.sh", "--name", "codex", "--kind", "codex", "--", "codex"]
working_directory = "workspace"
