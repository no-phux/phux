schema_version = 1
id = "opencode"
display_name = "OpenCode"
kind = "terminal-agent"
description = "OpenCode running inside a phux-managed terminal."
package_version = "0.1.0"
package_status = "public"
first_party = true
capabilities = ["terminal-control", "code-editing", "human-question"]

[detect]
mode = "opt-in"
command = "opencode"
env = "PHUX_AGENT_TOOLS_DETECT"

[link]
mode = "state-file"
default_session = "agent-bench-opencode"

[session_identity]
# OpenCode 2.0 root command: `--session/-s <id>` is "Session ID to continue,
# or to create if it does not exist". The `@phux/opencode-v2` plugin opens its
# AgentSession with the OpenCode session id (ADR-0151). OpenCode mints its own
# `ses_` ids, so no caller-supplied fresh id is declared.
mode = "native-or-phux"
native_env = "PHUX_OPENCODE_SESSION_ID"
restore = "external-cli"
resume_args = ["--session", "${PHUX_AGENT_SESSION_ID}"]

[agent_identity]
name = "opencode"
kind = "opencode"

[launch]
command = ["sh", "${PHUX_PLUGIN_ROOT}/scripts/phux-agent-wrap.sh", "--name", "opencode", "--kind", "opencode", "--", "opencode"]
required_executables = ["opencode"]
working_directory = "workspace"
