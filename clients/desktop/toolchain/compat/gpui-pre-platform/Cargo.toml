# Adapted from gpui-fast compat/gpui-pre-platform (Apache-2.0): the gpui-pre name and
# version GPUI Kit pins, re-exporting the published gpui-fast crate.
[package]
name = "gpui-pre-platform"
version = "0.3.10"
description = "gpui-fast's `gpui_platform` under the gpui-pre name GPUI Kit pins."
license = "Apache-2.0"
edition = "2024"
publish = false

[lib]
name = "gpui_platform"
path = "lib.rs"
doctest = false

[features]
default = ["gpui_fast/default"]
bench-support = ["gpui_fast/bench-support"]
font-kit = ["gpui_fast/font-kit"]
inspector = ["gpui_fast/inspector"]
runtime_shaders = ["gpui_fast/runtime_shaders"]
screen-capture = ["gpui_fast/screen-capture"]
test-support = ["gpui_fast/test-support"]
wayland = ["gpui_fast/wayland"]
x11 = ["gpui_fast/x11"]

[dependencies]
gpui_fast = { package = "gpui-fast-platform", version = "=0.1.12", default-features = false }
