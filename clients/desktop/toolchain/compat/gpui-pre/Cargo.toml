# Adapted from gpui-fast compat/gpui-pre (Apache-2.0): the gpui-pre name and
# version GPUI Kit pins, re-exporting the published gpui-fast crate.
[package]
name = "gpui-pre"
version = "0.3.10"
description = "gpui-fast's `gpui` under the gpui-pre name GPUI Kit pins."
license = "Apache-2.0"
edition = "2024"
publish = false

[lib]
name = "gpui"
path = "lib.rs"
doctest = false

[features]
default = ["gpui_fast/default"]
bench = ["gpui_fast/bench"]
bench-support = ["gpui_fast/bench-support"]
inspector = ["gpui_fast/inspector"]
leak-detection = ["gpui_fast/leak-detection"]
profiler = ["gpui_fast/profiler"]
screen-capture = ["gpui_fast/screen-capture"]
stacker = ["gpui_fast/stacker"]
test-support = ["gpui_fast/test-support"]
wayland = ["gpui_fast/wayland"]
windows-manifest = ["gpui_fast/windows-manifest"]
x11 = ["gpui_fast/x11"]

[dependencies]
gpui_fast = { package = "gpui-fast", version = "=0.1.12", default-features = false }
