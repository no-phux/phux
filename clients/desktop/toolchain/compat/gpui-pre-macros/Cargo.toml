# Adapted from gpui-fast compat/gpui-pre-macros (Apache-2.0): the gpui-pre name and
# version GPUI Kit pins, re-exporting the published gpui-fast crate.
[package]
name = "gpui-pre-macros"
version = "0.3.9"
description = "gpui-fast's `gpui_macros` under the gpui-pre name GPUI Kit pins."
license = "Apache-2.0"
edition = "2024"
publish = false

[lib]
name = "gpui_macros"
path = "lib.rs"
doctest = false

[features]
inspector = ["gpui_fast/inspector"]

[dependencies]
gpui_fast = { package = "gpui-fast-macros", version = "=0.1.9", default-features = false }
