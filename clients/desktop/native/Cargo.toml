[package]
name = "phux-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "phux_desktop"
path = "src/lib.rs"

[[bin]]
name = "phux-desktop"
path = "src/main.rs"

# The GPUI graph is large and macOS-specific. Keep this host's resolved union
# local instead of adding the platform renderer to every phux workspace consumer.
[workspace]

[features]
# Record where each glyph landed in `terminal::PaintedFrame` for pixel
# fixtures; off in shipping builds.
terminal-fixtures = []

[dependencies]
phux-client-core = { path = "../../../crates/phux-client-core" }
phux-client-runtime = { path = "../../../crates/phux-client-runtime" }
phux-client-ffi = { path = "../../../crates/phux-client-ffi", default-features = false }
phux-perf = { path = "../../../crates/phux-perf" }
phux-protocol = { path = "../../../crates/phux-protocol" }
# GPUI snapshot, platform and Kit move together: Kit 0.7.1 is built against
# exactly gpui-pre 0.3.8. `toolchain/bootstrap.py` materializes the patched
# copies `[patch.crates-io]` points at (drawable-presented receipts).
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "runtime_shaders"] }
gpui-kit = { version = "=0.7.1" }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
async-channel = "2"
log = "0.4"
serde_json = "1"
smol = "2"
unicode-segmentation = "1"
# Quick terminal: system-wide hotkeys without Accessibility permission or
# handwritten Carbon FFI (the host denies unsafe code).
global-hotkey = "=0.8.0"

[patch.crates-io]
gpui-pre = { path = "../toolchain/gpui/gpui-pre" }
gpui-pre-apple = { path = "../toolchain/gpui/gpui-pre-apple" }
gpui-pre-macos = { path = "../toolchain/gpui/gpui-pre-macos" }

[dev-dependencies]
# `HeadlessAppContext` and `gpui_platform::current_headless_renderer` exist
# only with GPUI's `test-support` feature. Enabling it here keeps the feature
# out of the shipping binary: Cargo unifies it for `cargo test` and clippy
# `--all-targets`, and `cargo build` does not.
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = [
    "font-kit",
    "runtime_shaders",
    "test-support",
] }

[profile.release]
lto = true

[lints.rust]
unsafe_code = "deny"
