[package]
name = "phux-desktop"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "phux_desktop"
path = "src/lib.rs"

[[bin]]
name = "phux-desktop"
path = "src/main.rs"

# The GPUI graph is large and platform-specific. Keep this host's resolved union
# local instead of adding the platform renderer to every phux workspace consumer.
[workspace]

[features]
# Record where each glyph landed in `terminal::PaintedFrame` for pixel
# fixtures; off in shipping builds.
terminal-fixtures = []
# Native material preview. Excluded from the shipping binary.
ui-fixtures = []

[[example]]
name = "glass_menu"
required-features = ["ui-fixtures"]

[dependencies]
phux-client-core = { path = "../../../crates/phux-client-core" }
phux-client-runtime = { path = "../../../crates/phux-client-runtime" }
phux-client-ffi = { path = "../../../crates/phux-client-ffi", default-features = false }
phux-perf = { path = "../../../crates/phux-perf" }
phux-protocol = { path = "../../../crates/phux-protocol" }
# GPUI, platform and Kit move together: Kit 0.7.3 pins gpui-pre 0.3.9, which
# `[patch.crates-io]` below serves as gpui-fast 0.1.9 (same Zed revision).
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders", "x11", "wayland"] }
gpui-kit = { version = "=0.7.3" }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
async-channel = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
unicode-segmentation = "1"
# Quick terminal: system-wide hotkeys without Accessibility permission or
# handwritten Carbon FFI (the host denies unsafe code).
global-hotkey = "=0.8.0"

# GPUI Kit pins gpui-pre; the compatibility crates under `toolchain/compat`
# carry those names and re-export gpui-fast, so Kit and this host share one
# GPUI. `toolchain/bootstrap.py` materializes the patched gpui-fast crates.
[patch.crates-io]
gpui-pre = { path = "../toolchain/compat/gpui-pre" }
gpui-pre-macros = { path = "../toolchain/compat/gpui-pre-macros" }
gpui-pre-platform = { path = "../toolchain/compat/gpui-pre-platform" }
gpui-pre-web = { path = "../toolchain/compat/gpui-pre-web" }
gpui-fast = { path = "../toolchain/gpui/gpui-fast" }
gpui-fast-apple = { path = "../toolchain/gpui/gpui-fast-apple" }
gpui-fast-macos = { path = "../toolchain/gpui/gpui-fast-macos" }

[dev-dependencies]
# `HeadlessAppContext` and `gpui_platform::current_headless_renderer` exist
# only with GPUI's `test-support` feature. Enabling it here keeps the feature
# out of the shipping binary: Cargo unifies it for `cargo test` and clippy
# `--all-targets`, and `cargo build` does not.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = [
    "font-kit",
    "runtime_shaders",
    "test-support",
] }
# `tests/pixels.rs` is its own crate. It drives the same protocol and runtime
# the painter fixture uses, and reads the captured buffer through `image`.
# These crates are already normal dependencies; repeating them here is what
# makes them visible to that test binary.
phux-client-core = { path = "../../../crates/phux-client-core" }
phux-client-runtime = { path = "../../../crates/phux-client-runtime" }
phux-protocol = { path = "../../../crates/phux-protocol" }
image = { version = "0.25", default-features = false, features = ["png"] }

# Pixel fixtures open GPUI's real platform. On macOS `MacPlatform::new`
# requires the process main thread (`MainThreadMarker`); the default harness
# runs `#[test]` functions on worker threads and panics with "Mac platform
# not created on main thread". `harness = false` keeps `main` on that thread
# and runs the five fixtures there. Linux uses the same binary (wgpu /
# lavapipe).
[[test]]
name = "pixels"
path = "tests/pixels.rs"
harness = false

[profile.release]
lto = true

[lints.rust]
unsafe_code = "deny"
