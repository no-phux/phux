[package]
name = "phux-web"
description = "phux browser client: renders terminals over the wire with the ghostty-vt engine."
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/no-phux/phux"
authors = ["phall <phallsignup@gmail.com>"]
publish = false

# Standalone workspace (wasm-only); excluded from the native phux workspace.
[workspace]

# The shipped module is downloaded on every visit, and its runtime cost is
# canvas and engine calls, not Rust codegen: a paint measured the same
# (~7 ms at 120x40) at opt-level 3 and "z". Whole-program, size-first
# optimization cuts the Rust code by 30% (2,151,881 -> 1,965,110 bytes raw,
# 641,377 -> 583,335 gzipped, of which the embedded engine is 1.53 MB raw).
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
phux-vt-web = { path = "../phux-vt-web" }
# The browser client speaks the exact Rust wire codec (ADR-0024 made it wasm-safe).
phux-protocol = { path = "../../crates/phux-protocol" }
phux-client-core = { path = "../../crates/phux-client-core" }
bytes = "1"
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gloo-timers = { version = "0.4", features = ["futures"] }
# The WebTransport* features are unstable in web-sys (the W3C spec is a
# draft) and additionally require the `web_sys_unstable_apis` cfg — set for
# this standalone workspace in `.cargo/config.toml`. The plain stream types
# (ReadableStream & co.) are stable; they drive the WebTransport read/write
# pumps in client.rs.
web-sys = { version = "0.3", features = [
    "AbortSignal",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "BinaryType",
    "KeyboardEvent",
    "CompositionEvent",
    "InputEvent",
    "ClipboardEvent",
    "DataTransfer",
    "HtmlTextAreaElement",
    "DomRect",
    "WheelEvent",
    "CustomEvent",
    "CustomEventInit",
    "HtmlDocument",
    "MouseEvent",
    "PointerEvent",
    "MediaQueryList",
    "CssStyleDeclaration",
    "Event",
    "EventTarget",
    "Location",
    "Performance",
    "console",
    "WebTransport",
    "WebTransportBidirectionalStream",
    "WebTransportReceiveStream",
    "WebTransportSendStream",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "WritableStream",
    "WritableStreamDefaultWriter",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
# Event constructors the browser tests dispatch; the library needs none.
web-sys = { version = "0.3", features = [
    "RequestInit",
    "Response",
    "ClipboardEventInit",
    "CompositionEventInit",
    "EventInit",
    "MouseEventInit",
    "KeyboardEventInit",
    "PointerEventInit",
    "WheelEventInit",
] }
