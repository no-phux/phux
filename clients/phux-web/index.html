<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>phux — web client</title>
    <!-- Generated by phux-brand (brand.config.json); every colour, size and
         duration below is a var(--phux-…) from it. -->
    <link data-trunk rel="css" href="assets/phux-tokens.css" />
    <link data-trunk rel="rust" data-bin="phux-web" data-wasm-opt="z" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--phux-layer-ground);
        color: var(--phux-text-text);
        font: var(--phux-type-label-weight) var(--phux-type-label-size) / var(--phux-type-label-line-height)
          var(--phux-font-mono);
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--phux-space-s3);
        padding: var(--phux-space-page-margin);
      }
      /* The wasm client sizes the canvas to the terminal grid and paints its
         own ground, solved from the terminal's palette. */
      #phux-term {
        background: var(--phux-layer-ground);
        outline: var(--phux-space-hairline) solid var(--phux-border-base);
        image-rendering: pixelated;
      }
      /* The client marks a dropped connection while it redials. */
      #phux-term[data-phux-connection="disconnected"] {
        opacity: 0.45;
      }
      /* A server on another protocol major: the client stopped redialing. */
      #phux-term[data-phux-connection="incompatible"] {
        opacity: 0.25;
        outline-color: var(--phux-status-failed);
      }
      /* One focus ring everywhere, for keyboard focus only. An outline, so
         forced colours keep it. */
      :focus-visible {
        outline: var(--phux-focus-ring-width) solid var(--phux-border-focus);
        outline-offset: var(--phux-focus-ring-offset);
      }
      .hint {
        color: var(--phux-text-faint);
      }

      /* Agent badges for the pane on screen: mark, provider and word, in the
         status tone (colour + word + mark, never colour alone). */
      #phux-agent-badges {
        display: flex;
        flex-wrap: wrap;
        gap: var(--phux-space-s2);
      }
      #phux-agent-badges[hidden] {
        display: none;
      }
      .phux-agent-badge,
      .phux-bell-dot {
        display: inline-flex;
        align-items: center;
        gap: var(--phux-space-s1);
        /* A badge never truncates its word: a minimum, never a fixed width. */
        min-inline-size: max-content;
        padding-block: var(--phux-space-s0-5);
        padding-inline: var(--phux-space-s2);
        border: var(--phux-space-hairline) solid var(--phux-border-base);
        border-radius: var(--phux-radius-full);
        color: var(--phux-text-dim);
        white-space: nowrap;
      }
      .phux-mark {
        flex: none;
        inline-size: var(--phux-icon-sm);
        block-size: var(--phux-icon-sm);
      }
      .phux-agent-provider {
        color: var(--phux-text-text);
      }
      .phux-agent-badge[data-tone="needs_you"] {
        color: var(--phux-status-needs-you);
        background: var(--phux-status-needs-you-wash);
        border-color: var(--phux-status-needs-you-edge);
      }
      .phux-agent-badge[data-tone="working"] {
        color: var(--phux-status-working);
        background: var(--phux-status-working-wash);
        border-color: var(--phux-status-working-edge);
      }
      .phux-agent-badge[data-tone="done"] {
        color: var(--phux-status-done);
        background: var(--phux-status-done-wash);
        border-color: var(--phux-status-done-edge);
      }
      .phux-agent-badge[data-tone="failed"] {
        color: var(--phux-status-failed);
        background: var(--phux-status-failed-wash);
        border-color: var(--phux-status-failed-edge);
      }
      .phux-agent-badge[data-tone="idle"] {
        color: var(--phux-status-idle);
        background: var(--phux-status-idle-wash);
        border-color: var(--phux-status-idle-edge);
      }
      .phux-agent-badge[data-tone="unknown"] {
        color: var(--phux-status-unknown);
        border-color: var(--phux-status-unknown-edge);
      }
      .phux-bell-dot,
      .phux-agent-badge[data-tone="bell"] {
        color: var(--phux-status-bell);
        background: var(--phux-status-bell-wash);
        border-color: var(--phux-status-bell-edge);
      }
      /* The loud rungs (needs you, failed, done not yet seen) are bold. */
      .phux-agent-badge:is([data-status="needs_you"], [data-status="failed"], [data-status="lost"], [data-status="done"])
        .phux-agent-word {
        font-weight: var(--phux-weight-semibold);
      }

      /* Controls: the find bar, the path picker and the approval inbox. */
      .phux-find,
      .phux-path-panel {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--phux-space-s2);
      }
      .phux-find[hidden],
      .phux-path-panel[hidden] {
        display: none;
      }
      :is(.phux-find, #phux-path-picker, #phux-approvals) :is(input, button) {
        position: relative;
        font: inherit;
        min-block-size: var(--phux-space-pointer-min);
        background: var(--phux-layer-raised);
        color: var(--phux-text-text);
        border: var(--phux-space-hairline) solid var(--phux-border-control);
        border-radius: var(--phux-radius-sm);
        padding-block: var(--phux-space-s1);
        padding-inline: var(--phux-space-s2);
      }
      :is(.phux-find, #phux-path-picker, #phux-approvals) input::placeholder {
        color: var(--phux-text-faint);
      }
      :is(.phux-find, #phux-path-picker, #phux-approvals) button {
        cursor: pointer;
        transition: transform var(--phux-motion-press-exit-duration) var(--phux-motion-press-exit-easing);
      }
      /* Hover and press are washes laid over the control; press replaces
         hover and adds the press scale. */
      :is(.phux-find, #phux-path-picker, #phux-approvals) button::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: var(--phux-wash-hover);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--phux-motion-control-exit-duration) var(--phux-motion-control-exit-easing);
      }
      @media (hover: hover) {
        :is(.phux-find, #phux-path-picker, #phux-approvals) button:hover:not(:disabled)::after {
          opacity: 1;
          transition-duration: var(--phux-motion-control-duration);
          transition-timing-function: var(--phux-motion-control-easing);
        }
      }
      :is(.phux-find, #phux-path-picker, #phux-approvals) button:active:not(:disabled) {
        transform: scale(0.98);
        transition-duration: var(--phux-motion-press-duration);
        transition-timing-function: var(--phux-motion-press-easing);
      }
      :is(.phux-find, #phux-path-picker, #phux-approvals) button:active:not(:disabled)::after {
        background: var(--phux-wash-press);
        opacity: 1;
      }
      /* Disabled: faint ink and a muted edge, never opacity. */
      :is(.phux-find, #phux-path-picker, #phux-approvals) button:disabled {
        cursor: not-allowed;
        color: var(--phux-control-disabled, var(--phux-text-faint));
        border-color: var(--phux-border-muted);
      }
      /* The view's one primary action, and the destructive verb. */
      #phux-approvals button[data-variant="primary"]:not(:disabled) {
        background: var(--phux-accent-accent);
        color: var(--phux-accent-on-accent);
        border-color: var(--phux-accent-accent);
      }
      #phux-approvals button[data-variant="danger"]:not(:disabled) {
        color: var(--phux-status-failed);
        border-color: var(--phux-status-failed-edge);
      }
      #phux-approvals article {
        display: flex;
        flex-wrap: wrap;
        gap: var(--phux-space-s2);
        padding-block: var(--phux-space-s2);
        border-block-start: var(--phux-space-hairline) solid var(--phux-border-muted);
      }
      #phux-approvals :is(h3, pre) {
        inline-size: 100%;
        margin: 0;
        font: inherit;
      }
      #phux-approvals h3 {
        font-weight: var(--phux-weight-semibold);
      }
      .phux-approval-status,
      .phux-find-count,
      .phux-path-fallback,
      .phux-path-status {
        color: var(--phux-text-dim);
      }
      .phux-find-count {
        min-inline-size: 7em;
      }
      #phux-path-picker {
        inline-size: min(640px, 95vw);
      }
      .phux-path-fallback {
        padding-inline-start: var(--phux-space-s2);
      }
      .phux-path-panel {
        padding-block: var(--phux-space-s3);
      }
      .phux-path-panel label {
        display: flex;
        flex-direction: column;
        gap: var(--phux-space-s1);
      }
      .phux-path-results {
        inline-size: 100%;
        max-block-size: 220px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        align-items: start;
        gap: var(--phux-space-s1);
      }
      .phux-path-status {
        inline-size: 100%;
      }
      /* Forced colours: controls take the system button colours; badges
         keep their mark and word in CanvasText (the tokens map the tones). */
      @media (forced-colors: active) {
        :is(.phux-find, #phux-path-picker, #phux-approvals) button,
        #phux-approvals button:is([data-variant="primary"], [data-variant="danger"]):not(:disabled) {
          background: var(--phux-control-button-face);
          color: var(--phux-control-button-text);
          border-color: var(--phux-control-button-border);
        }
        :is(.phux-find, #phux-path-picker, #phux-approvals) button:disabled {
          color: var(--phux-control-disabled);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="hint">
        phux in the browser — the same libghostty engine, over the wire. Click and type.
      </div>
      <canvas id="phux-term" tabindex="0" width="640" height="384"></canvas>
    </main>
  </body>
</html>
