[package]
name = "phux-rune-ios"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["staticlib"]

[dependencies]
phux-rune = { path = "../.." }
serde_json = "1"
# Already in Rune's graph; the simulator fixture installs a target-only subscriber.
tracing = "0.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
