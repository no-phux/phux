[package]
name = "phux-rune"
version = "0.1.0-alpha.18"
description = "An alpha phux desktop client built on the Rune UI framework."
edition = "2024"
publish = false
license = "Apache-2.0"

[[bin]]
name = "phux-rune"
path = "src/main.rs"

# Rune's wgpu/winit graph stays out of the main phux workspace and the GPUI
# desktop's lock, as the GPUI host keeps its own.
[workspace]

[dependencies]
phux-client-core = { path = "../../crates/phux-client-core" }
phux-client-runtime = { path = "../../crates/phux-client-runtime" }
phux-perf = { path = "../../crates/phux-perf" }
phux-protocol = { path = "../../crates/phux-protocol" }
# Rune has no releases; apps pin a `dev` revision (dev is fast-forward only).
rune = { git = "https://github.com/anomalyco/rune", rev = "a9da7e3ebf5a8ab9bf19c3015032674b6e042df2" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "a9da7e3ebf5a8ab9bf19c3015032674b6e042df2" }
rune-perf = { git = "https://github.com/anomalyco/rune", rev = "a9da7e3ebf5a8ab9bf19c3015032674b6e042df2" }
# Never called directly: Rune's decoder guesses the format, so these
# features (unified with Rune's png/jpeg) let typed documents draw GIF/WebP.
image = { version = "0.25", default-features = false, features = ["gif", "webp"] }
serde_json = "1"
# The same digest the runtime uses, for a downloaded update.
sha2 = "0.11"

# The Dock count is the one call Rune doesn't wrap; same objc2 as Rune's.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSString"] }

[profile.release]
lto = "thin"

[lints.rust]
unsafe_code = "deny"
