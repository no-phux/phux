[package]
name = "phux-rune"
version = "0.1.50"
description = "The phux desktop client, built on the Rune UI framework."
edition = "2024"
publish = false
license = "Apache-2.0"

[[bin]]
name = "phux-rune"
path = "src/main.rs"

# Rune's wgpu/winit graph stays out of the main phux workspace's lock.
[workspace]
members = ["ios/bridge"]
default-members = ["."]

[dependencies]
phux-client-core = { path = "../../crates/phux-client-core" }
phux-client-runtime = { path = "../../crates/phux-client-runtime" }
# Shared first-run step (`onboarding-progress.json` in the server state dir).
phux-config = { path = "../../crates/phux-config" }
# The host palette and hash every client shares.
phux-config-core = { path = "../../crates/phux-config-core" }
# The design tokens, the theme solver and the theme catalog every client shares.
phux-design = { path = "../../crates/phux-design" }
phux-perf = { path = "../../crates/phux-perf" }
phux-protocol = { path = "../../crates/phux-protocol" }
# Rune has no releases; apps pin a `dev` revision (dev is fast-forward only).
# Phux supplies Inter and the terminal font through AppSpec::fonts. Keep
# Rune's other defaults, but don't carry its unused embedded font copies.
# Packaged qualification and the updater's GPU launch check use headless tooling.
rune = { git = "https://github.com/anomalyco/rune", rev = "52f858284387401dad7f7e12574ce7764f32889f", default-features = false, features = ["accessibility", "dbus", "metal-backend", "ogg-audio", "svg", "tooling"] }
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "52f858284387401dad7f7e12574ce7764f32889f" }
rune-perf = { git = "https://github.com/anomalyco/rune", rev = "52f858284387401dad7f7e12574ce7764f32889f" }
# The quick terminal's shortcut recorder in Settings.
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "52f858284387401dad7f7e12574ce7764f32889f" }
# Never called directly: Rune's decoder guesses the format, so these
# features (unified with Rune's png/jpeg) let typed documents draw GIF/WebP.
image = { version = "0.25", default-features = false, features = ["gif", "webp"] }
# Cuts the onboarding fox's 16-bit sprite strips into frames; already locked.
png = "0.17"
# Already in Rune's graph (resvg): paints the pitch's still background once per size.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
serde_json = "1"
# Waits on a runtime answer from a worker thread; already in the graph (wgpu).
pollster = "1"
serde = { version = "1", features = ["derive"] }
url = "2"
# Anonymous, private files bound renderer I/O without pipe deadlocks.
tempfile = "3"
# The same digest the runtime uses, for a downloaded update.
sha2 = "0.11"
# The Pair a phone QR; the version and features `phux pair` already uses.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
# Frame builders the tests feed the embedded client; pure Rust, no new graph.
phux-wire-fixtures = { path = "../../crates/phux-wire-fixtures" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
phux-plugin = { path = "../../crates/phux-plugin" }

# Catching SIGXFSZ, so a write past RLIMIT_FSIZE fails instead of killing
# the app (src/file_size.rs); already in the graph.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The desktop's light or dark preference from the XDG portal (src/theme/portal.rs);
# the same zbus/async-io stack Rune's `dbus` feature already builds.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io"] }
async-io = "2"
futures-lite = { version = "2", default-features = false, features = ["std"] }

# The Dock count and System Settings' window; same objc2 as Rune's. Rune's
# taskbar badge still retains destroyed windows (see src/dock.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSString"] }

# Asking CoreText which face covers a character (grid/missing.rs).
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-core-foundation = "0.3"
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont"] }
skrifa = "0.44"

[patch.crates-io]
# Git dependencies do not inherit Rune's workspace patches. Track all six
# at the same upstream base: IME, frame corners, shaping/bidi, GPU and AX.
# Keep the upstream base; only Wayland cursor publication differs in this fork.
winit = { git = "https://github.com/no-phux/rune", rev = "ba5690bf204b3f98bdd116601bca2c9fc588a693" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "52f858284387401dad7f7e12574ce7764f32889f" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "52f858284387401dad7f7e12574ce7764f32889f" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "52f858284387401dad7f7e12574ce7764f32889f" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "52f858284387401dad7f7e12574ce7764f32889f" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "52f858284387401dad7f7e12574ce7764f32889f" }

[profile.release]
lto = "thin"

# Rendering, shaping, and accessibility fixtures are CPU-bound in an unoptimized
# test build. The 64 KiB search test took 163.66 s at opt-level 0 and 10.61 s at
# opt-level 1; CI caches the optimized third-party artifacts between changes.
[profile.test]
opt-level = 1

[lints.rust]
unsafe_code = "deny"
