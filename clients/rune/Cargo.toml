[package]
name = "phux-rune"
version = "0.1.40"
description = "The phux desktop client, built on the Rune UI framework."
edition = "2024"
publish = false
license = "Apache-2.0"

[[bin]]
name = "phux-rune"
path = "src/main.rs"

# Rune's wgpu/winit graph stays out of the main phux workspace's lock.
[workspace]
members = ["ios/bridge"]
default-members = ["."]

[dependencies]
phux-client-core = { path = "../../crates/phux-client-core" }
phux-client-runtime = { path = "../../crates/phux-client-runtime" }
# The host palette and hash every client shares.
phux-config-core = { path = "../../crates/phux-config-core" }
# The design tokens, the theme solver and the theme catalog every client shares.
phux-design = { path = "../../crates/phux-design" }
phux-perf = { path = "../../crates/phux-perf" }
phux-protocol = { path = "../../crates/phux-protocol" }
# Rune has no releases; apps pin a `dev` revision (dev is fast-forward only).
# One Linux IME serial fix atop upstream 5329931; keep it on future pin bumps
# until upstream avoids committing unchanged IME cursor rectangles.
# Phux supplies Inter and the terminal font through AppSpec::fonts. Keep
# Rune's other defaults, but don't carry its unused embedded font copies.
# Packaged qualification and the updater's GPU launch check use headless tooling.
rune = { git = "https://github.com/no-phux/rune", rev = "719b0a8b5e602b52ce2a8ad404e29b965e0ac223", default-features = false, features = ["accessibility", "dbus", "metal-backend", "ogg-audio", "svg", "tooling"] }
rune-notify = { git = "https://github.com/no-phux/rune", rev = "719b0a8b5e602b52ce2a8ad404e29b965e0ac223" }
rune-perf = { git = "https://github.com/no-phux/rune", rev = "719b0a8b5e602b52ce2a8ad404e29b965e0ac223" }
# The quick terminal's shortcut recorder in Settings.
rune-kit = { git = "https://github.com/no-phux/rune", rev = "719b0a8b5e602b52ce2a8ad404e29b965e0ac223" }
# Never called directly: Rune's decoder guesses the format, so these
# features (unified with Rune's png/jpeg) let typed documents draw GIF/WebP.
image = { version = "0.25", default-features = false, features = ["gif", "webp"] }
# Cuts the onboarding fox's 16-bit sprite strips into frames; already locked.
png = "0.17"
# Already in Rune's graph (resvg): paints the pitch's still background once per size.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
serde_json = "1"
# Waits on a runtime answer from a worker thread; already in the graph (wgpu).
pollster = "1"
serde = { version = "1", features = ["derive"] }
url = "2"
# Anonymous, private files bound renderer I/O without pipe deadlocks.
tempfile = "3"
# The same digest the runtime uses, for a downloaded update.
sha2 = "0.11"
# The Pair a phone QR; the version and features `phux pair` already uses.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
# Frame builders the tests feed the embedded client; pure Rust, no new graph.
phux-wire-fixtures = { path = "../../crates/phux-wire-fixtures" }

# The desktop's light or dark preference from the XDG portal (src/theme/portal.rs);
# the same zbus, tokio and futures-util Rune's `dbus` feature already builds.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
tokio = { version = "1", features = ["rt", "time"] }
futures-util = { version = "0.3", default-features = false }

# The Dock count and System Settings' window; same objc2 as Rune's. Rune's
# taskbar badge still retains destroyed windows (see src/dock.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSString"] }

# Asking CoreText which face covers a character (grid/missing.rs).
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-core-foundation = "0.3"
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont"] }
skrifa = "0.44"

[patch.crates-io]
# Git dependencies do not inherit Rune's workspace patches. Track all five
# at the same rev: native IME, text shaping/bidi, GPU and native accessibility.
winit = { git = "https://github.com/no-phux/rune", rev = "719b0a8b5e602b52ce2a8ad404e29b965e0ac223" }
parley_engine = { git = "https://github.com/no-phux/rune", rev = "719b0a8b5e602b52ce2a8ad404e29b965e0ac223" }
wgpu-hal = { git = "https://github.com/no-phux/rune", rev = "719b0a8b5e602b52ce2a8ad404e29b965e0ac223" }
accesskit_windows = { git = "https://github.com/no-phux/rune", rev = "719b0a8b5e602b52ce2a8ad404e29b965e0ac223" }
accesskit_macos = { git = "https://github.com/no-phux/rune", rev = "719b0a8b5e602b52ce2a8ad404e29b965e0ac223" }

[profile.release]
lto = "thin"

[lints.rust]
unsafe_code = "deny"
