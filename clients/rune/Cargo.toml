[package]
name = "phux-rune"
version = "0.1.19"
description = "The phux desktop client, built on the Rune UI framework."
edition = "2024"
publish = false
license = "Apache-2.0"

[[bin]]
name = "phux-rune"
path = "src/main.rs"

# Rune's wgpu/winit graph stays out of the main phux workspace's lock.
[workspace]
members = ["ios/bridge"]
default-members = ["."]

[dependencies]
phux-client-core = { path = "../../crates/phux-client-core" }
phux-client-runtime = { path = "../../crates/phux-client-runtime" }
# The host palette and hash every client shares.
phux-config-core = { path = "../../crates/phux-config-core" }
phux-perf = { path = "../../crates/phux-perf" }
phux-protocol = { path = "../../crates/phux-protocol" }
# Rune has no releases; apps pin a `dev` revision (dev is fast-forward only).
# Phux supplies Inter and the terminal font through AppSpec::fonts. Keep
# Rune's other defaults, but don't carry its unused embedded font copies.
# Packaged qualification and the updater's GPU launch check use headless tooling.
rune = { git = "https://github.com/anomalyco/rune", rev = "726ccc363ad115c6cc8f603f397f101d04e7c8e9", default-features = false, features = ["accessibility", "dbus", "metal-backend", "ogg-audio", "svg", "tooling"] }
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "726ccc363ad115c6cc8f603f397f101d04e7c8e9" }
rune-perf = { git = "https://github.com/anomalyco/rune", rev = "726ccc363ad115c6cc8f603f397f101d04e7c8e9" }
# Never called directly: Rune's decoder guesses the format, so these
# features (unified with Rune's png/jpeg) let typed documents draw GIF/WebP.
image = { version = "0.25", default-features = false, features = ["gif", "webp"] }
# Cuts the onboarding fox's 16-bit sprite strips into frames; already locked.
png = "0.17"
# Already in Rune's graph (resvg): paints the pitch's still background once per size.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2"
# The same digest the runtime uses, for a downloaded update.
sha2 = "0.11"

# The Dock count and System Settings' window; same objc2 as Rune's. Rune's
# taskbar badge still retains destroyed windows (see src/dock.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSString"] }

[patch.crates-io]
# Git dependencies do not inherit Rune's workspace patches. Track all four
# at the same rev: native IME, text shaping/bidi, GPU and Windows accessibility.
winit = { git = "https://github.com/anomalyco/rune", rev = "726ccc363ad115c6cc8f603f397f101d04e7c8e9" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "726ccc363ad115c6cc8f603f397f101d04e7c8e9" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "726ccc363ad115c6cc8f603f397f101d04e7c8e9" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "726ccc363ad115c6cc8f603f397f101d04e7c8e9" }

[profile.release]
lto = "thin"

[lints.rust]
unsafe_code = "deny"
