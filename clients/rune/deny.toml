# cargo-deny for this workspace's own lockfile (`just rune-deny`): the root
# deny.toml's rules, plus the git source only Rune's graph uses. Rune has no
# releases, and this client pins a `dev` revision.

[graph]
all-features = true
# What ships; Windows-only crates in Rune's graph don't.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"
unmaintained = "workspace"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/anomalyco/rune",
    "https://github.com/phall1/libghostty-rs",
]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
