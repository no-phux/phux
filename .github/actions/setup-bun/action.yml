name: setup-bun
description: Install the Bun that mise.toml pins, for `bun tools/main.ts` and the desktop tooling.
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        version="$(sed -n 's/^bun = "\([^"]*\)"/\1/p' mise.toml)"
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.pin.outputs.version }}
