name: Linux desktop setup
description: Native Ubuntu 24.04 desktop build and X11 software-rendering qualification dependencies. Bun comes from setup-bun.
inputs:
  source:
    description: Checkout containing the pinned contributor toolchains
    default: .
runs:
  using: composite
  steps:
    - name: Install native desktop and qualification dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config clang cmake mold curl xz-utils \
          libfontconfig1-dev libfreetype6-dev libasound2-dev libxkbcommon-dev \
          libxkbcommon-x11-dev libwayland-dev libxcb1-dev libxcb-xkb-dev \
          libssl-dev libvulkan-dev mesa-vulkan-drivers libegl1-mesa-dev \
          xvfb xauth dbus-x11 tesseract-ocr fonts-dejavu-core openbox xdotool xclip \
          x11-utils imagemagick
        icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
        test -n "$icd"
        echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
        echo 'WGPU_BACKEND=vulkan' >> "$GITHUB_ENV"
        echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
    - name: Contributor Rust and Zig setup
      shell: bash
      working-directory: ${{ inputs.source }}
      run: |
        set -euo pipefail
          bash scripts/setup-rust.sh native
          bash scripts/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"
    # The release binary, checked against the release's SHA256SUMS; building
    # it with cargo install cost a minute of every desktop job.
    - name: Install the repository-pinned command runner
      shell: bash
      working-directory: ${{ inputs.source }}
      run: |
        set -euo pipefail
        version="$(sed -n 's/^just = "\([^"]*\)"/\1/p' mise.toml)"
        test -n "$version"
        archive="just-${version}-$(uname -m)-unknown-linux-musl.tar.gz"
        base="https://github.com/casey/just/releases/download/${version}"
        dir="$RUNNER_TEMP/phux-desktop-tools"
        mkdir -p "$dir/bin"
        curl -fsSL --retry 3 -o "$dir/$archive" "$base/$archive"
        curl -fsSL --retry 3 -o "$dir/SHA256SUMS" "$base/SHA256SUMS"
        (cd "$dir" && grep " ${archive}\$" SHA256SUMS | sha256sum -c -)
        tar -xzf "$dir/$archive" -C "$dir/bin" just
        echo "$dir/bin" >> "$GITHUB_PATH"
        "$dir/bin/just" --version
