# Shared setup for the Linux Rust compile lanes (ci.yml check/test, stress).
#
# This block was copy-pasted across three jobs, and the copies had already
# drifted once (the stress lane carried no compiler cache while the ci lanes
# did). One definition keeps the cache-key policy and the disk-headroom trim
# the same everywhere they run.
#
# Steps, in order:
#   1. Drop unused preinstalled toolchains from the ephemeral hosted runner.
#   2. Nix + Cachix: the pinned devshell (rustc, zig, nextest, deny, mbx).
#   3. mbx (jdx/mr-boxington) for the check and icount lanes, the same pinned
#      build cache local shells use (docs/SETUP.md#build-cache-mbx). It
#      content-keys every compilation, build-script run, and native (mold)
#      link. The GitHub `objects` payload carries only what that lane's builds
#      used or produced; saves are restricted to pushes to main so PR writes
#      cannot thrash the shared 10 GB LRU. The primary key excludes the
#      commit: an exact hit skips the post-step export. The key changes with
#      flake.lock, Cargo.lock, or the UTC day, and ci.yml's prune-build-cache
#      keeps the newest check and icount entry.
#      The test lane does not restore or save that payload. Run 38442503688
#      saved a 5.5 GB archive (5940645663 bytes) and the repo's other caches,
#      including Cockpit's ~4.8 GB zig entry, already fill the 10 GB cap, so
#      the archive was gone before the next job. Importing it takes about as
#      long as the cold compile, and packaging the export takes about eleven
#      minutes. PHUX_CI_MBX still wraps Cargo, so unit tests and e2e share one
#      disk store inside the job.
#      Objects mode leaves GC off during the build. A cap under the restored
#      working set deletes the action results the next build needs. Collect
#      only above that working set, and only before any build records its
#      export group; after the lane, release Cargo downloads without evicting
#      the group's pending action results.
#
# No CPU fingerprint: libghostty-vt-sys builds Zig for `-Dcpu=baseline` unless
# LIBGHOSTTY_VT_SYS_CPU says otherwise (and its build script declares that
# variable, so mbx keys on it), so a restored archive cannot SIGILL on leaner
# hosted hardware the way the old host-native build could.
name: setup-rust-lane
description: Shared Linux Rust-lane setup — disk headroom, Nix + Cachix, mbx build cache.

inputs:
  cachix-auth-token:
    description: Cachix auth token (secrets are not implicitly visible to composite actions).
    required: true
  cache-lane:
    description: >
      Build-cache series. `check` and `icount` each keep their own GitHub
      objects entry. `test` skips that cache: its archive does not fit in the
      shared 10 GB budget.
    required: true

outputs:
  cache-hit:
    description: mbx action cache-hit output (exact key restored), for the lane signal step.
    value: ${{ steps.mbx.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: runner disk headroom
      shell: bash
      run: |
        df -h / | tail -1
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
        df -h / | tail -1

    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: phux
        authToken: ${{ inputs.cachix-auth-token }}
        pushFilter: '(-source$|nixpkgs\.tar\.gz$)'

    - name: verify pinned shell prerequisites
      shell: bash
      run: nix develop -c bash scripts/doctor.sh ci

    # The mbx action runs outside `nix develop`: it finds mbx on PATH and keys
    # the cache on `rustc -vV`, so hand it the devshell's pinned binaries (the
    # mise.toml mbx release, the rust-toolchain.toml compiler) rather than let
    # it download the latest mbx and key on the runner image's rustc.
    # PHUX_CI_MBX opts this CI shell into the flake's mbx `cargo` wrapper.
    # The generation folds in flake.lock: mbx keys on rustc, but not on the
    # Zig or mold a nixpkgs bump can change underneath an unchanged rustc,
    # which is the same invalidation the old rust-cache key carried. The
    # GitHub entry uses cache_key from this step, not the action's generated
    # rustc-and-commit key. flake.lock already pins that compiler.
    - name: expose the devshell's mbx and rustc
      id: mbx-env
      shell: bash
      env:
        CACHE_LANE: ${{ inputs.cache-lane }}
      run: |
        set -euo pipefail
        # Through a file: the shellHook greets on stdout.
        nix develop -c bash -c 'dirname "$(command -v mbx)" > "$1"; dirname "$(command -v rustc)" >> "$1"' _ "$RUNNER_TEMP/mbx-path"
        cat "$RUNNER_TEMP/mbx-path" >> "$GITHUB_PATH"
        echo "PHUX_CI_MBX=1" >> "$GITHUB_ENV"
        flake="$(sha256sum flake.lock | cut -c1-12)"
        lock="$(sha256sum Cargo.lock | cut -c1-12)"
        # UTC day, not the commit. mr-boxington-action skips the objects
        # export on an exact primary-key hit; a per-commit key never hits
        # and repackages the whole store after every green main push.
        day="$(date -u +%Y%m%d)"
        case "$(uname -m)" in
          aarch64|arm64) platform=linux-arm64 ;;
          x86_64) platform=linux-x64 ;;
          *) platform="linux-$(uname -m)" ;;
        esac
        generation="phux-${CACHE_LANE}-${flake}"
        {
          echo "generation=${generation}"
          echo "cache_key=${platform}-mbx-${generation}-${lock}-${day}"
          # Prefix of the previous per-commit keys (`…-${flake}-dir-rust-…`)
          # as well as today's key, so the first run of a new day or lockfile
          # still restores the newest compatible store.
          echo "restore_key=${platform}-mbx-${generation}-"
        } >> "$GITHUB_OUTPUT"

    # The test profile's objects archive is ~5.5 GB compressed. It cannot
    # stay resident next to Cockpit's zig cache, and the restore costs about
    # as much as recompiling. check and icount archives are ~1.5 GiB logical
    # and save in seconds.
    - uses: jdx/mr-boxington-action@d0825fbaf3cc36ca2609aa38e71046265a1f1e37 # v1.7.1
      id: mbx
      if: inputs.cache-lane != 'test'
      with:
        backend: github
        github-cache-mode: objects
        # Not `isolate-objects-cache`: v1.7.1's post step cannot delete the
        # isolated store, because mbx marks its shared OUT_DIR copies
        # read-only (EACCES), and that failure skips the save.
        cache-generation: ${{ steps.mbx-env.outputs.generation }}
        cache-key: ${{ steps.mbx-env.outputs.cache_key }}
        restore-keys: ${{ steps.mbx-env.outputs.restore_key }}

    - name: bound restored objects before recording builds
      if: inputs.cache-lane != 'test'
      shell: bash
      run: |
        set -euo pipefail
        # --max-size caps the action store only. A cap of 8 GiB sat under a
        # restored store (~19 GiB logical, run 38442503688) and deleted every
        # action result before the build, which then recorded 0 hits. 48 GiB
        # is above the check and icount working sets on the 145 GB hosted
        # disk and still bounds a runaway store. Collection after the first
        # build would drop the export group, so this stays in front of it.
        mbx gc --max-size 48GiB
