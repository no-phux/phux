# Shared setup for ci.yml's Linux Rust lanes. The tests and e2e jobs take
# `build-cache: none`: they execute a downloaded nextest archive and compile
# nothing, so they need the devshell's tools but no build cache.
#
# Steps, in order:
#   1. Drop unused preinstalled toolchains only when the disk is actually tight.
#   2. Nix + Cachix: the pinned devshell (rustc, zig, nextest, deny, mbx).
#      cachix-action pushes what realizing it builds; pushFilter only
#      excludes paths (sources and nixpkgs tarballs). libghostty-vt is not
#      part of the shell: its build script downloads a prebuilt archive.
#   3. mbx (jdx/mr-boxington), the same pinned build cache local shells use
#      (docs/development.md#build-cache-mbx). It content-keys every compilation,
#      build-script run, and native (mold) link. The GitHub `objects` payload
#      carries only what that lane's builds used or produced; saves are
#      restricted to pushes to main so PR writes cannot thrash the shared
#      10 GB LRU. The primary key excludes the commit: an exact hit skips the
#      post-step export. The key changes with flake.lock, Cargo.lock, or the
#      UTC day, and ci.yml's prune-build-cache keeps the newest entry per lane.
#      A cold test build records "not looked up": mbx learns the key while
#      compiling, then the save makes the next job a hit. Run 38451988937
#      compiled the test profile in 10m 24s with 0 hits and stored a 2.3 GB
#      archive (2339429694 bytes). That is the entry to restore. The earlier
#      5.5 GB / 11 min export was a store whose action results had been
#      deleted before the build.
#      Objects mode leaves GC off during the build. A cap under the restored
#      working set deletes the action results the next build needs. Collect
#      only above that working set, and only before any build records its
#      export group. The post step byte-copies that store, so the cap also
#      has to leave room for the copy beside the managed target. Headroom
#      collapses those duplicate target bytes and skips the save when the
#      copy still does not fit.
#
# No CPU fingerprint: libghostty-vt-sys links its prebuilt archive, built for
# Zig's `baseline` CPU, and builds from source for that CPU too unless
# LIBGHOSTTY_VT_SYS_CPU says otherwise. Its build script declares that
# variable, so mbx keys on it, and a restored archive cannot SIGILL on leaner
# hosted hardware the way a host-native build could.
name: setup-rust-lane
description: Shared Linux Rust-lane setup — disk headroom, Nix + Cachix, and an mbx or dependency-only build cache.

inputs:
  cachix-auth-token:
    description: Cachix auth token (secrets are not implicitly visible to composite actions).
    required: true
  cache-lane:
    description: Build-cache series; one GitHub entry per lane (check, icount, test, uniffi). Unused with build-cache none.
    required: false
    default: ""
  build-cache:
    description: mbx (content-keyed objects store), deps (third-party dependency artifacts only), or none (a lane that runs prebuilt test binaries).
    required: false
    default: mbx

outputs:
  cache-hit:
    description: Build-cache hit output (exact key restored), for the lane signal step.
    value: ${{ steps.mbx.outputs.cache-hit || steps.deps.outputs.cache-hit }}
  cache-key:
    description: Primary objects-cache key. A failed main lane saves this same key.
    value: ${{ steps.mbx-env.outputs.cache_key }}

runs:
  using: composite
  steps:
    - name: runner disk headroom
      shell: bash
      run: |
        df -h / | tail -1
        avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
        # The x64 image spends about 2.5 minutes deleting preinstalled
        # toolchains when the disk is already mostly empty (run 38442503688
        # icount: 86G free). Pay that only when a build could fill the disk.
        if [ "${avail_kb}" -lt $((40 * 1024 * 1024)) ]; then
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h / | tail -1
        fi

    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: phux
        authToken: ${{ inputs.cachix-auth-token }}
        pushFilter: '(-source$|nixpkgs\.tar\.gz$)'

    # The mbx action runs outside `nix develop`: it finds mbx on PATH and keys
    # the cache on `rustc -vV`, so hand it the devshell's pinned binaries (the
    # mise.toml mbx release, the rust-toolchain.toml compiler) rather than let
    # it download the latest mbx and key on the runner image's rustc.
    # PHUX_CI_MBX opts this CI shell into the flake's mbx `cargo` wrapper.
    # The generation folds in flake.lock: mbx keys on rustc, but not on the
    # Zig or mold a nixpkgs bump can change underneath an unchanged rustc,
    # which is the same invalidation the old rust-cache key carried. The
    # GitHub entry uses cache_key from this step, not the action's generated
    # rustc-and-commit key. flake.lock already pins that compiler. The
    # devshell's bun rides along for scripts/ci/mbx-export-headroom.sh, which
    # these mbx lanes run outside `nix develop`.
    - name: expose the devshell's mbx, rustc and bun
      if: inputs.build-cache == 'mbx'
      id: mbx-env
      shell: bash
      env:
        CACHE_LANE: ${{ inputs.cache-lane }}
      run: |
        set -euo pipefail
        # Through a file: the shellHook greets on stdout.
        nix develop -c bash -c 'for tool in mbx rustc bun; do dirname "$(command -v "$tool")"; done > "$1"' _ "$RUNNER_TEMP/mbx-path"
        cat "$RUNNER_TEMP/mbx-path" >> "$GITHUB_PATH"
        echo "PHUX_CI_MBX=1" >> "$GITHUB_ENV"
        flake="$(sha256sum flake.lock | cut -c1-12)"
        lock="$(sha256sum Cargo.lock | cut -c1-12)"
        # UTC day, not the commit. mr-boxington-action skips the objects
        # export on an exact primary-key hit; a per-commit key never hits
        # and repackages the whole store after every green main push.
        day="$(date -u +%Y%m%d)"
        case "$(uname -m)" in
          aarch64|arm64) platform=linux-arm64 ;;
          x86_64) platform=linux-x64 ;;
          *) platform="linux-$(uname -m)" ;;
        esac
        generation="phux-${CACHE_LANE}-${flake}"
        {
          echo "generation=${generation}"
          echo "cache_key=${platform}-mbx-${generation}-${lock}-${day}"
          # Prefix of the previous per-commit keys (`…-${flake}-dir-rust-…`)
          # as well as today's key, so the first run of a new day or lockfile
          # still restores the newest compatible store.
          echo "restore_key=${platform}-mbx-${generation}-"
        } >> "$GITHUB_OUTPUT"

    - uses: jdx/mr-boxington-action@d0825fbaf3cc36ca2609aa38e71046265a1f1e37 # v1.7.1
      if: inputs.build-cache == 'mbx'
      id: mbx
      with:
        backend: github
        github-cache-mode: objects
        # Not `isolate-objects-cache`: v1.7.1's post step cannot delete the
        # isolated store, because mbx marks its shared OUT_DIR copies
        # read-only (EACCES), and that failure skips the save.
        cache-generation: ${{ steps.mbx-env.outputs.generation }}
        cache-key: ${{ steps.mbx-env.outputs.cache_key }}
        restore-keys: ${{ steps.mbx-env.outputs.restore_key }}

    - name: bound restored objects before recording builds
      if: inputs.build-cache == 'mbx'
      shell: bash
      run: |
        set -euo pipefail
        # --max-size caps the action store only. A cap of 8 GiB sat under a
        # restored store (~19 GiB logical, run 38442503688) and deleted every
        # action result before the build, which then recorded 0 hits. 48 GiB
        # then let the test lane reach 36.5 GiB of objects beside a 37.3 GiB
        # target (run 38505694112); the export copy hit ENOSPC with 30 GiB
        # free. 40 GiB stays above that working set on the 145 GiB disk.
        # Collection after the first build would drop the export group, so
        # this stays in front of it.
        mbx gc --max-size 40GiB

    # Dependency-only cache for the ffi lane. rust-cache keeps only
    # third-party artifacts and build-script outputs, drops workspace crates
    # and incremental state before saving, and keys on rustc, Cargo.lock,
    # flake.lock, and every CARGO_* variable set here.
    #
    # Test builds skip debuginfo and incremental state. Incremental state is
    # never reused by a fresh CI checkout's workspace crates, and line tables
    # serve only symbolized backtraces: panic locations come from
    # #[track_caller], and symbol names stay in the unstripped test binaries.
    # Both multiply the bytes compiled, linked, and cached.
    - name: expose the devshell's rustc and the test-build settings
      if: inputs.build-cache == 'deps'
      id: deps-env
      shell: bash
      run: |
        set -euo pipefail
        # Through a file: the shellHook greets on stdout.
        nix develop -c bash -c 'dirname "$(command -v rustc)" > "$1"' _ "$RUNNER_TEMP/rustc-path"
        cat "$RUNNER_TEMP/rustc-path" >> "$GITHUB_PATH"
        {
          echo "CARGO_INCREMENTAL=0"
          echo "CARGO_PROFILE_DEV_DEBUG=0"
        } >> "$GITHUB_ENV"
        echo "flake=$(sha256sum flake.lock | cut -c1-12)" >> "$GITHUB_OUTPUT"

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      if: inputs.build-cache == 'deps'
      id: deps
      with:
        shared-key: phux-${{ inputs.cache-lane }}
        # flake.lock pins the Zig and mold a dependency build script uses;
        # rust-cache already keys on rustc, Cargo.lock, and CARGO_* settings.
        key: ${{ steps.deps-env.outputs.flake }}
        # Pull requests restore only (see docs/development.md#ci).
        save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        cache-on-failure: "true"
