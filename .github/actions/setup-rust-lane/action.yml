# Shared setup for the Linux Rust compile lanes (ci.yml check/test, stress).
#
# This block was copy-pasted across three jobs, and the copies had already
# drifted once (the stress lane carried no compiler cache while the ci lanes
# did). One definition keeps the cache-key policy, the disk-headroom trim, and
# the build cache identical everywhere they run.
#
# Steps, in order:
#   1. Drop unused preinstalled toolchains from the ephemeral hosted runner.
#   2. Nix + Cachix: the pinned devshell (rustc, zig, nextest, deny, mbx).
#   3. mbx (jdx/mr-boxington), the same pinned build cache local shells use
#      (docs/SETUP.md#build-cache-mbx). It content-keys every compilation,
#      build-script run, and native (mold) link, so a fresh checkout's new
#      source mtimes no longer force the workspace to recompile, and test
#      binaries restore instead of relinking. The GitHub `objects` payload
#      carries only what this lane's builds used or produced; saves are
#      restricted to pushes to main so PR writes cannot thrash the shared
#      10 GB LRU and evict the warm base every lane restores from. Each main
#      push saves a new entry; ci.yml's prune-build-cache keeps the newest.
#      Objects mode leaves GC off during the build. Collect the restored store
#      before any build records its export group; after the lane, release Cargo
#      downloads without evicting the group's pending action results.
#
# No CPU fingerprint: libghostty-vt-sys builds Zig for `-Dcpu=baseline` unless
# LIBGHOSTTY_VT_SYS_CPU says otherwise (and its build script declares that
# variable, so mbx keys on it), so a restored archive cannot SIGILL on leaner
# hosted hardware the way the old host-native build could.
name: setup-rust-lane
description: Shared Linux Rust-lane setup — disk headroom, Nix + Cachix, mbx build cache.

inputs:
  cachix-auth-token:
    description: Cachix auth token (secrets are not implicitly visible to composite actions).
    required: true
  cache-lane:
    description: Build-cache series; keep one per cargo profile (check, test) so lanes never restore each other's closure.
    required: true

outputs:
  cache-hit:
    description: mbx action cache-hit output (exact key restored), for the lane signal step.
    value: ${{ steps.mbx.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: runner disk headroom
      shell: bash
      run: |
        df -h / | tail -1
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
        df -h / | tail -1

    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: phux
        authToken: ${{ inputs.cachix-auth-token }}
        pushFilter: '(-source$|nixpkgs\.tar\.gz$)'

    - name: verify pinned shell prerequisites
      shell: bash
      run: nix develop -c bash scripts/doctor.sh ci

    # The mbx action runs outside `nix develop`: it finds mbx on PATH and keys
    # the cache on `rustc -vV`, so hand it the devshell's pinned binaries (the
    # mise.toml mbx release, the rust-toolchain.toml compiler) rather than let
    # it download the latest mbx and key on the runner image's rustc.
    # PHUX_CI_MBX opts this CI shell into the flake's mbx `cargo` wrapper.
    # The generation folds in flake.lock: mbx keys on rustc, but not on the
    # Zig or mold a nixpkgs bump can change underneath an unchanged rustc,
    # which is the same invalidation the old rust-cache key carried.
    - name: expose the devshell's mbx and rustc
      id: mbx-env
      shell: bash
      env:
        CACHE_LANE: ${{ inputs.cache-lane }}
      run: |
        set -euo pipefail
        # Through a file: the shellHook greets on stdout.
        nix develop -c bash -c 'dirname "$(command -v mbx)" > "$1"; dirname "$(command -v rustc)" >> "$1"' _ "$RUNNER_TEMP/mbx-path"
        cat "$RUNNER_TEMP/mbx-path" >> "$GITHUB_PATH"
        echo "PHUX_CI_MBX=1" >> "$GITHUB_ENV"
        echo "generation=phux-${CACHE_LANE}-$(sha256sum flake.lock | cut -c1-12)" >> "$GITHUB_OUTPUT"

    - uses: jdx/mr-boxington-action@d0825fbaf3cc36ca2609aa38e71046265a1f1e37 # v1.7.1
      id: mbx
      with:
        backend: github
        github-cache-mode: objects
        # Not `isolate-objects-cache`: v1.7.1's post step cannot delete the
        # isolated store, because mbx marks its shared OUT_DIR copies
        # read-only (EACCES), and that failure skips the save.
        cache-generation: ${{ steps.mbx-env.outputs.generation }}

    - name: bound restored objects before recording builds
      shell: bash
      run: mbx gc --max-size 8GiB
