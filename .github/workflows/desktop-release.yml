# Release Please owns the immutable tag and draft; release.yml is the only door.
# Stable: notarized Apple silicon DMG + ZIP, Linux x64/arm64, and native Windows x64 ZIP.
name: Release Desktop

on:
  workflow_call:
    inputs:
      tag:
        description: Existing desktop-vX.Y.Z draft to build and publish
        required: true
        type: string
      channel:
        description: Stable draft publication or next-channel qualification
        default: stable
        type: string
      sha:
        description: Immutable green-main SHA required for next
        default: ""
        type: string
    secrets:
      PHUX_MINISIGN_SECRET_KEY:
        description: minisign secret key that signs a stable checksum (ADR-0178); next signs in next.yml
        required: false
      APPLE_DEVELOPER_ID_P12:
        description: Base64 Developer ID Application certificate and private key
        required: false
      APPLE_DEVELOPER_ID_PASSWORD:
        required: false
      APPLE_NOTARY_KEY_P8:
        description: Base64 App Store Connect API private key for notarytool
        required: false
      APPLE_NOTARY_KEY_ID:
        required: false
      APPLE_NOTARY_ISSUER_ID:
        required: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  capabilities:
    name: Select the tagged desktop target set
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      windows: ${{ steps.targets.outputs.windows }}
      sidecars: ${{ steps.targets.outputs.sidecars }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - id: targets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          bun - <<'JS'
            import { appendFileSync } from "node:fs";
            import { targets, VERSION, SHA } from "./tools/src/release/manifest.ts";
            const { RELEASE_TAG: tag, RELEASE_CHANNEL: channel, RELEASE_SHA: sha, GITHUB_OUTPUT: output } = process.env;
            const version = channel === "stable" ? tag.slice("desktop-v".length) : "0.0.0";
            if (channel !== "stable" && channel !== "next") throw new Error("Invalid desktop channel");
            if (channel === "stable" && (!VERSION.test(version) || tag !== `desktop-v${version}`)) throw new Error("Invalid desktop tag");
            if (channel === "next" && (tag !== "next" || !SHA.test(sha))) throw new Error("Invalid next source");
            const required = targets("desktop", channel, version);
            appendFileSync(output, `windows=${required.includes("x86_64-pc-windows-msvc")}\nsidecars=${required.length + 1}\n`);
          JS
  macos:
    needs: capabilities
    name: Qualify and publish macOS arm64
    # Build on the oldest supported host/SDK; PRs also qualify Xcode 27.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PHUX_BUILD_CHANNEL: ${{ inputs.channel }}
      PHUX_CHANNEL: ${{ inputs.channel }}
      PHUX_BUILD_SHA: ${{ inputs.sha }}
      GH_REPO: ${{ github.repository }}
      LIBGHOSTTY_VT_SYS_CPU: baseline
      RUSTFLAGS: -C target-cpu=apple-m1
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    steps:
      # The harness follows main; all product builds use the immutable tag below.
      # Keep checkouts siblings: an ancestor Cargo workspace captures GPUI's
      # path dependencies and breaks their workspace-inherited dependencies.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: harness
          persist-credentials: false
      - name: Require an existing desktop draft and native runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          if [[ "$PHUX_BUILD_CHANNEL" == next ]]; then
            test "$RELEASE_TAG" = next
            [[ "$PHUX_BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]
          else
            test "$PHUX_BUILD_CHANNEL" = stable
            [[ "$RELEASE_TAG" =~ ^desktop-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          fi
      - name: Require stable Apple signing configuration before building
        if: inputs.channel == 'stable'
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash harness/scripts/ci/sign-macos-desktop.sh --check-config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || inputs.tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tagged source and select archive
        id: version
        working-directory: source
        run: |
          set -euo pipefail
          if [[ "$PHUX_BUILD_CHANNEL" == next ]]; then
            test "$(git rev-parse HEAD)" = "$PHUX_BUILD_SHA"
          else
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          fi
          git merge-base --is-ancestor HEAD origin/main
          echo "PHUX_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # The archive name is release-manifest's naming rule.
          version="$(jq -er .version clients/desktop/package.json)"
          test "$(jq -er '."clients/desktop"' .release-please-manifest.json)" = "$version"
          identity="$version"
          if [[ "$PHUX_BUILD_CHANNEL" == next ]]; then
            identity="next.$PHUX_BUILD_SHA"
          else
            test "$RELEASE_TAG" = "desktop-v$version"
          fi
          echo "archive=phux-desktop-$identity-macos-arm64.zip" >> "$GITHUB_OUTPUT"
      - uses: ./harness/.github/actions/setup-bun
        with:
          source: source
      - uses: ./harness/.github/actions/setup-macos-desktop
        with:
          source: source
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: source -> target
          shared-key: mini-v1-desktop-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build same-checkout qualification CLI
        working-directory: source
        run: cargo build --locked --release -p phux
      - name: Package optimized desktop
        working-directory: source
        run: just desktop-package
      - name: Sign, notarize and staple the stable app and DMG
        if: inputs.channel == 'stable'
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: bash harness/scripts/ci/sign-macos-desktop.sh source/clients/desktop/dist/app/Phux.app "$RUNNER_TEMP/desktop-release/$ARCHIVE"
      - name: Verify final bytes and qualify ZIP and stable DMG installations
        working-directory: source
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: bash ../harness/scripts/ci/qualify-macos-desktop.sh
      - name: Exercise installer transactions
        run: bun test ./harness/tools/src/install/desktop.e2e.ts
      - name: Retain packaged runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-runtime-${{ inputs.sha || inputs.tag }}
          path: ${{ runner.temp }}/desktop-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Retain DMG qualification and Apple notarization receipts
        if: always() && inputs.channel == 'stable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-dmg-${{ inputs.tag }}
          path: |
            ${{ runner.temp }}/desktop-dmg-evidence
            ${{ runner.temp }}/desktop-release/*-notary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload to draft and verify downloaded bytes
        if: inputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail
          dmg="${ARCHIVE%.zip}.dmg"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/desktop-release/$ARCHIVE" "$RUNNER_TEMP/desktop-release/$ARCHIVE.sha256" "$RUNNER_TEMP/desktop-release/$dmg" "$RUNNER_TEMP/desktop-release/$dmg.sha256" "$RUNNER_TEMP/desktop-release/SHA256SUMS" --clobber
          gh release download "$RELEASE_TAG" --pattern "$ARCHIVE" --pattern "$dmg" --pattern SHA256SUMS --dir "$RUNNER_TEMP/desktop-download"
          cd "$RUNNER_TEMP/desktop-download"
          cmp SHA256SUMS "$RUNNER_TEMP/desktop-release/SHA256SUMS"
          shasum -a 256 -c SHA256SUMS
      - name: Hand the stable checksum to the signer
        if: inputs.channel == 'stable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-sidecar-macos-arm64
          path: ${{ runner.temp }}/desktop-release/phux-desktop-*-macos-arm64.*.sha256
          if-no-files-found: error
      - name: Retain qualified next artifacts for serialized publication
        if: inputs.channel == 'next'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-arm64
          path: |
            ${{ runner.temp }}/desktop-release/phux-desktop-next.*.zip
            ${{ runner.temp }}/desktop-release/phux-desktop-next.*.zip.sha256
          if-no-files-found: error

  linux:
    needs: capabilities
    name: Qualify and publish Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PHUX_BUILD_CHANNEL: ${{ inputs.channel }}
      PHUX_CHANNEL: ${{ inputs.channel }}
      PHUX_BUILD_SHA: ${{ inputs.sha }}
      PHUX_DESKTOP_TARGET: ${{ matrix.target }}
      GH_REPO: ${{ github.repository }}
      LIBGHOSTTY_VT_SYS_CPU: baseline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: harness
          persist-credentials: false
      - name: Require an existing desktop draft and native Linux runner
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          case "$TARGET" in
            x86_64-unknown-linux-gnu) test "$(uname -m)" = x86_64 ;;
            aarch64-unknown-linux-gnu) test "$(uname -m)" = aarch64 ;;
            *) exit 1 ;;
          esac
          if [[ "$PHUX_BUILD_CHANNEL" == next ]]; then
            test "$RELEASE_TAG" = next
            [[ "$PHUX_BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]
          else
            test "$PHUX_BUILD_CHANNEL" = stable
            [[ "$RELEASE_TAG" =~ ^desktop-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || inputs.tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable source and select archive
        id: version
        working-directory: source
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [[ "$PHUX_BUILD_CHANNEL" == next ]]; then
            test "$(git rev-parse HEAD)" = "$PHUX_BUILD_SHA"
          else
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          fi
          git merge-base --is-ancestor HEAD origin/main
          PHUX_BUILD_SHA="$(git rev-parse HEAD)"
          export PHUX_BUILD_SHA
          echo "PHUX_BUILD_SHA=$PHUX_BUILD_SHA" >> "$GITHUB_ENV"
          # The archive name is release-manifest's naming rule.
          version="$(jq -er .version clients/desktop/package.json)"
          test "$(jq -er '."clients/desktop"' .release-please-manifest.json)" = "$version"
          identity="$version"
          if [[ "$PHUX_BUILD_CHANNEL" == next ]]; then
            identity="next.$PHUX_BUILD_SHA"
          else
            test "$RELEASE_TAG" = "desktop-v$version"
          fi
          echo "archive=phux-desktop-$identity-linux-$ARCH.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: ./harness/.github/actions/setup-linux-desktop
        with:
          source: source
      - uses: ./harness/.github/actions/setup-bun
        with:
          source: source
      - name: Native desktop lint
        working-directory: source
        run: just desktop-lint
      - name: Native desktop tests and renderer
        # The harness owns orchestration; nested just calls read the immutable
        # source's recipes, including tags older than desktop-tests itself.
        run: just --justfile "$GITHUB_WORKSPACE/harness/justfile" --working-directory "$GITHUB_WORKSPACE/source" desktop-tests
      - name: Build same-checkout qualification CLI
        working-directory: source
        run: cargo build --locked --release -p phux
      - name: Package optimized desktop
        working-directory: source
        run: just desktop-package
      - name: Checksum and qualify the archived Linux package
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-release" "$RUNNER_TEMP/desktop-qualified"
          cp "source/clients/desktop/dist/$ARCHIVE" "$RUNNER_TEMP/desktop-release/"
          cd "$RUNNER_TEMP/desktop-release"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          sha256sum -c "$ARCHIVE.sha256"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/desktop-qualified"
          cd "$GITHUB_WORKSPACE"
          bundle="$RUNNER_TEMP/desktop-qualified/phux-desktop"
          jq -e --arg sha "$PHUX_BUILD_SHA" --arg target "$PHUX_DESKTOP_TARGET" \
            --arg channel "$PHUX_BUILD_CHANNEL" \
            '.sha == $sha and .target == $target and .channel == $channel' \
            "$bundle/share/phux-desktop/release.json" >/dev/null
          test -f "$bundle/bin/phux-desktop"
          xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session -- \
            bun harness/clients/desktop/scripts/smoke-linux.ts \
            --app "$RUNNER_TEMP/desktop-qualified/phux-desktop" \
             --phux "$GITHUB_WORKSPACE/source/target/release/phux" \
             --require-backend Vulkan \
            --output "$RUNNER_TEMP/desktop-evidence"
      - name: Exercise installer transactions
        run: bun test ./harness/tools/src/install/desktop-linux.e2e.ts
      - name: Retain packaged Linux runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-runtime-linux-${{ matrix.arch }}-${{ inputs.sha || inputs.tag }}
          path: ${{ runner.temp }}/desktop-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Upload to draft and verify downloaded bytes
        if: inputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/desktop-release/$ARCHIVE" "$RUNNER_TEMP/desktop-release/$ARCHIVE.sha256" --clobber
          gh release download "$RELEASE_TAG" --pattern "$ARCHIVE" --pattern "$ARCHIVE.sha256" --dir "$RUNNER_TEMP/desktop-download"
          cd "$RUNNER_TEMP/desktop-download"
          cmp "$ARCHIVE.sha256" "$RUNNER_TEMP/desktop-release/$ARCHIVE.sha256"
          sha256sum -c "$ARCHIVE.sha256"
      - name: Hand the stable checksum to the signer
        if: inputs.channel == 'stable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-sidecar-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/desktop-release/*.tar.gz.sha256
          if-no-files-found: error
      - name: Retain qualified next artifacts for serialized publication
        if: inputs.channel == 'next'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/desktop-release/*.tar.gz
            ${{ runner.temp }}/desktop-release/*.tar.gz.sha256
          if-no-files-found: error

  windows:
    name: Qualify and publish native Windows desktop
    needs: capabilities
    if: needs.capabilities.outputs.windows == 'true'
    uses: ./.github/workflows/windows-desktop.yml
    with:
      ref: ${{ inputs.sha || inputs.tag }}
      channel: ${{ inputs.channel }}
      release-tag: ${{ inputs.tag }}

  # Minisign is isolated from build hosts (ADR-0178). Apple signs on macOS.
  # All three platforms
  # must qualify before any signature is issued or the draft is published.
  sign:
    name: Sign and publish stable
    needs: [capabilities, macos, linux, windows]
    if: >-
      always() && inputs.channel == 'stable' &&
      needs.capabilities.result == 'success' &&
      needs.macos.result == 'success' && needs.linux.result == 'success' &&
      (needs.windows.result == 'success' ||
       (needs.capabilities.outputs.windows == 'false' && needs.windows.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_DESKTOP_SIDECARS: ${{ needs.capabilities.outputs.sidecars }}
      WINDOWS_DESKTOP: ${{ needs.capabilities.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-sidecar-*
          merge-multiple: true
          path: ${{ runner.temp }}/desktop-sidecar
      - name: Sign matching checksums and publish stable, never latest
        env:
          GH_TOKEN: ${{ github.token }}
          PHUX_MINISIGN_SECRET_KEY: ${{ secrets.PHUX_MINISIGN_SECRET_KEY }}
        run: bash scripts/ci/publish-desktop-release.sh
