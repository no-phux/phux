# Release Please owns the immutable tag and draft; publish.yml is the only door.
# Stable: Apple silicon, ad-hoc signed, not Apple-notarized.
name: Release Desktop

on:
  workflow_call:
    inputs:
      tag:
        description: Existing desktop-vX.Y.Z draft to build and publish
        required: true
        type: string
      channel:
        description: Stable draft publication or next-channel qualification
        default: stable
        type: string
      sha:
        description: Immutable green-main SHA required for next
        default: ""
        type: string
    secrets:
      PHUX_MINISIGN_SECRET_KEY:
        description: minisign secret key that signs a stable checksum (ADR-0177); next signs in next-release.yml
        required: false

permissions:
  contents: write

concurrency:
  group: mini-v1-desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  macos:
    name: Qualify and publish macOS arm64
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PHUX_BUILD_CHANNEL: ${{ inputs.channel }}
      PHUX_CHANNEL: ${{ inputs.channel }}
      PHUX_BUILD_SHA: ${{ inputs.sha }}
      GH_REPO: ${{ github.repository }}
      LIBGHOSTTY_VT_SYS_CPU: baseline
      RUSTFLAGS: -C target-cpu=apple-m1
      MACOSX_DEPLOYMENT_TARGET: "27.0"
    steps:
      # The harness follows main; all product builds use the immutable tag below.
      # Keep checkouts siblings: an ancestor Cargo workspace captures GPUI's
      # path dependencies and breaks their workspace-inherited dependencies.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: harness
          persist-credentials: false
      - name: Require an existing desktop draft and native runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          if [[ "$PHUX_BUILD_CHANNEL" == next ]]; then
            test "$RELEASE_TAG" = next
            [[ "$PHUX_BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]
          else
            test "$PHUX_BUILD_CHANNEL" = stable
            [[ "$RELEASE_TAG" =~ ^desktop-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || inputs.tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tagged source and select Bun
        id: version
        working-directory: source
        run: |
          set -euo pipefail
          if [[ "$PHUX_BUILD_CHANNEL" == next ]]; then
            test "$(git rev-parse HEAD)" = "$PHUX_BUILD_SHA"
          else
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          fi
          git merge-base --is-ancestor HEAD origin/main
          echo "PHUX_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          package = json.loads(Path('clients/desktop/package.json').read_text())
          manifest = json.loads(Path('.release-please-manifest.json').read_text())
          version = package['version']
          assert manifest['clients/desktop'] == version
          channel = os.environ['PHUX_BUILD_CHANNEL']
          if channel == 'stable':
              assert os.environ['RELEASE_TAG'] == f'desktop-v{version}'
          identity = f"next.{os.environ['PHUX_BUILD_SHA']}" if channel == 'next' else version
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"bun={package['engines']['bun']}\n")
              output.write(f"archive=phux-desktop-{identity}-macos-arm64.zip\n")
          PY
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.version.outputs.bun }}
      - name: Contributor Rust, Zig and Metal setup
        working-directory: source
        run: |
          bash scripts/setup-rust.sh native
          bash scripts/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"
          brew install just
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: source -> target
          shared-key: mini-v1-desktop-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build same-checkout qualification CLI and compiled desktop app
        working-directory: source
        run: |
          set -euo pipefail
          cargo build --locked --release -p phux
          just desktop-package
      - name: Verify signature and create checksummed release archive
        working-directory: source
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail
          app=clients/desktop/dist/app/Phux.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -F 'Signature=adhoc'
          PHUX_MACOS_MIN_MAX=27.0 bash ../harness/scripts/check-binary-portability.sh \
            "$app/Contents/MacOS/phux-desktop"
          test ! -e "$app/Contents/Resources/phux-desktop-native.darwin-arm64.node"
          test "$(/usr/libexec/PlistBuddy -c 'Print :PhuxDesktopHost' "$app/Contents/Info.plist")" = gpui
          test "$(/usr/libexec/PlistBuddy -c 'Print :PhuxBuildSHA' "$app/Contents/Info.plist")" = "$(git rev-parse HEAD)"
          if [[ "$PHUX_BUILD_CHANNEL" == next ]]; then
            test "$(/usr/libexec/PlistBuddy -c 'Print :PhuxDesktopChannel' "$app/Contents/Info.plist")" = next
          fi
          mkdir -p "$RUNNER_TEMP/desktop-release"
          ditto -c -k --norsrc --keepParent "$app" "$RUNNER_TEMP/desktop-release/$ARCHIVE"
          cd "$RUNNER_TEMP/desktop-release"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          shasum -a 256 -c "$ARCHIVE.sha256"
          cp "$ARCHIVE.sha256" SHA256SUMS
      - name: Qualify the archived app against an isolated same-checkout server
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-qualified"
          ditto -x -k "$RUNNER_TEMP/desktop-release/$ARCHIVE" "$RUNNER_TEMP/desktop-qualified"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/desktop-qualified/Phux.app"
          # Hosted runners have only a virtual display, which never confirms a
          # presented drawable; the evidence records `submitted` instead.
          bun harness/clients/desktop/scripts/smoke-app.ts --app "$RUNNER_TEMP/desktop-qualified/Phux.app" --phux "$GITHUB_WORKSPACE/source/target/release/phux" --output "$RUNNER_TEMP/desktop-evidence" --allow-unconfirmed-present
      - name: Exercise installer transactions
        run: python3 harness/scripts/test-install-desktop.py
      - name: Retain packaged runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-runtime-${{ inputs.sha || inputs.tag }}
          path: ${{ runner.temp }}/desktop-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Upload to draft and verify downloaded bytes
        if: inputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/desktop-release/$ARCHIVE" "$RUNNER_TEMP/desktop-release/$ARCHIVE.sha256" "$RUNNER_TEMP/desktop-release/SHA256SUMS" --clobber
          gh release download "$RELEASE_TAG" --pattern "$ARCHIVE" --pattern SHA256SUMS --dir "$RUNNER_TEMP/desktop-download"
          cd "$RUNNER_TEMP/desktop-download"
          cmp SHA256SUMS "$RUNNER_TEMP/desktop-release/SHA256SUMS"
          shasum -a 256 -c SHA256SUMS
      - name: Hand the stable checksum to the signer
        if: inputs.channel == 'stable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-sidecar
          path: ${{ runner.temp }}/desktop-release/phux-desktop-*-macos-arm64.zip.sha256
          if-no-files-found: error
      - name: Retain qualified next artifacts for serialized publication
        if: inputs.channel == 'next'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop
          path: |
            ${{ runner.temp }}/desktop-release/phux-desktop-next.*.zip
            ${{ runner.temp }}/desktop-release/phux-desktop-next.*.zip.sha256
          if-no-files-found: error

  # Signing runs on a hosted Linux runner, so the release key never reaches the
  # macOS build host (ADR-0177). The draft publishes only once it is signed.
  sign:
    name: Sign and publish stable
    needs: macos
    if: inputs.channel == 'stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-sidecar
          path: ${{ runner.temp }}/desktop-sidecar
      - name: Sign the checksum and attach the signature
        env:
          GH_TOKEN: ${{ github.token }}
          PHUX_MINISIGN_SECRET_KEY: ${{ secrets.PHUX_MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          sidecars=("$RUNNER_TEMP"/desktop-sidecar/phux-desktop-*-macos-arm64.zip.sha256)
          test "${#sidecars[@]}" -eq 1
          sidecar="${sidecars[0]}"
          name="$(basename "$sidecar")"
          # Sign only the checksum the draft actually carries.
          gh release download "$RELEASE_TAG" --pattern "$name" --dir "$RUNNER_TEMP/desktop-draft"
          cmp "$sidecar" "$RUNNER_TEMP/desktop-draft/$name"
          bash scripts/ci/sign-release.sh "$sidecar"
          gh release upload "$RELEASE_TAG" "$sidecar.minisig" --clobber
      - name: Publish as stable, never latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/desktop-release-notes"
          gh release view "$RELEASE_TAG" --json body --jq '.body // ""' > "$notes"
          marker='Desktop: ad-hoc signed; not Apple-notarized.'
          if ! grep -Fq "$marker" "$notes"; then
            printf '\n%s\n\nApple silicon macOS 27 or later. Requires a separately installed phux CLI (https://phux.sh/install); this app does not install or upgrade your coordinator.\n' "$marker" >> "$notes"
          fi
          gh release edit "$RELEASE_TAG" --notes-file "$notes" \
            --draft=false --latest=false
