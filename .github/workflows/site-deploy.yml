name: site-deploy

# Push to main touching docs/, ADR/, or the curl installer → build the Astro
# site (docs/site) and deploy it as a Workers static-assets worker (phux-site)
# on phux.sh and docs.phux.sh. Site, docs, and installer share this repository,
# so an edit to any of them rebuilds the site directly — no cross-repo
# dispatch, no drift polling.
# The live demo reads PUBLIC_PHUX_DEMO_WS (a repo *variable*); it points at the
# Worker's wss URL (see site-deploy-worker.yml + docs/site/DEPLOY.md).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "ADR/**"
      # The site serves scripts/install.sh verbatim at /install and
      # scripts/install-cockpit.sh at /install-cockpit, so an installer
      # change has to redeploy the site or phux.sh keeps handing out the old
      # script. sync-docs.ts copies them in; this is what triggers that copy.
      - "scripts/install.sh"
      - "scripts/install-cockpit.sh"
      - ".github/workflows/site-deploy.yml"
  # A new phux release stamps the site's version badge (scripts/fetch-release.ts).
  release:
    types: [published]
  # Weekly backstop so the badge can never drift far from reality.
  schedule:
    - cron: "7 13 * * 1"
  workflow_dispatch:

concurrency:
  group: mini-v1-site-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pages:
    # Release events matter for the core phux tags (vX.Y.Z) and the Cockpit
    # tags (cockpit-vX.Y.Z) — both move a version badge on the landing.
    # Other component releases (opencode-plugin-v*, …) badge nothing.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v') || startsWith(github.event.release.tag_name, 'cockpit-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: docs/site
        run: bun install --frozen-lockfile

      # sync-docs reads ../../docs (the enclosing repo's docs tree) and stamps
      # source links with this checkout's HEAD revision.
      - name: Sync docs into the site
        working-directory: docs/site
        run: bun run sync-docs

      - name: Build
        working-directory: docs/site
        run: bun run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_PHUX_DEMO_WS: ${{ vars.PUBLIC_PHUX_DEMO_WS }}

      - name: Check built links
        working-directory: docs/site
        run: bun run check:links

      - name: Deploy site worker (static assets)
        working-directory: docs/site
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The curl installers are the assets whose ROUTES cannot be proven before
      # a deploy: `wrangler.jsonc` sets html_handling, and an extensionless
      # asset is an unusual shape for it to resolve. Everything else about the
      # scripts is gated in `just ci` (scripts/check-install-surface.sh), so this
      # step only answers "does the URL people are told to pipe to sh actually
      # return the script". Failing here is loud and costs nobody an install;
      # finding out from a stranger's broken terminal is the alternative.
      # The commit SHA busts any edge cache left over from the previous deploy.
      - name: Verify the installers are served
        run: |
          set -euo pipefail
          for path in install install.sh; do
            url="https://phux.sh/${path}?deployed=${GITHUB_SHA}"
            served="$(curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors "$url")"
            # Take the shebang by parameter expansion, not `| head -n 1`: under
            # `pipefail` a closing reader turns into a SIGPIPE failure and the
            # step flakes on a deploy that was perfectly fine.
            shebang="${served%%$'\n'*}"
            if [ "$shebang" != '#!/bin/sh' ]; then
              echo "https://phux.sh/${path} did not return a POSIX sh script" >&2
              echo "first line was: ${shebang}" >&2
              exit 1
            fi
            if ! grep -Fq 'no-phux/phux/releases/download' <<<"$served"; then
              echo "https://phux.sh/${path} is missing its release download URL" >&2
              exit 1
            fi
          done
          echo "installer verified at /install and /install.sh"
          for path in install-cockpit install-cockpit.sh; do
            url="https://phux.sh/${path}?deployed=${GITHUB_SHA}"
            served="$(curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors "$url")"
            shebang="${served%%$'\n'*}"
            if [ "$shebang" != '#!/bin/sh' ]; then
              echo "https://phux.sh/${path} did not return a POSIX sh script" >&2
              echo "first line was: ${shebang}" >&2
              exit 1
            fi
            if ! grep -Fq 'phux-cockpit-' <<<"$served"; then
              echo "https://phux.sh/${path} is missing its Cockpit asset name" >&2
              exit 1
            fi
          done
          echo "cockpit installer verified at /install-cockpit and /install-cockpit.sh"
