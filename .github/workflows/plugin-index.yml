# Build the static plugin index from the public GitHub topic `phux-plugin`
# and the in-repo examples. The generator (crates/phux-plugin-index)
# validates each manifest with the same loader as `phux plugin validate`;
# its tests, clippy, and cargo-deny run in the workspace CI lanes.
#
# schedule and workflow_dispatch query the public API. GITHUB_TOKEN is sent
# only to raise the rate limit.
#
# The file is an artifact. Publishing it is a separate decision.

name: plugin-index

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust-lane
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-lane: check

      - name: Build the index from GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nix develop -c cargo run --locked -p phux-plugin-index -- \
            --examples examples/plugins \
            --repo-root . \
            --out "${RUNNER_TEMP}/plugin-index"
          echo '--- plugin-index.json ---'
          cat "${RUNNER_TEMP}/plugin-index/plugin-index.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-index
          path: ${{ runner.temp }}/plugin-index
          if-no-files-found: error
          retention-days: 14

      # TODO(Patrick): a GitHub Pages deploy of ${{ runner.temp }}/plugin-index
      # would go here. Publishing the index is intentionally not part of this
      # workflow; do not add a pages deploy, a push to main, or an auto-commit
      # until that decision is made.
