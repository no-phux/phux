# Build the static plugin index from the public GitHub topic `phux-plugin`
# and the in-repo examples. The generator validates each manifest with the
# same loader as `phux plugin validate`.
#
# Pull requests that touch the generator run the offline tests and write an
# index of the example plugins from fixtures, so the log shows those plugins
# without querying GitHub. schedule and workflow_dispatch query the public
# API. GITHUB_TOKEN is sent only on that networked build, and only to raise
# the rate limit.
#
# The file is an artifact. Publishing it is a separate decision.

name: plugin-index

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/plugin-index/**"
      - ".github/workflows/plugin-index.yml"
      - "docs/spec/plugin-index.schema.json"
      - "docs/plugins.md"

permissions:
  contents: read

concurrency:
  group: plugin-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0

      # scripts/plugin-index is its own workspace, so the root `cargo deny check`
      # never reads this lockfile. Same deny.toml, same 0.20.2 pin as mise.toml.
      - name: Check the generator lockfile
        run: |
          set -euo pipefail
          version=0.20.2
          archive="cargo-deny-${version}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${version}/${archive}"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/cargo-deny-${version}-x86_64-unknown-linux-musl/cargo-deny" \
            --manifest-path scripts/plugin-index/Cargo.toml \
            --config deny.toml \
            --locked \
            check

      - name: Test the generator offline
        run: cargo test --locked --manifest-path scripts/plugin-index/Cargo.toml

      - name: Build the example index offline
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path scripts/plugin-index/Cargo.toml -- \
            --offline scripts/plugin-index/fixtures/examples-only \
            --examples examples/plugins \
            --repo-root . \
            --generated-at 2026-01-15T00:00:00Z \
            --out "${RUNNER_TEMP}/plugin-index"
          echo '--- plugin-index.json ---'
          cat "${RUNNER_TEMP}/plugin-index/plugin-index.json"

      - name: Build the index from GitHub
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path scripts/plugin-index/Cargo.toml -- \
            --examples examples/plugins \
            --repo-root . \
            --out "${RUNNER_TEMP}/plugin-index"
          echo '--- plugin-index.json ---'
          cat "${RUNNER_TEMP}/plugin-index/plugin-index.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-index
          path: ${{ runner.temp }}/plugin-index
          if-no-files-found: error
          retention-days: 14

      # TODO(Patrick): a GitHub Pages deploy of ${{ runner.temp }}/plugin-index
      # would go here. Publishing the index is intentionally not part of this
      # workflow; do not add a pages deploy, a push to main, or an auto-commit
      # until that decision is made.
