name: Cache warm

# Pull requests restore Rust caches but never save them (a PR entry is
# restorable only from that PR, and it evicts main's). The Rune lane runs on a
# main push only when Rune changes, so its cache is saved here: the lane
# itself, run on main once a day. An unchanged key restores exactly and saves
# nothing.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-warm
  cancel-in-progress: false

jobs:
  rune:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/rune-build.yml
