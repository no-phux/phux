name: cockpit-ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  merge_group:

permissions:
  actions: read
  contents: read

concurrency:
  # A newer main push cannot cancel validation/artifacts needed by a release.
  group: mini-v1-cockpit-ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # One shared dependency map, including the bundled coordinator's inputs.
  changes:
    name: classify changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cockpit_needed: ${{ steps.detect.outputs.cockpit_needed }}
      ffi_needed: ${{ steps.detect.outputs.ffi_needed }}
      cli_needed: ${{ steps.detect.outputs.cli_needed }}
      zig_needed: ${{ steps.detect.outputs.zig_needed }}
      shipping_needed: ${{ steps.detect.outputs.shipping_needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/classify-changes

  test:
    name: Zig 0.16 macOS
    if: needs.changes.outputs.cockpit_needed == 'true'
    needs: changes
    # Standard public GitHub Apple-silicon runner; no paid larger-runner label.
    runs-on: macos-26
    timeout-minutes: 45
    # One checkout, nothing to starve: use the machine Zig cache and let the
    # job timeout own the limit. Isolated mode plus a 600s wrapper watchdog
    # restored a 4.4GB duplicate cache and could kill a shipping compile.
    env:
      PHUX_ZIG_CACHE_MODE: shared
      PHUX_ZIG_BUILD_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Contributor Zig setup
        run: bash scripts/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"

      - name: Contributor Rust setup
        run: bash scripts/setup-rust.sh cockpit

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/cockpit/package-lock.json

      # The same-checkout phux-client-ffi build is ~4.5 minutes cold.
      - name: Check native Cockpit prerequisites
        run: bash scripts/doctor.sh cockpit

      # Exact-input FFI and CLI, keyed on the files that enter each binary.
      # Compute identity before Node tests: npm leaves worktree dirt that is
      # unrelated to Rust inputs but used to fail a whole-tree clean check.
      # A test file does not miss. The CLI is not built before zig tests.
      - name: Cockpit Rust artifact identity
        id: rust-artifacts
        run: python3 scripts/ci/cockpit_artifacts.py key

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci-cockpit-artifacts/ffi
          key: ${{ steps.rust-artifacts.outputs.ffi_key }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci-cockpit-artifacts/cli
          key: ${{ steps.rust-artifacts.outputs.cli_key }}

      - name: Restore exact-input FFI and CLI
        id: rust-restore
        run: python3 scripts/ci/cockpit_artifacts.py restore

      # Node 24 will not strip @native-sdk/core .ts under node_modules; the
      # navigation-loader does. just cockpit-node-test is the same command.
      - name: Run Cockpit Node tests
        if: needs.changes.outputs.zig_needed == 'true'
        working-directory: clients/cockpit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --import ./src/tests/navigation-loader.mjs --test ./src/tests/*.test.mjs

      # rust-cache is the dependency archive for a miss. The fat-LTO link is
      # the exact-input artifact above; sccache does not cache that link.
      # Save only from main — the Actions cache is a hard 10 GB LRU.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.rust-restore.outputs.ffi_restored != 'true' || steps.rust-restore.outputs.cli_restored != 'true'
      - name: enable sccache
        if: steps.rust-restore.outputs.ffi_restored != 'true' || steps.rust-restore.outputs.cli_restored != 'true'
        env:
          SCCACHE_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_GHA_ENABLED=true"
            echo "SCCACHE_GHA_RW_MODE=${SCCACHE_RW_MODE}"
            echo "CARGO_INCREMENTAL=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.rust-restore.outputs.ffi_restored != 'true' || steps.rust-restore.outputs.cli_restored != 'true'
        with:
          shared-key: mini-v1-cockpit-ffi
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Keyed on Zig sources and the shipping flags, not build.zig alone and
      # not the commit SHA (phux-6khi). A hit restores the ReleaseSafe object
      # instead of compiling it again. Save only from main, and only on a
      # miss, so the entry updates when sources change and stays frozen when
      # they do not. Do not cache `.zig-global-cache`: its `p/` symlink
      # duplicated the package cache into a 4.4GB restore.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.zig_needed == 'true' || needs.changes.outputs.shipping_needed == 'true'
        id: zig-cache
        with:
          path: |
            ~/.cache/zig
            clients/cockpit/.zig-cache
          key: mini-v3-cockpit-zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-relsafe-aarch64-baseline-phux-traceoff-${{ hashFiles('clients/cockpit/build.zig', 'clients/cockpit/build.zig.zon', 'clients/cockpit/src/**', 'clients/cockpit/**/*.zig', 'clients/cockpit/**/*.ts', 'clients/cockpit/**/*.native', '.config/zig-toolchain.json', 'clients/cockpit/scripts/build-shipping-app.sh', 'clients/cockpit/scripts/zig-build.sh', 'clients/cockpit/scripts/build-phux-cli.sh', 'clients/cockpit/scripts/build-phux-artifacts.sh', 'clients/cockpit/scripts/native-cargo-target.sh', 'scripts/install-zig.sh') }}
          restore-keys: |
            mini-v3-cockpit-zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-

      - name: Fetch Zig packages
        if: needs.changes.outputs.zig_needed == 'true' || needs.changes.outputs.shipping_needed == 'true'
        working-directory: clients/cockpit
        run: |
          if [ -d "${HOME}/.cache/zig/p" ] && [ -n "$(ls -A "${HOME}/.cache/zig/p" 2>/dev/null)" ]; then
            echo "Zig package cache already present; skipping --fetch"
          else
            ./scripts/zig-build.sh --fetch=all -Dplatform=null
          fi

      - name: Check release, SDK, and measurement contracts
        if: needs.changes.outputs.zig_needed == 'true' || needs.changes.outputs.shipping_needed == 'true'
        working-directory: clients/cockpit
        run: |
          ./scripts/check-release-version.sh
          ./scripts/check-release-fallback.sh
          ./scripts/check-sdk-pin.sh
          python3 ./scripts/check-build-contracts.py
          ./scripts/lib/zon_test.sh
          ./scripts/lib/measure_test.sh
          ./scripts/glyph-visibility-diagnose_test.sh
          ./scripts/generate-operation-fixtures_test.sh
          ./scripts/verify-phux-ffi.py --phux-tree ../..

      - name: Materialize the pinned SDK source
        if: needs.changes.outputs.zig_needed == 'true' || needs.changes.outputs.shipping_needed == 'true'
        working-directory: clients/cockpit
        run: ./scripts/build-automation-cli.sh --checkout-only

      - name: Check the host rasterizer's glyph weight
        if: needs.changes.outputs.zig_needed == 'true' || needs.changes.outputs.shipping_needed == 'true'
        working-directory: clients/cockpit
        run: |
          defaults -currentHost read -g AppleFontSmoothing 2>/dev/null \
            || echo 'AppleFontSmoothing: unset (the state the floor was derived on)'
          ./scripts/host-raster-check.sh --min-solid 4179

      - name: Build the same-checkout Phux FFI
        if: steps.rust-restore.outputs.ffi_restored != 'true' && (needs.changes.outputs.ffi_needed == 'true' || needs.changes.outputs.zig_needed == 'true' || needs.changes.outputs.shipping_needed == 'true')
        run: bash clients/cockpit/scripts/build-phux-artifacts.sh --only staticlib

      # One test graph. DisabledPhuxProvider is typechecked inside this
      # invocation as the compile-only `disabled-phux-provider` step (phux-q0i3,
      # phux-9ajd); do not add a second `zig build test` just to compile it.
      # Tests do not build or run the CLI.
      - name: Test the shipping TypeScript and native provider graph
        if: needs.changes.outputs.zig_needed == 'true' || needs.changes.outputs.ffi_needed == 'true'
        working-directory: clients/cockpit
        run: ./scripts/zig-build.sh test -Dplatform=null -Dphux-enabled=true --summary all

      # PRs prove the CLI links with ffi-dev (no fat LTO). Main and the merge
      # queue build ffi-release, which is the artifact release restores.
      - name: Build the coordinator CLI
        if: steps.rust-restore.outputs.cli_restored != 'true' && (needs.changes.outputs.cli_needed == 'true' || (needs.changes.outputs.shipping_needed == 'true' && github.event_name != 'pull_request'))
        run: bash clients/cockpit/scripts/build-phux-artifacts.sh --only cli ${{ github.event_name == 'pull_request' && 'ffi-dev' || 'ffi-release' }}

      - name: Record verified coordinator bytes
        if: needs.changes.outputs.shipping_needed == 'true' && github.event_name != 'pull_request'
        run: |
          python3 scripts/ci/cockpit_artifacts.py save
          python3 scripts/ci/cockpit_artifacts.py verify
          echo 'PHUX_CI_ARTIFACTS_VERIFIED=true' >> "$GITHUB_ENV"

      # ReleaseSafe is the slow compile. PRs run the Debug test graph above.
      # Main and the merge queue own the shipping compile and the dead_strip check.
      - name: Build the production macOS app
        if: needs.changes.outputs.shipping_needed == 'true' && github.event_name != 'pull_request'
        working-directory: clients/cockpit
        run: bash ./scripts/build-shipping-app.sh --summary all

      - name: Check ring P-256 helpers survived dead_strip
        if: needs.changes.outputs.shipping_needed == 'true' && github.event_name != 'pull_request'
        working-directory: clients/cockpit
        run: python3 ./scripts/check-ring-p256-helpers.py zig-out/bin/phux-cockpit

      - name: Save exact-input artifact manifests
        if: github.ref == 'refs/heads/main' && (steps.rust-restore.outputs.ffi_restored != 'true' || steps.rust-restore.outputs.cli_restored != 'true')
        run: python3 scripts/ci/cockpit_artifacts.py save

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.rust-restore.outputs.ffi_restored != 'true'
        with:
          path: target/ci-cockpit-artifacts/ffi
          key: ${{ steps.rust-artifacts.outputs.ffi_key }}

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.rust-restore.outputs.cli_restored != 'true'
        with:
          path: target/ci-cockpit-artifacts/cli
          key: ${{ steps.rust-artifacts.outputs.cli_key }}

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && (needs.changes.outputs.zig_needed == 'true' || needs.changes.outputs.shipping_needed == 'true') && steps.zig-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/zig
            clients/cockpit/.zig-cache
          key: mini-v3-cockpit-zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-relsafe-aarch64-baseline-phux-traceoff-${{ hashFiles('clients/cockpit/build.zig', 'clients/cockpit/build.zig.zon', 'clients/cockpit/src/**', 'clients/cockpit/**/*.zig', 'clients/cockpit/**/*.ts', 'clients/cockpit/**/*.native', '.config/zig-toolchain.json', 'clients/cockpit/scripts/build-shipping-app.sh', 'clients/cockpit/scripts/zig-build.sh', 'clients/cockpit/scripts/build-phux-cli.sh', 'clients/cockpit/scripts/build-phux-artifacts.sh', 'clients/cockpit/scripts/native-cargo-target.sh', 'scripts/install-zig.sh') }}
