name: cockpit-ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  merge_group:

permissions:
  actions: read
  contents: read

concurrency:
  # A newer main push cannot cancel validation/artifacts needed by a release.
  group: mini-v1-cockpit-ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # One shared dependency map, including the bundled coordinator's inputs.
  changes:
    name: classify changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cockpit_needed: ${{ steps.detect.outputs.cockpit_needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/classify-changes

  test:
    name: Zig 0.16 macOS
    if: needs.changes.outputs.cockpit_needed == 'true'
    needs: changes
    # Standard public GitHub Apple-silicon runner; no paid larger-runner label.
    runs-on: macos-26
    timeout-minutes: 45
    # One checkout, nothing to starve: use the machine Zig cache and let the
    # job timeout own the limit. Isolated mode plus a 600s wrapper watchdog
    # restored a 4.4GB duplicate cache and could kill a shipping compile.
    env:
      PHUX_ZIG_CACHE_MODE: shared
      PHUX_ZIG_BUILD_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Contributor Zig setup
        run: bash scripts/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"

      - name: Contributor Rust setup
        run: bash scripts/setup-rust.sh cockpit

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/cockpit/package-lock.json

      # The same-checkout phux-client-ffi build is ~4.5 minutes cold.
      - name: Check native Cockpit prerequisites
        run: bash scripts/doctor.sh cockpit

      # Node 24 will not strip @native-sdk/core .ts under node_modules; the
      # navigation-loader does. The helper is also the canonical local gate.
      - name: Test Cockpit model and presentation contracts
        working-directory: clients/cockpit
        run: ./scripts/cockpit-node-test.sh

      # rust-cache keys on Cargo.lock itself; the shared key keeps this
      # macOS ffi-release cache disjoint from ci.yml's Linux check/test
      # profiles. Save only from main pushes — GitHub's Actions cache is a
      # hard 10 GB per repo with LRU eviction, and PR saves would thrash the
      # warm base (same policy as ci.yml's lanes). Workspace crates are not
      # in that archive; sccache is the same GHA wrapper Linux already uses.
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: enable sccache
        env:
          SCCACHE_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_GHA_ENABLED=true"
            echo "SCCACHE_GHA_RW_MODE=${SCCACHE_RW_MODE}"
            echo "CARGO_INCREMENTAL=0"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: mini-v1-cockpit-ffi
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Zig compilation dominates the rest of the job. Restore on every run;
      # save only from main, mirroring the rust-cache policy. Keyed on the
      # build manifest and Zig version — not the commit SHA (phux-6khi).
      # CI uses the shared global cache (`~/.cache/zig`) plus the checkout
      # local cache. Do not cache `.zig-global-cache`: that isolated dir's
      # `p/` symlink duplicated the package cache into a 4.4GB restore.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: zig-cache
        with:
          path: |
            ~/.cache/zig
            clients/cockpit/.zig-cache
          key: mini-v2-cockpit-zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('clients/cockpit/build.zig', 'clients/cockpit/build.zig.zon') }}
          restore-keys: |
            mini-v2-cockpit-zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-

      # mini-v2 is a new path list, so the first runs miss and Zig has to
      # fetch nested tarballs. zig-build.sh retries --fetch on
      # HttpConnectionClosing.
      - name: Fetch Zig packages
        working-directory: clients/cockpit
        run: |
          if [ -d "${HOME}/.cache/zig/p" ] && [ -n "$(ls -A "${HOME}/.cache/zig/p" 2>/dev/null)" ]; then
            echo "Zig package cache already present; skipping --fetch"
          else
            ./scripts/zig-build.sh --fetch=all -Dplatform=null
          fi

      - name: Check release, SDK, and measurement contracts
        working-directory: clients/cockpit
        run: |
          ./scripts/check-release-version.sh
          ./scripts/check-release-fallback.sh
          ./scripts/check-sdk-pin.sh
          ./scripts/check-sdk-pin_test.sh
          python3 ./scripts/check-build-contracts.py
          ./scripts/lib/zon_test.sh
          ./scripts/lib/measure_test.sh
          ./scripts/glyph-visibility-diagnose_test.sh
          ./scripts/verify-phux-ffi.py --phux-tree ../..

      - name: Materialize the pinned SDK source
        working-directory: clients/cockpit
        run: ./scripts/build-automation-cli.sh --checkout-only

      - name: Check the host rasterizer's glyph weight
        working-directory: clients/cockpit
        run: |
          defaults -currentHost read -g AppleFontSmoothing 2>/dev/null \
            || echo 'AppleFontSmoothing: unset (the state the floor was derived on)'
          ./scripts/host-raster-check.sh --min-solid 4179

      - name: Build the same-checkout Phux FFI and coordinator CLI
        run: bash clients/cockpit/scripts/build-phux-artifacts.sh

      # One test graph. DisabledPhuxProvider is typechecked inside this
      # invocation as the compile-only `disabled-phux-provider` step (phux-q0i3,
      # phux-9ajd); do not add a second `zig build test` just to compile it.
      - name: Test the shipping TypeScript and native provider graph
        working-directory: clients/cockpit
        run: ./scripts/zig-build.sh test -Dplatform=null -Dphux-enabled=true --summary all

      # The null-platform tests do not compile the AppKit executable. Keep one
      # real production build on PRs while reserving archive/DMG work for main.
      # package-macos.sh owns the main-path shipping compile; skipping this
      # step on push is required (one compile owner), not a missing artifact.
      - name: Build the production macOS app
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        working-directory: clients/cockpit
        run: bash ./scripts/build-shipping-app.sh --summary all

      - name: Check ring P-256 helpers survived dead_strip
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        working-directory: clients/cockpit
        run: python3 ./scripts/check-ring-p256-helpers.py zig-out/bin/phux-cockpit

      - name: Package and verify the arm64 macOS app
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: |
          set -euo pipefail
          VERSION="$(< clients/cockpit/version.txt)"
          VERSION="$VERSION" clients/cockpit/scripts/package-macos.sh
          clients/cockpit/scripts/soak-macos-app.sh \
            --app "clients/cockpit/zig-out/release/Phux Cockpit.app" \
            --cycles 3 \
            --artifacts clients/cockpit/zig-out/soak-ci

      # The soak's failure directory carries the app log, the coordinator log,
      # and the process table; without it a red soak is one line of stderr.
      - name: Upload soak diagnostics
        if: failure() && hashFiles('clients/cockpit/zig-out/soak-ci/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cockpit-soak-diagnostics
          path: clients/cockpit/zig-out/soak-ci
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.zig-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/zig
            clients/cockpit/.zig-cache
          key: mini-v2-cockpit-zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('clients/cockpit/build.zig', 'clients/cockpit/build.zig.zon') }}
