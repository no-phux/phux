name: cockpit-ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  # A newer main push cannot cancel validation/artifacts needed by a release.
  group: mini-v1-cockpit-ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # One shared dependency map, including the bundled coordinator's inputs.
  changes:
    name: classify changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cockpit_needed: ${{ steps.detect.outputs.cockpit_needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/classify-changes

  test:
    name: Zig 0.16 macOS
    if: needs.changes.outputs.cockpit_needed == 'true'
    needs: changes
    # Standard public GitHub Apple-silicon runner; no paid larger-runner label.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Contributor Zig setup
        run: bash scripts/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"

      - name: Contributor Rust setup
        run: bash scripts/setup-rust.sh cockpit

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/cockpit/package-lock.json

      # The same-checkout phux-client-ffi build is ~4.5 minutes cold.
      - name: Check native Cockpit prerequisites
        run: bash scripts/doctor.sh cockpit

      # rust-cache keys on Cargo.lock itself; the shared key keeps this
      # macOS ffi-release cache disjoint from ci.yml's Linux check/test
      # profiles. Save only from main pushes — GitHub's Actions cache is a
      # hard 10 GB per repo with LRU eviction, and PR saves would thrash the
      # warm base (same policy as ci.yml's lanes).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: mini-v1-cockpit-ffi
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Zig compilation dominates the rest of the job (the materialized SDK
      # source plus two build graphs and a production build). Restore on every
      # run; save only from main, mirroring the rust-cache policy. Keyed on
      # the build manifest and Zig version — not the commit SHA. A SHA suffix
      # made every main push a unique immutable entry that never exact-hit
      # and accumulated gigabytes per day (phux-6khi). Zig's cache is
      # content-addressed, so a stable key still hits unchanged units after
      # source-only commits. The prefix restores the most recent compatible
      # base when the manifest hash rotates.
      # Cache the shared Zig package directory and checkout-owned build caches.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: zig-cache
        with:
          path: |
            ~/.cache/zig
            clients/cockpit/.zig-cache
            clients/cockpit/.zig-global-cache
          key: mini-v1-cockpit-zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('clients/cockpit/build.zig', 'clients/cockpit/build.zig.zon') }}
          restore-keys: |
            mini-v1-cockpit-zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-

      - name: Check release, SDK, and measurement contracts
        working-directory: clients/cockpit
        run: |
          ./scripts/check-release-version.sh
          ./scripts/check-release-fallback.sh
          ./scripts/check-sdk-pin.sh
          python3 ./scripts/check-build-contracts.py
          ./scripts/lib/zon_test.sh
          ./scripts/lib/measure_test.sh
          ./scripts/glyph-visibility-diagnose_test.sh
          ./scripts/verify-phux-ffi.py --phux-tree ../..

      - name: Materialize the pinned SDK source
        working-directory: clients/cockpit
        run: ./scripts/build-automation-cli.sh --checkout-only

      - name: Check the host rasterizer's glyph weight
        working-directory: clients/cockpit
        run: |
          defaults -currentHost read -g AppleFontSmoothing 2>/dev/null \
            || echo 'AppleFontSmoothing: unset (the state the floor was derived on)'
          ./scripts/host-raster-check.sh --min-solid 4179

      - name: Build the same-checkout Phux FFI and coordinator CLI
        uses: ./.github/actions/cockpit-rust-artifacts

      - name: Test the shipping TypeScript and native provider graph
        working-directory: clients/cockpit
        run: ./scripts/zig-build.sh test -Dplatform=null -Dphux-enabled=true --summary all

      # The default app graph has no Phux provider (DisabledPhuxProvider).
      # Only this step compiles it: provider calls it lacked once failed that
      # build for days while every step above stayed green (phux-q0i3). It
      # reuses the step above's cached compilation of everything but the app
      # graph, and packages nothing.
      - name: Test the app graph without the Phux provider
        working-directory: clients/cockpit
        run: ./scripts/zig-build.sh test -Dplatform=null --summary all

      # The null-platform tests do not compile the AppKit executable. Keep one
      # real production build on PRs while reserving archive/DMG work for main.
      - name: Build the production macOS app
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        working-directory: clients/cockpit
        run: bash ./scripts/build-shipping-app.sh --summary all

      - name: Package and verify the arm64 macOS app
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: |
          set -euo pipefail
          VERSION="$(< clients/cockpit/version.txt)"
          VERSION="$VERSION" clients/cockpit/scripts/package-macos.sh
          clients/cockpit/scripts/soak-macos-app.sh \
            --app "clients/cockpit/zig-out/release/Phux Cockpit.app" \
            --cycles 3 \
            --artifacts clients/cockpit/zig-out/soak-ci

      # The soak's failure directory carries the app log, the coordinator log,
      # and the process table; without it a red soak is one line of stderr.
      - name: Upload soak diagnostics
        if: failure() && hashFiles('clients/cockpit/zig-out/soak-ci/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cockpit-soak-diagnostics
          path: clients/cockpit/zig-out/soak-ci
          if-no-files-found: ignore
          retention-days: 7

      # Save last so a failed build never poisons the cache with a partial
      # compile, only from main so PRs never write (see above), and only on
      # a miss — cache/save errors when the key already exists.
      - name: Save validated same-tree Rust artifacts for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/cockpit-rust-artifacts
        with:
          mode: save

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.zig-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/zig
            clients/cockpit/.zig-cache
            clients/cockpit/.zig-global-cache
          key: mini-v1-cockpit-zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('clients/cockpit/build.zig', 'clients/cockpit/build.zig.zon') }}
