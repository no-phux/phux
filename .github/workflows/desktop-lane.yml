name: Desktop lane

# The native desktop on both Apple toolchains and Linux. ci.yml calls this as
# the `desktop` lane for pull requests; cache-warm.yml calls it on main, which
# is the only place its Rust caches are saved.
#
# Not on main pushes (plan.ts): release qualification builds the desktop for
# every desktop change, and two macOS jobs per merge starved the 5-slot macOS
# pool the release lanes share.
#
# Cold, each leg compiled GPUI's dependency graph and the root `phux` CLI
# from nothing: about 24 minutes a leg, 11 to 19 of them in `desktop-tests`
# (runs 41862713444, 41886269436). rust-cache keeps the third-party artifacts
# of both workspaces; workspace crates still compile from this checkout.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  desktop:
    name: desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: xcode-27
            smoke: --allow-unconfirmed-present
          - platform: macOS-26
            os: macos-26
            smoke: --allow-unconfirmed-present
          - platform: Linux
            os: ubuntu-24.04
            smoke: --require-backend Vulkan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      LIBGHOSTTY_VT_SYS_CPU: baseline
      # Fewer bytes compiled, linked and cached. Panic locations come from
      # #[track_caller] and symbol names stay in unstripped binaries; the
      # root test lane builds the same way (setup-rust-lane).
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-macos-desktop
        if: runner.os == 'macOS'
      - name: Require the compatibility runner's macOS and Xcode 26
        if: matrix.platform == 'macOS-26'
        run: |
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          xcodebuild -version | grep -E '^Xcode 26[.]'
      - uses: ./.github/actions/setup-linux-desktop
        if: runner.os == 'Linux'
      # After the toolchain: the key folds in `rustc -vV`. One entry per
      # platform, since each Apple SDK builds its own native dependencies.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            clients/desktop/native -> target
            . -> target
          shared-key: desktop-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"
      - uses: ./.github/actions/setup-bun
      # One step per recipe: Bun leaves a shared stdout non-blocking, and a
      # Cargo build after it in the same step panics on EAGAIN.
      - run: just desktop-lint
      - run: just desktop-tests
      - run: just desktop-check
      # PRs qualify production features in the warm debug profile. Optimized
      # shipping builds remain in desktop-release.yml.
      # Hosted macOS never confirms a presented drawable; Linux must render
      # through lavapipe's Vulkan.
      - name: Packaged debug desktop qualification
        env:
          PHUX_DESKTOP_SMOKE_ARGS: --output ${{ runner.temp }}/desktop-evidence ${{ matrix.smoke }}
        run: just desktop-framework-check debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/desktop-evidence
            clients/desktop/native/target/perf-headless
          if-no-files-found: warn
          retention-days: 14
