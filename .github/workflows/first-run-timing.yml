# Prove install, the first launch, and a stub agent session finish in under
# 60 seconds. The script owns the clock and the pass/fail line. On a pull
# request the installer is this checkout's scripts/install.sh (the binary
# is still the latest release). Pushes and manual runs use
# https://phux.sh/install. The job summary names which installer ran.
# Linux is the gate. macOS uses the same script on the macos-26 runner
# this repository already uses for desktop CI.
name: first-run timing

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-run-timing-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux install to first agent
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Time install through a stub agent
        env:
          PHUX_INSTALL_URL: ${{ github.event_name == 'pull_request' && format('{0}/scripts/install.sh', github.workspace) || 'https://phux.sh/install' }}
        run: bash scripts/first-run-timing.sh

  macos:
    name: macos install to first agent
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Time install through a stub agent
        env:
          PHUX_INSTALL_URL: ${{ github.event_name == 'pull_request' && format('{0}/scripts/install.sh', github.workspace) || 'https://phux.sh/install' }}
        run: bash scripts/first-run-timing.sh
