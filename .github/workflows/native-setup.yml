name: native-setup

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: mini-v1-native-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One shared detector, no outer path allowlist to silently lose coverage.
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native_needed: ${{ steps.detect.outputs.native_needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/classify-changes

  linux:
    needs: changes
    if: needs.changes.outputs.native_needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # No Nix and no target cache: exercise a fresh native compile/link path.
      # The image supplies rustup, just as the native guide asks contributors to.
      - name: Platform packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config mold curl xz-utils
      - name: Setup helper regressions
        run: bash scripts/test-dev-setup.sh
      - name: Contributor Rust setup
        run: bash scripts/setup-rust.sh native
      - name: Contributor Zig setup
        run: bash scripts/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"
      - name: Native build and test smoke
        run: bash scripts/native-smoke.sh
