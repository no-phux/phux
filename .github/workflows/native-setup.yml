name: native-setup

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/*setup*'
      - 'scripts/doctor.sh'
      - 'scripts/install-zig.sh'
      - 'scripts/native-smoke.sh'
      - 'scripts/lib/dev-toolchain.sh'
      - 'docs/SETUP.md'
      - '.github/workflows/native-setup.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/*setup*'
      - 'scripts/doctor.sh'
      - 'scripts/install-zig.sh'
      - 'scripts/native-smoke.sh'
      - 'scripts/lib/dev-toolchain.sh'
      - 'docs/SETUP.md'
      - '.github/workflows/native-setup.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-setup-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # No Nix and no target cache: exercise a fresh native compile/link path.
      # The image supplies rustup, just as the native guide asks contributors to.
      - name: Platform packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config mold curl xz-utils
      - name: Setup helper regressions
        run: bash scripts/test-dev-setup.sh
      - name: Contributor Rust setup
        run: bash scripts/setup-rust.sh native
      - name: Contributor Zig setup
        run: bash scripts/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"
      - name: Native build and test smoke
        run: bash scripts/native-smoke.sh
