# next channel — coalesced release-profile builds of green main.
#
# Trigger: ci.yml succeeded on a push to main, or a manual dispatch.
# Ownership: this workflow owns the moving `next` prerelease only. It never
# creates a vX.Y.Z or cockpit-vX.Y.Z tag and never touches Homebrew.
# release-please remains the sole owner of stable tags (ADR-0113).
#
# Two products ride the one prerelease, each with its own pointer:
# channel.json (phux + phux-mcp, three targets) and cockpit-channel.json
# (Phux Cockpit.app, arm64 macOS, ad-hoc signed). Each rebuilds only when its
# own inputs moved since the SHA its pointer names, and each publishes on its
# own success.
#
# Cost: at most one run in flight. A newer green SHA waits instead of
# cancelling it, and pending runs coalesce to the newest, so a busy main still
# ships its tip rather than cancelling every build. Docs-only and
# already-published SHAs produce nothing. Registry cache is shared with
# release.yml; target/ is never saved.

name: next-release

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to publish (default: the SHA that triggered this run, or github.sha)."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mini-v1-next-release
  cancel-in-progress: false

jobs:
  gate:
    name: gate next channel
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      should_build: ${{ steps.decide.outputs.should_build }}
      cockpit_build: ${{ steps.decide.outputs.cockpit_build }}
    steps:
      - name: Select SHA
        id: select
        env:
          DISPATCH_SHA: ${{ github.event.inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="${DISPATCH_SHA:-${RUN_SHA:-$FALLBACK_SHA}}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::not a git SHA: ${sha}"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.select.outputs.sha }}
          fetch-depth: 0

      - name: Decide whether to build
        id: decide
        env:
          SHA: ${{ steps.select.outputs.sha }}
        run: |
          set -euo pipefail
          # decide POINTER KEY...: true when any classifier KEY moved since the
          # SHA the product's pointer names, or when there is no usable pointer.
          decide() {
            local pointer="https://github.com/${GITHUB_REPOSITORY}/releases/download/next/$1"
            shift
            local prev="" body outputs key
            if body="$(curl -fsSL "$pointer" 2>/dev/null)"; then
              prev="$(printf '%s\n' "$body" | sed -n 's/.*"sha"[[:space:]]*:[[:space:]]*"\([0-9a-f]\{40\}\)".*/\1/p' | head -n 1)"
            fi
            if [ "$prev" = "$SHA" ]; then
              echo "  already published for ${SHA}" >&2
              echo false
              return
            fi
            if [ -z "$prev" ] || ! git cat-file -e "${prev}^{commit}" 2>/dev/null; then
              echo "  first publish or previous SHA not in history; building" >&2
              echo true
              return
            fi
            outputs="$(git diff --name-only "$prev" "$SHA" -- | python3 scripts/ci/classify-changes.py)"
            for key in "$@"; do
              if grep -qx "${key}=true" <<<"$outputs"; then
                echo "  ${key} since ${prev}; building" >&2
                echo true
                return
              fi
            done
            echo "  no product inputs since ${prev}; skipping" >&2
            echo false
          }
          echo "phux:" >&2
          phux="$(decide channel.json phux_needed native_needed)"
          echo "cockpit:" >&2
          cockpit="$(decide cockpit-channel.json cockpit_needed)"
          {
            echo "should_build=${phux}"
            echo "cockpit_build=${cockpit}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    # Hosted ubuntu-22.04 labels retire in 2027 (actions/runner-images#14254).
    # Linux legs keep a native glibc 2.35 userspace via ubuntu:22.04 on the
    # free 24.04 runners. macOS is JSON null (no container).
    container: ${{ fromJSON(matrix.container) }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            container: "null"
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            container: '{"image":"ubuntu:22.04"}'
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            container: '{"image":"ubuntu:22.04"}'
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Verify native release platform and Linux baseline
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            aarch64-apple-darwin) test "$(uname -s)/$(uname -m)" = Darwin/arm64 ;;
            x86_64-unknown-linux-gnu) test "$(uname -s)/$(uname -m)" = Linux/x86_64 ;;
            aarch64-unknown-linux-gnu) test "$(uname -s)/$(uname -m)" = Linux/aarch64 ;;
            *) exit 1 ;;
          esac
          if [[ "$TARGET" == *-linux-gnu ]]; then
            . /etc/os-release
            test "$ID/$VERSION_ID" = ubuntu/22.04
            test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.35'
          fi

      - name: Install git in the Ubuntu 22.04 container
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Setup Linux 22.04 release userspace
        if: runner.os == 'Linux'
        run: bash scripts/ci/setup-linux-release-userspace.sh

      - name: Install Zig
        run: bash scripts/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-deps
          cache-targets: "false"

      - name: Build release binaries
        env:
          PHUX_BUILD_CHANNEL: next
          PHUX_BUILD_SHA: ${{ needs.gate.outputs.sha }}
        run: bash scripts/build-release-binaries.sh "${{ matrix.target }}"

      - name: Check binary portability
        run: bash scripts/check-binary-portability.sh target/release/phux target/release/phux-mcp

      - name: Package tarball
        id: package
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bash scripts/pack-release.sh \
            --id "next.${SHA}" \
            --target "${TARGET}" \
            --bin-dir target/release \
            --out-dir . \
            --smoke

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            phux-*.tar.gz
            phux-*.tar.gz.sha256
          if-no-files-found: error

  cockpit:
    name: build Phux Cockpit (macOS arm64)
    needs: gate
    if: needs.gate.outputs.cockpit_build == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      LIBGHOSTTY_VT_SYS_CPU: baseline
      RUSTFLAGS: -C target-cpu=apple-m1
      PHUX_ZIG_CACHE_MODE: shared
      PHUX_ZIG_BUILD_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Zig
        run: bash scripts/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"
      - name: Install Rust toolchain
        run: bash scripts/setup-rust.sh cockpit

      # The same best-effort dependency caches cockpit-release.yml warms.
      # Restore only: stable releases own the saved entries.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mini-v1-cockpit-ffi
          save-if: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            clients/cockpit/.zig-cache
          key: mini-v3-cockpit-zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-relsafe-aarch64-baseline-phux-traceoff-${{ hashFiles('clients/cockpit/build.zig', 'clients/cockpit/build.zig.zon', 'clients/cockpit/src/**', 'clients/cockpit/**/*.zig', 'clients/cockpit/**/*.ts', 'clients/cockpit/**/*.native', '.config/zig-toolchain.json', 'clients/cockpit/scripts/build-shipping-app.sh', 'clients/cockpit/scripts/zig-build.sh', 'clients/cockpit/scripts/build-phux-cli.sh', 'clients/cockpit/scripts/build-phux-artifacts.sh', 'clients/cockpit/scripts/native-cargo-target.sh', 'scripts/install-zig.sh') }}
          restore-keys: |
            mini-v3-cockpit-zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-

      - name: Fetch Zig packages
        working-directory: clients/cockpit
        run: ./scripts/zig-build.sh --fetch=all

      - name: Build the same-checkout Phux FFI and coordinator CLI
        uses: ./.github/actions/cockpit-rust-artifacts

      - name: Build, sign, verify, and package
        env:
          PHUX_BUILD_CHANNEL: next
          PHUX_BUILD_SHA: ${{ needs.gate.outputs.sha }}
          PHUX_CLIENT_FFI_INCLUDE_DIR: ${{ github.workspace }}/crates/phux-client-ffi/include
          PHUX_CLIENT_FFI_LIB_DIR: ${{ github.workspace }}/target/ffi-release
        run: clients/cockpit/scripts/package-macos.sh

      - name: Name the next-channel archive
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          IFS= read -r version < clients/cockpit/version.txt
          name="phux-cockpit-next.${SHA}-macos-arm64.zip"
          mkdir -p dist
          cp "clients/cockpit/zig-out/release/phux-cockpit-${version}-macos-arm64.zip" "dist/${name}"
          (cd dist && shasum -a 256 "${name}" > "${name}.sha256" && shasum -a 256 -c "${name}.sha256")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cockpit
          path: |
            dist/phux-cockpit-next.*.zip
            dist/phux-cockpit-next.*.zip.sha256
          if-no-files-found: error

  publish:
    name: publish next channel
    needs: [gate, build, cockpit]
    if: >-
      !cancelled() &&
      (needs.build.result == 'success' || needs.cockpit.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish moving next prerelease
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: bash scripts/publish-next-channel.sh "$SHA" dist

      - name: Publish Phux Cockpit onto the next prerelease
        if: needs.cockpit.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: bash scripts/publish-next-channel.sh --cockpit "$SHA" dist
