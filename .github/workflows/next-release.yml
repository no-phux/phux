# The next channel: release builds of green main on the moving `next`
# prerelease, recorded in channels/next.json (ADR-0176). Each product rebuilds
# only when its inputs changed since the commit next.json names. One run at a
# time, and a newer commit queues instead of cancelling, so a busy main still
# ships its tip and the next.json read-modify-write never races.

name: next-release

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to publish (default: the head of main)."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mini-v1-next-release
  cancel-in-progress: false

jobs:
  gate:
    name: gate next channel
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      phux: ${{ steps.decide.outputs.phux }}
      desktop: ${{ steps.decide.outputs.desktop }}
    steps:
      - name: Select the commit
        id: select
        env:
          SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a git SHA: $SHA"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.select.outputs.sha }}
          fetch-depth: 0

      - name: Decide which products to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.select.outputs.sha }}
        run: |
          set -euo pipefail
          # changed PRODUCT KEY...: whether any classifier KEY moved since the
          # commit next.json names for PRODUCT.
          changed() {
            local product="$1" previous outputs key
            shift
            previous="$(python3 scripts/ci/release_manifest.py next-sha "$product")"
            if [ "$previous" = "$SHA" ]; then
              echo "$product: already published" >&2; echo false; return
            fi
            if [ -z "$previous" ] || ! git cat-file -e "${previous}^{commit}" 2>/dev/null; then
              echo "$product: no usable previous commit" >&2; echo true; return
            fi
            outputs="$(git diff --name-only "$previous" "$SHA" -- | python3 scripts/ci/classify-changes.py)"
            for key in "$@"; do
              if grep -qx "${key}=true" <<<"$outputs"; then
                echo "$product: $key changed" >&2; echo true; return
              fi
            done
            # Desktop is its own workspace, outside the root classifier.
            if [ "$product" = desktop ] && ! git diff --quiet "$previous" "$SHA" -- \
                clients/desktop scripts/install.sh just/desktop.just .github/workflows/desktop-release.yml; then
              echo "$product: desktop inputs changed" >&2; echo true; return
            fi
            echo "$product: unchanged" >&2; echo false
          }
          {
            echo "phux=$(changed phux phux_needed native_needed)"
            echo "desktop=$(changed desktop phux_needed native_needed desktop_needed)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.phux == 'true'
    uses: ./.github/workflows/build-cli.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}
      id: next.${{ needs.gate.outputs.sha }}
      channel: next

  desktop:
    needs: gate
    if: needs.gate.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: next
      channel: next
      sha: ${{ needs.gate.outputs.sha }}

  publish:
    name: publish next
    needs: [gate, build, desktop]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.desktop.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # The signature over each sidecar is the trust root `phux update` and
      # the installer check (ADR-0178); release_manifest.py refuses an
      # unsigned build.
      - name: Sign the checksums
        env:
          PHUX_MINISIGN_SECRET_KEY: ${{ secrets.PHUX_MINISIGN_SECRET_KEY }}
        run: bash scripts/ci/sign-release.sh dist/*.sha256

      # Each product publishes on its own success; a failed one keeps its
      # previous next.json entry.
      - name: Publish phux
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: python3 scripts/ci/release_manifest.py next --product phux --sha "$SHA" --dist dist

      - name: Publish desktop
        if: ${{ !cancelled() && needs.desktop.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: python3 scripts/ci/release_manifest.py next --product desktop --sha "$SHA" --dist dist
