# Report a published vX.Y.Z to the Linear `phux` pipeline. Linear finds the
# issues a release carried in its commit range, so this needs full history.
# The tag is both name and version, and the notes come from the tagged
# changelog, so a retry reports the same release.

name: linear-release

on:
  workflow_call:
    inputs:
      tag:
        description: "Published root release tag (vX.Y.Z)."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Published root release tag (vX.Y.Z)."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mini-v1-linear-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  report:
    name: report ${{ inputs.tag }} to Linear
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun

      - name: Check out the published tag and write its notes
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::expected vX.Y.Z, got $TAG"; exit 1; }
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          # The extractor runs from main before the checkout, so an older tag
          # still gets today's helper; the notes are the tag's own changelog.
          bun tools/main.ts changelog-section --tag "$TAG" --output release-notes.md
          git checkout --quiet "refs/tags/$TAG"
          base="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0.18.0
        with:
          access_key: ${{ secrets.LINEAR_RELEASE_ACCESS_KEY }}
          command: sync
          name: ${{ inputs.tag }}
          version: ${{ inputs.tag }}
          base_ref: ${{ steps.range.outputs.base }}
          no_branch_ref_detection: true
          release_notes: release-notes.md
          links: |
            GitHub release=${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}

      - uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0.18.0
        with:
          access_key: ${{ secrets.LINEAR_RELEASE_ACCESS_KEY }}
          command: update
          stage: Released
          version: ${{ inputs.tag }}
