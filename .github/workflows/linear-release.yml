# linear-release — report a tagged release to the matching Linear pipeline.
#
# Linear resolves the issues a release carried from the Linear identifiers and
# PR references in its commit range, so it needs the full history at the tag,
# not a shallow clone.
#
# Tag -> pipeline:
#   vX.Y.Z         -> Linear `phux`           (secret LINEAR_RELEASE_ACCESS_KEY)
#   cockpit-vX.Y.Z -> Linear `phux-cockpit`   (secret LINEAR_COCKPIT_RELEASE_ACCESS_KEY)
#
# Continuous Linear pipelines name a release after the short SHA unless `name`
# is set. We always pass the tag as both name and version so Linear shows
# `v0.36.0`, not `7d0c433`. Notes come from the tagged changelog section, not
# `gh release view`: at tag time the GitHub release is still a private draft
# and a failed view used to upload an empty notes file.
#
# Two stages, because a release is not one moment:
#   building  — the tag exists and the release is being built. Linear shows it
#               in Building. Called by release-please.yml at tag time.
#   released  — binaries, tap, and the public GitHub release are all complete.
#               Called by release-please.yml after the artifact workflow succeeds.
#
# A failed artifact build therefore leaves the Linear release in Building next
# to a private draft on GitHub, which is the honest state.
#
# WHY THIS IS A SEPARATE, DISPATCHABLE WORKFLOW rather than two jobs inline in
# release-please.yml: those jobs are gated on release-please's `release_created`
# output, and release-please.yml only runs `on: push: branches: [main]`. When a
# release has to be recovered by hand — as v0.19.0 was, after release-please
# built no release for it at all — that output is false and never fires, so the
# release ships to users and Linear never hears about it. There was no way to
# report it after the fact short of pushing a commit. Extracting it here gives
# the recovery path an entry point, and keeps exactly one definition of how a
# release is reported: release-please.yml calls this workflow, it does not
# duplicate it.

name: linear-release

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing release tag to report (vX.Y.Z or cockpit-vX.Y.Z)."
        required: true
        type: string
      stage:
        description: "building = tagged and building; released = fully published."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to report (vX.Y.Z or cockpit-vX.Y.Z). Must already exist."
        required: true
        type: string
      stage:
        description: "building = tagged and building; released = fully published."
        required: true
        default: released
        type: choice
        options:
          - building
          - released

permissions:
  contents: read

concurrency:
  group: mini-v1-linear-release-${{ inputs.tag }}-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  report:
    name: report ${{ inputs.tag }} to Linear (${{ inputs.stage }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate stage
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          case "$STAGE" in
            building|released) ;;
            *) echo "::error::stage must be 'building' or 'released', got '${STAGE}'"; exit 1 ;;
          esac

      - name: Resolve Linear pipeline from the tag
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            cockpit-v[0-9]*)
              echo "component=cockpit" >> "$GITHUB_OUTPUT"
              echo "changelog=clients/cockpit/CHANGELOG.md" >> "$GITHUB_OUTPUT"
              ;;
            v[0-9]*)
              echo "component=phux" >> "$GITHUB_OUTPUT"
              echo "changelog=CHANGELOG.md" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unsupported Linear tag '${TAG}'; expected vX.Y.Z or cockpit-vX.Y.Z"
              exit 1
              ;;
          esac

      - name: Require the Linear pipeline access key
        env:
          COMPONENT: ${{ steps.meta.outputs.component }}
          PHUX_KEY: ${{ secrets.LINEAR_RELEASE_ACCESS_KEY }}
          COCKPIT_KEY: ${{ secrets.LINEAR_COCKPIT_RELEASE_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ "$COMPONENT" = cockpit ]; then
            if [ -z "$COCKPIT_KEY" ]; then
              echo "::error::LINEAR_COCKPIT_RELEASE_ACCESS_KEY is unset. Create an access key on the Linear phux-cockpit pipeline and add it as a repository secret."
              exit 1
            fi
          elif [ -z "$PHUX_KEY" ]; then
            echo "::error::LINEAR_RELEASE_ACCESS_KEY is unset."
            exit 1
          fi

      # Full history of the default branch, NOT `ref: <tag>`. On the former
      # Blacksmith runners, fetches used a transparent git mirror; a tag that
      # release-please had just created through the API was not in it yet:
      # v0.24.0's `building` report died in checkout with "A branch or tag with
      # the name 'v0.24.0' could not be found" thirty seconds after the tag was
      # created, and the `released` update then had nothing to update. The tag
      # is fetched below, straight from github.com and past the mirror.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The CLI scans the whole commit range, so shallow will not do.
          fetch-depth: 0

      - name: Fetch the release tag from GitHub, bypassing the runner git mirror
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # System and global git config are where the mirror's url rewrite
          # lives; disabling both plus naming github.com explicitly means this
          # fetch cannot be answered from a stale cache. A brief retry covers
          # GitHub's own propagation of a ref created moments ago.
          for attempt in 1 2 3 4 5 6; do
            if GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
               git fetch --no-tags "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
                 "+refs/tags/${TAG}:refs/tags/${TAG}"; then
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "::error::tag ${TAG} not found on github.com after ${attempt} attempts"
              exit 1
            fi
            sleep 10
          done
          git checkout --quiet "refs/tags/${TAG}"
          echo "checked out ${TAG} at $(git rev-parse HEAD)"

      - name: Write Linear release notes from the tagged changelog
        if: inputs.stage == 'building'
        env:
          TAG: ${{ inputs.tag }}
          CHANGELOG: ${{ steps.meta.outputs.changelog }}
        run: |
          set -euo pipefail
          python3 scripts/ci/extract_changelog_section.py \
            --tag "$TAG" --changelog "$CHANGELOG" --output release-notes.md

      - uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0.18.0
        if: inputs.stage == 'building' && steps.meta.outputs.component == 'phux'
        with:
          access_key: ${{ secrets.LINEAR_RELEASE_ACCESS_KEY }}
          command: sync
          name: ${{ inputs.tag }}
          version: ${{ inputs.tag }}
          release_notes: release-notes.md
          links: |
            GitHub release=${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}

      - uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0.18.0
        if: inputs.stage == 'building' && steps.meta.outputs.component == 'cockpit'
        with:
          access_key: ${{ secrets.LINEAR_COCKPIT_RELEASE_ACCESS_KEY }}
          command: sync
          name: ${{ inputs.tag }}
          version: ${{ inputs.tag }}
          include_paths: clients/cockpit/**
          release_notes: release-notes.md
          links: |
            GitHub release=${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}

      - uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0.18.0
        if: inputs.stage == 'released' && steps.meta.outputs.component == 'phux'
        with:
          access_key: ${{ secrets.LINEAR_RELEASE_ACCESS_KEY }}
          command: update
          stage: Released
          version: ${{ inputs.tag }}

      - uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0.18.0
        if: inputs.stage == 'released' && steps.meta.outputs.component == 'cockpit'
        with:
          access_key: ${{ secrets.LINEAR_COCKPIT_RELEASE_ACCESS_KEY }}
          command: update
          stage: Released
          version: ${{ inputs.tag }}
