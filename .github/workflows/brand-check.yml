name: brand-check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  brand:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B scripts/brand.py check
      - run: python3 -B -m unittest discover -s scripts -p 'test_brand*.py'
