# commitlint — the PR gate for the conventional-commit contract.
#
# Lints every authored (non-merge) commit in the PR and the PR TITLE against
# commitlint.config.mjs (config-conventional, tuned there). Both surfaces
# matter because main allows both squash and rebase merges:
#   * squash merge -> the PR title becomes the commit subject on main
#   * rebase merge -> authored PR commits land on main verbatim
# Integration merges do not land in linear main history. Select by Git parent
# count, never by a message prefix that could hide malformed authored commits.
# release-please parses that log to decide the next version and the
# changelog (docs/releasing.md), so a malformed message silently drops the
# change from the release notes or skips a version bump.
#
# The ruleset requires the `commitlint` context beside ci.yml's `ci`. Release
# PRs opened by the release App get this check like any other PR: App-raised
# events trigger workflows, unlike GITHUB_TOKEN ones.
#
# `edited` is in the trigger list so fixing a bad PR title re-runs the gate
# without needing a push.

name: commitlint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 so base.sha..head.sha resolves. The default checkout
      # of refs/pull/N/merge carries both parents, so this holds for fork
      # PRs too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # No package.json at the repo root, and none wanted: --no-save
      # installs into an untracked node_modules that exists only for this
      # job. Majors are pinned; extends resolution finds
      # @commitlint/config-conventional right next to the CLI.
      - name: Install commitlint
        run: npm install --no-save --no-audit --no-fund @commitlint/cli@21 @commitlint/config-conventional@21

      - name: Lint PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Cockpit's one-time history import is intentionally reachable as a
          # merge parent. Its 199 historical commits predate this repository's
          # commitlint contract; exclude exactly that immutable ancestry while
          # continuing to lint every authored PR commit.
          import_tip="$(< .github/cockpit-history-tip)"
          mapfile -t commits < <(git rev-list --no-merges --reverse "$BASE_SHA..$HEAD_SHA" --not "$import_tip")
          for commit in "${commits[@]}"; do
            git show -s --format=%B "$commit" | npx commitlint --verbose
          done

      # The title is passed through the environment, not interpolated into
      # the script, so backticks/quotes in a title cannot inject shell.
      - name: Lint PR title (the squash-merge subject)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose
