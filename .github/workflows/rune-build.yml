name: Rune build

# The Rune client (clients/rune): desktop archives on macOS/Linux, plus real
# native iOS simulator/device builds and simulator input qualification.
# Its own Cargo workspace is tested and packaged. ci.yml calls this for the
# Linux hosts; rune-macos.yml calls it for macOS and the iOS simulator.
# rune-client.yml calls it for a tag (every host, iOS included), when the
# macOS app is also signed and the archives go on to publication. It is
# separate because a called workflow can't ask for more than its caller
# grants, and publishing needs `contents: write`.
on:
  workflow_call:
    inputs:
      # Off for ci.yml's Linux lane. rune-macos.yml's plan sets it. A tag
      # passes nothing, so the release keeps the simulator leg.
      ios:
        type: boolean
        default: true
      # all (the default a tag and the cache warm use), linux, or macos.
      hosts:
        type: string
        default: all
    secrets:
      APPLE_DEVELOPER_ID_P12:
        required: false
      APPLE_DEVELOPER_ID_PASSWORD:
        required: false
      APPLE_NOTARY_KEY_P8:
        required: false
      APPLE_NOTARY_KEY_ID:
        required: false
      APPLE_NOTARY_ISSUER_ID:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    # A caller names the hosts it wants. macOS is its own job: a job-level
    # `if` cannot read `matrix`, so this matrix is Linux only.
    if: inputs.hosts == 'all' || inputs.hosts == 'linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Debug builds only (clippy, tests, the qualification CLI): fewer bytes to
    # compile and cache. The packaged release build keeps its own profile.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: ./.github/actions/rune-host
        with:
          name: ${{ matrix.name }}
          apple_developer_id_p12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          apple_developer_id_password: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          apple_notary_key_p8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          apple_notary_key_id: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          apple_notary_issuer_id: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

  macos:
    name: macos-arm64
    if: inputs.hosts == 'all' || inputs.hosts == 'macos'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: ./.github/actions/rune-host
        with:
          name: macos-arm64
          apple_developer_id_p12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          apple_developer_id_password: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          apple_notary_key_p8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          apple_notary_key_id: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          apple_notary_issuer_id: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

  ios-native:
    name: ios-native-simulator
    if: inputs.ios && (inputs.hosts == 'all' || inputs.hosts == 'macos')
    runs-on: macos-26
    # A cold macOS + simulator + device build still has to qualify both
    # transports. Sixty minutes can expire after QUIC, during the WSS pass.
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchains
        run: |
          bash scripts/setup-rust.sh core
          bash scripts/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"
          rustup target add aarch64-apple-ios-sim aarch64-apple-ios
      - uses: ./.github/actions/setup-bun
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
          shared-key: rune-ios-native
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"
      - name: Test native build and qualification drivers
        run: python3 -B -m unittest discover -s clients/rune/scripts -p 'test_ios*.py'
      - name: Check the native Rust bridge
        run: |
          cargo fmt --manifest-path clients/rune/Cargo.toml --all --check
          cargo clippy --locked --manifest-path clients/rune/Cargo.toml -p phux-rune-ios \
            --target aarch64-apple-ios-sim -- -D warnings
      - name: Build native simulator app and device bundle
        run: |
          python3 clients/rune/ios/build.py --out "$RUNNER_TEMP/ios-simulator" --target simulator
          python3 clients/rune/ios/build.py --out "$RUNNER_TEMP/ios-device" --target device
      - name: Test native tailnet trust, SSH and cancellation
        run: |
          helper="$RUNNER_TEMP/ios-simulator/tailnet"
          xcrun --sdk macosx swift test --package-path "$helper/package" \
            --scratch-path "$helper/test-build" --cache-path "$helper/cache" \
            --config-path "$helper/config" --security-path "$helper/security" \
            --manifest-cache local --disable-keychain --disable-netrc --force-resolved-versions \
            --sdk "$(xcrun --sdk macosx --show-sdk-path)" --triple arm64-apple-macosx26.0 \
            --jobs 8
      - name: Qualify native rendering and input against the same-source dev server
        run: |
          cargo build --locked -p phux
          python3 clients/rune/ios/qualify.py --app "$RUNNER_TEMP/ios-simulator/Phux Rune.app" \
            --phux "$PWD/target/debug/phux" --out "$RUNNER_TEMP/ios-qualification/quic"
          python3 clients/rune/ios/qualify.py --app "$RUNNER_TEMP/ios-simulator/Phux Rune.app" \
            --phux "$PWD/target/debug/phux" --transport wss --out "$RUNNER_TEMP/ios-qualification/wss"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          # rune-client.yml publishes rune-* artifacts; evidence/debug apps
          # must never enter the signed desktop release/feed asset set.
          name: qualification-ios-native
          path: |
            ${{ runner.temp }}/ios-qualification
            ${{ runner.temp }}/ios-simulator/*.json
            ${{ runner.temp }}/ios-simulator/*.log
            ${{ runner.temp }}/ios-simulator/tailnet/*.log
            ${{ runner.temp }}/ios-simulator/tailnet/*.command.json
            ${{ runner.temp }}/ios-simulator/Phux Rune.app
            ${{ runner.temp }}/ios-device/*.json
            ${{ runner.temp }}/ios-device/*.log
            ${{ runner.temp }}/ios-device/tailnet/*.log
            ${{ runner.temp }}/ios-device/tailnet/*.command.json
          if-no-files-found: warn
          retention-days: 14
