# Retired at the free-runner cutover: PR closure must not cancel pre-cutover
# queued/running jobs. Keep this manual, read-only marker for workflow history.
name: pr-janitor

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mini-v1-pr-janitor
  cancel-in-progress: false

jobs:
  policy:
    name: report cancellation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo 'Automatic PR-close cancellation is retired; existing runs finish normally.' >> "$GITHUB_STEP_SUMMARY"
