# Build the Android UniFFI zip from this checkout.
# Sibling of ffi-xcframework.yml, not a job on it: Apple publication must not
# wait on NDK. phux-mobile fetches this zip at PHUX_REV.
#
# release.yml dispatches it with the tag to attach the zip once a root
# release is public; that is the build phux-mobile pins by default. A
# dispatch with `commit` builds one main commit for a mobile override pin
# (phux-mobile `just pin-phux <sha>`). Main pushes no longer build it.
#
# An ubuntu preflight runs before the NDK build and skips it when that
# commit is already built.

name: ffi-android

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing root release tag (vX.Y.Z). Empty builds this ref and only uploads the workflow artifact.
        required: false
        type: string
        default: ""
      commit:
        description: Full 40-character commit SHA to build instead of the dispatched ref's head. Leave empty with a tag. Artifacts are then named with a -<sha> suffix, because the run's headSha is not the built commit.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

# Keyed on the built commit, never on a branch. A group admits one running and
# ONE pending run, so a ref-keyed group let a third push on main replace the
# still-pending run for the second, and that commit never got an artifact even
# though phux-mobile may pin it. Per-commit groups only serialize a replay of
# the same commit; nothing is cancelled.
concurrency:
  group: ffi-android-${{ inputs.tag || inputs.commit || github.sha }}
  cancel-in-progress: false

jobs:
  # ubuntu, before the build. Skips that build only when this exact commit
  # is already built. A tag dispatch skips only when the release already has
  # every archive this workflow attaches, each zip matches its sha256, and
  # provenance names the tag commit: attach is a step in the build job, and
  # unsuffixed workflow artifacts do not identify which tag was built.
  # notify-mobile still runs on that skip; it only sends the tag.
  # A dispatch without a tag skips when a successful earlier run of this
  # workflow still has the unexpired artifacts this run would upload. The
  # build runs in every other case, including when the lookup cannot tell.
  preflight:
    name: check for an existing build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - name: Decide whether this commit is already built
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          COMMIT_INPUT: ${{ inputs.commit }}
          WORKFLOW_FILE: ffi-android.yml
          PREFLIGHT_LABEL: Android UniFFI zip
          BARE_ARTIFACTS: PhuxMobileFFI-android
          RELEASE_SPECS: |
            PhuxMobileFFI-|.android.zip|.android.provenance|phux_rev=
        run: |
          # Decide whether this dispatch's commit is already built. The sibling
          # workflow keeps this script in lockstep; only the step env differs.
          set -Eeo pipefail

          summary="${RUNNER_TEMP:-/tmp}/ffi-preflight-summary.md"
          mkdir -p "$(dirname "$summary")"
          : >"$summary"
          skip=false
          release_reason=""
          matched_url=""
          matched_id=""
          matched_head=""
          matched_event=""
          matched_names=""

          # shellcheck disable=SC2329 # invoked from the EXIT trap
          finish() {
              if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
                  echo "skip=${skip}" >>"$GITHUB_OUTPUT"
              fi
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                  cat "$summary" >>"$GITHUB_STEP_SUMMARY"
              fi
              echo "preflight: skip=${skip}"
          }
          trap finish EXIT

          # shellcheck disable=SC2329 # invoked from the ERR trap
          fail_open() {
              local status=$?
              skip=false
              {
                  echo "### Preflight could not check"
                  echo
                  echo "A command failed with status ${status}, so this run will build."
                  echo "An uncertain check does not skip the build."
              } >"$summary"
              exit 0
          }
          trap fail_open ERR

          say_build() {
              {
                  echo "### Build will run"
                  echo
                  printf '%s\n' "$1"
              } >"$summary"
              skip=false
              exit 0
          }

          say_skip() {
              {
                  echo "### Existing build"
                  echo
                  printf '%s\n' "$1"
              } >"$summary"
              skip=true
              exit 0
          }

          check_archive() {
              local dir="$1" zip="$2" sum="$3" prov="$4" line_prefix="$5"
              local zip_path="$dir/$zip" sum_path="$dir/$sum" prov_path="$dir/$prov"
              local count digest name actual want
              if [[ ! -f "$zip_path" || ! -f "$sum_path" || ! -f "$prov_path" ]]; then
                  release_reason="Download of \`${zip}\` was incomplete. The build will run."
                  return 1
              fi
              count="$(awk 'NF { n++ } END { print n + 0 }' "$sum_path")"
              digest="$(awk 'NF { print tolower($1); exit }' "$sum_path")"
              name="$(awk 'NF { print $2; exit }' "$sum_path")"
              name="${name#\*}"
              if [[ "$count" != "1" || "$name" != "$zip" || ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
                  release_reason="Checksum \`${sum}\` does not name \`${zip}\` as one sha256 line. The build will run."
                  return 1
              fi
              actual="$(sha256sum "$zip_path" | awk '{ print $1 }')"
              if [[ "$actual" != "$digest" ]]; then
                  release_reason="\`${zip}\` does not match its sha256 sidecar. The build will run and replace it."
                  return 1
              fi
              if [[ "$line_prefix" == *= ]]; then
                  want="${line_prefix}${expected}"
              else
                  want="${line_prefix} ${expected}"
              fi
              if ! grep -qx -- "$want" "$prov_path"; then
                  release_reason="Provenance \`${prov}\` does not name \`${expected}\`. The build will run and replace it."
                  return 1
              fi
          }

          verify_release() {
              local view draft target names prefix zip_suffix prov_suffix line_prefix
              local zip prov sum dir proof spec
              local -a specs=()
              if ! view="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft,targetCommitish,assets)"; then
                  release_reason="No GitHub release \`${RELEASE_TAG}\` exists yet. The build will run and attach once it does, as it does today."
                  return 1
              fi
              draft="$(jq -r '.isDraft' <<<"$view")"
              target="$(jq -r '.targetCommitish' <<<"$view")"
              if [[ "$target" != "$expected" ]]; then
                  release_reason="Release \`${RELEASE_TAG}\` records target \`${target}\`, not \`${expected}\`. phux-mobile's fetcher requires \`target_commitish\` to be that commit, so the build will run."
                  return 1
              fi
              names="$(jq -r '.assets[].name' <<<"$view")"
              while IFS='|' read -r prefix zip_suffix prov_suffix line_prefix; do
                  [[ -n "$prefix" ]] || continue
                  zip="${prefix}${RELEASE_TAG}${zip_suffix}"
                  prov="${prefix}${RELEASE_TAG}${prov_suffix}"
                  sum="${zip}.sha256"
                  if ! grep -Fxq -- "$zip" <<<"$names" \
                      || ! grep -Fxq -- "$sum" <<<"$names" \
                      || ! grep -Fxq -- "$prov" <<<"$names"; then
                      release_reason="Release \`${RELEASE_TAG}\` is missing \`${zip}\`, its checksum, or its provenance. The build will run and attach."
                      return 1
                  fi
                  specs+=("${prefix}|${zip_suffix}|${prov_suffix}|${line_prefix}")
              done <<<"$RELEASE_SPECS"
              if [[ "${#specs[@]}" -eq 0 ]]; then
                  release_reason="Preflight has no release archive specs. The build will run."
                  return 1
              fi
              dir="$(mktemp -d)"
              proof=""
              for spec in "${specs[@]}"; do
                  IFS='|' read -r prefix zip_suffix prov_suffix line_prefix <<<"$spec"
                  zip="${prefix}${RELEASE_TAG}${zip_suffix}"
                  prov="${prefix}${RELEASE_TAG}${prov_suffix}"
                  sum="${zip}.sha256"
                  if ! gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir "$dir" \
                      --pattern "$zip" --pattern "$sum" --pattern "$prov"; then
                      rm -rf "$dir"
                      release_reason="Could not download \`${zip}\` from \`${RELEASE_TAG}\`. The build will run."
                      return 1
                  fi
                  if ! check_archive "$dir" "$zip" "$sum" "$prov" "$line_prefix"; then
                      rm -rf "$dir"
                      return 1
                  fi
                  proof+="- \`${zip}\` sha256 matches, and provenance names \`${expected}\`"$'\n'
              done
              rm -rf "$dir"
              {
                  printf 'Skipping the %s build for %s.\n\n' "$PREFLIGHT_LABEL" "$expected"
                  printf 'Release [%s](https://github.com/%s/releases/tag/%s) already has verified archives for this commit:\n\n' \
                      "$RELEASE_TAG" "$GH_REPO" "$RELEASE_TAG"
                  printf '%s\n' "$proof"
                  if [[ "$draft" == "true" ]]; then
                      echo "The release is still a draft. The archives already verify, so the build is skipped anyway."
                      echo
                  fi
                  echo "Attach is a step inside the build job and would upload these same bytes again (\`--clobber\`, then \`cmp\`). Skipping the build skips that step because the release already holds them."
                  echo
                  echo "\`notify-mobile\` still runs. It only sends \`client_payload[tag]\` and does not read the build job's outputs or artifacts."
              }
          }

          run_has_artifacts() {
              local run_id="$1" head="$2"
              local payload count name tagged
              local -a bare_names=() want=()
              if ! payload="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}/artifacts?per_page=100")"; then
                  echo "preflight: could not list artifacts for run ${run_id}" >&2
                  return 1
              fi
              read -r -a bare_names <<<"$BARE_ARTIFACTS"
              for name in "${bare_names[@]}"; do
                  want+=("${name}${suffix}")
              done
              matched_names=""
              for name in "${want[@]}"; do
                  count="$(jq -r --arg n "$name" '[.artifacts[] | select(.name == $n and .expired == false)] | length' <<<"$payload")"
                  [[ "$count" == "1" ]] || return 1
                  matched_names+="${name}"$'\n'
              done
              if [[ -z "$suffix" ]]; then
                  [[ "$head" == "$expected" ]] || return 1
                  # A tag dispatch checks out the tag while the run's head SHA stays on
                  # the ref it was dispatched from. Unsuffixed artifacts from that run
                  # can belong to the tag's commit, not this head, so they are not proof.
                  if ! tagged="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}/jobs?per_page=100" \
                      --jq '[.jobs[].steps[]? | select(.name == "Validate release tag") | .conclusion] | any(. == "success")')"; then
                      echo "preflight: could not read jobs for run ${run_id}" >&2
                      return 1
                  fi
                  if [[ "$tagged" == "true" ]]; then
                      echo "preflight: run ${run_id} validated a release tag; ignoring its unsuffixed artifacts" >&2
                      return 1
                  fi
              fi
          }

          find_run() {
              local commit_json main_json rows run_id head event url
              if ! commit_json="$(gh run list --repo "$GH_REPO" --workflow "$WORKFLOW_FILE" \
                  --commit "$expected" --status success --limit 20 \
                  --json databaseId,headSha,event,url,createdAt)"; then
                  return 2
              fi
              main_json='[]'
              if [[ -n "$suffix" ]]; then
                  if ! main_json="$(gh run list --repo "$GH_REPO" --workflow "$WORKFLOW_FILE" \
                      --branch main --event workflow_dispatch --status success --limit 50 \
                      --json databaseId,headSha,event,url,createdAt)"; then
                      return 2
                  fi
              fi
              if ! rows="$(jq -s -r --arg self "${GITHUB_RUN_ID:-0}" '
                  add
                  | map(select((.databaseId | tostring) != $self))
                  | sort_by(.createdAt) | reverse
                  | unique_by(.databaseId)
                  | .[]
                  | [.databaseId, .headSha, .event, .url] | @tsv
              ' <(printf '%s\n' "$commit_json") <(printf '%s\n' "$main_json"))"; then
                  return 2
              fi
              while IFS=$'\t' read -r run_id head event url; do
                  [[ -n "$run_id" ]] || continue
                  if run_has_artifacts "$run_id" "$head"; then
                      matched_id="$run_id"
                      matched_head="$head"
                      matched_event="$event"
                      matched_url="$url"
                      return 0
                  fi
              done <<<"$rows"
              return 1
          }

          if [[ -n "${RELEASE_TAG}" && -n "${COMMIT_INPUT}" ]]; then
              say_build "Both \`tag\` and \`commit\` were set. The build will run and reject that, as it does today."
          fi
          if [[ -n "${COMMIT_INPUT}" && ! "${COMMIT_INPUT}" =~ ^[0-9a-f]{40}$ ]]; then
              say_build "\`commit\` is not a full 40-character SHA. The build will run and reject it, as it does today."
          fi
          tag_re='^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z][0-9A-Za-z.-]*)?$'
          if [[ -n "${RELEASE_TAG}" && ! "${RELEASE_TAG}" =~ $tag_re ]]; then
              say_build "\`tag\` does not match a root release tag. The build will run and reject it, as it does today."
          fi

          if [[ -n "${RELEASE_TAG}" ]]; then
              if ! expected="$(gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq .sha)"; then
                  say_build "Tag \`${RELEASE_TAG}\` does not resolve. The build will run and report that, as it does today."
              fi
          elif [[ -n "${COMMIT_INPUT}" ]]; then
              expected="${COMMIT_INPUT}"
          else
              expected="${GITHUB_SHA}"
          fi
          if [[ ! "${expected}" =~ ^[0-9a-f]{40}$ ]]; then
              say_build "Could not resolve a full commit SHA (\`${expected}\`). The build will run."
          fi

          suffix=""
          if [[ -z "${RELEASE_TAG}" && -n "${COMMIT_INPUT}" && "${COMMIT_INPUT}" != "${GITHUB_SHA}" ]]; then
              suffix="-${expected}"
          fi

          if [[ -n "${RELEASE_TAG}" ]]; then
              proof_file="$(mktemp)"
              # Current shell, not a substitution: release_reason has to survive a miss.
              if verify_release >"$proof_file"; then
                  say_skip "$(cat "$proof_file")"
              fi
              rm -f "$proof_file"
              say_build "${release_reason:-Release \`${RELEASE_TAG}\` is not a verified build of \`${expected}\`. The build will run and attach.}"
          fi

          find_status=0
          find_run || find_status=$?
          if [[ "$find_status" -eq 0 ]]; then
              if [[ ! "$matched_url" =~ ^https://github.com/ ]]; then
                  matched_url="https://github.com/${GH_REPO}/actions/runs/${matched_id}"
              fi
              name_list=""
              while IFS= read -r name; do
                  [[ -n "$name" ]] || continue
                  name_list+="- \`${name}\` (not expired)"$'\n'
              done <<<"$matched_names"
              if [[ -n "$suffix" ]]; then
                  fetch_note="Those names end in \`-${expected}\`, which is the \`commit=\` artifact \`scripts/ffi-run-for-pin.sh\` downloads. The lookup uses that script's window: 20 successful runs whose head SHA is the commit, and 50 recent successful \`main\` dispatches. This run uploads nothing, so the script skips it and keeps the earlier run."
              elif [[ "$matched_event" != "workflow_dispatch" ]]; then
                  fetch_note="The names are unsuffixed because this dispatch's head is the built commit, matching the build job's \`ARTIFACT_SUFFIX\`. \`scripts/ffi-run-for-pin.sh\` accepts an unsuffixed artifact when the run head is the pin and the run is not a \`workflow_dispatch\`, so this earlier run still satisfies that fetch."
              else
                  fetch_note="The names are unsuffixed because this dispatch's head is the built commit, matching the build job's \`ARTIFACT_SUFFIX\`. A \`commit=\` dispatch from a later main uploads \`-${expected}\` names instead. \`scripts/ffi-run-for-pin.sh\` requires that suffixed name on a \`workflow_dispatch\`, so this skip only avoids repeating this head's build; it does not hide a missing suffixed artifact."
              fi
              say_skip "$(
                  printf 'Skipping the %s build for %s.\n\n' "$PREFLIGHT_LABEL" "$expected"
                  printf 'Successful run [%s](%s) of %s (%s, head %s) still has the unexpired artifacts this dispatch would upload:\n\n' \
                      "$matched_id" "$matched_url" "$WORKFLOW_FILE" "$matched_event" "$matched_head"
                  printf '%s\n' "$name_list"
                  printf '\n%s\n\n' "$fetch_note"
                  echo "No tag was passed, so the build job's attach step does not run and \`notify-mobile\` stays skipped. Both of those already behave that way when \`inputs.tag\` is empty."
              )"
          fi
          if [[ "$find_status" -eq 2 ]]; then
              say_build "Could not list earlier runs of \`${WORKFLOW_FILE}\`. The build will run."
          fi
          want_desc=""
          read -r -a bare_names <<<"$BARE_ARTIFACTS"
          for name in "${bare_names[@]}"; do
              if [[ -n "$want_desc" ]]; then
                  want_desc+=" and "
              fi
              want_desc+="\`${name}${suffix}\`"
          done
          say_build "No earlier successful run of \`${WORKFLOW_FILE}\` still has unexpired ${want_desc} for \`${expected}\`. The build will run."

  build:
    name: build Android UniFFI zip
    needs: preflight
    # Only skip=false builds. A failed preflight does not start the NDK
    # build: artifacts from a red workflow are not a pin phux-mobile will fetch.
    # An uncertain lookup records skip=false and the build runs as before.
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      ARTIFACTS: target/mobile-ffi-android/Artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || inputs.commit || github.sha }}

      # The checkout above names a commit, not a branch: a push run that waits
      # in the queue must still build the commit that triggered it, or its
      # artifacts carry a later main's provenance under this run's headSha and
      # phux-mobile's fetcher refuses them. This step proves HEAD is that
      # commit and decides the artifact names (see the commit input).
      - name: Resolve the build commit
        env:
          COMMIT_INPUT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ -z "$COMMIT_INPUT" ]] || { echo "::error::pass tag or commit, not both"; exit 1; }
            expected="$(git rev-parse "$RELEASE_TAG^{commit}")"
          else
            expected="${COMMIT_INPUT:-$GITHUB_SHA}"
          fi
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full 40-character SHA: $expected"; exit 1; }
          test "$(git rev-parse HEAD)" = "$expected"
          suffix=""
          if [[ -n "$COMMIT_INPUT" && "$COMMIT_INPUT" != "$GITHUB_SHA" ]]; then
            suffix="-$expected"
          fi
          {
            echo "BUILD_SHA=$expected"
            echo "ARTIFACT_SUFFIX=$suffix"
          } >> "$GITHUB_ENV"
          echo "Building ${expected} (run headSha ${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"

      # Same packages ci.yml's native lane uses: .cargo/config.toml passes
      # -fuse-ld=mold on Linux, and the hosted image has no mold or ld by default.
      - name: Platform packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config mold curl xz-utils unzip

      - name: Contributor Zig setup
        run: bash scripts/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"

      - name: Contributor Rust setup
        run: bash scripts/setup-rust.sh core

      - name: Android NDK
        run: bash scripts/ci/setup-android-ndk.sh >> "$GITHUB_ENV"

      - name: cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ffi-android
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build Android UniFFI artifact
        run: bash scripts/build-mobile-ffi-android.sh

      - name: Package zip and checksum
        id: package
        run: |
          set -euo pipefail
          stem="PhuxMobileFFI-${RELEASE_TAG:-$(git rev-parse --short HEAD)}.android"
          cd "$ARTIFACTS"
          zip -qry "${stem}.zip" kotlin jniLibs provenance
          shasum -a 256 "${stem}.zip" > "${stem}.zip.sha256"
          cp provenance "${stem}.provenance"
          echo "stem=${stem}" >> "$GITHUB_OUTPUT"

      # The provenance the consumer checks must name the commit this run was for.
      - name: Verify provenance names the build commit
        run: |
          set -euo pipefail
          grep -qx "phux_rev=$BUILD_SHA" "$ARTIFACTS/provenance"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PhuxMobileFFI-android${{ env.ARTIFACT_SUFFIX }}
          path: |
            ${{ env.ARTIFACTS }}/provenance
            ${{ env.ARTIFACTS }}/${{ steps.package.outputs.stem }}.zip
            ${{ env.ARTIFACTS }}/${{ steps.package.outputs.stem }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Attach and verify release assets
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STEM: ${{ steps.package.outputs.stem }}
        run: |
          set -euo pipefail
          cd "$ARTIFACTS"
          gh release upload "$RELEASE_TAG" \
            "${STEM}.zip" "${STEM}.zip.sha256" "${STEM}.provenance" --clobber
          existing="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --dir "$existing" --pattern "${STEM}.*"
          cmp "${STEM}.zip" "$existing/${STEM}.zip"
          (cd "$existing" && shasum -a 256 -c "${STEM}.zip.sha256")

  # phux-mobile pins the newest release that carries both mobile archives.
  # Tell it one was just attached instead of leaving it to its six-hour poll.
  # Best effort: the poll still catches a missed event, so a failed dispatch
  # must not fail the release build.
  # needs.build.result == 'skipped' is the tag replay whose release already
  # verified. !cancelled() is required: without a status function GitHub
  # prepends success(), and a skipped build would suppress the dispatch.
  # The job still sends only client_payload[tag]. It does not read build
  # outputs or artifacts, and continue-on-error stays as it was.
  notify-mobile:
    needs: [preflight, build]
    if: ${{ !cancelled() && inputs.tag != '' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.preflight.outputs.skip == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: mobile
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: no-phux
          repositories: phux-mobile
          permission-contents: write
      - name: Tell phux-mobile a release archive was attached
        env:
          GH_TOKEN: ${{ steps.mobile.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: >-
          gh api repos/no-phux/phux-mobile/dispatches
          -f event_type=phux-ffi-published -f "client_payload[tag]=$TAG"
