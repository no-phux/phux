# Publish one agent integration tag. release.yml dispatches this once ci is
# green for the tag; it re-tests that tree, packs one artifact, publishes npm
# packages with provenance, attaches the artifact, then flips the draft public.
#
# npm trusted publishing trusts the entry workflow filename and GitHub-hosted
# runners only, and checks each package's repository URL; so this stays a
# dispatch target, never a workflow_call, and publishes from ubuntu-latest.
# Never parse `npm pack` stdout (prepack output shares it), and pass npm
# tarballs as absolute paths (`dir/x.tgz` reads as GitHub shorthand).

name: Release agent integration

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing component-vX.Y.Z tag to validate
        required: true
        type: string
      dry_run:
        description: Validate without publishing or changing the GitHub release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: agent-integration-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release identity
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      component: ${{ steps.release.outputs.component }}
      directory: ${{ steps.release.outputs.directory }}
      version: ${{ steps.release.outputs.version }}
      package_name: ${{ steps.release.outputs.package_name }}
      publish_npm: ${{ steps.release.outputs.publish_npm }}
      dry_run: ${{ steps.release.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      # The version contract runs from the tools package.
      - uses: ./.github/actions/setup-bun

      - name: Validate tag, commit, and component version
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          tag="$DISPATCH_TAG"
          dry_run="$DISPATCH_DRY_RUN"
          if [[ ! "$tag" =~ ^(pi-extension|claude-plugin|opencode-plugin|omp-extension|grok-plugin)-v([0-9]+[.][0-9]+[.][0-9]+)$ ]]; then
            echo "::error::tag must be <pi-extension|claude-plugin|opencode-plugin|omp-extension|grok-plugin>-vX.Y.Z"
            exit 1
          fi
          component="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          # npm packages publish to the registry; marketplace plugins (Claude,
          # Grok) are installed from this repository, so their release carries
          # a source archive only.
          case "$component" in
            pi-extension) directory=integrations/pi; publish_npm=true ;;
            claude-plugin) directory=integrations/claude; publish_npm=false ;;
            opencode-plugin) directory=integrations/opencode-v2; publish_npm=true ;;
            omp-extension) directory=integrations/omp; publish_npm=true ;;
            grok-plugin) directory=integrations/grok; publish_npm=false ;;
          esac

          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/${tag}")"
          package_version="$(node -p "require('./${directory}/package.json').version")"
          package_name="$(node -p "require('./${directory}/package.json').name")"
          package_repository="$(node -p "require('./${directory}/package.json').repository.url")"
          expected_repository="https://github.com/${GITHUB_REPOSITORY}.git"
          test "$package_version" = "$version"
          if [[ "$package_repository" != "$expected_repository" ]]; then
            echo "::error::${package_name} repository.url must be ${expected_repository} for npm trusted publishing, found ${package_repository}"
            exit 1
          fi
          bun tools/main.ts integration-versions-check

          {
            echo "tag=$tag"
            echo "component=$component"
            echo "directory=$directory"
            echo "version=$version"
            echo "package_name=$package_name"
            echo "publish_npm=$publish_npm"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Test and package exact artifact
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: integrations/*/package-lock.json

      # OpenCode and OMP build with Bun; same pin as ci.yml's integrations job.
      - uses: ./.github/actions/setup-bun

      # Pi bundles the built runtime; OpenCode and OMP compile its sources.
      - name: Build and verify shared integration runtime
        if: needs.prepare.outputs.component == 'pi-extension'
        env:
          npm_config_audit: "false"
          npm_config_fund: "false"
        run: |
          npm install --global npm@12.2.1
          npm --prefix integrations/runtime ci
          npm --prefix integrations/runtime run gates
          git diff --exit-code -- integrations/runtime/dist

      - name: Install and run component gates
        working-directory: ${{ needs.prepare.outputs.directory }}
        env:
          # The root .npmrc is invisible below a package.json; see .npmrc.
          npm_config_audit: "false"
          npm_config_fund: "false"
          COMPONENT: ${{ needs.prepare.outputs.component }}
        run: |
          npm install --global npm@12.2.1
          case "$COMPONENT" in
            opencode-plugin|omp-extension) bun install --frozen-lockfile; bun run gates ;;
            grok-plugin) npm test ;;
            *) npm ci; npm run gates ;;
          esac
          # The release ships committed bundles (OpenCode's index.js/tui.js):
          # they must be what this tree builds.
          git diff --exit-code -- .

      - name: Build immutable release artifact
        id: artifact
        shell: bash
        env:
          COMPONENT: ${{ needs.prepare.outputs.component }}
          DIRECTORY: ${{ needs.prepare.outputs.directory }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_NPM: ${{ needs.prepare.outputs.publish_npm }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir release
          if [[ "$PUBLISH_NPM" == true ]]; then
            # Find the tarball by glob in an empty directory, never from npm's stdout.
            (cd "$DIRECTORY" && npm pack --pack-destination "$GITHUB_WORKSPACE/release")
            mapfile -t packed < <(find release -maxdepth 1 -type f -name '*.tgz')
            if [[ "${#packed[@]}" -ne 1 ]]; then
              echo "::error::expected exactly one packed tarball, found ${#packed[@]}: ${packed[*]-}"
              exit 1
            fi
            tarball="$(basename "${packed[0]}")"
          else
            tarball="phux-${COMPONENT}-${VERSION}.tar.gz"
            git archive --format=tar.gz --prefix="phux-${COMPONENT}-${VERSION}/" -o "release/$tarball" "${TAG}:${DIRECTORY}"
          fi
          (cd release && sha256sum "$tarball" > "${tarball}.sha256")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Verify exact packed npm artifact
        if: needs.prepare.outputs.publish_npm == 'true'
        env:
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          set -euo pipefail
          test_dir="$(mktemp -d)"
          cd "$test_dir"
          npm init --yes >/dev/null
          # Temp dir outside the repo tree: no project .npmrc applies, so the
          # flags are explicit here (see .npmrc for why audit is off).
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false "$GITHUB_WORKSPACE/release/$TARBALL"
          npm ls --depth=0 "${PACKAGE_NAME}@${VERSION}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.prepare.outputs.component }}-${{ needs.prepare.outputs.tag }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish validated component
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    # No checkout: this job publishes only the bytes the package job built, so
    # gh has no git remote and needs the repository named.
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.component }}-${{ needs.prepare.outputs.tag }}
          path: release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Verify downloaded artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find release -maxdepth 1 -type f \( -name '*.tgz' -o -name '*.tar.gz' \))
          test "${#tarballs[@]}" -eq 1
          (cd release && sha256sum --check "$(basename "${tarballs[0]}").sha256")
          echo "tarball=$(cd "$(dirname "${tarballs[0]}")" && pwd)/$(basename "${tarballs[0]}")" >> "$GITHUB_OUTPUT"

      # Also on dry runs, so they exercise the gh wiring.
      - name: Verify the draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release view "$TAG" --json tagName,isDraft --jq '"\(.tagName) draft=\(.isDraft)"'

      - name: Exercise npm publication
        if: needs.prepare.outputs.publish_npm == 'true' && needs.prepare.outputs.dry_run == 'true'
        env:
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: npm publish --dry-run --no-audit "$TARBALL"

      - name: Publish exact npm artifact with provenance
        if: needs.prepare.outputs.publish_npm == 'true' && needs.prepare.outputs.dry_run == 'false'
        env:
          TARBALL: ${{ steps.artifact.outputs.tarball }}
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          npm install --global npm@12.2.1
          # npm versions are immutable, so a replay compares contents (npm pack
          # does not order files reproducibly) and moves on.
          if npm view "${PACKAGE_NAME}@${VERSION}" dist.shasum >/dev/null 2>&1; then
            existing="$(mktemp -d)"
            npm pack "${PACKAGE_NAME}@${VERSION}" --pack-destination "${existing}" --silent
            published="$(find "${existing}" -maxdepth 1 -type f -name '*.tgz' | head -n1)"
            test -n "${published}"
            local_dir="${existing}/local"; published_dir="${existing}/published"
            mkdir "${local_dir}" "${published_dir}"
            tar -xzf "$TARBALL" -C "${local_dir}"
            tar -xzf "${published}" -C "${published_dir}"
            if ! diff -r "${local_dir}/package" "${published_dir}/package"; then
              echo "::error::${PACKAGE_NAME}@${VERSION} is already on npm with DIFFERENT content. The registry version is immutable; cut a new version rather than trying to overwrite it."
              exit 1
            fi
            echo "${PACKAGE_NAME}@${VERSION} already published with identical content; nothing to do."
          else
            npm publish --provenance --access public --no-audit "$TARBALL"
          fi

      - name: Attach assets and publish component release
        if: needs.prepare.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" release/* --clobber
          mapfile -t expected < <(find release -maxdepth 1 -type f -exec basename {} \; | sort)
          mapfile -t actual < <(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          # Only CLI releases are Latest (ADR-0176).
          gh release edit "$TAG" --draft=false --latest=false
