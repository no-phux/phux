# Release agent integration — the publish lane for integrations/*.
#
# Flow: release-please merges a release PR, creates `<component>-vX.Y.Z`, and
# leaves a DRAFT GitHub release (release-please-config.json sets "draft": true
# globally). That tag push lands here. This workflow re-tests the exact tagged
# tree, packs the immutable artifact, publishes it to npm where applicable,
# attaches the artifact to the draft, and only then flips the draft public.
#
# The tag is created by the release App, not GITHUB_TOKEN, so the push DOES
# raise a workflow run — see the header of release-please.yml for why that
# distinction is load-bearing.
#
# THIS LANE WAS DEAD ON ARRIVAL. Its first four invocations all failed, leaving
# four permanent 0-asset drafts (opencode-plugin-v0.2.0, pi-extension-v0.2.0,
# claude-plugin-v0.2.0/v0.2.1) and nothing on npm. It failed silently: the root
# `vX.Y.Z` lane is self-announcing because a missing release is obvious, but a
# component release that never leaves draft looks exactly like one nobody cut.
# The four independent defects, all fixed here — do not reintroduce any of them:
#
#   1. `npm pack` in JSON mode piped into a JSON parser. `npm pack` runs the `prepack`
#      lifecycle script, whose stdout is interleaved with the JSON on the same
#      fd. integrations/opencode's prepack is `tsup`, which prints a colourised
#      "CLI Building entry..." banner, so the parse died on
#      `Unexpected token '^[', "^[[34mCLI^[["...`. integrations/pi survived only
#      because its prepack is a silent `tsc`. Never parse npm's stdout: pack to
#      a known directory and glob for the artifact.
#
#   2. The publish job had no `actions/checkout` and no `GH_REPO`, so every
#      `gh release ...` call died on "failed to run git: fatal: not a git
#      repository". gh resolves the target repo from the git remote unless told
#      otherwise, and downloading an artifact does not make a git repo. The job
#      deliberately stays checkout-free — it must publish only the bytes the
#      package job built — so GH_REPO is set at job level instead.
#
#   3. `npm publish "release/foo.tgz"`. A relative path containing a `/` and no
#      leading `./` is parsed by npm as the GitHub shorthand `owner/repo`, so
#      npm tried `git ls-remote ssh://git@github.com/release/phux-pi-0.2.0.tgz.git`
#      and exited 128. Tarball arguments are resolved to absolute paths here.
#
#   4. Nothing checked that npm credentials existed. With NPM_TOKEN unset the
#      lane ran all the way to the publish step before failing, and the failure
#      surfaced as an unrelated-looking git error. The first releases were
#      bootstrapped interactively; subsequent publishes use npm trusted
#      publishing, so no long-lived npm credential exists to go missing.
#
# npm trusted publishing accepts GitHub-hosted runners only. Build/test stays on
# Blacksmith, but the small publish job MUST stay on ubuntu-latest so npm accepts
# its OIDC assertion. The package repository URLs must also exactly match this
# repository; npm validates them during the token exchange.
#
# `find` note: the artifact globs are parenthesised. `-type f -name a -o -name b`
# binds as `(-type f -a -name a) -o (-name b)`, which silently drops the type
# filter from the second branch.

name: Release agent integration

on:
  push:
    tags:
      - "opencode-plugin-v*.*.*"
      - "pi-extension-v*.*.*"
      - "claude-plugin-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing component-vX.Y.Z tag to validate
        required: true
        type: string
      dry_run:
        description: Validate without publishing or changing the GitHub release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: agent-integration-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release identity
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      component: ${{ steps.release.outputs.component }}
      directory: ${{ steps.release.outputs.directory }}
      version: ${{ steps.release.outputs.version }}
      package_name: ${{ steps.release.outputs.package_name }}
      publish_npm: ${{ steps.release.outputs.publish_npm }}
      dry_run: ${{ steps.release.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Validate tag, commit, and component version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push ]]; then
            tag="$PUSH_TAG"
            dry_run=false
          else
            tag="$DISPATCH_TAG"
            dry_run="$DISPATCH_DRY_RUN"
          fi
          if [[ ! "$tag" =~ ^(opencode-plugin|pi-extension|claude-plugin)-v([0-9]+[.][0-9]+[.][0-9]+)$ ]]; then
            echo "::error::tag must be opencode-plugin-vX.Y.Z, pi-extension-vX.Y.Z, or claude-plugin-vX.Y.Z"
            exit 1
          fi
          component="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          case "$component" in
            opencode-plugin) directory=integrations/opencode; publish_npm=true ;;
            pi-extension) directory=integrations/pi; publish_npm=true ;;
            claude-plugin) directory=integrations/claude; publish_npm=false ;;
          esac

          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/${tag}")"
          package_version="$(node -p "require('./${directory}/package.json').version")"
          package_name="$(node -p "require('./${directory}/package.json').name")"
          package_repository="$(node -p "require('./${directory}/package.json').repository.url")"
          expected_repository="https://github.com/${GITHUB_REPOSITORY}.git"
          test "$package_version" = "$version"
          if [[ "$package_repository" != "$expected_repository" ]]; then
            echo "::error::${package_name} repository.url must be ${expected_repository} for npm trusted publishing, found ${package_repository}"
            exit 1
          fi
          node scripts/check-agent-integration-versions.mjs

          {
            echo "tag=$tag"
            echo "component=$component"
            echo "directory=$directory"
            echo "version=$version"
            echo "package_name=$package_name"
            echo "publish_npm=$publish_npm"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Test and package exact artifact
    needs: prepare
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ needs.prepare.outputs.directory }}/package-lock.json

      - name: Install and run component gates
        working-directory: ${{ needs.prepare.outputs.directory }}
        run: |
          npm install --global npm@11.5.1
          npm ci
          npm run gates

      - name: Build immutable release artifact
        id: artifact
        shell: bash
        env:
          COMPONENT: ${{ needs.prepare.outputs.component }}
          DIRECTORY: ${{ needs.prepare.outputs.directory }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_NPM: ${{ needs.prepare.outputs.publish_npm }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir release
          if [[ "$PUBLISH_NPM" == true ]]; then
            # Pack straight into release/ and discover the artifact by glob.
            # npm's stdout is NOT parseable: `npm pack` runs `prepack`, and that
            # script's output shares the fd (tsup's colourised banner is what
            # broke opencode-plugin-v0.2.0). The directory is ours and empty, so
            # exactly one .tgz can land in it.
            (cd "$DIRECTORY" && npm pack --pack-destination "$GITHUB_WORKSPACE/release")
            mapfile -t packed < <(find release -maxdepth 1 -type f -name '*.tgz')
            if [[ "${#packed[@]}" -ne 1 ]]; then
              echo "::error::expected exactly one packed tarball, found ${#packed[@]}: ${packed[*]-}"
              exit 1
            fi
            tarball="$(basename "${packed[0]}")"
          else
            tarball="phux-claude-plugin-${VERSION}.tar.gz"
            git archive --format=tar.gz --prefix="phux-claude-plugin-${VERSION}/" -o "release/$tarball" "${TAG}:${DIRECTORY}"
          fi
          (cd release && sha256sum "$tarball" > "${tarball}.sha256")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Verify exact packed npm artifact
        if: needs.prepare.outputs.publish_npm == 'true'
        env:
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          set -euo pipefail
          test_dir="$(mktemp -d)"
          cd "$test_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --package-lock=false "$GITHUB_WORKSPACE/release/$TARBALL"
          npm ls --depth=0 "${PACKAGE_NAME}@${VERSION}"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ needs.prepare.outputs.component }}-${{ needs.prepare.outputs.tag }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish validated component
    needs: [prepare, package]
    # npm trusted publishing rejects GitHub self-hosted runners. Blacksmith is
    # deliberately retained for the expensive gates above; only this small OIDC
    # exchange and publication job needs a GitHub-hosted runner.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      id-token: write
    # This job never checks out: it must publish exactly the bytes the package
    # job built, and nothing else. That leaves gh with no git remote to infer
    # the repository from, so name it explicitly — without this every
    # `gh release ...` call dies on "fatal: not a git repository".
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ needs.prepare.outputs.component }}-${{ needs.prepare.outputs.tag }}
          path: release

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify downloaded artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find release -maxdepth 1 -type f \( -name '*.tgz' -o -name '*.tar.gz' \))
          test "${#tarballs[@]}" -eq 1
          (cd release && sha256sum --check "$(basename "${tarballs[0]}").sha256")
          # Absolute, always. `npm publish release/foo.tgz` is read by npm as the
          # GitHub shorthand `owner/repo` — a relative path with a `/` and no
          # leading `./` is indistinguishable from one — and npm goes looking for
          # ssh://git@github.com/release/foo.tgz.git.
          echo "tarball=$(cd "$(dirname "${tarballs[0]}")" && pwd)/$(basename "${tarballs[0]}")" >> "$GITHUB_OUTPUT"

      # Proves repository resolution and release existence on the dry-run path
      # too, so a dispatch with dry_run=true actually exercises the gh wiring
      # instead of skipping straight past it.
      - name: Verify the draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release view "$TAG" --json tagName,isDraft --jq '"\(.tagName) draft=\(.isDraft)"'

      - name: Exercise npm publication
        if: needs.prepare.outputs.publish_npm == 'true' && needs.prepare.outputs.dry_run == 'true'
        env:
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: npm publish --dry-run "$TARBALL"

      - name: Publish exact npm artifact with provenance
        if: needs.prepare.outputs.publish_npm == 'true' && needs.prepare.outputs.dry_run == 'false'
        env:
          TARBALL: ${{ steps.artifact.outputs.tarball }}
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          npm install --global npm@11.5.1
          local_shasum="$(sha1sum "$TARBALL" | cut -d' ' -f1)"
          published_shasum="$(npm view "${PACKAGE_NAME}@${VERSION}" dist.shasum 2>/dev/null || true)"
          # An npm version is immutable, so a re-run against an already-published
          # version must not republish — it verifies the registry holds the same
          # bytes and moves on, which keeps the whole lane replayable.
          if [[ -n "$published_shasum" ]]; then
            if [[ "$published_shasum" != "$local_shasum" ]]; then
              echo "::error::${PACKAGE_NAME}@${VERSION} is already on npm with shasum ${published_shasum}, but this run packed ${local_shasum}. The registry version is immutable; cut a new version rather than trying to overwrite it."
              exit 1
            fi
            echo "${PACKAGE_NAME}@${VERSION} already published with matching shasum; nothing to do."
          else
            npm publish --provenance --access public "$TARBALL"
          fi

      - name: Attach assets and publish component release
        if: needs.prepare.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" release/* --clobber
          mapfile -t expected < <(find release -maxdepth 1 -type f -exec basename {} \; | sort)
          mapfile -t actual < <(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          gh release edit "$TAG" --draft=false
