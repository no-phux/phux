# Release Please owns tags, draft releases, and notes. This workflow owns only
# verified artifacts, draft publication, and the Homebrew update.
name: Release Cockpit

on:
  workflow_call:
    inputs:
      tag:
        description: Existing Release Please tag to build and publish
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        # A keyless local fallback may build and verify an unpublished draft.
        # Publication remains gated on this secret inside the job.
        required: false
      MACOS_CERTIFICATE:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      APPLE_NOTARY_KEY:
        required: false
      APPLE_NOTARY_KEY_ID:
        required: false
      APPLE_NOTARY_ISSUER_ID:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cockpit-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Keep packaging and publishing together so signing keys and signed artifacts
  # never need to cross a job boundary.
  macos:
    name: Package arm64 macOS release
    # Standard macos-26 is an arm64 GitHub-hosted runner and is free for this
    # public repository. Release signing does not require a larger paid runner.
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate release tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^cockpit-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          clients/cockpit/scripts/check-release-version.sh "$RELEASE_TAG"
          clients/cockpit/scripts/verify-phux-ffi.py --phux-tree "$GITHUB_WORKSPACE"

      - name: Require the Release Please release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Build the pinned Phux client FFI
        run: cargo build --locked --profile ffi-release -p phux-client-ffi

      - name: Configure Developer ID signing when available
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          supplied=0
          [[ -n "${MACOS_CERTIFICATE}" ]] && supplied=$((supplied + 1))
          [[ -n "${MACOS_CERTIFICATE_PASSWORD}" ]] && supplied=$((supplied + 1))
          [[ -n "${SIGNING_IDENTITY}" ]] && supplied=$((supplied + 1))
          if [[ "${supplied}" -eq 0 ]]; then
            echo "No Developer ID secrets configured; the release will be ad-hoc signed."
            exit 0
          fi
          if [[ "${supplied}" -ne 3 ]]; then
            echo "::error::Developer ID secrets are incomplete; configure all three or none."
            exit 1
          fi

          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/phux-cockpit-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "${MACOS_CERTIFICATE}" | base64 -D > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          {
            echo "MACOS_SIGNING_IDENTITY=${SIGNING_IDENTITY}"
            echo "SIGNING_KEYCHAIN=${keychain_path}"
          } >> "${GITHUB_ENV}"

      - name: Configure notarization when available
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          supplied=0
          [[ -n "${NOTARY_KEY}" ]] && supplied=$((supplied + 1))
          [[ -n "${NOTARY_KEY_ID}" ]] && supplied=$((supplied + 1))
          [[ -n "${NOTARY_ISSUER_ID}" ]] && supplied=$((supplied + 1))
          if [[ "${supplied}" -eq 0 ]]; then
            if [[ -n "${MACOS_SIGNING_IDENTITY:-}" ]]; then
              echo "::error::Hosted Developer ID releases require notarization credentials. Configure all APPLE_NOTARY_* secrets or remove all signing secrets."
              exit 1
            fi
            echo "No Developer ID or notarization secrets configured; the release will be ad-hoc signed."
            exit 0
          fi
          if [[ "${supplied}" -ne 3 ]]; then
            echo "::error::Notarization secrets are incomplete; configure all three or none."
            exit 1
          fi
          if [[ -z "${MACOS_SIGNING_IDENTITY:-}" ]]; then
            echo "::error::Notarization credentials require all three Developer ID signing secrets."
            exit 1
          fi

          key_path="${RUNNER_TEMP}/phux-cockpit-notary-key.p8"
          printf '%s' "${NOTARY_KEY}" | base64 -D > "${key_path}"
          {
            echo "APPLE_NOTARY_KEY_PATH=${key_path}"
            echo "APPLE_NOTARY_KEY_ID=${NOTARY_KEY_ID}"
            echo "APPLE_NOTARY_ISSUER_ID=${NOTARY_ISSUER_ID}"
          } >> "${GITHUB_ENV}"

      - name: Test
        working-directory: clients/cockpit
        run: |
          zig build test \
            -Dplatform=null \
            -Dphux-enabled=true \
            --summary all

      - name: Build, sign, verify, and package
        id: package
        env:
          PHUX_CLIENT_FFI_INCLUDE_DIR: ${{ github.workspace }}/crates/phux-client-ffi/include
          PHUX_CLIENT_FFI_LIB_DIR: ${{ github.workspace }}/target/ffi-release
        run: |
          set -euo pipefail
          export VERSION="${RELEASE_TAG#cockpit-v}"
          clients/cockpit/scripts/package-macos.sh

      - name: Soak packaged application lifecycle
        run: |
          clients/cockpit/scripts/soak-macos-app.sh \
            --app "clients/cockpit/zig-out/release/Phux Cockpit.app" \
            --cycles 10 \
            --artifacts clients/cockpit/zig-out/soak-release

      - name: Attach and verify release assets
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#cockpit-v}"
          archive="phux-cockpit-${version}-macos-arm64.zip"
          image="phux-cockpit-${version}-macos-arm64.dmg"
          expected_assets="$(printf '%s\n' SHA256SUMS "${archive}" "${image}" | LC_ALL=C sort)"
          existing_assets="$(gh release view "${RELEASE_TAG}" \
            --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          release_was_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
          uploaded_this_run=false

          if [[ "${release_was_draft}" == "true" ]]; then
            if [[ -z "${existing_assets}" ]]; then
              gh release upload "${RELEASE_TAG}" \
                "clients/cockpit/zig-out/release/${archive}" \
                "clients/cockpit/zig-out/release/${image}" \
                clients/cockpit/zig-out/release/SHA256SUMS
              uploaded_this_run=true
            elif [[ "${existing_assets}" != "${expected_assets}" ]]; then
              printf 'error: draft release %s has a partial or unexpected asset set; refusing to mutate it\n' "${RELEASE_TAG}" >&2
              printf 'expected:\n%s\nfound:\n%s\n' "${expected_assets}" "${existing_assets}" >&2
              exit 1
            fi
          elif [[ "${existing_assets}" != "${expected_assets}" ]]; then
            printf 'error: published release %s has a partial or unexpected asset set\n' "${RELEASE_TAG}" >&2
            printf 'expected:\n%s\nfound:\n%s\n' "${expected_assets}" "${existing_assets}" >&2
            exit 1
          fi

          published_assets="$(gh release view "${RELEASE_TAG}" \
            --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          if [[ "${published_assets}" != "${expected_assets}" ]]; then
            printf 'error: release asset upload did not produce the exact expected set\n' >&2
            exit 1
          fi

          existing="$(mktemp -d)"
          gh release download "${RELEASE_TAG}" \
            --dir "${existing}" \
            --pattern "${archive}" \
            --pattern "${image}" \
            --pattern SHA256SUMS
          if [[ "${uploaded_this_run}" == "true" ]]; then
            cmp "clients/cockpit/zig-out/release/${archive}" "${existing}/${archive}"
            cmp "clients/cockpit/zig-out/release/${image}" "${existing}/${image}"
            cmp clients/cockpit/zig-out/release/SHA256SUMS "${existing}/SHA256SUMS"
          fi
          (cd "${existing}" && shasum -a 256 -c SHA256SUMS)
          mkdir "${existing}/extracted"
          ditto -x -k "${existing}/${archive}" "${existing}/extracted"
          existing_app="${existing}/extracted/Phux Cockpit.app"
          if codesign -dv --verbose=4 "${existing_app}" 2>&1 | grep -q '^Signature=adhoc$'; then
            asset_signature=adhoc
            asset_notarized=false
          elif xcrun stapler validate "${existing_app}" >/dev/null 2>&1 && \
              spctl --assess --type execute "${existing_app}" >/dev/null 2>&1; then
            asset_signature=developer-id-notarized
            asset_notarized=true
          else
            printf 'error: release asset is Developer ID signed but not notarized\n' >&2
            exit 1
          fi
          clients/cockpit/scripts/verify-macos-app.sh \
            --app "${existing_app}" \
            --version "${version}" \
            --signature-mode "${asset_signature}" \
            --quarantine ignore
          hdiutil verify -quiet "${existing}/${image}"
          dmg_mount="${existing}/dmg-mount"
          dmg_attached=false
          cleanup_dmg() {
            if [[ "${dmg_attached}" == "true" ]]; then
              hdiutil detach -quiet "${dmg_mount}" || \
                hdiutil detach -quiet -force "${dmg_mount}" || true
            fi
          }
          trap cleanup_dmg EXIT
          mkdir "${dmg_mount}"
          hdiutil attach -quiet -readonly -nobrowse \
            -mountpoint "${dmg_mount}" "${existing}/${image}"
          dmg_attached=true
          clients/cockpit/scripts/verify-macos-app.sh \
            --app "${dmg_mount}/Phux Cockpit.app" \
            --version "${version}" \
            --signature-mode "${asset_signature}" \
            --quarantine ignore
          [[ -L "${dmg_mount}/Applications" ]]
          [[ "$(readlink "${dmg_mount}/Applications")" == "/Applications" ]]
          hdiutil detach -quiet "${dmg_mount}"
          dmg_attached=false
          trap - EXIT
          rm -f -- clients/cockpit/zig-out/release/*.zip clients/cockpit/zig-out/release/*.dmg clients/cockpit/zig-out/release/SHA256SUMS
          cp "${existing}/${archive}" "${existing}/${image}" "${existing}/SHA256SUMS" clients/cockpit/zig-out/release/
          {
            echo "notarized=${asset_notarized}"
            echo "signature=${asset_signature}"
            echo "draft=${release_was_draft}"
          } >> "${GITHUB_OUTPUT}"

      # A keyless replay reaches this gate only after the draft owns an exact,
      # re-downloaded, intrinsically verified asset set. Publication remains
      # after the tap's remote equality proof.
      - name: Require Homebrew tap deploy key before publication
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_KEY}" ]]; then
            echo "::error::KEYLESS_RELEASE_STOP: verified assets remain attached to draft ${RELEASE_TAG}; HOMEBREW_TAP_DEPLOY_KEY is required before publication and the Homebrew update."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: phall1/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Update Homebrew tap before publication
        env:
          NOTARIZED: ${{ steps.assets.outputs.notarized }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          [[ "$TAG" =~ ^cockpit-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          version="${BASH_REMATCH[1]}"
          archive="phux-cockpit-$version-macos-arm64.zip"
          expected="$(awk -v file="$archive" '$2 == file { print $1 }' clients/cockpit/zig-out/release/SHA256SUMS)"
          actual="$(shasum -a 256 "clients/cockpit/zig-out/release/$archive" | cut -d ' ' -f 1)"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          [[ "$actual" == "$expected" ]]
          cd tap
          bash .github/scripts/gen-phux-cockpit-cask.sh "$TAG" "$actual" "$NOTARIZED" Casks/phux-cockpit.rb
          ruby -c Casks/phux-cockpit.rb
          intended_cask_blob="$(git hash-object Casks/phux-cockpit.rb)"
          bash .github/scripts/commit-update.sh Casks/phux-cockpit.rb "Brew cask update for Phux Cockpit $TAG"
          git fetch origin main
          remote_cask_blob="$(git rev-parse origin/main:Casks/phux-cockpit.rb)"
          if [[ "${remote_cask_blob}" != "${intended_cask_blob}" ]]; then
            printf 'error: pushed Homebrew cask does not match origin/main; refusing to publish release\n' >&2
            exit 1
          fi

      - name: Record signing status and publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNATURE: ${{ steps.assets.outputs.signature }}
          WAS_DRAFT: ${{ steps.assets.outputs.draft }}
        run: |
          set -euo pipefail
          case "${SIGNATURE}" in
            developer-id-notarized)
              marker='This release is Developer ID signed and Apple-notarized.'
              note="${marker}"
              ;;
            adhoc)
              marker='This release is ad-hoc signed because Developer ID credentials are'
              note="${marker} not configured. The Homebrew cask clears the app's quarantine attribute and reports this in its installation caveat."
              ;;
            *)
              printf 'error: unsupported release signature status: %s\n' "${SIGNATURE}" >&2
              exit 1
              ;;
          esac

          notes="$(mktemp)"
          gh release view "${RELEASE_TAG}" --json body --jq '.body // ""' > "${notes}"
          if ! grep -Fq "${marker}" "${notes}"; then
            if grep -Eq 'This release is (Developer ID signed|ad-hoc signed)' "${notes}"; then
              printf 'error: release notes contain conflicting signing metadata\n' >&2
              exit 1
            fi
            separator=''
            if [[ -s "${notes}" ]]; then
              separator=$'\n'
            fi
            printf '%s%s\n' "${separator}" "${note}" >> "${notes}"
            gh release edit "${RELEASE_TAG}" --notes-file "${notes}"
          fi
          if [[ "${WAS_DRAFT}" == "true" ]]; then
            gh release edit "${RELEASE_TAG}" --draft=false
          fi

      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/phux-cockpit-signing.keychain-db" 2>/dev/null || true
          rm -f -- \
            "${RUNNER_TEMP}/developer-id.p12" \
            "${RUNNER_TEMP}/phux-cockpit-notary-key.p8"
