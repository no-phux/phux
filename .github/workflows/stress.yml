# phux stress lane — the heavy resize/output/lifecycle storm suite.
#
# Why this is NOT in ci.yml: these tests are CPU-starvation-sensitive. The
# server is a single current-thread runtime; on the 2-core GitHub runner the
# output-flood-vs-resize-reflow feedback loop turns a sub-second test into a
# multi-minute grind (a single resize-storm test measured ~0.3s on a
# multi-core box vs ~13 min on the 2-core runner — pure CPU starvation, not
# a code defect). Gating PRs on that is a ~25-min wall for no added safety
# signal a fast machine wouldn't already give. So the stress suite runs here
# instead: nightly (catch environment drift) and on-demand —
# `workflow_dispatch`, or by adding the `stress` label to a PR — never on
# every push. (It used to also run post-merge on every `main` push; that was
# the biggest Actions-minute sink for little signal, so it was dropped in
# favor of the nightly + opt-in lanes.)
#
# Build+run stay on one runner (matching ci.yml): libghostty-vt's build.rs
# lets zig auto-detect the host CPU, so an artifact built on one runner can
# SIGILL on another. The CPU-fingerprinted cache key keeps native artifacts
# pinned to matching hardware. Cachix persists the devshell, while `save-if`
# confines rust-cache writes to `main` — see ci.yml for the shared 10 GB
# GitHub cache rationale. Pull requests can read the public Cachix cache but
# cannot push because GitHub withholds repository secrets from forks.

name: stress

on:
  schedule:
    - cron: "0 7 * * *" # nightly 07:00 UTC
  workflow_dispatch:
  # Opt-in per-PR: add the `stress` label to run this lane against a risky
  # change. The job-level `if` below filters to that label so other labels
  # spin up no runner.
  pull_request:
    types: [labeled]

# Don't pile up: re-labeling a PR supersedes its in-flight stress run on the
# same ref. Never cancel a scheduled run (we want the nightly coverage).
concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  stress:
    name: stress
    # schedule + workflow_dispatch always run; a pull_request fires this lane
    # only when tagged with the `stress` label.
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'stress' }}
    # Matches ci.yml's check/test lanes: the homogeneous Cobalt 100 arm fleet
    # gives one stable CPU_KEY, so this lane's rust-cache entries share warmth
    # with what ci.yml saves on main pushes instead of scattering across the
    # mixed x64 fleet.
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Shared lane setup (disk headroom, CPU fingerprint, Nix + Cachix,
      # sccache, rust-cache): .github/actions/setup-rust-lane. This lane
      # builds the nextest test profile, so it shares ci.yml's `test`
      # rust-cache key — the nightly run reuses what main's CI saved instead
      # of maintaining a third copy.
      - uses: ./.github/actions/setup-rust-lane
        id: setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          rust-cache-shared-key: test
      # Timed + junit-instrumented like ci.yml's lanes (ADR-0082): the storms
      # are exactly where per-test wall times matter, since CPU starvation on
      # the 2-core runner is this suite's known failure mode.
      - name: stress suite
        run: |
          nix develop -c bash -euo pipefail <<'EOF'
          source scripts/ci/timed.sh
          timed stress env NEXTEST_PROFILE=ci just stress
          EOF
      - name: lane signal
        if: always()
        env:
          PHUX_CACHE_HIT: ${{ steps.setup.outputs.rust-cache-hit }}
          PHUX_JUNIT: target/nextest/ci/junit.xml
        run: bash scripts/ci/summarize-job.sh
