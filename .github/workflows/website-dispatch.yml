# website-dispatch — tell no-phux/website to rebuild phux.sh when the inputs
# it copies out of this repo change.
#
# The site, its Cloudflare workflows, and the demo worker live in
# no-phux/website. Docs, installers, and product skills stay here and are
# read at build time. GITHUB_TOKEN cannot write another repository, so this
# mints the same Release App token sync-skills.yml uses and sends
# repository_dispatch type phux-content with this commit's sha.
#
# Path-filtered so a token is minted only when those inputs change. The
# site's own Monday cron catches a missed dispatch and moves the release badge.

name: website-dispatch

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".agents/skills/using-phux/**"
      - ".agents/skills/using-phux-mcp/**"
      - ".agents/skills/using-phux-tools/**"
      - "scripts/product-skills"
      - "scripts/install.sh"
      - "scripts/install-desktop.sh"
      - ".github/workflows/website-dispatch.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mini-v1-website-dispatch-${{ github.sha }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: dispatch no-phux/website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: no-phux
          repositories: website

      - name: Dispatch phux-content
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/no-phux/website/dispatches \
            -f event_type=phux-content \
            -f "client_payload[sha]=${GITHUB_SHA}"
