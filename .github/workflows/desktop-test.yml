# Native desktop host lanes for clients/desktop/native, a GPUI crate that
# builds on macOS and Linux. It is its own Cargo workspace, so the root lanes never
# compile it; before this workflow a desktop regression reached main with
# nothing red (phux-piaf7). `macos` runs `just desktop-lint`,
# `just desktop-test` and the headless perf budget on that test build;
# `package` builds Phux.app and runs the packaged smoke against an isolated
# same-checkout server. Real-GPU qualification stays manual (docs/CI.md).
#
# The shared classifier routes it (desktop_needed): the crate's root path
# dependencies, the toolchain inputs, the root files it embeds, this file,
# and every unrouted clients/desktop path.
# Not part of the required `ci` aggregate, like web-check and native-setup.
# No build cache: a PR may not write one, and a main entry would compete with
# the release lanes for the 10 GB budget docs/CI.md describes.
name: desktop-test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests are latest-wins. main is one running and one pending run:
  # nothing gates on a per-SHA desktop-test, and keying main on the SHA queued
  # two hour-long xcode-27 jobs per merge, ~35 deep, in front of the release
  # lanes' own macOS builds. Nothing on main, push or dispatch, ever cancels
  # the running main run.
  group: mini-v1-desktop-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop_needed: ${{ steps.detect.outputs.desktop_needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/classify-changes

  macos:
    name: desktop lint and test (macOS arm64)
    needs: changes
    if: needs.changes.outputs.desktop_needed == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The contributor setup desktop-release.yml uses: rustup from the pin,
      # libghostty's Zig, and the Metal compiler GPUI's shaders need. This
      # block and the Bun steps below are copied in the macos and package
      # jobs and in desktop-release.yml; change all three together.
      - name: Contributor Rust, Zig and Metal setup
        run: |
          set -euo pipefail
          bash scripts/setup-rust.sh native
          bash scripts/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"
          brew install just
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
      - uses: ./.github/actions/setup-bun
      - name: Desktop lint
        run: just desktop-lint
      - name: Desktop tests
        run: just desktop-test
      # Same test build as above; scene/runtime counters are exact budgets,
      # times and RSS are loose ceilings (clients/desktop/scripts/perf-budget.ts).
      - name: Desktop headless perf budget
        run: just desktop-perf-budget "$RUNNER_TEMP/desktop-perf"
      - name: Retain headless perf samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-perf-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-perf
          if-no-files-found: warn
          retention-days: 14

  linux:
    name: desktop native and package (Linux ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.desktop_needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PHUX_DESKTOP_TARGET: ${{ matrix.target }}
      LIBGHOSTTY_VT_SYS_CPU: baseline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux-desktop
      - uses: ./.github/actions/setup-bun
      - name: Native desktop lint
        run: just desktop-lint
      - name: Native desktop tests under X11 and lavapipe
        run: xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session -- just desktop-test
      - name: Pinned Linux renderer and capture regressions
        run: just desktop-renderer-test
      - name: Build same-checkout CLI and Linux package
        run: |
          set -euo pipefail
          cargo build --locked -p phux
          just desktop-native-build
          bun clients/desktop/scripts/package-linux.ts
          mkdir -p "$RUNNER_TEMP/desktop-qualified"
          tar -xzf clients/desktop/dist/phux-desktop-*-linux-${{ matrix.arch }}.tar.gz -C "$RUNNER_TEMP/desktop-qualified"
      - name: Packaged X11 runtime qualification
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session --
          bun clients/desktop/scripts/smoke-linux.ts
          --app "$RUNNER_TEMP/desktop-qualified/phux-desktop"
          --phux target/debug/phux
          --require-backend Vulkan
          --output "$RUNNER_TEMP/desktop-evidence"
      - name: Retain packaged Linux runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-evidence
          if-no-files-found: warn
          retention-days: 14

  package:
    name: desktop package and smoke (macOS arm64)
    needs: changes
    if: needs.changes.outputs.desktop_needed == 'true'
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The contributor setup desktop-release.yml uses: rustup from the pin,
      # libghostty's Zig, and the Metal compiler GPUI's shaders need. This
      # block and the Bun steps below are copied in the macos and package
      # jobs and in desktop-release.yml; change all three together.
      - name: Contributor Rust, Zig and Metal setup
        run: |
          set -euo pipefail
          bash scripts/setup-rust.sh native
          bash scripts/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"
          brew install just
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
      - uses: ./.github/actions/setup-bun
      - name: Build the same-checkout CLI and Phux.app
        run: |
          set -euo pipefail
          cargo build --locked -p phux
          just desktop-package
      # Hosted runners have only a virtual display, which never confirms a
      # presented drawable; the evidence records `submitted` instead.
      - name: Packaged app smoke
        run: >-
          bun clients/desktop/scripts/smoke-app.ts
          --app clients/desktop/dist/app/Phux.app
          --phux target/debug/phux
          --output "$RUNNER_TEMP/desktop-evidence"
          --allow-unconfirmed-present
      - name: Retain packaged runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-evidence
          if-no-files-found: warn
          retention-days: 14
