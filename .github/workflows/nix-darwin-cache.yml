# Pushes the Darwin build of the flake's libghostty-vt package to Cachix.
#
# The Linux Rust lanes realize the devshell, so Cachix gets the Linux archive
# from them (.github/actions/setup-rust-lane). No macOS job enters the
# devshell, so without this workflow every Mac pays the Zig build once per
# flake.lock. The package is the only flake-built derivation the macOS shell
# compiles; the rest of the shell substitutes from cache.nixos.org or is a
# fixed-output download.
#
# It runs only when an input of that package moves: the flake (the Ghostty pin
# and nixpkgs), the Zig pins, and the optimize mode in .cargo/config.toml.
# Pull requests from this repository push too, so a bump is cached before it
# lands. A run on a warm cache takes about a minute of xcode-27 time; a miss
# adds the build, about a minute on Apple silicon.
name: nix-darwin-cache

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .config/zig-toolchain.json
      - .cargo/config.toml
      - .github/workflows/nix-darwin-cache.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - .config/zig-toolchain.json
      - .cargo/config.toml
      - .github/workflows/nix-darwin-cache.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mini-v1-nix-darwin-cache-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  libghostty-vt:
    name: libghostty-vt (aarch64-darwin)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # Fork pull requests get no secret; cachix-action then only substitutes.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: phux
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: '(-source$|nixpkgs\.tar\.gz$)'
      - name: build libghostty-vt
        run: nix build -L .#libghostty-vt
      - name: archive flavor
        run: |
          set -euo pipefail
          test -f result/lib/libghostty-vt.a
          nix path-info -rSh ./result
          otool -l result/lib/libghostty-vt.a | awk '/minos/ { print "minos", $2 }' | sort -u
