name: Rune client

# The alpha desktop client on Rune (clients/rune). It has its own Cargo
# workspace, so the main CI lanes never build it; this lane does, for its
# own changes and for the client crates it depends on. A `rune-vVERSION`
# tag also packages it and publishes a GitHub prerelease.
on:
  pull_request:
    paths:
      - .github/workflows/rune-client.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/config.toml
      - clients/rune/**
      - clients/desktop/packaging/AppIcon.png
      - crates/quictun/**
      - crates/phux-client-runtime/**
      - crates/phux-client-core/**
      - crates/phux-config-core/**
      - crates/phux-core/**
      - crates/phux-dial/**
      - crates/phux-perf/**
      - crates/phux-protocol/**
  push:
    branches: [main]
    paths:
      - .github/workflows/rune-client.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/config.toml
      - clients/rune/**
      - clients/desktop/packaging/AppIcon.png
      - crates/quictun/**
      - crates/phux-client-runtime/**
      - crates/phux-client-core/**
      - crates/phux-config-core/**
      - crates/phux-core/**
      - crates/phux-dial/**
      - crates/phux-perf/**
      - crates/phux-protocol/**
    tags: ["rune-v*"]

permissions:
  contents: read

concurrency:
  group: rune-client-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            name: macos-arm64
          - os: ubuntu-24.04
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config mold libxkbcommon-dev libwayland-dev
      - name: Toolchains
        run: |
          bash scripts/setup-rust.sh core
          bash scripts/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"
      - name: Format
        working-directory: clients/rune
        run: cargo fmt --check
      - name: Clippy
        working-directory: clients/rune
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: clients/rune
        run: cargo test --locked
      - name: Require Apple signing configuration before building
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/rune-v')
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash scripts/ci/sign-macos-desktop.sh --check-config
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/rune-v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' clients/rune/Cargo.toml | head -1)"
          [[ "rune-v$version" == "$TAG" ]] || { echo "Cargo.toml is $version, tag is $TAG" >&2; exit 1; }
      - name: Package
        env:
          REF: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' clients/rune/Cargo.toml | head -1)"
          bash clients/rune/scripts/package.sh "$version" "$RUNNER_TEMP/dist" "$RUNNER_TEMP/app"
      # Releases ship the app the way the GPUI desktop does: Developer ID
      # signed with the hardened runtime, notarized and stapled, so it opens
      # from Finder without a Gatekeeper override.
      - name: Sign, notarize and staple the macOS app
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/rune-v')
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' clients/rune/Cargo.toml | head -1)"
          archive="phux-rune-$version-macos-arm64.zip"
          rm "$RUNNER_TEMP/dist/$archive" "$RUNNER_TEMP/dist/$archive.sha256"
          bash scripts/ci/sign-macos-desktop.sh --zip-only "$RUNNER_TEMP/app/Phux Rune.app" "$RUNNER_TEMP/signed/$archive"
          mv "$RUNNER_TEMP/signed/$archive" "$RUNNER_TEMP/dist/$archive"
          cd "$RUNNER_TEMP/dist"
          shasum -a 256 "$archive" > "$archive.sha256"
          # What a download gets: the stapled ticket, and Gatekeeper's yes.
          mkdir "$RUNNER_TEMP/verify"
          ditto -x -k "$archive" "$RUNNER_TEMP/verify"
          xcrun stapler validate "$RUNNER_TEMP/verify/Phux Rune.app"
          spctl --assess --type execute --verbose=2 "$RUNNER_TEMP/verify/Phux Rune.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rune-${{ matrix.name }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish prerelease
    if: startsWith(github.ref, 'refs/tags/rune-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rune-*
          path: dist
          merge-multiple: true
      # Minisign stays off the build hosts, as in desktop-release.yml. The
      # updater refuses a checksum no release key signed.
      - name: Sign the checksums
        env:
          PHUX_MINISIGN_SECRET_KEY: ${{ secrets.PHUX_MINISIGN_SECRET_KEY }}
        run: bash scripts/ci/sign-release.sh dist/*.sha256
      - name: Build the update feed
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 clients/rune/scripts/feed.py "${TAG#rune-v}" "$GITHUB_SHA" dist \
            crates/phux-protocol/src/lib.rs > "$RUNNER_TEMP/rune.json"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A prerelease, never "latest": installers and the release tooling
          # resolve the CLI and the GPUI desktop from their own tags.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --prerelease --latest=false --verify-tag \
              --title "Phux Rune ${TAG#rune-v} (alpha)" \
              --notes-file clients/rune/RELEASE_NOTES.md
          fi
      # Last, so no client hears of a release before its assets exist.
      - name: Point the update feed at this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Rerunning an old tag must not move the feed backwards.
          newest="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
            --jq '.[].tagName | select(startswith("rune-v"))' | sort -V | tail -1)"
          [[ "$newest" == "$TAG" ]] || { echo "$newest is newer; feed unchanged"; exit 0; }
          gh release upload channels "$RUNNER_TEMP/rune.json" --clobber --repo "$GITHUB_REPOSITORY"
