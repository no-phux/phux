name: Rune client

# A `rune-vVERSION` tag publishes the Rune client (clients/rune): a tag clients
# can read, on a commit main already proved, builds in rune-build.yml and
# becomes a GitHub release. Pull requests and main reach the same build as
# ci.yml's `rune` lane, so the required check never waits on a path filter.
on:
  push:
    tags: ["rune-v*"]

permissions:
  contents: read

concurrency:
  group: rune-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: tag preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: The tag, Cargo.toml and the release notes agree
        env:
          TAG: ${{ github.ref_name }}
        run: python3 clients/rune/scripts/feed.py preflight "$TAG" clients/rune/Cargo.toml clients/rune/RELEASE_NOTES.md
      # Tag after ci finishes on main; rerun this job if it was still going.
      - name: The commit is on main with a green ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tools/main.ts ci-green "$GITHUB_SHA"

  build:
    needs: preflight
    uses: ./.github/workflows/rune-build.yml
    secrets:
      APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
      APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
      APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

  release:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rune-*
          path: dist
          merge-multiple: true
      # Minisign stays off the build hosts, as in desktop-release.yml. The
      # updater refuses a checksum no release key signed.
      - name: Sign the checksums
        env:
          PHUX_MINISIGN_SECRET_KEY: ${{ secrets.PHUX_MINISIGN_SECRET_KEY }}
        run: bash scripts/ci/sign-release.sh dist/*.sha256
      - name: Build the update feed
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 clients/rune/scripts/feed.py build "${TAG#rune-v}" "$GITHUB_SHA" dist \
            crates/phux-protocol/src/lib.rs > "$RUNNER_TEMP/rune.json"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Never "latest", even at 0.1.0: installers and the release tooling
          # resolve the CLI and the GPUI desktop from their own tags.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            mapfile -t flags < <(python3 clients/rune/scripts/feed.py release-flags "${TAG#rune-v}")
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              "${flags[@]}" --latest=false --verify-tag \
              --notes-file clients/rune/RELEASE_NOTES.md
          fi
      # Last, so no client hears of a release before its assets exist.
      - name: Point the update feed at this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Rerunning an old tag must not move the feed backwards. feed.py
          # orders as clients do, and fails on a tag they couldn't read.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --exclude-drafts \
            --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/tags"
          newest="$(python3 clients/rune/scripts/feed.py newest < "$RUNNER_TEMP/tags")"
          [[ "$newest" == "$TAG" ]] || { echo "$newest is newer; feed unchanged"; exit 0; }
          gh release upload channels "$RUNNER_TEMP/rune.json" --clobber --repo "$GITHUB_REPOSITORY"
