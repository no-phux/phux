name: scoped-mutation

# Advisory scans are intentionally separate from required PR test gates.
# Survivors are findings; baseline/tool failures still fail this workflow.
on:
  workflow_dispatch:
    inputs:
      language:
        description: Mutation pilot to run
        type: choice
        default: both
        options: [both, zig, rust]
  schedule:
    - cron: '23 5 1 * *'

permissions:
  contents: read

concurrency:
  group: scoped-mutation-${{ github.ref }}-${{ inputs.language || 'both' }}
  cancel-in-progress: true

jobs:
  zig:
    if: github.event_name == 'schedule' || inputs.language != 'rust'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Pinned Zig
        run: bash scripts/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"
      - name: Runner outcome and cleanup contracts
        env:
          PHUX_ZIG_MUTATION_INTEGRATION: '1'
        run: python3 -B -m unittest discover -s scripts/mutation -p test_zig.py -v
      - name: Bounded real-module pilot
        run: bash scripts/mutation/zig.sh --out target/mutation/zig
      - name: Mutation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zig-mutation-${{ github.run_attempt }}
          path: target/mutation/zig*/
          if-no-files-found: warn
          retention-days: 14

  rust:
    if: github.event_name == 'schedule' || inputs.language != 'zig'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Platform packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config mold
      - name: Pinned project Rust
        run: bash scripts/setup-rust.sh core
      - name: Pinned cargo-mutants
        run: |
          version="$(python3 -c 'import runpy; print(runpy.run_path("scripts/mutation/rust_runner.py")["VERSION"])')"
          cargo install cargo-mutants --version "$version" --locked --jobs 2 \
            --root "target/mutation-tools/cargo-mutants-$version"
      - name: Runner outcome and cleanup contracts
        run: python3 scripts/mutation/rust_check.py
      - name: Bounded pure-Rust pilot
        run: bash scripts/mutation/rust.sh --output target/mutation/rust
      - name: Mutation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-mutation-${{ github.run_attempt }}
          path: target/mutation/rust*/
          if-no-files-found: warn
          retention-days: 14
