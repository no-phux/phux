name: scoped-mutation

# Advisory scans are intentionally separate from required PR test gates.
# Survivors are findings; baseline/tool failures still fail this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mini-v1-scoped-mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Platform packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config mold
      - name: Pinned project Rust
        run: bash scripts/setup-rust.sh core
      - name: Pinned cargo-mutants
        run: |
          version="$(sed -n 's/^export const CARGO_MUTANTS_VERSION = "\(.*\)";$/\1/p' tools/src/mutation/pin.ts)"
          test -n "$version"
          cargo install cargo-mutants --version "$version" --locked --jobs 2 \
            --root "target/mutation-tools/cargo-mutants-$version"
      - name: Runner outcome and cleanup contracts
        run: bun tools/main.ts mutation-check
      - name: Bounded pure-Rust pilot
        run: bun tools/main.ts mutation-run --output target/mutation/rust
      - name: Mutation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-mutation-${{ github.run_attempt }}
          path: target/mutation/rust*/
          if-no-files-found: warn
          retention-days: 14
