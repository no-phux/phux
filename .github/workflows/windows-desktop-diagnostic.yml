# Iterate the GUI harness against immutable retained build bytes without a
# second MSVC build. This workflow cannot upload qualified products or publish.
name: Windows Desktop Diagnostic
on:
  workflow_call:
    inputs:
      build-run:
        required: true
        type: string
      build-sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      build-run:
        description: Same-repository Actions run containing both native package and WSL server
        required: true
        type: string
      build-sha:
        description: Exact 40-hex product revision from that run (not this harness revision)
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PHUX_WSL_DISTRO: Ubuntu-24.04
      PHUX_DIAGNOSTIC: 'true'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build-run }}
          name: desktop-build-windows-x64
          path: windows-package
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build-run }}
          name: windows-desktop-wsl-server
          path: wsl-server
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          wsl-shell-user: phux-ci
          additional-packages: ca-certificates minisign python3
          use-cache: 'false'
      - name: Set disposable default user and install OCR
        shell: pwsh
        run: |
          wsl.exe --distribution Ubuntu-24.04 --user root --exec sh -c "printf '[user]\ndefault=phux-ci\n' >> /etc/wsl.conf"
          if ($LASTEXITCODE -ne 0) { throw 'WSL user configuration failed' }
          wsl.exe --terminate Ubuntu-24.04
          choco install tesseract --version=5.5.3.20260724 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'OCR installation failed' }
      - name: Diagnose retained native package; never release eligibility
        shell: pwsh
        env:
          BUILD_SHA: ${{ inputs.build-sha }}
        run: |
          $archive = (Get-ChildItem windows-package/phux-desktop-*-windows-x64.zip).FullName
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File clients/desktop/scripts/smoke-windows.ps1 -Archive $archive -ServerBinary "$env:GITHUB_WORKSPACE/wsl-server/phux" -Output "$env:RUNNER_TEMP/desktop-evidence" -DiagnosticBuildSha $env:BUILD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Native GUI diagnostic failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-diagnostic-windows-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-evidence
          if-no-files-found: warn
          retention-days: 7
