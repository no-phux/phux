# release-please — versions, tags, and draft release notes. Nothing else.
#
# Every push to main, release-please maintains the release PR. Merging that
# PR creates the component tags and private draft GitHub releases. publish.yml
# ships them after ci.yml is green for that exact commit. This file does not
# build, wait, or publish.
#
# App token, not GITHUB_TOKEN. main requires the ci check. Events raised by
# GITHUB_TOKEN do not trigger workflows, so a release PR opened with
# GITHUB_TOKEN never gets ci and cannot merge. The same applies to the
# lockfile commit pushed onto that PR. Both authenticate as the release App.
#
# release-please force-pushes the release branch and drops the lockfile commit
# sync-lockfile added. main does not require checks on the latest push, so that
# unsynced head is mergeable until sync runs — #1105 merged in that window and
# left integration drafts that publish will not ship, because ci failed on the
# unsynced commit. Hold a ready PR as draft in this job, before it exits, and
# let sync mark it ready only after the lockfile push lands.
#
# Do not set last-release-sha. It is a bootstrap pin release-please never
# ignores, so the changelog grows from that commit forever.
#
# Do not set package-name on the root package. include-component-in-tag is
# false, but package-name still feeds the branch component. A root-only
# release PR then aborts with no tag (v0.19.0). The manifest and tags are
# the record of what shipped.
#
# crates.io is not wired here. phux-protocol publishes only through
# publish-crate.yml.

name: release-please

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: mini-v1-release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release PR / github release
    runs-on: ubuntu-24.04
    outputs:
      # A candidate with no code changes comes back as PR number 0; see the
      # filter step. Anything downstream needs only real, existing PRs.
      prs_created: ${{ steps.prs.outputs.created }}
      # `pr` contains only the first PR. Desktop releases can be separate,
      # so synchronize every returned branch, including the root release PR.
      prs: ${{ steps.prs.outputs.prs }}
      # Ready PRs returned to draft until sync-lockfile pushes. Empty when
      # nothing was updated, or the hold step did not run.
      held_prs: ${{ steps.hold.outputs.held_prs || '[]' }}
    steps:
      # Fail closed and loudly if the App is not configured, rather than falling
      # back to GITHUB_TOKEN and silently opening an unmergeable release PR.
      - name: Require the release App
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APP_ID}" ] || [ -z "${APP_KEY}" ]; then
            echo "::error::RELEASE_APP_ID (variable) and RELEASE_APP_PRIVATE_KEY (secret) must be set. See this workflow's header comment. GITHUB_TOKEN cannot be used: main's ruleset requires ci, and GITHUB_TOKEN-raised events do not trigger workflows, so the release PR would be unmergeable."
            exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          # v3 deprecated `app-id` in favor of `client-id`. The JWT issuer claim
          # accepts the numeric App ID and the Iv1-style Client ID alike, so the
          # existing RELEASE_APP_ID variable works unchanged.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please returns a synthetic PR number 0 when a candidate has no
      # code changes — a hidden-only commit, for one. It has no branch to check
      # out and no PR to undraft, and it made the hold step's `gh pr view 0`
      # fail the whole run. Drop it before the hold and the sync matrix see it.
      - name: Drop change-less candidate PRs
        id: prs
        env:
          PRS: ${{ steps.rp.outputs.prs }}
        run: |
          set -euo pipefail
          filtered="$(printf '%s' "${PRS:-[]}" | jq -c '[.[] | select(.number > 0)]')"
          echo "prs=$filtered" >> "$GITHUB_OUTPUT"
          if [ "$filtered" = "[]" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      # Same job as the force-push, before this job exits. A later job is too
      # late: the unsynced head is mergeable for as long as a runner takes to
      # start, and main's ruleset accepts the previous head's green ci.
      - name: Hold ready release PRs until lockfiles sync
        id: hold
        if: steps.prs.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PRS: ${{ steps.prs.outputs.prs }}
        run: |
          set -euo pipefail
          held='[]'
          if [ -n "${PRS:-}" ] && [ "$PRS" != "null" ] && [ "$PRS" != "[]" ]; then
            held_nums=()
            numbers="$(printf '%s' "$PRS" | jq -er '.[].number')"
            while IFS= read -r num; do
              [ -n "$num" ] || continue
              meta="$(gh pr view "$num" --repo "$GITHUB_REPOSITORY" --json state,isDraft --jq '[.state,(.isDraft|tostring)] | @tsv')"
              state="${meta%%$'\t'*}"
              draft="${meta#*$'\t'}"
              if [ "$state" = "OPEN" ] && [ "$draft" = "false" ]; then
                gh pr ready "$num" --repo "$GITHUB_REPOSITORY" --undo
                held_nums+=("$num")
                echo "held #$num as draft until lockfile sync finishes"
              fi
            done <<< "$numbers"
            if [ "${#held_nums[@]}" -gt 0 ]; then
              held="$(printf '%s\n' "${held_nums[@]}" | jq -R 'tonumber' | jq -s -c .)"
            fi
          fi
          echo "held_prs=$held" >> "$GITHUB_OUTPUT"

      # `force-tag-creation: true` makes release-please create refs immediately
      # for draft releases. Do not recreate that behavior here: one owner keeps
      # root, Desktop, and integration component tags on the same code path.

  sync-lockfile:
    name: sync release inputs (${{ matrix.pr.headBranchName }})
    needs: release-please
    # Keep going when the release PR was opened and the job then failed.
    # The lockfile sync is what makes that PR mergeable.
    if: always() && needs.release-please.outputs.prs_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.release-please.outputs.prs) }}
    runs-on: ubuntu-24.04
    # release-please cannot update Cargo.lock, and this is not a config mistake:
    #
    #   * Its `rust` strategy is unusable here (see the header of release.yml),
    #     so we drive the root Cargo.toml with a generic TOML jsonpath updater.
    #   * Its TOML updater resolves a jsonpath against a parse tree in which
    #     every scalar is a {start,end,value} tagged object. A filter such as
    #     `$.package[?(@.name=='phux-protocol')].version` therefore compares an
    #     object to a string, matches nothing, and SILENTLY no-ops. There is no
    #     jsonpath that can select the 11 workspace members out of Cargo.lock's
    #     [[package]] array by name.
    #   * Comment annotations (`# x-release-please-version`) are not durable in
    #     Cargo.lock either: cargo rewrites the file and drops them.
    #
    # So cargo itself re-resolves the lock. `cargo update --workspace` touches
    # only the workspace members' own entries and leaves every external pin
    # alone. It resolves metadata only — no build, so no zig/libghostty needed.
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          # v3 deprecated `app-id` in favor of `client-id`. The JWT issuer claim
          # accepts the numeric App ID and the Iv1-style Client ID alike, so the
          # existing RELEASE_APP_ID variable works unchanged.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.pr.headBranchName }}
          fetch-depth: 0
          # MUST be the App token, not GITHUB_TOKEN. This job pushes a commit that
          # becomes the release PR's new head; with GITHUB_TOKEN that push raises
          # no `pull_request: synchronize` event, so ci.yml never runs against the
          # new head SHA, and `check`/`test` never report on it for the ordinary
          # merge path. The App's push DOES trigger ci.yml — exactly what we want.
          # This cannot recurse
          # into release-please.yml: that is `on: push: branches: [main]`, and this
          # pushes to the release PR branch.
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Detect a root workspace release
        id: root-release
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          base="$(git merge-base HEAD origin/main)"
          if git diff --quiet "$base" HEAD -- Cargo.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.root-release.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # rust-toolchain.toml is the single source of truth for the
          # toolchain version — never hardcode a release here.
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal

      - name: Re-resolve workspace member versions
        if: steps.root-release.outputs.changed == 'true'
        run: |
          cargo update --workspace
          # The standalone browser lock also records the root path crates'
          # versions; its locked CI must advance those in the same release PR.
          (cd clients/phux-web && cargo update --workspace)
          # The desktop host lock records them too, but its pinned GPUI snapshot
          # is parent-managed and not present here, so cargo cannot resolve it.
          python3 scripts/sync-path-lock-versions.py Cargo.lock clients/desktop/native/Cargo.lock docs/site/edge/Cargo.lock

      - name: Commit Cargo.lock
        shell: bash
        env:
          PR_BRANCH: ${{ matrix.pr.headBranchName }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock clients/phux-web/Cargo.lock clients/desktop/native/Cargo.lock docs/site/edge/Cargo.lock; then
            echo "Cargo lockfiles already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock clients/phux-web/Cargo.lock clients/desktop/native/Cargo.lock docs/site/edge/Cargo.lock
          git commit -m "chore: sync Cargo lockfiles with the release version"
          git push origin "HEAD:${PR_BRANCH}"

      # The archive must already exist on GitHub, and its Cargo.lock must be
      # synchronized before hashing it. Pin this source commit, then commit
      # the pin separately; a commit cannot embed its own immutable SHA.
      - name: Synchronize native demo source pin
        if: steps.root-release.outputs.changed == 'true'
        env:
          PR_BRANCH: ${{ matrix.pr.headBranchName }}
        run: |
          set -euo pipefail
          python3 scripts/ci/site_source_pin.py --revision HEAD
          python3 scripts/ci/site_source_pin.py --check
          if git diff --quiet -- docs/site/worker/Dockerfile; then
            echo "Native demo source pin already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/site/worker/Dockerfile
          git commit -m "chore: sync native demo source with the release version"
          git push origin "HEAD:${PR_BRANCH}"

      # After every push this job makes. Restoring earlier lets a non-strict
      # ruleset merge the lockfile commit before the source pin lands.
      - name: Release the merge hold
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HELD_PRS: ${{ needs.release-please.outputs.held_prs || '[]' }}
          PR_NUMBER: ${{ matrix.pr.number }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$HELD_PRS" | jq -e --argjson n "$PR_NUMBER" 'index($n) != null' >/dev/null; then
            echo "#$PR_NUMBER was not held"
            exit 0
          fi
          meta="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,isDraft --jq '[.state,(.isDraft|tostring)] | @tsv')"
          state="${meta%%$'\t'*}"
          draft="${meta#*$'\t'}"
          if [ "$state" != "OPEN" ]; then
            echo "#$PR_NUMBER is $state; leaving it alone"
            exit 0
          fi
          if [ "$draft" = "true" ]; then
            gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
            echo "restored #$PR_NUMBER to ready for review"
          fi

  # A release PR lands itself, always as ONE squash commit — never a rebase or
  # merge commit. Runs after sync-lockfile, so the head is final and the hold
  # (if any) is lifted. It discovers open release PRs by branch rather than by
  # the action's `prs` output, because release-please returns nothing for an
  # unchanged PR: a carried-over PR must still be undrafted and armed. It also
  # undrafts the PR, because release-please creates it as a draft
  # (`draft-pull-request`); the lockfile is synced by now, so that is safe, and
  # undrafting runs `ci`, which auto-merge then waits for. A PR whose checks are
  # already green merges immediately. release-please finds the merged PR by
  # label and branch, so the squash commit is what it tags.
  auto-merge:
    name: squash auto-merge release PRs
    needs: [release-please, sync-lockfile]
    # Sync can be skipped (no PR was created or updated) or can fail. Never
    # undraft onto an unsynced head: only run when sync succeeded or was not
    # needed.
    if: >-
      always()
      && needs.release-please.result == 'success'
      && (needs.sync-lockfile.result == 'success' || needs.sync-lockfile.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          # See release-please.yml's header: never fall back to GITHUB_TOKEN.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Undraft and enable squash auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          numbers="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--")) | .number')"
          if [ -z "$numbers" ]; then
            echo "no open release PRs"
            exit 0
          fi
          while IFS= read -r num; do
            [ -n "$num" ] || continue
            meta="$(gh pr view "$num" --repo "$GITHUB_REPOSITORY" --json state,isDraft --jq '[.state,(.isDraft|tostring)] | @tsv')"
            state="${meta%%$'\t'*}"
            draft="${meta#*$'\t'}"
            if [ "$state" != "OPEN" ]; then
              echo "#$num is $state; nothing to auto-merge"
              continue
            fi
            if [ "$draft" = "true" ]; then
              # Safe here: sync-lockfile already finished or was not needed.
              echo "#$num is a draft; marking it ready for review"
              gh pr ready "$num" --repo "$GITHUB_REPOSITORY"
            fi
            # `--auto` is refused on an already-clean PR; fall back to merging
            # the finished release in that case.
            gh pr merge "$num" --repo "$GITHUB_REPOSITORY" --squash --auto \
              || gh pr merge "$num" --repo "$GITHUB_REPOSITORY" --squash
          done <<< "$numbers"
