# release-please — the single entry point for cutting a phux release.
#
# Flow:
#   1. Every push to main, release-please reads the conventional-commit log
#      since the last release and maintains an open "release PR" that bumps
#      [workspace.package] version in the root Cargo.toml and regenerates
#      CHANGELOG.md.
#   2. `sync-lockfile` re-resolves Cargo.lock on that PR branch. release-please
#      CANNOT do this itself — see the comment on that job.
#   3. When a human merges the release PR, release-please pushes the `vX.Y.Z`
#      tag and creates a DRAFT GitHub Release, with the changelog as its body.
#   4. `release-artifacts` calls release.yml (a reusable workflow) to build all
#      binaries, attach them, refresh Homebrew, and only then publish the draft.
#
# Ownership boundary (do not blur this):
#   * release-please owns the TAG and creates the RELEASE + body/notes as draft.
#   * release.yml owns ASSETS and the one-way draft -> published transition. It
#     never rewrites the body, so the two cannot fight over the release notes.
#
# Why release-artifacts is a workflow_call and not a `push: tags` /
# `release: published` trigger on release.yml: GitHub does not fire
# workflow-triggering events for refs/releases created by GITHUB_TOKEN, so a
# `push: tags: v*` or `release: published` trigger could never fire. Calling
# release.yml as a reusable workflow in this same run sidesteps that.
#
# WHY AN APP TOKEN AND NOT GITHUB_TOKEN (this is load-bearing — do not "simplify"
# it back):
#   `main` carries an active ruleset requiring ci.yml's aggregate `ci` status
#   contexts for the ordinary merge path. Those contexts are produced only by
#   ci.yml's `pull_request` trigger. GitHub suppresses workflow runs for events
#   raised by GITHUB_TOKEN — so a release PR opened with GITHUB_TOKEN would get
#   no CI run and require an administrator bypass. The same applies to the
#   sync-lockfile push: it moves the PR head to a SHA with no check runs. Both
#   jobs therefore authenticate as a GitHub App, whose events trigger workflows
#   normally instead of making every release depend on bypass.
#
# ONE-TIME SETUP (without it, this workflow fails closed at the token step):
#   1. Create a GitHub App with repo permissions `contents: write` +
#      `pull requests: write`, and INSTALL IT ON THE ORG THAT OWNS THIS REPO
#      (`no-phux`), granting it access to `no-phux/phux`.
#   2. Repo secret  RELEASE_APP_PRIVATE_KEY = the App's generated .pem
#      Repo variable RELEASE_APP_ID          = the App's numeric App ID
#
# AN APP INSTALLATION DOES NOT SURVIVE A REPO TRANSFER. This repo moved from
# the phall1 user account to the no-phux org, and the App stayed installed on
# the account it was installed on, which no longer owns anything here. Every
# push to main then failed at the token step with:
#
#     Failed to create token for "no-phux/phux": Not Found
#     https://api.github.com/repos/no-phux/phux/installation
#
# That error means the App credentials are FINE — create-github-app-token
# authenticates with the private key first and only then looks up the
# installation, so reaching a 404 there proves the key and App ID are valid
# and only the installation is missing. Do not regenerate the key; install the
# App on the owning org. `gh api /orgs/<org>/installations` lists what is
# actually installed, which is the fastest way to confirm.
#
# While this is broken there is no release PR at all, and a release has to be
# cut by hand (bump + changelog + tag + draft release + dispatch release.yml),
# which is how v0.23.3 shipped.
#
# DO NOT REINTRODUCE `last-release-sha` (this is the bug that produced #419):
#   It is a BOOTSTRAP-ONLY setting. Upstream is explicit that it "is never
#   ignored — you must remove/change it once a good release PR is merged", so a
#   pinned value does not decay into a floor: release-please keeps starting its
#   commit search there forever, in preference to the tags. Ours was pinned to
#   040fea1a (v0.1.0) and stayed there for 242 commits, so the release PR
#   eventually proposed a 0.15.0 whose changelog re-listed the entire project
#   history — every feature already shipped in 0.9.0 through 0.14.1, plus
#   BREAKING CHANGES that shipped months earlier. Merging that would have
#   duplicated most of CHANGELOG.md and bumped the minor on the strength of
#   long-released commits.
#
#   The manifest (.release-please-manifest.json) plus component tags are the
#   real source of truth for "where the last release was". Cockpit's temporary
#   top-level `bootstrap-sha` was removed after the first canonical
#   `cockpit-v0.16.2` release; do not reintroduce it. If a later release PR
#   proposes commits that are already in a changelog, look here first.
#
# DO NOT REINTRODUCE `package-name` ON THE ROOT PACKAGE (this is the bug that
# silently skipped v0.19.0):
#   `release-please-config.json` sets `"include-component-in-tag": false` for
#   `"."`, so the root's component is empty everywhere the TAG and the PR BODY
#   are concerned. But `package-name` is a second, independent source for the
#   component: BaseStrategy computes `component = options.component ||
#   normalizeComponent(packageName)`, and `getBranchComponent()` — unlike
#   `getComponent()` — does NOT honour `include-component-in-tag`. With
#   `"package-name": "phux"` the branch component was therefore "phux" while the
#   PR branch is plainly `release-please--branches--main`, component undefined.
#
#   That mismatch only bites on the single-section path. `buildRelease()` treats
#   a merged release PR whose body has exactly ONE component-less release
#   section as a "standalone release PR" and requires branch component ==
#   configured component; it bails with "PR component: undefined does not match
#   configured component: phux" and creates NO release. When two or more
#   sections are present it takes the multi-component path instead, which
#   matches on `getComponent()` (empty) and works fine.
#
#   So the release only ever worked by accident: every cycle up to v0.18.0
#   happened to carry an integrations/* bump alongside the root one. v0.19.0 was
#   the first root-only cycle, and it vanished — no tag, no release, no
#   artifacts, and PR #445 left labelled `autorelease: pending`, which then
#   aborts every subsequent run with "There are untagged, merged release PRs
#   outstanding". Dropping `package-name` makes the branch component empty on
#   both sides. It cannot change the tag or the release name: both are gated on
#   `include-component-in-tag`, which stays false.
#
#   Symptom to look for: a release-please run that is GREEN but reports
#   `releases_created: false` right after a release PR merged.
#
# crates.io is deliberately NOT wired in here. Publishing is irreversible and
# there is no human in a tag-triggered path, so phux-protocol is published only
# via the manual publish-crate.yml dispatch. See CONTRIBUTING.md.

name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release PR / github release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      cockpit_release_created: ${{ steps.rp.outputs['clients/cockpit--release_created'] }}
      cockpit_tag_name: ${{ steps.rp.outputs['clients/cockpit--tag_name'] }}
      prs_created: ${{ steps.rp.outputs.prs_created }}
      # `pr` is a JSON string of release-please's PullRequest object, and is
      # unset when no PR was touched — short-circuit so fromJSON never sees ''.
      pr_branch: ${{ steps.rp.outputs.pr && fromJSON(steps.rp.outputs.pr).headBranchName || '' }}
    steps:
      # Fail closed and loudly if the App is not configured, rather than falling
      # back to GITHUB_TOKEN and silently opening an unmergeable release PR.
      - name: Require the release App
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APP_ID}" ] || [ -z "${APP_KEY}" ]; then
            echo "::error::RELEASE_APP_ID (variable) and RELEASE_APP_PRIVATE_KEY (secret) must be set. See this workflow's header comment. GITHUB_TOKEN cannot be used: main's ruleset requires check+test, and GITHUB_TOKEN-raised events do not trigger CI, so the release PR would be unmergeable."
            exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          # v3 deprecated `app-id` in favor of `client-id`. The JWT issuer claim
          # accepts the numeric App ID and the Iv1-style Client ID alike, so the
          # existing RELEASE_APP_ID variable works unchanged.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # `force-tag-creation: true` makes release-please create refs immediately
      # for draft releases. Do not recreate that behavior here: one owner keeps
      # root, Cockpit, and integration component tags on the same code path.

  sync-lockfile:
    name: sync Cargo.lock on the release PR
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.pr_branch != ''
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # release-please cannot update Cargo.lock, and this is not a config mistake:
    #
    #   * Its `rust` strategy is unusable here (see the header of release.yml),
    #     so we drive the root Cargo.toml with a generic TOML jsonpath updater.
    #   * Its TOML updater resolves a jsonpath against a parse tree in which
    #     every scalar is a {start,end,value} tagged object. A filter such as
    #     `$.package[?(@.name=='phux-protocol')].version` therefore compares an
    #     object to a string, matches nothing, and SILENTLY no-ops. There is no
    #     jsonpath that can select the 11 workspace members out of Cargo.lock's
    #     [[package]] array by name.
    #   * Comment annotations (`# x-release-please-version`) are not durable in
    #     Cargo.lock either: cargo rewrites the file and drops them.
    #
    # So cargo itself re-resolves the lock. `cargo update --workspace` touches
    # only the workspace members' own entries and leaves every external pin
    # alone. It resolves metadata only — no build, so no zig/libghostty needed.
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          # v3 deprecated `app-id` in favor of `client-id`. The JWT issuer claim
          # accepts the numeric App ID and the Iv1-style Client ID alike, so the
          # existing RELEASE_APP_ID variable works unchanged.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
          fetch-depth: 0
          # MUST be the App token, not GITHUB_TOKEN. This job pushes a commit that
          # becomes the release PR's new head; with GITHUB_TOKEN that push raises
          # no `pull_request: synchronize` event, so ci.yml never runs against the
          # new head SHA, and `check`/`test` never report on it for the ordinary
          # merge path. The App's push DOES trigger ci.yml — exactly what we want.
          # This cannot recurse
          # into release-please.yml: that is `on: push: branches: [main]`, and this
          # pushes to the release PR branch.
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Detect a root workspace release
        id: root-release
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          base="$(git merge-base HEAD origin/main)"
          if git diff --quiet "$base" HEAD -- Cargo.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.root-release.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # rust-toolchain.toml is the single source of truth for the
          # toolchain version — never hardcode a release here.
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal

      - name: Re-resolve workspace member versions
        if: steps.root-release.outputs.changed == 'true'
        run: cargo update --workspace

      - name: Commit Cargo.lock
        shell: bash
        env:
          PR_BRANCH: ${{ needs.release-please.outputs.pr_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock with the release version"
          git push origin "HEAD:${PR_BRANCH}"

  release-artifacts:
    name: build + attach binaries
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  cockpit-release-artifacts:
    name: build + attach Cockpit app
    needs: release-please
    if: needs.release-please.outputs.cockpit_release_created == 'true'
    uses: ./.github/workflows/cockpit-release.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.cockpit_tag_name }}

  # Report the release to the Linear `phux` pipeline, which resolves the issues
  # a release carried from the Linear identifiers and PR references in its
  # commit range. Syncing at tag time puts it in Building; the promote below
  # moves it to Released only after the binaries, public GitHub release, and tap
  # are complete. A failed artifact build leaves a private draft for repair.
  #
  # Both stages live in linear-release.yml rather than inline here, because
  # these two jobs are gated on `release_created` and this workflow only runs on
  # push. A hand-recovered release — v0.19.0 was one — has that output false, so
  # inline jobs could never report it and there was no way to do it after the
  # fact. linear-release.yml is `workflow_dispatch`able for exactly that case.
  linear-release-sync:
    name: report release to Linear
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/linear-release.yml
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      stage: building

  linear-release-promote:
    name: mark the Linear release released
    needs: [release-please, release-artifacts]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/linear-release.yml
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      stage: released
