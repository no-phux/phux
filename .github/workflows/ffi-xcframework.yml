# Build the canonical mobile xcframework from this checkout and attach it to
# the root release. PhuxMobileFFI is crates/phux-client-ffi built with
# --no-default-features --features uniffi, including generated Swift from the
# same revision. It carries the engine for iOS devices, the arm64 simulator,
# and arm64 macOS.
#
# Release Please owns tags, draft releases and notes. This workflow only adds
# verified assets to an existing release, the same contract release.yml
# follows, and release.yml dispatches it once each root
# release is public. It never gates the draft's publication: the CLI tarballs
# are the release contract; the xcframework is the mobile pin's input.
#
# No pull request triggers this workflow, so its caches are saved from every
# run without thrashing the PR cache budget docs/development.md#ci describes.
#
# phux-mobile pins ONE revision and fetches both artifacts at it, so this
# workflow and ffi-android.yml always run as a pair: release.yml dispatches
# both with the tag (the default mobile pin is a release), and a mobile
# override pin dispatches both with `commit` (phux-mobile `just pin-phux
# <sha>`), which only uploads workflow artifacts (the attach step is guarded
# on RELEASE_TAG). Main pushes no longer build it: each build is 45 minutes
# on the five-slot macOS pool, and most push builds were never pinned.
#
# An ubuntu preflight runs before the xcode-27 job and skips it when that
# commit is already built, so a second dispatch does not take another slot.

name: ffi-xcframework

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing root release tag (vX.Y.Z) to build from and attach to. Empty builds the dispatched ref and only uploads the workflow artifact.
        required: false
        type: string
        default: ""
      commit:
        description: Full 40-character commit SHA to build instead of the dispatched ref's head. Leave empty with a tag. Artifacts are then named with a -<sha> suffix, because the run's headSha is not the built commit.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

# Keyed on the built commit, never on a branch. A group admits one running and
# ONE pending run, so a ref-keyed group let a third push on main replace the
# still-pending run for the second, and that commit never got an artifact even
# though phux-mobile may pin it. Per-commit groups only serialize a replay of
# the same commit; nothing is cancelled.
concurrency:
  group: ffi-xcframework-${{ inputs.tag || inputs.commit || github.sha }}
  cancel-in-progress: false

jobs:
  # ubuntu, before the build. Skips that build only when this exact commit
  # is already built. A tag dispatch skips only when the release already has
  # every archive this workflow attaches, each zip matches its sha256, and
  # provenance names the tag commit: attach is a step in the build job, and
  # unsuffixed workflow artifacts do not identify which tag was built.
  # notify-mobile still runs on that skip; it only sends the tag.
  # A dispatch without a tag skips when a successful earlier run of this
  # workflow still has the unexpired artifacts this run would upload. The
  # build runs in every other case, including when the lookup cannot tell.
  preflight:
    name: check for an existing build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      # The guard comes from the workflow revision, never the older mobile pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Decide whether this commit is already built
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          COMMIT_INPUT: ${{ inputs.commit }}
          WORKFLOW_FILE: ffi-xcframework.yml
          PREFLIGHT_LABEL: native xcframeworks
          BARE_ARTIFACTS: PhuxFFI-xcframework PhuxMobileFFI-xcframework
          RELEASE_SPECS: |
            PhuxFFI-|.xcframework.zip|.provenance|phux-rev
            PhuxMobileFFI-|.xcframework.zip|.provenance|phux_rev=
        run: bash scripts/ci/ffi-build-preflight.sh

  build:
    name: build native xcframeworks
    needs: preflight
    # Only skip=false builds. A failed preflight does not start xcode-27:
    # artifacts from a red workflow are not a pin phux-mobile will fetch.
    # An uncertain lookup records skip=false and the build runs as before.
    if: needs.preflight.outputs.skip != 'true'
    # Standard xcode-27 is an arm64 GitHub-hosted runner with Xcode 27 and the
    # iOS SDK; device and simulator slices need both.
    runs-on: xcode-27
    # A cold run compiles ghostty's xcframework emit for both iOS targets;
    # retain a conservative ceiling until hosted timings justify tightening it.
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      MOBILE_ARTIFACTS: target/mobile-ffi-xcframework/Artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || inputs.commit || github.sha }}

      # The checkout above names a commit, not a branch: a push run that waits
      # in the queue must still build the commit that triggered it, or its
      # artifacts carry a later main's provenance under this run's headSha and
      # phux-mobile's fetcher refuses them. This step proves HEAD is that
      # commit and decides the artifact names (see the commit input).
      - name: Resolve the build commit
        env:
          COMMIT_INPUT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ -z "$COMMIT_INPUT" ]] || { echo "::error::pass tag or commit, not both"; exit 1; }
            expected="$(git rev-parse "$RELEASE_TAG^{commit}")"
          else
            expected="${COMMIT_INPUT:-$GITHUB_SHA}"
          fi
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full 40-character SHA: $expected"; exit 1; }
          test "$(git rev-parse HEAD)" = "$expected"
          suffix=""
          if [[ -n "$COMMIT_INPUT" && "$COMMIT_INPUT" != "$GITHUB_SHA" ]]; then
            suffix="-$expected"
          fi
          {
            echo "BUILD_SHA=$expected"
            echo "ARTIFACT_SUFFIX=$suffix"
          } >> "$GITHUB_ENV"
          echo "Building ${expected} (run headSha ${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"

      - name: Contributor Zig setup
        run: |
          bash dev/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"
          # ghostty's build.zig panics when its HEAD carries a tag that is not vX.Y.Z,
          # and the ghostty fork tags archived branches (phux-1wudz). This step lives
          # in the workflow, not the checkout, so a dispatch for an older tag gets it too.
          # Hide git from Zig only; ghostty then uses its dev version.
          printf '#!/bin/sh\nGIT_DIR=/nonexistent exec zig "$@"\n' > "$RUNNER_TEMP/zig-no-git"
          chmod +x "$RUNNER_TEMP/zig-no-git"
          echo "ZIG=$RUNNER_TEMP/zig-no-git" >> "$GITHUB_ENV"

      - name: Contributor Rust setup
        run: bash dev/setup-rust.sh core

      # After the Rust setup: check-release-version.sh runs `cargo metadata`,
      # and the pinned toolchain must come from dev/setup-rust.sh, not
      # from whatever the runner image auto-installs on first use.
      - name: Validate release tag
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          bash scripts/check-release-version.sh "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      # No rust-cache for this job. Two dep archives, 978198846 and
      # 968319491 bytes, landed fifteen minutes apart on 2026-10-13 (runs
      # 38450850133 and 38450787572). Both compiles were already cold — the
      # key suffix changed — and next to other large build caches they
      # LRU-evicted the 2.3 GB test-lane archive. The zig package cache
      # below is tens of MB and stays.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zig
          key: mini-v1-ffi-xcframework-zig-${{ hashFiles('.config/zig-toolchain.json', 'Cargo.lock') }}
          restore-keys: |
            mini-v1-ffi-xcframework-zig-

      # The design exports under design/ come from the tools package.
      - uses: ./.github/actions/setup-bun

      - name: Build, verify and smoke-test the mobile xcframework
        run: bash scripts/build-mobile-ffi-xcframework.sh --full

      - name: Package the mobile archive, bindings and checksum
        id: mobile-package
        run: |
          set -euo pipefail
          stem="PhuxMobileFFI-${RELEASE_TAG:-$(git rev-parse --short HEAD)}"
          cd "$MOBILE_ARTIFACTS"
          test -f design/manifest.json
          zip -qry "${stem}.xcframework.zip" PhuxFFI.xcframework Generated design provenance
          shasum -a 256 "${stem}.xcframework.zip" > "${stem}.xcframework.zip.sha256"
          cp provenance "${stem}.provenance"
          cat "${stem}.xcframework.zip.sha256" "${stem}.provenance"
          echo "stem=${stem}" >> "$GITHUB_OUTPUT"

      # The provenance the consumer checks must name the commit this run was for.
      - name: Verify provenance names the build commit
        run: |
          set -euo pipefail
          grep -qx "phux_rev=$BUILD_SHA" "$MOBILE_ARTIFACTS/provenance"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PhuxMobileFFI-xcframework${{ env.ARTIFACT_SUFFIX }}
          path: |
            ${{ env.MOBILE_ARTIFACTS }}/provenance
            ${{ env.MOBILE_ARTIFACTS }}/${{ steps.mobile-package.outputs.stem }}.xcframework.zip
            ${{ env.MOBILE_ARTIFACTS }}/${{ steps.mobile-package.outputs.stem }}.xcframework.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Attach and verify release assets
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MOBILE_STEM: ${{ steps.mobile-package.outputs.stem }}
        run: |
          set -euo pipefail
          cd "$MOBILE_ARTIFACTS"
          # `gh release upload` adds assets only; it never rewrites the name or
          # body release-please generated. --clobber keeps a replay against
          # the same tag idempotent.
          gh release upload "$RELEASE_TAG" \
            "${MOBILE_STEM}.xcframework.zip" "${MOBILE_STEM}.xcframework.zip.sha256" \
            "${MOBILE_STEM}.provenance" --clobber
          existing="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --dir "$existing" --pattern "${MOBILE_STEM}.*"
          cmp "${MOBILE_STEM}.xcframework.zip" "$existing/${MOBILE_STEM}.xcframework.zip"
          cmp "${MOBILE_STEM}.provenance" "$existing/${MOBILE_STEM}.provenance"
          (cd "$existing" && shasum -a 256 -c "${MOBILE_STEM}.xcframework.zip.sha256")
          echo "attached ${MOBILE_STEM} to ${RELEASE_TAG}"

  # phux-mobile pins the newest release that carries both mobile archives.
  # Tell it one was just attached instead of leaving it to its six-hour poll.
  # Best effort: the poll still catches a missed event, so a failed dispatch
  # must not fail the release build.
  # needs.build.result == 'skipped' is the tag replay whose release already
  # verified. !cancelled() is required: without a status function GitHub
  # prepends success(), and a skipped build would suppress the dispatch.
  # The job still sends only client_payload[tag]. It does not read build
  # outputs or artifacts, and continue-on-error stays as it was.
  notify-mobile:
    needs: [preflight, build]
    if: ${{ !cancelled() && inputs.tag != '' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.preflight.outputs.skip == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: mobile
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: no-phux
          repositories: phux-mobile
          permission-contents: write
      - name: Tell phux-mobile a release archive was attached
        env:
          GH_TOKEN: ${{ steps.mobile.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: >-
          gh api repos/no-phux/phux-mobile/dispatches
          -f event_type=phux-ffi-published -f "client_payload[tag]=$TAG"
