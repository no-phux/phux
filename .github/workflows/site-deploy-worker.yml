name: site-deploy-worker

# Deploy the live-demo Worker (docs/site/worker): edge fallback DO + native
# container image, declared in docs/site/infra/demo.run.ts (Alchemy). The built
# phux-edge WASM is committed, so no Rust toolchain is needed in CI.

on:
  push:
    branches: [main]
    paths:
      - "docs/site/worker/**"
      - "docs/site/infra/**"
      - "docs/site/edge/**"
      - "docs/site/package.json"
      - "docs/site/bun.lock"
      - "docs/site/scripts/phux-wire.ts"
      - "docs/site/scripts/smoke-native.ts"
      - ".github/workflows/site-deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: mini-v1-site-deploy-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: docs/site
        run: bun install --frozen-lockfile

      - name: Install infra dependencies
        working-directory: docs/site/infra
        run: bun install --frozen-lockfile

      - name: Validate Worker
        working-directory: docs/site
        run: |
          bun run test
          bun run worker:check
          bun --cwd infra run check

      - name: Capture current Worker version
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          previous="$(
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/phux-demo/deployments" \
              | jq -r '.result.deployments[0].versions[0].version_id // empty'
          )"
          echo "version=$previous" >> "$GITHUB_OUTPUT"
          echo "Previous Worker version: \`$previous\` (site-rollback-worker.yml)" >> "$GITHUB_STEP_SUMMARY"

      # CI starts from empty Alchemy state and re-adopts the Worker by its
      # alchemy:* tags and the container application by name. Docker builds
      # and pushes the native image.
      - name: Deploy Worker + Durable Objects
        working-directory: docs/site/infra
        run: bunx alchemy deploy demo.run.ts --stage prod --yes --no-input
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Native admission is parked unless this repository variable is
          # "true"; see infra/demo.run.ts. Unset (empty) stays parked.
          PHUX_NATIVE_ENABLED: ${{ vars.PHUX_NATIVE_ENABLED }}

      - name: Wait for container rollout
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for _ in {1..30}; do
            info="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/containers/applications/a032bc35-604a-4f1e-93a6-aad2aed206cf" \
              | jq '.result')"
            if ! jq -e '.active_rollout_id // empty' <<<"$info" >/dev/null; then
              echo "container_rollout ready=true"
              exit 0
            fi
            sleep 10
          done
          echo "container_rollout timeout=true" >&2
          exit 1

      - name: Smoke native and graceful fallback
        working-directory: docs/site
        run: |
          # A newly attached custom domain can lag the Worker deployment in
          # public DNS. Do not mistake that propagation window for a runtime
          # or WebSocket failure.
          for attempt in {1..30}; do
            if curl --fail --silent --show-error https://shell.phux.sh/healthz >/dev/null; then
              bun run worker:smoke-fallback
              exit 0
            fi
            echo "Waiting for custom-domain DNS (${attempt}/30)"
            sleep 10
          done
          echo "shell.phux.sh did not become healthy after five minutes" >&2
          exit 1
        env:
          PHUX_SYNTHETIC_TOKEN: ${{ secrets.PHUX_SYNTHETIC_TOKEN }}
