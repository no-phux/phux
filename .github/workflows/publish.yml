# The only workflow that turns a draft public. Release Please cuts the tag and
# notes, and ci proves the commit; they finish in either order, so every run
# ships every draft whose tagged commit has a green ci. The daily run catches a
# missed event and checks for drift. A draft older than a published version of
# its component is deleted; its tag stays, so Release Please never re-cuts it.

name: publish

on:
  workflow_run:
    workflows: ["ci", "release-please"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft tag to publish. Leave empty to reconcile every ready draft."
        required: false
        type: string
        default: ""
  schedule:
    - cron: "5 15 * * *"

permissions:
  actions: read
  contents: write

concurrency:
  group: mini-v1-publish
  cancel-in-progress: false

jobs:
  plan:
    name: choose drafts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      phux_tag: ${{ steps.plan.outputs.phux_tag }}
      desktop_tag: ${{ steps.plan.outputs.desktop_tag }}
      integration_tags: ${{ steps.plan.outputs.integration_tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - id: plan
        name: Decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
        run: bun tools/main.ts publish-plan

  phux:
    name: publish phux
    needs: plan
    if: needs.plan.outputs.phux_tag != ''
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    secrets:
      PHUX_MINISIGN_SECRET_KEY: ${{ secrets.PHUX_MINISIGN_SECRET_KEY }}
    with:
      tag: ${{ needs.plan.outputs.phux_tag }}

  desktop:
    name: publish desktop
    needs: plan
    if: needs.plan.outputs.desktop_tag != ''
    uses: ./.github/workflows/desktop-release.yml
    permissions:
      contents: write
    secrets:
      PHUX_MINISIGN_SECRET_KEY: ${{ secrets.PHUX_MINISIGN_SECRET_KEY }}
    with:
      tag: ${{ needs.plan.outputs.desktop_tag }}

  channel-manifest:
    name: publish stable manifest
    needs: [plan, phux, desktop]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Build and publish stable.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tools/main.ts release-manifest stable --out "$RUNNER_TEMP/stable.json" --publish

  # Mobile artifacts ride on the root release without gating it. Dispatched,
  # not called, and only once the CLI is public: a called xcframework build
  # took an xcode-27 runner ahead of the release's own macOS build and held
  # this workflow's single concurrency slot for another ~40 minutes, so every
  # draft cut meanwhile sat unpublished. Each dispatched run keys its own
  # per-tag group.
  mobile-ffi:
    name: dispatch mobile FFI
    needs: [plan, phux]
    if: needs.phux.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch ffi-xcframework and ffi-android
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.phux_tag }}
        run: |
          set -euo pipefail
          for workflow in ffi-xcframework.yml ffi-android.yml; do
            gh workflow run "$workflow" --ref main -f tag="$TAG"
            echo "dispatched $workflow for $TAG"
          done

  # phux.sh reads the release list at build time; a GITHUB_TOKEN publish
  # fires no release event, so tell the site here.
  website:
    name: rebuild phux.sh
    needs: [phux, desktop, channel-manifest]
    if: ${{ !cancelled() && (needs.phux.result == 'success' || needs.desktop.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch website-dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run website-dispatch.yml --ref main

  # Dispatched, not called: npm trusted publishing trusts the entry workflow.
  integration:
    name: publish integration
    needs: plan
    if: needs.plan.outputs.integration_tags != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Dispatch agent-integration-release and wait
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.plan.outputs.integration_tags }}
        run: bun tools/main.ts dispatch-integration-publishes

  linear-phux:
    name: report phux to Linear
    needs: [plan, phux]
    if: needs.phux.result == 'success'
    uses: ./.github/workflows/linear-release.yml
    secrets: inherit
    with:
      tag: ${{ needs.plan.outputs.phux_tag }}

  drift:
    name: check for stuck releases
    needs: channel-manifest
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the API lists drafts only to a token that can push
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Check for stuck releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tools/main.ts release-drift
