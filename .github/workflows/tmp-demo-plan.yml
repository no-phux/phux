name: tmp-demo-plan

# TEMPORARY: plan the Alchemy demo stack against production with the repo
# token (read-only). Reverted before merge.

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-demo-plan.yml"

permissions:
  contents: read

jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install
        run: |
          (cd docs/site && bun install --frozen-lockfile)
          (cd docs/site/infra && bun install --frozen-lockfile)
      - name: Plan demo and site
        working-directory: docs/site/infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx alchemy plan demo.run.ts --stage prod --detailed --no-input
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/containers/applications" \
            | jq -c '.result[] | {id, name, instances, max_instances, durable_objects, rollout_kind: .rollout_kind, instance_type: .configuration.instance_type, image: .configuration.image}'
