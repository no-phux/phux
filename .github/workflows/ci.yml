# Root validation: compile-free guards, independently routed Node integrations,
# and two Rust lanes. All compile/run phases retain their own target directory:
# check shares Clippy/rustdoc artifacts; test shares unit/e2e artifacts. The
# check and icount lanes restore compilations from setup-rust-lane's mbx cache.
# The test lane does not: its objects archive cannot share the 10 GB budget.
# The required `ci` aggregate owns the explicit skip/failure policy.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Drafts cost no build; undrafting must produce a fresh validation run.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  # PRs are latest-wins. Main SHAs keep their own validation because a release
  # can depend on any of them; a later push must not strand that release draft.
  group: mini-v1-ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  changes:
    name: classify changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      phux_needed: ${{ steps.detect.outputs.phux_needed }}
      workflow_only: ${{ steps.detect.outputs.workflow_only }}
      cockpit_needed: ${{ steps.detect.outputs.cockpit_needed }}
      web_needed: ${{ steps.detect.outputs.web_needed }}
      web_engine_needed: ${{ steps.detect.outputs.web_engine_needed }}
      integrations_needed: ${{ steps.detect.outputs.integrations_needed }}
      native_needed: ${{ steps.detect.outputs.native_needed }}
      test_filterset: ${{ steps.detect.outputs.test_filterset }}
      unit_mode: ${{ steps.detect.outputs.unit_mode }}
      unit_targets: ${{ steps.detect.outputs.unit_targets }}
      e2e_needed: ${{ steps.detect.outputs.e2e_needed }}
      perf_icount_needed: ${{ steps.detect.outputs.perf_icount_needed }}
      validated: ${{ steps.receipt.outputs.validated }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/classify-changes
      - id: receipt
        uses: ./.github/actions/validation-receipt
        with:
          mode: check
          workflow: .github/workflows/ci.yml
          coverage: phux=${{ steps.detect.outputs.phux_needed }},integrations=${{ steps.detect.outputs.integrations_needed }}

  # Always check cheap contracts, including mixed and docs-only changes. Resolve
  # only these tools from the pinned nixpkgs input: no devshell, Rust or Zig
  # realization or build-cache restore on this runner.
  workflow-gate:
    name: workflow gate
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Prefer local Git objects for source-pin validation; squash-merged
          # release commits fall back to the checksummed source archive.
          fetch-depth: 0
      - name: read desktop Bun pin
        id: desktop-bun
        run: |
          version="$(sed -n 's/^bun = "\([^"]*\)"/\1/p' mise.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.desktop-bun.outputs.version }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: phux
          pushFilter: '(-source$|nixpkgs\.tar\.gz$)'
      - name: compile-free guards
        run: |
          nix shell --inputs-from . nixpkgs#actionlint nixpkgs#shellcheck \
            nixpkgs#just nixpkgs#nodejs_24 nixpkgs#python3 nixpkgs#jq \
            -c bash -euo pipefail <<'EOF'
          just workflow-check docs-check font-check e2e-lane-check formula-check zig-pin-check install-surface-check cache-portable-check
          just desktop-install desktop-check
          timeout 120 just agents-fleet-smoke
          EOF

  integrations:
    name: agent integrations
    needs: changes
    if: needs.changes.outputs.integrations_needed == 'true' && needs.changes.outputs.validated != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integrations/*/package-lock.json
      - name: read desktop Bun pin
        id: desktop-bun
        run: |
          version="$(sed -n 's/^bun = "\([^"]*\)"/\1/p' mise.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.desktop-bun.outputs.version }}
      - name: agent integration gates
        run: bash scripts/ci/agent-integrations.sh

  # Clippy/rustdoc exercise all features; tests deliberately use default
  # features so dhat's allocator does not distort the performance e2e gates.
  check:
    name: check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.phux_needed == 'true' && needs.changes.outputs.validated != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust-lane
        id: setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-lane: check
      - name: rust checks (fmt + clippy + doc + deny)
        run: |
          nix develop -c bash -euo pipefail <<'EOF'
          source scripts/ci/timed.sh
          timed fmt    just fmt-check
          timed clippy just lint
          timed doc    just doc
          timed deny   just deny
          timed features just build-features-check
          timed feature-compile just build-features-compile
          EOF
      - name: mbx stats
        if: always()
        run: mbx stats || true
      - name: lane signal
        if: always()
        env:
          PHUX_CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
          PHUX_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: bash scripts/ci/summarize-job.sh
      - name: leave disk for the mbx objects export
        if: always()
        run: bash scripts/ci/mbx-export-headroom.sh

  # Library changes keep the workspace feature union. A tests/-only diff
  # builds that integration test instead of linking the rest of the pool.
  # Pushes keep the full pool even when the classifier says skip.
  test:
    name: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.phux_needed == 'true' && needs.changes.outputs.validated != 'true' && (github.event_name == 'push' || needs.changes.outputs.unit_mode != 'skip' || needs.changes.outputs.e2e_needed == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cache-lane test skips the GitHub objects cache. See setup-rust-lane.
      - uses: ./.github/actions/setup-rust-lane
        id: setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-lane: test
      - name: tests (unit + e2e)
        env:
          # Pushes to main keep the full unit pool. PRs and merge groups use
          # the classifier's rdeps filterset; empty means run everything.
          PHUX_NEXTEST_FILTERSET: ${{ github.event_name != 'push' && needs.changes.outputs.test_filterset || '' }}
          PHUX_UNIT_MODE: ${{ github.event_name == 'push' && 'workspace' || needs.changes.outputs.unit_mode }}
          PHUX_UNIT_TARGETS: ${{ needs.changes.outputs.unit_targets }}
          PHUX_E2E_NEEDED: ${{ github.event_name == 'push' && 'true' || needs.changes.outputs.e2e_needed }}
        run: |
          nix develop -c bash -euo pipefail <<'EOF'
          source scripts/ci/timed.sh
          if [[ "${PHUX_UNIT_MODE}" != "skip" ]]; then
            timed unit   env NEXTEST_PROFILE=ci just test
          fi
          if [[ "${PHUX_UNIT_MODE}" == "workspace" || "${PHUX_UNIT_MODE}" == "rdeps" ]]; then
            timed uniffi just binding-uniffi-test
          fi
          if [[ "${PHUX_E2E_NEEDED}" == "true" ]]; then
            timed e2e    just e2e
          fi
          EOF
      - name: mbx stats
        if: always()
        run: mbx stats || true
      - name: lane signal
        if: always()
        env:
          PHUX_CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
          PHUX_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          PHUX_JUNIT: target/nextest/ci/junit.xml
        run: bash scripts/ci/summarize-job.sh
      - name: leave disk for the mbx objects export
        if: always()
        run: bash scripts/ci/mbx-export-headroom.sh

  # x86_64 callgrind counts. ubuntu-24.04 (not the arm check/test lanes):
  # the checked-in baseline is an x86_64 icount-profile number. Skipped when
  # the classifier says the diff cannot move those counts.
  perf-icount:
    name: perf-icount
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.perf_icount_needed == 'true' && needs.changes.outputs.validated != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust-lane
        id: setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-lane: icount
      - name: instruction counts
        env:
          # The label is visible on the next pull_request event. A re-run
          # keeps the original payload, so add the label and push.
          PHUX_PERF_BASELINE_UPDATE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'perf-baseline') && '1' || '0' }}
          PHUX_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          nix develop -c bash -euo pipefail <<'EOF'
          source scripts/ci/timed.sh
          timed icount just perf-icount
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-icount
          path: target/perf-icount/iai.jsonl
          if-no-files-found: ignore
          retention-days: 14
      - name: mbx stats
        if: always()
        run: mbx stats || true
      - name: lane signal
        if: always()
        env:
          PHUX_CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
          PHUX_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: bash scripts/ci/summarize-job.sh
      - name: leave disk for the mbx objects export
        if: always()
        run: bash scripts/ci/mbx-export-headroom.sh

  # Live main rules require ci + commitlint (verified 2026-09-09). Retain raw
  # check/test names for visibility. A crashed classifier or cheap guard cannot
  # become skipped-green; only product lanes may be intentionally skipped.
  ci:
    name: ci
    needs: [changes, check, test, workflow-gate, integrations, perf-icount]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: aggregate lane results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            let bad = false;
            for (const [job, { result }] of Object.entries(needs)) {
              const required = ["changes", "workflow-gate"].includes(job);
              const ok = required
                ? result === "success"
                : result === "success" || result === "skipped";
              console.log(`${ok ? "pass" : "FAIL"} ${job}: ${result}`);
              if (!ok) bad = true;
            }
            process.exit(bad ? 1 : 0);
          '
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.validated != 'true'
        with:
          persist-credentials: false
      - name: Record successful validation of this tree and coverage
        if: needs.changes.outputs.validated != 'true'
        uses: ./.github/actions/validation-receipt
        with:
          mode: write
          workflow: .github/workflows/ci.yml
          coverage: phux=${{ needs.changes.outputs.phux_needed }},integrations=${{ needs.changes.outputs.integrations_needed }}

  # check and icount save an mbx objects entry when the key changes (UTC day,
  # Cargo.lock, or flake.lock), not on every commit. An exact hit skips the
  # export. Restores take only the newest, so keep one entry for each of those
  # lanes. The test lane does not save; delete every leftover test entry so a
  # multi-GB archive cannot evict the caches that fit.
  # check is arm64; perf-icount is x86_64, so its key prefix differs.
  prune-build-cache:
    name: prune superseded mbx cache entries
    needs: [check, test, perf-icount]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: prune rust-lane mbx entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          delete_cache() {
            echo "deleting ${1} entry ${2}"
            # A 404 means another main run already pruned it.
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${2}" --silent || true
            sleep 1
          }
          for spec in check:linux-arm64 icount:linux-x64; do
            lane="${spec%%:*}"
            arch="${spec#*:}"
            mapfile -t stale < <(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/caches?ref=refs/heads/main&key=${arch}-mbx-phux-${lane}-&sort=created_at&direction=desc&per_page=100" \
              --jq '.actions_caches[].id' | tail -n +2)
            for id in "${stale[@]:-}"; do
              [ -n "${id}" ] || continue
              delete_cache "$lane" "$id"
            done
          done
          mapfile -t stale < <(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/caches?ref=refs/heads/main&key=linux-arm64-mbx-phux-test-&sort=created_at&direction=desc&per_page=100" \
            --jq '.actions_caches[].id')
          for id in "${stale[@]:-}"; do
            [ -n "${id}" ] || continue
            delete_cache "test" "$id"
          done
