# Root validation: compile-free guards, independently routed Node integrations,
# and two Rust lanes. All compile/run phases retain their own target directory:
# check shares Clippy/rustdoc artifacts; test shares unit/e2e artifacts. Native
# artifacts remain CPU-keyed by setup-rust-lane (libghostty detects host CPU).
# The required `ci` aggregate owns the explicit skip/failure policy.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Drafts cost no build; undrafting must produce a fresh validation run.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  # PRs are latest-wins. Main SHAs keep their own validation because a release
  # can depend on any of them; a later push must not strand that release draft.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  changes:
    name: classify changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      phux_needed: ${{ steps.detect.outputs.phux_needed }}
      workflow_only: ${{ steps.detect.outputs.workflow_only }}
      cockpit_needed: ${{ steps.detect.outputs.cockpit_needed }}
      web_needed: ${{ steps.detect.outputs.web_needed }}
      web_engine_needed: ${{ steps.detect.outputs.web_engine_needed }}
      integrations_needed: ${{ steps.detect.outputs.integrations_needed }}
      native_needed: ${{ steps.detect.outputs.native_needed }}
      validated: ${{ steps.receipt.outputs.validated }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/classify-changes
      - id: receipt
        uses: ./.github/actions/validation-receipt
        with:
          mode: check
          workflow: .github/workflows/ci.yml
          coverage: phux=${{ steps.detect.outputs.phux_needed }},integrations=${{ steps.detect.outputs.integrations_needed }}

  # Always check cheap contracts, including mixed and docs-only changes. Resolve
  # only these tools from the pinned nixpkgs input: no devshell, Rust or Zig
  # realization, sccache setup, or target-cache restore on this runner.
  workflow-gate:
    name: workflow gate
    needs: changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: phux
          pushFilter: '(-source$|nixpkgs\.tar\.gz$)'
      - name: compile-free guards
        run: |
          nix shell --inputs-from . nixpkgs#actionlint nixpkgs#shellcheck \
            nixpkgs#just nixpkgs#nodejs_24 nixpkgs#python3 nixpkgs#jq \
            -c bash -euo pipefail <<'EOF'
          just workflow-check docs-check font-check e2e-lane-check formula-check zig-pin-check install-surface-check
          timeout 120 just agents-fleet-smoke
          EOF

  integrations:
    name: agent integrations
    needs: changes
    if: needs.changes.outputs.integrations_needed == 'true' && needs.changes.outputs.validated != 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integrations/*/package-lock.json
      - name: agent integration gates
        run: |
          set -euo pipefail
          bash scripts/doctor.sh integrations
          node scripts/check-agent-integration-versions.mjs
          export npm_config_audit=false npm_config_fund=false
          for package in opencode pi claude; do
            npm --prefix "integrations/$package" ci
            npm --prefix "integrations/$package" run gates
          done

  # Clippy/rustdoc exercise all features; tests deliberately use default
  # features so dhat's allocator does not distort the performance e2e gates.
  check:
    name: check
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.phux_needed == 'true' && needs.changes.outputs.validated != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust-lane
        id: setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          rust-cache-shared-key: check
      - name: rust checks (fmt + clippy + doc + deny)
        run: |
          nix develop -c bash -euo pipefail <<'EOF'
          source scripts/ci/timed.sh
          timed fmt    just fmt-check
          timed clippy just lint
          timed doc    just doc
          timed deny   just deny
          timed features just build-features-check
          timed feature-compile just build-features-compile
          EOF
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: lane signal
        if: always()
        env:
          PHUX_CACHE_HIT: ${{ steps.setup.outputs.rust-cache-hit }}
          PHUX_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: bash scripts/ci/summarize-job.sh

  # Unit and ignored e2e selections must keep identical Cargo feature/package
  # selection. nextest filters select execution after one workspace build.
  test:
    name: test
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.phux_needed == 'true' && needs.changes.outputs.validated != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust-lane
        id: setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          rust-cache-shared-key: test
      - name: tests (unit + e2e)
        run: |
          nix develop -c bash -euo pipefail <<'EOF'
          source scripts/ci/timed.sh
          timed unit env NEXTEST_PROFILE=ci just test
          timed e2e  just e2e
          EOF
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: lane signal
        if: always()
        env:
          PHUX_CACHE_HIT: ${{ steps.setup.outputs.rust-cache-hit }}
          PHUX_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          PHUX_JUNIT: target/nextest/ci/junit.xml
        run: bash scripts/ci/summarize-job.sh

  # Live main rules require ci + commitlint (verified 2026-09-09). Retain raw
  # check/test names for visibility. A crashed classifier or cheap guard cannot
  # become skipped-green; only product lanes may be intentionally skipped.
  ci:
    name: ci
    needs: [changes, check, test, workflow-gate, integrations]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: aggregate lane results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            let bad = false;
            for (const [job, { result }] of Object.entries(needs)) {
              const required = ["changes", "workflow-gate"].includes(job);
              const ok = required
                ? result === "success"
                : result === "success" || result === "skipped";
              console.log(`${ok ? "pass" : "FAIL"} ${job}: ${result}`);
              if (!ok) bad = true;
            }
            process.exit(bad ? 1 : 0);
          '
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.validated != 'true'
        with:
          persist-credentials: false
      - name: Record successful validation of this tree and coverage
        if: needs.changes.outputs.validated != 'true'
        uses: ./.github/actions/validation-receipt
        with:
          mode: write
          workflow: .github/workflows/ci.yml
          coverage: phux=${{ needs.changes.outputs.phux_needed }},integrations=${{ needs.changes.outputs.integrations_needed }}
