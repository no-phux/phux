# The one validation workflow: every pull request and every main push.
#
# `plan` routes the diff (tools/src/routing) to lanes. Each lane is one job
# that sets up its environment and runs the just recipes plan.ts names for
# it, so `just check` locally runs the same commands. A lane the diff cannot
# affect is skipped; the `ci` aggregate (the required check) accepts a skip
# and nothing else. A main push whose tree a pull request already validated
# with the same lanes skips them all (tools/src/routing/receipt.ts).
name: ci

on:
  pull_request:
    # `closed` runs nothing; joining the PR's concurrency group cancels the
    # run still in flight for a merged or abandoned PR.
    types: [opened, synchronize, reopened, ready_for_review, closed]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # PRs are latest-wins, keyed by number: a merged PR's `closed` event carries
  # the base ref, not the PR's. Every main SHA keeps its own run: release.yml
  # publishes a draft only on a green ci for that exact commit.
  group: ci-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  plan:
    if: github.event.action != 'closed' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      guards: ${{ steps.plan.outputs.guards }}
      lint: ${{ steps.plan.outputs.lint }}
      tests: ${{ steps.plan.outputs.tests }}
      e2e: ${{ steps.plan.outputs.e2e }}
      ffi: ${{ steps.plan.outputs.ffi }}
      icount: ${{ steps.plan.outputs.icount }}
      integrations: ${{ steps.plan.outputs.integrations }}
      web: ${{ steps.plan.outputs.web }}
      desktop: ${{ steps.plan.outputs.desktop }}
      native: ${{ steps.plan.outputs.native }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      web_engine: ${{ steps.plan.outputs.web_engine }}
      content: ${{ steps.plan.outputs.content }}
      unit_mode: ${{ steps.plan.outputs.unit_mode }}
      unit_targets: ${{ steps.plan.outputs.unit_targets }}
      test_filterset: ${{ steps.plan.outputs.test_filterset }}
      receipt: ${{ steps.plan.outputs.receipt }}
      receipt_name: ${{ steps.plan.outputs.receipt_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tools/main.ts ci-plan

  guards:
    needs: plan
    if: needs.plan.outputs.guards == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # A docs-only diff needs only the two guards that read docs, with the
      # runner's own bash and no Nix.
      - name: docs guards
        if: needs.plan.outputs.docs_only == 'true'
        run: |
          bash scripts/check-docs.sh
          bash scripts/check-install-surface.sh
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: needs.plan.outputs.docs_only != 'true'
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: needs.plan.outputs.docs_only != 'true'
        with:
          name: phux
          pushFilter: '(-source$|nixpkgs\.tar\.gz$)'
      # The pinned nixpkgs tools, not the devshell: guards compile nothing.
      # PHUX_TEST_REAL_MINISIGN turns the installer's signature-check skip
      # into a failure.
      - name: just guards
        if: needs.plan.outputs.docs_only != 'true'
        env:
          PHUX_TEST_REAL_MINISIGN: "1"
        run: |
          nix shell --inputs-from . nixpkgs#actionlint nixpkgs#shellcheck nixpkgs#just \
            nixpkgs#nodejs_24 nixpkgs#python3 nixpkgs#jq nixpkgs#minisign -c just guards

  lint:
    name: rust lint
    needs: plan
    if: needs.plan.outputs.lint == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-lane
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-lane: check
      - run: nix develop -c just rust-lint
      - name: leave disk for the mbx objects export
        if: github.event_name == 'push'
        run: bash scripts/ci/mbx-export-headroom.sh

  # One compile of the test profile, archived for the tests and e2e jobs. The
  # mbx store lets a PR recompile only the crates its diff reaches.
  test-build:
    name: rust test build
    needs: plan
    if: needs.plan.outputs.tests == 'true' || needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-lane
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-lane: test
      - name: just test-archive
        env:
          PHUX_UNIT_MODE: ${{ needs.plan.outputs.unit_mode }}
          PHUX_UNIT_TARGETS: ${{ needs.plan.outputs.unit_targets }}
          PHUX_E2E: ${{ needs.plan.outputs.e2e }}
          PHUX_TEST_ARCHIVE: ${{ runner.temp }}/phux-tests.tar.zst
        run: nix develop -c just test-archive
      # Already zstd. One retry: a single CreateArtifact ECONNRESET once lost a
      # finished build.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        continue-on-error: true
        with:
          name: phux-tests
          path: ${{ runner.temp }}/phux-tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.upload.outcome == 'failure'
        with:
          name: phux-tests
          path: ${{ runner.temp }}/phux-tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      - name: leave disk for the mbx objects export
        if: github.event_name == 'push'
        run: bash scripts/ci/mbx-export-headroom.sh

  tests:
    name: rust tests
    needs: [plan, test-build]
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-lane
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          build-cache: none
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phux-tests
          path: ${{ runner.temp }}
      - name: just test
        env:
          NEXTEST_PROFILE: ci
          PHUX_NEXTEST_FILTERSET: ${{ needs.plan.outputs.test_filterset }}
          PHUX_UNIT_MODE: ${{ needs.plan.outputs.unit_mode }}
          PHUX_UNIT_TARGETS: ${{ needs.plan.outputs.unit_targets }}
          PHUX_TEST_ARCHIVE: ${{ runner.temp }}/phux-tests.tar.zst
        run: nix develop -c just test

  e2e:
    name: rust e2e
    needs: [plan, test-build]
    if: needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-lane
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          build-cache: none
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phux-tests
          path: ${{ runner.temp }}
      - name: just e2e
        env:
          NEXTEST_PROFILE: ci
          PHUX_TEST_ARCHIVE: ${{ runner.temp }}/phux-tests.tar.zst
        run: nix develop -c just e2e

  # phux-client-ffi with `uniffi` instead of its defaults shares no artifacts
  # with the unit pool; the C ABI checks link its default staticlib.
  ffi:
    name: rust ffi
    needs: plan
    if: needs.plan.outputs.ffi == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-lane
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-lane: uniffi
          build-cache: deps
      - run: nix develop -c just binding-uniffi-test
      - run: nix develop -c just ffi-abi

  # x86_64 callgrind counts: the checked-in baseline is an x86_64 number.
  icount:
    name: rust icount
    needs: plan
    if: needs.plan.outputs.icount == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-lane
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-lane: icount
      - name: just perf-icount
        env:
          # A label is read from the next pull_request event; add it, then push.
          PHUX_PERF_BASELINE_UPDATE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'perf-baseline') && '1' || '0' }}
          PHUX_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: nix develop -c just perf-icount
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-icount
          path: target/perf-icount/iai.jsonl
          if-no-files-found: ignore
          retention-days: 14
      - name: leave disk for the mbx objects export
        if: github.event_name == 'push'
        run: bash scripts/ci/mbx-export-headroom.sh

  integrations:
    name: agent integrations
    needs: plan
    if: needs.plan.outputs.integrations == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: a PR-scoped entry is unrestorable after the PR closes
      # and only evicts main's build caches.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: ./.github/actions/setup-bun
      # `just agent-integrations-check`, without installing just.
      - run: bash scripts/ci/agent-integrations.sh

  web:
    name: web
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: phux
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: '(-source$|nixpkgs\.tar\.gz$)'
      - name: just web-check
        env:
          PHUX_WEB_ENGINE: ${{ needs.plan.outputs.web_engine == 'true' && '1' || '0' }}
          PHUX_TOOLCHAIN_DIR: ${{ runner.temp }}/phux-toolchains
        run: nix develop .#browser -c just web-check

  # Pull requests only (plan.ts): on main, release qualification builds the
  # desktop for every desktop change, and two macOS jobs per merge starved the
  # 5-slot macOS pool the release lanes share.
  desktop:
    name: desktop (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: xcode-27
            smoke: --allow-unconfirmed-present
          - platform: Linux
            os: ubuntu-24.04
            smoke: --require-backend Vulkan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      LIBGHOSTTY_VT_SYS_CPU: baseline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # desktop-release.yml provisions the same way.
      - name: Rust, Zig and Metal setup
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bash scripts/setup-rust.sh native
          bash scripts/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"
          brew install just
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
      - uses: ./.github/actions/setup-linux-desktop
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup-bun
      # One step per recipe: Bun leaves a shared stdout non-blocking, and a
      # Cargo build after it in the same step panics on EAGAIN.
      - run: just desktop-lint
      - run: just desktop-tests
      - run: just desktop-check
      # Hosted macOS never confirms a presented drawable; Linux must render
      # through lavapipe's Vulkan.
      - name: just desktop-smoke
        env:
          PHUX_DESKTOP_SMOKE_ARGS: --output ${{ runner.temp }}/desktop-evidence ${{ matrix.smoke }}
        run: just desktop-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/desktop-evidence
            clients/desktop/native/target/perf-headless
          if-no-files-found: warn
          retention-days: 14

  # A clean contributor machine: rustup, the pinned Zig, no Nix, no cache.
  native:
    name: native setup
    needs: plan
    if: needs.plan.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config mold curl xz-utils
      - run: bash scripts/test-dev-setup.sh
      - run: |
          bash scripts/setup-rust.sh native
          bash scripts/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"
      # `just native-smoke`, without installing just.
      - run: bash scripts/native-smoke.sh

  # The required check. The ruleset matches this display name.
  ci:
    name: ci
    needs: [plan, guards, lint, test-build, tests, e2e, ffi, icount, integrations, web, desktop, native]
    if: always() && github.event.action != 'closed' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: plan succeeded; every lane passed or was not needed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<<"$RESULTS"
          jq -e '.plan.result == "success" and ([.[].result] | all(. == "success" or . == "skipped"))' \
            <<<"$RESULTS" >/dev/null
      - name: write the validation receipt
        if: github.event_name == 'pull_request'
        env:
          RECEIPT: ${{ needs.plan.outputs.receipt }}
        run: |
          mkdir -p "$RUNNER_TEMP/receipt"
          printf '%s\n' "$RECEIPT" > "$RUNNER_TEMP/receipt/receipt.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: ${{ needs.plan.outputs.receipt_name }}
          path: ${{ runner.temp }}/receipt/receipt.json
          # A rerun shares its run id and tree; replace only after a pass.
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  # A green main push that touched docs, installers, or product skills
  # republishes them: no-phux/website rebuilds phux.sh, and no-phux/skills
  # mirrors the product skills. GITHUB_TOKEN can write neither, and GitHub
  # drops repository_dispatch from it, so both use the release App.
  content:
    name: publish content
    needs: [plan, ci]
    # always(): an implicit success() also requires the skipped desktop lane.
    if: always() && github.event_name == 'push' && needs.plan.outputs.content == 'true' && needs.ci.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: no-phux
          repositories: website,skills
      - name: rebuild phux.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/no-phux/website/dispatches \
            -f event_type=phux-content -f "client_payload[sha]=${GITHUB_SHA}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: no-phux/skills
          token: ${{ steps.app-token.outputs.token }}
          path: .skills-mirror
          persist-credentials: true
      - name: mirror product skills
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          bash scripts/export-product-skills.sh .skills-mirror
          shortsha="$(git rev-parse --short HEAD)"
          cd .skills-mirror
          git add -A
          if git diff --cached --quiet; then echo "skills mirror already in sync"; exit 0; fi
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "sync: product skills from no-phux/phux@${shortsha}"
          git push

  # mbx saves when its key changes (UTC day, Cargo.lock, flake.lock); restores
  # take only the newest entry, so keep one per lane and per release cache.
  prune-build-cache:
    name: prune superseded build caches
    needs: [lint, test-build, ffi, icount]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          keep_newest() {
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/caches?key=${1}&sort=created_at&direction=desc&per_page=100" \
              --jq '.actions_caches[].id' | tail -n +2 | while read -r id; do
              echo "deleting ${1} entry ${id}"
              # A 404 means another main run already pruned it.
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" --silent || true
              sleep 0.25
            done
          }
          for prefix in linux-arm64-mbx-phux-check- linux-arm64-mbx-phux-test- \
            v0-rust-phux-uniffi-Linux- linux-x64-mbx-phux-icount- v0-rust-ffi-android-Linux-x64- \
            v0-rust-release-deps-Linux-x64- v0-rust-release-deps-Linux-arm64- \
            v0-rust-release-deps-Darwin-arm64- v0-rust-mini-v1-desktop-release- \
            mini-v1-ffi-xcframework-zig-; do
            keep_newest "$prefix"
          done
