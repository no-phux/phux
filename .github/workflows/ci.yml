# Root validation: compile-free guards, independently routed Node integrations,
# and the Rust lanes. check shares Clippy/rustdoc artifacts in its own target
# directory; test build compiles the unit and e2e binaries once for the test
# run jobs. check, test build, and perf-icount restore native compilations,
# build scripts, and links from setup-rust-lane's mbx cache.
# The required `ci` aggregate owns the explicit skip/failure policy.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Drafts cost no build; undrafting must produce a fresh validation run.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  # PRs are latest-wins. Main SHAs keep their own validation because a release
  # can depend on any of them; a later push must not strand that release draft.
  group: mini-v1-ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  changes:
    name: classify changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      phux_needed: ${{ steps.detect.outputs.phux_needed }}
      workflow_only: ${{ steps.detect.outputs.workflow_only }}
      web_needed: ${{ steps.detect.outputs.web_needed }}
      web_engine_needed: ${{ steps.detect.outputs.web_engine_needed }}
      integrations_needed: ${{ steps.detect.outputs.integrations_needed }}
      native_needed: ${{ steps.detect.outputs.native_needed }}
      test_filterset: ${{ steps.detect.outputs.test_filterset }}
      unit_mode: ${{ steps.detect.outputs.unit_mode }}
      unit_targets: ${{ steps.detect.outputs.unit_targets }}
      e2e_needed: ${{ steps.detect.outputs.e2e_needed }}
      perf_icount_needed: ${{ steps.detect.outputs.perf_icount_needed }}
      validated: ${{ steps.receipt.outputs.validated }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/classify-changes
      - id: receipt
        uses: ./.github/actions/validation-receipt
        with:
          mode: check
          workflow: .github/workflows/ci.yml
          coverage: phux=${{ steps.detect.outputs.phux_needed }},integrations=${{ steps.detect.outputs.integrations_needed }}

  # Always check cheap contracts. A docs-only diff (the classifier's
  # docs_only: no file that code or a guard reads) runs the two guards that
  # read docs, with the runner's own bash and python and no Nix, Bun or
  # desktop install. Every other diff resolves the full tool set from the
  # pinned nixpkgs input: no devshell, Rust or Zig realization or build-cache
  # restore on this runner.
  workflow-gate:
    name: workflow gate
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Prefer local Git objects for source-pin validation; squash-merged
          # release commits fall back to the checksummed source archive.
          fetch-depth: 0
      # The docs-check and install-surface-check recipe bodies.
      - name: docs guards
        if: env.DOCS_ONLY == 'true'
        run: |
          bash scripts/check-docs.sh
          bash scripts/check-install-surface.sh
      - name: read desktop Bun pin
        if: env.DOCS_ONLY != 'true'
        id: desktop-bun
        run: |
          version="$(sed -n 's/^bun = "\([^"]*\)"/\1/p' mise.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: env.DOCS_ONLY != 'true'
        with:
          bun-version: ${{ steps.desktop-bun.outputs.version }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: env.DOCS_ONLY != 'true'
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: env.DOCS_ONLY != 'true'
        with:
          name: phux
          pushFilter: '(-source$|nixpkgs\.tar\.gz$)'
      - name: compile-free guards
        if: env.DOCS_ONLY != 'true'
        run: |
          # minisign: the installer's real-signature checks must run here,
          # not skip (PHUX_TEST_REAL_MINISIGN makes a skip a failure).
          nix shell --inputs-from . nixpkgs#actionlint nixpkgs#shellcheck \
            nixpkgs#just nixpkgs#nodejs_24 nixpkgs#python3 nixpkgs#jq \
            nixpkgs#minisign \
            -c bash -euo pipefail <<'EOF'
          export PHUX_TEST_REAL_MINISIGN=1
          just workflow-check docs-check font-check e2e-lane-check zig-pin-check ghostty-pin-check install-surface-check cache-portable-check
          just desktop-install desktop-check
          timeout 120 just agents-fleet-smoke
          EOF

  integrations:
    name: agent integrations
    needs: changes
    if: needs.changes.outputs.integrations_needed == 'true' && needs.changes.outputs.validated != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integrations/*/package-lock.json
      - name: read desktop Bun pin
        id: desktop-bun
        run: |
          version="$(sed -n 's/^bun = "\([^"]*\)"/\1/p' mise.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.desktop-bun.outputs.version }}
      - name: agent integration gates
        run: bash scripts/ci/agent-integrations.sh

  # Clippy/rustdoc exercise all features; tests deliberately use default
  # features so dhat's allocator does not distort the performance e2e gates.
  check:
    name: check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.phux_needed == 'true' && needs.changes.outputs.validated != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust-lane
        id: setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-lane: check
      - name: rust checks (fmt + clippy + doc + deny)
        run: |
          nix develop -c bash -euo pipefail <<'EOF'
          source scripts/ci/timed.sh
          timed fmt    just fmt-check
          timed clippy just lint
          timed doc    just doc
          timed deny   just deny
          timed features just build-features-check
          timed feature-compile just build-features-compile
          EOF
      - name: mbx stats
        if: always()
        run: mbx stats || true
      - name: lane signal
        if: always()
        env:
          PHUX_CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
          PHUX_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: bash scripts/ci/summarize-job.sh
      # Only main pushes export; on a PR this cleanup cost 50 s to 2 min of
      # the required path for nothing (run 38523359573).
      - name: leave disk for the mbx objects export
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci/mbx-export-headroom.sh
      # The action exports only from its success post step. Run 38457963019
      # compiled the test profile in 10m 37s, failed one assertion, and saved
      # nothing. Pull requests do not write this archive.
      - name: export objects when the lane fails
        id: mbx-fail-export
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true'
        env:
          PHUX_MBX_EXPORT_DIR: ${{ runner.temp }}/phux-mbx-objects
        run: bash scripts/ci/mbx-export-failed-lane.sh "$PHUX_MBX_EXPORT_DIR"
      - name: save objects when the lane fails
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true' && steps.mbx-fail-export.outputs.exported == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/phux-mbx-objects
          key: ${{ steps.setup.outputs.cache-key }}

  # One compile of the test profile serves the unit pool and e2e. Each lane
  # compiling its own targets cost three runners about 11 minutes of
  # workspace compile per code PR (run 38982580303: 4m 52s lib, 3m 38s
  # integration, 2m 21s e2e, much of it the same crates). This job compiles
  # the union once into a nextest archive; the run jobs download it and only
  # execute. TEST_FEATURES keeps one feature set for every lane, so the
  # classifier's rdeps filterset selects the same tests.
  #
  # The mbx objects store lets a PR recompile only the crates its diff
  # reaches: a phux-tui change compiled in 2m 52s against 6m 40s from
  # third-party artifacts alone (runs 38994317107, 38989373525). A
  # phux-protocol change still recompiles every workspace crate. Without
  # debuginfo or incremental state the store exports at about 0.7 GB.
  # Pushes build the full pool even when the classifier says skip; a
  # tests/-only diff (unit_mode=narrow) builds only the targets it touched,
  # plus the e2e set when e2e runs.
  test-build:
    name: test build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.phux_needed == 'true' && needs.changes.outputs.validated != 'true' && (github.event_name == 'push' || needs.changes.outputs.unit_mode != 'skip')
    # Line tables serve only symbolized backtraces: panic locations come from
    # #[track_caller], and symbol names stay in the unstripped test binaries.
    # Incremental state is never reused by a fresh checkout. Both multiply the
    # bytes compiled, linked, and cached.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust-lane
        id: setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-lane: test
      - name: build the test archive
        env:
          PHUX_UNIT_MODE: ${{ github.event_name == 'push' && 'workspace' || needs.changes.outputs.unit_mode }}
          PHUX_UNIT_TARGETS: ${{ needs.changes.outputs.unit_targets }}
          PHUX_E2E: ${{ github.event_name == 'push' && 'true' || needs.changes.outputs.e2e_needed }}
          PHUX_TEST_ARCHIVE: ${{ runner.temp }}/phux-tests.tar.zst
        run: |
          nix develop -c bash -euo pipefail <<'EOF'
          source scripts/ci/timed.sh
          timed test-archive just test-archive
          ls -l "$PHUX_TEST_ARCHIVE"
          EOF
      # The archive is already zstd; zip compression would only cost time.
      # One retry: run 38994951903 lost a finished build to a single
      # CreateArtifact ECONNRESET.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        continue-on-error: true
        with:
          name: phux-tests
          path: ${{ runner.temp }}/phux-tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.upload.outcome == 'failure'
        with:
          name: phux-tests
          path: ${{ runner.temp }}/phux-tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      - name: mbx stats
        if: always()
        run: mbx stats || true
      - name: lane signal
        if: always()
        env:
          PHUX_CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
          PHUX_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: bash scripts/ci/summarize-job.sh
      - name: leave disk for the mbx objects export
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci/mbx-export-headroom.sh
      - name: export objects when the lane fails
        id: mbx-fail-export
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true'
        env:
          PHUX_MBX_EXPORT_DIR: ${{ runner.temp }}/phux-mbx-objects
        run: bash scripts/ci/mbx-export-failed-lane.sh "$PHUX_MBX_EXPORT_DIR"
      - name: save objects when the lane fails
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true' && steps.mbx-fail-export.outputs.exported == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/phux-mbx-objects
          key: ${{ steps.setup.outputs.cache-key }}

  test:
    name: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    needs: [changes, test-build]
    if: needs.changes.outputs.phux_needed == 'true' && needs.changes.outputs.validated != 'true' && (github.event_name == 'push' || (needs.changes.outputs.unit_mode != 'skip' && needs.changes.outputs.unit_mode != 'narrow'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust-lane
        id: setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          build-cache: none
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phux-tests
          path: ${{ runner.temp }}
      - name: lib and bin unit tests
        env:
          # PRs and merge groups use the classifier's rdeps filterset; empty
          # means run everything.
          PHUX_NEXTEST_FILTERSET: ${{ github.event_name != 'push' && needs.changes.outputs.test_filterset || '' }}
          PHUX_UNIT_MODE: ${{ github.event_name == 'push' && 'workspace' || needs.changes.outputs.unit_mode }}
          PHUX_UNIT_PART: lib
          PHUX_TEST_ARCHIVE: ${{ runner.temp }}/phux-tests.tar.zst
        run: |
          nix develop -c bash -euo pipefail <<'EOF'
          source scripts/ci/timed.sh
          timed unit-lib env NEXTEST_PROFILE=ci just test
          EOF
      - name: lane signal
        if: always()
        env:
          PHUX_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          PHUX_JUNIT: target/nextest/ci/junit.xml
        run: bash scripts/ci/summarize-job.sh

  # A tests/-only diff (unit_mode=narrow) runs here alone.
  test-integration:
    name: test (integration)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    needs: [changes, test-build]
    if: needs.changes.outputs.phux_needed == 'true' && needs.changes.outputs.validated != 'true' && (github.event_name == 'push' || needs.changes.outputs.unit_mode != 'skip')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust-lane
        id: setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          build-cache: none
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phux-tests
          path: ${{ runner.temp }}
      - name: integration tests
        env:
          PHUX_NEXTEST_FILTERSET: ${{ github.event_name != 'push' && needs.changes.outputs.test_filterset || '' }}
          PHUX_UNIT_MODE: ${{ github.event_name == 'push' && 'workspace' || needs.changes.outputs.unit_mode }}
          PHUX_UNIT_TARGETS: ${{ needs.changes.outputs.unit_targets }}
          PHUX_UNIT_PART: integration
          PHUX_TEST_ARCHIVE: ${{ runner.temp }}/phux-tests.tar.zst
        run: |
          nix develop -c bash -euo pipefail <<'EOF'
          source scripts/ci/timed.sh
          timed unit-integration env NEXTEST_PROFILE=ci just test
          EOF
      - name: lane signal
        if: always()
        env:
          PHUX_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          PHUX_JUNIT: target/nextest/ci/junit.xml
        run: bash scripts/ci/summarize-job.sh

  e2e:
    name: e2e
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    needs: [changes, test-build]
    if: needs.changes.outputs.phux_needed == 'true' && needs.changes.outputs.validated != 'true' && (github.event_name == 'push' || needs.changes.outputs.e2e_needed == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust-lane
        id: setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          build-cache: none
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phux-tests
          path: ${{ runner.temp }}
      - name: e2e and perf gates
        env:
          PHUX_TEST_ARCHIVE: ${{ runner.temp }}/phux-tests.tar.zst
        run: |
          nix develop -c bash -euo pipefail <<'EOF'
          source scripts/ci/timed.sh
          timed e2e env NEXTEST_PROFILE=ci just e2e
          EOF
      - name: lane signal
        if: always()
        env:
          PHUX_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          PHUX_JUNIT: target/nextest/ci/junit.xml
        run: bash scripts/ci/summarize-job.sh

  # The mobile binding compiles phux-client-ffi with `uniffi` instead of its
  # default features, so it shares no workspace artifacts with the unit pool.
  uniffi:
    name: uniffi
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.phux_needed == 'true' && needs.changes.outputs.validated != 'true' && (github.event_name == 'push' || needs.changes.outputs.unit_mode == 'workspace' || needs.changes.outputs.unit_mode == 'rdeps')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust-lane
        id: setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-lane: uniffi
          build-cache: deps
      - name: UniFFI binding tests
        run: |
          nix develop -c bash -euo pipefail <<'EOF'
          source scripts/ci/timed.sh
          timed uniffi just binding-uniffi-test
          EOF
      - name: lane signal
        if: always()
        env:
          PHUX_CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
          PHUX_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: bash scripts/ci/summarize-job.sh

  # x86_64 callgrind counts. ubuntu-24.04 (not the arm check/test lanes):
  # the checked-in baseline is an x86_64 icount-profile number. Skipped when
  # the classifier says the diff cannot move those counts.
  perf-icount:
    name: perf-icount
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.perf_icount_needed == 'true' && needs.changes.outputs.validated != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust-lane
        id: setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-lane: icount
      - name: instruction counts
        env:
          # The label is visible on the next pull_request event. A re-run
          # keeps the original payload, so add the label and push.
          PHUX_PERF_BASELINE_UPDATE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'perf-baseline') && '1' || '0' }}
          PHUX_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          nix develop -c bash -euo pipefail <<'EOF'
          source scripts/ci/timed.sh
          timed icount just perf-icount
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-icount
          path: target/perf-icount/iai.jsonl
          if-no-files-found: ignore
          retention-days: 14
      - name: mbx stats
        if: always()
        run: mbx stats || true
      - name: lane signal
        if: always()
        env:
          PHUX_CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
          PHUX_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: bash scripts/ci/summarize-job.sh
      # Only main pushes export; on a PR this cleanup cost 50 s to 2 min of
      # the required path for nothing (run 38523359573).
      - name: leave disk for the mbx objects export
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci/mbx-export-headroom.sh
      # The action exports only from its success post step. Run 38457963019
      # compiled the test profile in 10m 37s, failed one assertion, and saved
      # nothing. Pull requests do not write this archive.
      - name: export objects when the lane fails
        id: mbx-fail-export
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true'
        env:
          PHUX_MBX_EXPORT_DIR: ${{ runner.temp }}/phux-mbx-objects
        run: bash scripts/ci/mbx-export-failed-lane.sh "$PHUX_MBX_EXPORT_DIR"
      - name: save objects when the lane fails
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true' && steps.mbx-fail-export.outputs.exported == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/phux-mbx-objects
          key: ${{ steps.setup.outputs.cache-key }}

  # Live main rules require ci + commitlint (verified 2026-09-09). Retain raw
  # check/test names for visibility. A crashed classifier or cheap guard cannot
  # become skipped-green; only product lanes may be intentionally skipped.
  ci:
    name: ci
    needs: [changes, check, test-build, test, test-integration, e2e, uniffi, workflow-gate, integrations, perf-icount]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: aggregate lane results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            let bad = false;
            for (const [job, { result }] of Object.entries(needs)) {
              const required = ["changes", "workflow-gate"].includes(job);
              const ok = required
                ? result === "success"
                : result === "success" || result === "skipped";
              console.log(`${ok ? "pass" : "FAIL"} ${job}: ${result}`);
              if (!ok) bad = true;
            }
            process.exit(bad ? 1 : 0);
          '
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.validated != 'true'
        with:
          persist-credentials: false
      - name: Record successful validation of this tree and coverage
        if: needs.changes.outputs.validated != 'true'
        uses: ./.github/actions/validation-receipt
        with:
          mode: write
          workflow: .github/workflows/ci.yml
          coverage: phux=${{ needs.changes.outputs.phux_needed }},integrations=${{ needs.changes.outputs.integrations_needed }}

  # mbx saves when its key changes (UTC day, Cargo.lock, or flake.lock), not
  # on every commit. An exact hit skips the export. Restores take only the
  # newest, so keep one entry per lane. Also keep one current copy of the
  # other large archives. Delete sccache's per-object shards and every
  # xcframework dep archive: a pair of ~1 GB entries evicted the 2.3 GB
  # test archive out from under the 4.9 GB zig cache (2026-10-13).
  prune-build-cache:
    name: prune superseded build cache entries
    needs: [check, test-build, uniffi, perf-icount]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: prune superseded build caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          delete_cache() {
            echo "deleting ${1} entry ${2}"
            # A 404 means another main run already pruned it.
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${2}" --silent || true
            sleep 0.25
          }
          list_ids() {
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/caches?key=${1}&sort=created_at&direction=desc&per_page=100" \
              --jq '.actions_caches[].id'
          }
          keep_newest() {
            local label="$1" prefix="$2"
            mapfile -t stale < <(list_ids "$prefix" | tail -n +2)
            for id in "${stale[@]:-}"; do
              [ -n "${id}" ] || continue
              delete_cache "$label" "$id"
            done
          }
          drop_all() {
            local label="$1" prefix="$2"
            mapfile -t stale < <(list_ids "$prefix")
            for id in "${stale[@]:-}"; do
              [ -n "${id}" ] || continue
              delete_cache "$label" "$id"
            done
          }
          keep_newest check linux-arm64-mbx-phux-check-
          # The test build keeps one mbx entry; the run jobs restore none.
          keep_newest test linux-arm64-mbx-phux-test-
          drop_all test-deps v0-rust-phux-test-Linux-
          drop_all test-integration-deps v0-rust-phux-test-integration-Linux-
          drop_all e2e-deps v0-rust-phux-e2e-Linux-
          keep_newest uniffi-deps v0-rust-phux-uniffi-Linux-
          keep_newest icount linux-x64-mbx-phux-icount-
          keep_newest android-ffi v0-rust-ffi-android-Linux-x64-
          keep_newest release-deps-x64 v0-rust-release-deps-Linux-x64-
          keep_newest release-deps-arm v0-rust-release-deps-Linux-arm64-
          keep_newest release-deps-mac v0-rust-release-deps-Darwin-arm64-
          keep_newest desktop-release v0-rust-mini-v1-desktop-release-
          keep_newest xcframework-zig mini-v1-ffi-xcframework-zig-
          drop_all xcframework-deps v0-rust-mini-v1-ffi-xcframework-
          drop_all sccache sccache
