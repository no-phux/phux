# The one validation workflow: every pull request, merge group and main push.
#
# Execution, required lanes, and receipt reuse: docs/ci.md.
name: ci

on:
  pull_request:
    # `closed` runs nothing; joining the PR's concurrency group cancels the
    # run still in flight for a merged or abandoned PR.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  push:
    branches: [main]
  # Inert until the main ruleset enables the queue. The queue waits for the
  # `ci` check on its gh-readonly-queue/main/* commit.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  # PR updates/closes and dispatches share repo:head-ref; queue refs stay unique.
  # Every main SHA retains its push CI: routing is per-push, so replacing a
  # pending push would drop its validation and content publication work.
  # Contracts and key boundaries: docs/ci.md#concurrency.
  group: >-
    ci-${{ github.event_name == 'push' && github.sha
    || github.event_name == 'pull_request' && format('{0}:refs/heads/{1}', github.event.pull_request.head.repo.full_name, github.head_ref)
    || github.event_name == 'workflow_dispatch' && format('{0}:{1}', github.repository, github.ref)
    || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  actions: read
  contents: read

jobs:
  plan:
    # All drafts skip qualification, including release trains. Ready release
    # heads keep full qualification. Push and queue events have no draft.
    if: github.event.action != 'closed' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      guards: ${{ steps.plan.outputs.guards }}
      lint: ${{ steps.plan.outputs.lint }}
      tests: ${{ steps.plan.outputs.tests }}
      e2e: ${{ steps.plan.outputs.e2e }}
      ffi: ${{ steps.plan.outputs.ffi }}
      icount: ${{ steps.plan.outputs.icount }}
      integrations: ${{ steps.plan.outputs.integrations }}
      web: ${{ steps.plan.outputs.web }}
      native: ${{ steps.plan.outputs.native }}
      rune: ${{ steps.plan.outputs.rune }}
      rune_qualify: ${{ steps.plan.outputs.rune_qualify }}
      release_qualify: ${{ steps.plan.outputs.release_qualify }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      web_engine: ${{ steps.plan.outputs.web_engine }}
      content: ${{ steps.plan.outputs.content }}
      unit_mode: ${{ steps.plan.outputs.unit_mode }}
      unit_targets: ${{ steps.plan.outputs.unit_targets }}
      test_filterset: ${{ steps.plan.outputs.test_filterset }}
      receipt: ${{ steps.plan.outputs.receipt }}
      receipt_name: ${{ steps.plan.outputs.receipt_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tools/main.ts ci-plan

  guards:
    needs: plan
    if: needs.plan.outputs.guards == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # A docs-only diff needs only the guards that read docs, with the
      # runner's own bash and no Nix.
      - name: docs guards
        if: needs.plan.outputs.docs_only == 'true'
        run: |
          bun tools/main.ts docs-check
          bash install/test.sh
          bun tools/main.ts file-tokens-check --merge-base origin/main
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: needs.plan.outputs.docs_only != 'true'
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: needs.plan.outputs.docs_only != 'true'
        with:
          name: phux
          pushFilter: '(-source$|nixpkgs\.tar\.gz$)'
      # The pinned nixpkgs tools, not the devshell: guards compile nothing.
      # PHUX_TEST_REAL_MINISIGN turns the installer's signature-check skip
      # into a failure.
      - name: just guards
        if: needs.plan.outputs.docs_only != 'true'
        env:
          PHUX_TEST_REAL_MINISIGN: "1"
        run: |
          nix shell --inputs-from . nixpkgs#actionlint nixpkgs#shellcheck nixpkgs#just \
            nixpkgs#nodejs_26 nixpkgs#python3 nixpkgs#jq nixpkgs#minisign -c just guards

  lint:
    name: rust lint
    needs: plan
    if: needs.plan.outputs.lint == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-lane
        id: lane
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-lane: check
      - run: nix develop -c just rust-lint
      - &mbx-export-headroom
        name: leave disk for the mbx objects export
        if: steps.lane.outputs.cache-save-eligible == 'true' && steps.lane.outputs.cache-hit != 'true'
        run: bun tools/main.ts mbx-export-headroom

  # One compile of the test profile, archived for the tests and e2e jobs. The
  # mbx store lets a PR recompile only the crates its diff reaches.
  test-build:
    name: rust test build
    needs: plan
    if: needs.plan.outputs.tests == 'true' || needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-lane
        id: lane
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-lane: test
      - name: just test-archive
        env:
          PHUX_UNIT_MODE: ${{ needs.plan.outputs.unit_mode }}
          PHUX_UNIT_TARGETS: &unit-targets ${{ needs.plan.outputs.unit_targets }}
          PHUX_E2E: ${{ needs.plan.outputs.e2e }}
          PHUX_TEST_ARCHIVE: ${{ runner.temp }}/phux-tests.tar.zst
        run: nix develop -c just test-archive
      # Already zstd. One retry: a single CreateArtifact ECONNRESET once lost a
      # finished build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        continue-on-error: true
        with:
          name: phux-tests
          path: ${{ runner.temp }}/phux-tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.upload.outcome == 'failure'
        with:
          name: phux-tests
          path: ${{ runner.temp }}/phux-tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      - *mbx-export-headroom

  # The archive runs in count partitions: one 4-vCPU runner took 263 s for
  # 7185 tests (run 41886342790), most of the critical path after the build.
  tests:
    name: rust tests (${{ matrix.shard }}/3)
    needs: [plan, test-build]
    if: needs.plan.outputs.tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-lane
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          build-cache: none
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phux-tests
          path: ${{ runner.temp }}
      - name: just test
        env:
          NEXTEST_PROFILE: ci
          PHUX_NEXTEST_FILTERSET: ${{ needs.plan.outputs.test_filterset }}
          PHUX_UNIT_MODE: ${{ needs.plan.outputs.unit_mode }}
          PHUX_UNIT_TARGETS: *unit-targets
          PHUX_TEST_ARCHIVE: ${{ runner.temp }}/phux-tests.tar.zst
          PHUX_NEXTEST_PARTITION: count:${{ matrix.shard }}/3
        run: nix develop .#test-archive -c just test

  # Serial e2e took 185 s on one runner (41886342790); split across two.
  e2e:
    name: rust e2e (${{ matrix.shard }}/2)
    needs: [plan, test-build]
    if: needs.plan.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-lane
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          build-cache: none
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phux-tests
          path: ${{ runner.temp }}
      - name: just e2e
        env:
          NEXTEST_PROFILE: ci
          PHUX_UNIT_TARGETS: *unit-targets
          PHUX_TEST_ARCHIVE: ${{ runner.temp }}/phux-tests.tar.zst
          PHUX_NEXTEST_PARTITION: count:${{ matrix.shard }}/2
        run: nix develop .#test-archive -c just e2e

  # phux-client-ffi with the mobile artifact's features shares no artifacts
  # with the unit pool.
  ffi:
    name: rust ffi
    needs: plan
    if: needs.plan.outputs.ffi == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-lane
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-lane: uniffi
          build-cache: deps
      - run: nix develop -c just binding-uniffi-test

  # x86_64 callgrind counts: the checked-in baseline is an x86_64 number.
  icount:
    name: rust icount
    needs: plan
    if: needs.plan.outputs.icount == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-lane
        id: lane
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-lane: icount
      - name: just perf-icount
        env:
          # A label is read from the next pull_request event; add it, then push.
          PHUX_PERF_BASELINE_UPDATE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'perf-baseline') && '1' || '0' }}
          PHUX_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: nix develop -c just perf-icount
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-icount
          path: target/perf-icount/iai.jsonl
          if-no-files-found: ignore
          retention-days: 14
      - *mbx-export-headroom

  integrations:
    name: agent integrations
    needs: plan
    if: needs.plan.outputs.integrations == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before setup-node: the installer's PATH entries otherwise put the
      # image's /usr/local/bin/node (22) ahead of setup-node's 26.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # No npm cache: a PR-scoped entry is unrestorable after the PR closes
      # and only evicts main's build caches.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: ./.github/actions/setup-bun
      # The npm agent-integration-release.yml packs and publishes with, so a
      # change that only breaks under it fails here instead of at release.
      - run: npm install --global npm@12.2.1
      # Only just from the pinned nixpkgs; Node, npm and Bun stay the ones above.
      - run: nix shell --inputs-from . nixpkgs#just -c just agent-integrations-check

  # `just web-check` still runs both. The cache action saves only from main.
  web-vt:
    name: web (vt)
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web-cache
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-key: phux-web-vt
          workspaces: clients/phux-vt-web
      - name: just web-vt-check
        env:
          PHUX_WEB_ENGINE: ${{ needs.plan.outputs.web_engine == 'true' && '1' || '0' }}
          PHUX_TOOLCHAIN_DIR: ${{ runner.temp }}/phux-toolchains
        run: nix develop -c just web-vt-check

  web-client:
    name: web (client + browser)
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web-cache
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-key: phux-web-client
          workspaces: |
            clients/phux-web
            . -> target/web-native
      - name: just web-client-check
        run: nix develop .#browser -c just web-client-check

  # A clean contributor machine: rustup, the pinned Zig, no Nix, no cache.
  native:
    name: native setup
    needs: plan
    if: needs.plan.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The smoke CLI only runs --version.
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config mold curl xz-utils
      - run: bash dev/test-dev-setup.sh
      - run: |
          bash dev/setup-rust.sh native
          bash dev/install-zig.sh "$RUNNER_TEMP/phux-toolchains" >> "$GITHUB_PATH"
      # `just native-smoke`, without installing just.
      - run: bash dev/native-smoke.sh

  # Fast-path PRs skip packaging and the second Linux host.
  rune:
    needs: plan
    if: needs.plan.outputs.rune == 'true'
    uses: ./.github/workflows/rune-build.yml
    with:
      hosts: linux
      ios: false
      qualify: ${{ needs.plan.outputs.rune_qualify == 'true' }}

  # Apple proof: the queue and release-bot PRs. Main pushes qualify the rest.
  queue-apple:
    name: queue-apple
    needs: plan
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && needs.plan.outputs.release_qualify == 'true' && needs.plan.outputs.rune == 'true')
    uses: ./.github/workflows/rune-macos.yml
    with:
      qualify: true

  # The required check. The ruleset matches this display name.
  ci:
    # Fresh drafts leave ci absent. This cannot revoke older same-SHA checks:
    # automated arming must first pass pr-ready-ci (docs/ci.md).
    name: ${{ github.event.pull_request.draft && 'ci (draft)' || 'ci' }}
    needs: [plan, guards, lint, test-build, tests, e2e, ffi, icount, integrations, web-vt, web-client, native, rune, queue-apple]
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Strict CI aggregate v2
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          RECEIPT: ${{ needs.plan.outputs.receipt }}
        run: bun tools/main.ts ci-aggregate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.plan.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        with:
          name: ${{ needs.plan.outputs.receipt_name }}
          path: ${{ runner.temp }}/receipt/receipt.json
          # A rerun shares its run id and tree; replace only after a pass.
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  # A green main push that touched docs, installers, or product skills
  # republishes them: no-phux/website rebuilds phux.sh, and no-phux/skills
  # mirrors the product skills.
  content:
    name: publish content
    needs: [plan, ci]
    # always(): an implicit success() also requires every skipped lane.
    if: always() && github.event_name == 'push' && needs.plan.outputs.content == 'true' && needs.ci.result == 'success'
    uses: ./.github/workflows/publish-content.yml
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # mbx saves when its key changes (UTC day, Cargo.lock, flake.lock). After
  # post-step uploads, prune only main entries with actual replacement proof;
  # otherwise keep the newest older restore source for each known prefix.
  prune-build-cache:
    name: prune superseded build caches
    needs: [lint, test-build, ffi, icount]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bun tools/main.ts prune-build-cache
