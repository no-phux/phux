name: rune-macos

# Rune's macOS legs, off the pull-request and main-push `ci` gate.
#
# A pull request reports a passing check named `rune-macos` and starts no
# macOS runner. On the queue, ci.yml calls this workflow and requires its
# result in the existing `ci` aggregate. A main push, a nightly run, and a dispatch
# run macos-arm64 and the iOS simulator through rune-build.yml. A direct push
# to main can land a red result: that blocks a release whose closure includes
# Rune, and it does not block main.
on:
  pull_request:
    # `closed` runs nothing; it joins the pull request's group and cancels
    # the run still in flight.
    types: [opened, synchronize, reopened, ready_for_review, closed]
  push:
    branches: [main]
  # Only ci calls the queue leg, avoiding a duplicate standalone native run.
  workflow_call:
  schedule:
    # After cache-warm's 06:17 UTC, so the two macOS passes do not start together.
    - cron: "47 11 * * *"
  workflow_dispatch:

concurrency:
  # Preserve every push SHA, including a pending native change followed by
  # docs-only work. Neither actor identity nor a later push waives its proof.
  # Prefix differs from the calling ci workflow, so it cannot cancel itself.
  group: >-
    rune-macos-${{ github.event_name == 'push' && github.sha
    || github.event_name == 'pull_request' && format('{0}:refs/heads/{1}', github.event.pull_request.head.repo.full_name, github.head_ref)
    || github.event_name == 'workflow_dispatch' && format('{0}:{1}', github.repository, github.ref)
    || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  actions: read
  contents: read

jobs:
  plan:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.plan.outputs.macos }}
      ios: ${{ steps.plan.outputs.ios }}
      coverage: ${{ steps.plan.outputs.coverage }}
      receipt: ${{ steps.plan.outputs.receipt }}
      receipt_name: ${{ steps.plan.outputs.receipt_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tools/main.ts rune-macos-plan

  build:
    needs: plan
    # The event check is the hard stop. The plan's macos output is the
    # second: a pull request's plan is false, and a main push whose tree a
    # merge group already covered is false too.
    if: github.event_name != 'pull_request' && needs.plan.outputs.macos == 'true'
    uses: ./.github/workflows/rune-build.yml
    with:
      hosts: macos
      ios: ${{ needs.plan.outputs.ios == 'true' }}

  rune-macos:
    name: rune-macos
    needs: [plan, build]
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: plan succeeded; macOS legs passed or were not needed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<<"$RESULTS"
          jq -e '.plan.result == "success" and ([.[].result] | all(. == "success" or . == "skipped"))
            and (.plan.outputs.macos != "true" or .build.result == "success")' \
            <<<"$RESULTS" >/dev/null
      - name: write the validation receipt
        if: github.event_name == 'merge_group' && needs.plan.outputs.coverage != ''
        env:
          RECEIPT: ${{ needs.plan.outputs.receipt }}
        run: |
          mkdir -p "$RUNNER_TEMP/receipt"
          printf '%s\n' "$RECEIPT" > "$RUNNER_TEMP/receipt/receipt.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'merge_group' && needs.plan.outputs.coverage != ''
        with:
          name: ${{ needs.plan.outputs.receipt_name }}
          path: ${{ runner.temp }}/receipt/receipt.json
          overwrite: true
          retention-days: 7
          if-no-files-found: error
