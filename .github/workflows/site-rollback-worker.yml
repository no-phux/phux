name: site-rollback-worker

# Roll the live-demo Worker (docs/site/worker) back to a previous version.
# Refuses to roll back across the authenticated-native baseline; use
# site-native-control for emergency containment instead.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Previously deployed Cloudflare Worker version ID
        required: true
        type: string
      reason:
        description: Rollback reason
        required: true
        type: string
      authenticated_baseline:
        description: Confirm the target version requires auth before native allocation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mini-v1-site-deploy-worker
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Refuse pre-auth rollback
        if: ${{ inputs.authenticated_baseline != true }}
        run: |
          echo "Refusing rollback without confirmation that the target preserves the native auth boundary." >&2
          echo "Use the native-control kill switch for emergency containment." >&2
          exit 1
      - name: Roll back Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          jq -n --arg version "$VERSION" --arg reason "$REASON" \
            '{strategy: "percentage", versions: [{version_id: $version, percentage: 100}], annotations: {"workers/message": $reason}}' \
            | curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "content-type: application/json" --data @- \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/phux-demo/deployments" \
            | jq -e '.success' >/dev/null
      - name: Verify authentication boundary
        run: |
          response="$(curl --fail --silent --show-error \
            --header 'Origin: https://phux.sh' \
            https://shell.phux.sh/auth/session)"
          jq -e '.authenticated == false and (keys | sort == ["authenticated"])' <<<"$response"
