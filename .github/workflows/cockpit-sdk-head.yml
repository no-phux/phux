# CI (ci.yml) builds Cockpit against the SDK sha that build.zig.zon pins today.
# That pin is a tarball sha, not a branch, so a push to the fork can never break
# a checkout of Cockpit — it defers the breakage to whoever next bumps the pin,
# which is where the signal is worth the least.
#
# This workflow builds Cockpit against the fork's CURRENT cockpit branch head
# instead, so an SDK change that Cockpit cannot compile against is visible while
# it is still the SDK's change. It is the only automated consumer test the fork
# has: the fork's own suite passes on changes that break its only downstream app
# (observed 2026-08-11, when `web_panes` gained a ChromeContext parameter).
#
# A failure here means the fork moved, not that Cockpit is broken. Cockpit's own
# PRs stay green until someone runs scripts/repoint-sdk.sh. See docs/SDK_PIN.md.
name: Cockpit SDK HEAD

on:
  # Optional SDK-head experiments are manual to reduce redundant rebuilds.
  workflow_dispatch:
    inputs:
      ref:
        description: 'SDK ref to build against ("auto" = newest cockpit/v* branch)'
        required: false
        default: auto
        type: string

permissions:
  contents: read

# Never cancel in progress: a manual run that another dispatch cancels reports no
# result at all, which is indistinguishable from the failure this job exists to
# catch.
concurrency:
  group: mini-v1-cockpit-sdk-head
  cancel-in-progress: false

jobs:
  build:
    name: Cockpit vs SDK branch head
    runs-on: macos-26
    # 45 minutes, matching ci.yml. Measured against the run that is a superset
    # of every step below except packaging:
    # The standalone repository's measured cold job total was 12m23s:
    # Cold job total 12m23s: setup 26s, phux-client-ffi 4m23s, null-platform
    # tests 2m28s, phux-provider tests 1m55s, package+soak 2m45s. This job drops
    # packaging and adds two exe builds, so it lands in the same band, and the
    # ceiling is there to kill a hung run rather than to bound a healthy one.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          # The action's default cache keys each save on run_id, so a
          # restore never hits and every job writes up to 2 GiB
          # (phux-6khi). The actions/cache step below is the reusable one.
          use-cache: false
      # Same caches as cockpit-ci.yml: the FFI build shares cockpit-ci's
      # macOS `mini-v1-cockpit-ffi` rust-cache (same profile, same fleet), and the
      # Zig caches key on the CHECKED-OUT build manifest — the repoint below
      # rewrites build.zig.zon after this restore. The stable prefix supplies
      # the latest compatible cache when the manifest hash rotates.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: mini-v1-cockpit-ffi
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            clients/cockpit/.zig-cache
            clients/cockpit/.zig-global-cache
          key: mini-v1-cockpit-zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('clients/cockpit/build.zig', 'clients/cockpit/build.zig.zon') }}
          restore-keys: |
            mini-v1-cockpit-zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-
      # Resolve and repoint before the FFI build, so a fork that renamed its
      # cockpit branches fails in 5 seconds rather than after 4 minutes of cargo.
      # This step also writes the run summary — pin, branch head, and the command
      # to bump — because everything a reader of a FAILED run needs is known
      # here, before the build, rather than from a trailing step that would have
      # to survive the failure it reports on.
      - name: Repoint the SDK dependency at the fork's branch head
        working-directory: clients/cockpit
        run: ./scripts/repoint-sdk.sh --ref "${SDK_REF}"
        env:
          SDK_REF: ${{ inputs.ref || 'auto' }}
      # Repointing rewrites build.zig.zon but does not create an SDK source
      # checkout. Materialize that newly-written pin through the same helper as
      # ci.yml, so host-raster-check.sh keeps enforcing its normal refusal to
      # measure another commit or a checkout with local source changes.
      - name: Materialize the SDK branch head source
        working-directory: clients/cockpit
        run: ./scripts/build-automation-cli.sh --checkout-only
      # Compile the branch head's real AppKit host into the headless CoreText
      # harness. This catches a glyph-weight regression while it is still the
      # SDK's change instead of waiting for Cockpit's next pin-bump PR.
      - name: Check the SDK branch head's glyph weight
        working-directory: clients/cockpit
        run: |
          defaults -currentHost read -g AppleFontSmoothing 2>/dev/null \
            || echo 'AppleFontSmoothing: unset (the state the floor was derived on)'
          ./scripts/host-raster-check.sh --min-solid 4000
      - name: Build the same-checkout Phux FFI and coordinator CLI
        run: bash clients/cockpit/scripts/build-phux-artifacts.sh
      - name: Test with the null platform
        working-directory: clients/cockpit
        run: ./scripts/zig-build.sh test -Dplatform=null --summary all
      - name: Test the production Phux provider
        working-directory: clients/cockpit
        run: |
          ./scripts/zig-build.sh test \
            -Dplatform=null \
            -Dphux-enabled=true \
            --summary all
      # `zig build test` compiles the test root, not the macOS executable, and
      # the platform layer is where an SDK signature change lands. Build the real
      # arm64 binary on both graphs so a break in AppKit-only code is caught here
      # rather than by the next person to run `zig build`.
      - name: Build the macOS executable, local terminal graph
        working-directory: clients/cockpit
        run: ./scripts/zig-build.sh --summary all
      - name: Build the macOS executable, production Phux graph
        working-directory: clients/cockpit
        run: bash ./scripts/build-shipping-app.sh --summary all
