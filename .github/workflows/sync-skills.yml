# sync-skills — one-way publish mirror of allowlisted product skills to
# no-phux/skills (the `npx skills add no-phux/skills` install surface).
#
# This is the same idea as no-phux/homebrew-tap: phux remains the source of
# truth; this workflow generates the public tree and pushes it. Do not use
# git submodules or subtrees.
#
# Every main push is wrong: it burns a runner and mints an App token even
# when the inner `git diff --cached --quiet` no-ops. Path-filter like
# site-deploy so we only run when product-skill publish inputs change.
# workflow_dispatch is the manual backstop. The export script still no-ops
# if the mirror bytes are unchanged.
#
# ONE-TIME SETUP: install the Release App on no-phux/skills (or on all
# no-phux repositories). The same RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY
# pair used by release-please.yml mints a token scoped to that repo. Without
# the installation, token minting fails closed at the require step.

name: sync-skills

on:
  push:
    branches: [main]
    paths:
      - ".agents/skills/using-phux/**"
      - ".agents/skills/using-phux-mcp/**"
      - "scripts/product-skills"
      - "scripts/export-product-skills.sh"
      - "scripts/skills-package/**"
      - ".github/workflows/sync-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mini-v1-sync-skills
  cancel-in-progress: false

jobs:
  sync:
    name: export and push no-phux/skills
    runs-on: ubuntu-24.04
    steps:
      # Fail closed and loudly if the App is not configured, rather than
      # falling back to GITHUB_TOKEN (which cannot write no-phux/skills).
      - name: Require the release App
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APP_ID}" ] || [ -z "${APP_KEY}" ]; then
            echo "::error::RELEASE_APP_ID (variable) and RELEASE_APP_PRIVATE_KEY (secret) must be set. See this workflow's header comment."
            exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          # v3 deprecated `app-id` in favor of `client-id`. The JWT issuer claim
          # accepts the numeric App ID and the Iv1-style Client ID alike, so the
          # existing RELEASE_APP_ID variable works unchanged.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: no-phux
          repositories: skills

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: no-phux/skills
          token: ${{ steps.app-token.outputs.token }}
          path: .skills-mirror
          persist-credentials: true

      - name: Export product skills
        run: bash scripts/export-product-skills.sh .skills-mirror

      - name: Commit and push if the mirror changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          shortsha="$(git rev-parse --short HEAD)"
          cd .skills-mirror
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "skills mirror already in sync"
            exit 0
          fi
          git commit -m "sync: product skills from no-phux/phux@${shortsha}"
          git push
