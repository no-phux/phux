name: site-native-control

# Operator kill switch for native shells on the live demo (docs/site/worker).
# The edge fallback stays live either way; this only gates native containers.

on:
  workflow_dispatch:
    inputs:
      enabled:
        description: Native admission state (edge fallback remains live)
        required: true
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

concurrency:
  group: mini-v1-site-deploy-worker
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: docs/site
        run: bun install --frozen-lockfile
      - name: Install infra dependencies
        working-directory: docs/site/infra
        run: bun install --frozen-lockfile
      # Redeploys the stack with NATIVE_ENABLED overridden (infra/demo.run.ts).
      # Native is parked by default: an ordinary site-deploy-worker run reads the
      # PHUX_NATIVE_ENABLED repository variable, which this dispatch does not
      # change. Set that variable (true) to make a re-enable survive deploys.
      - name: Deploy native kill-switch setting
        working-directory: docs/site/infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PHUX_NATIVE_ENABLED: ${{ inputs.enabled }}
        run: |
          bunx alchemy deploy demo.run.ts --stage prod --yes --no-input
          {
            echo "Native admission deployed as \`${{ inputs.enabled }}\` for this deploy."
            echo "Persistence: \`gh variable set PHUX_NATIVE_ENABLED --body \"${{ inputs.enabled }}\"\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify edge remains healthy
        working-directory: docs/site
        env:
          PHUX_NATIVE_WS: wss://shell.phux.sh/session?mode=native
          PHUX_ALLOWED_ORIGIN: https://phux.sh
          PHUX_SYNTHETIC_TOKEN: ${{ secrets.PHUX_SYNTHETIC_TOKEN }}
        run: |
          health="$(curl --fail --silent --show-error https://shell.phux.sh/healthz)"
          jq -e --argjson enabled "${{ inputs.enabled }}" '.nativeEnabled == $enabled' <<<"$health"
          if [[ "${{ inputs.enabled }}" == "true" ]]; then
            bun run scripts/smoke-native.ts
          else
            bun run scripts/smoke-native.ts --expect-edge
          fi
