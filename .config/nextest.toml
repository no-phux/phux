# nextest configuration. See https://nexte.st/docs/configuration/

[profile.default]
# Workspace-wide default: surface flakes promptly, no blanket retries.
retries = 0

# PTY-backed integration tests each spawn a real pseudo-terminal: a blocking
# reader thread, a server task, and a per-pane libghostty actor. Running two at
# once on the 2-core CI runner oversubscribes those threads and starves the
# timing-sensitive ones past their deadlines (WIRE_RECV_TIMEOUT / poll_for_echo)
# — the root cause behind the route_input / reconnect / attach-churn flakes that
# previously needed per-test `retries` band-aids and quarantines.
#
# Bound the whole phux-server integration-test set (tests/*.rs) to one at a
# time. nextest's global test-threads still fills the second core slot with a
# non-group test, so wall-clock barely moves on 2 cores, but no PTY test ever
# runs alongside another — which is what was breaking. Everything else (lib unit
# tests, other crates) stays fully parallel. New PTY tests are covered
# automatically by the filter; no per-test pinning to maintain.
#
# A larger CI runner (>= 4 cores) would let these run parallel again; if that
# lands, raise `max-threads` or drop the group.
[test-groups]
pty-serial = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(phux-server) & kind(test)'
test-group = 'pty-serial'

# One LIB test needs the same treatment, and the filter above misses it
# because `kind(test)` selects integration targets (tests/*.rs) only.
#
# `pane_kill_lets_foreground_process_flush_before_death` spawns a real
# `/bin/sh` under `set -m`, hangs it up, and asserts the foreground job wrote
# its flush marker. What it is really asserting is that the process got
# scheduled inside `PANE_KILL_GRACE` — a deliberate 500ms product budget
# ("kept short so pane close stays snappy"), not a test constant. Competing
# with fifteen other tests for CPU, a shell can miss that window purely
# through starvation, and the assertion then fails with an empty marker while
# the product behaved exactly as designed.
#
# `test-group` alone is NOT enough here, and it is worth saying why: a group
# with `max-threads = 1` only serialises members against EACH OTHER, so this
# test still ran alongside fifteen unrelated ones and still lost the race
# (measured: 2 failures in 3 full-suite runs with the group applied).
# `threads-required = 'num-cpus'` is the knob that actually clears the
# machine for it.
#
# Giving it the whole thread budget is the honest fix. Lengthening the grace
# would change shipped behavior to suit a test, and lengthening the test's
# own timeouts does nothing — no timeout is what fires; the final assertion
# is, with an empty marker.
[[profile.default.overrides]]
filter = 'package(phux-server) & test(pane_kill_lets_foreground_process_flush_before_death)'
threads-required = 'num-cpus'

# `agent_detect` needs the same treatment, for the same reason, and the
# measurement that justifies it is worth recording (phux-manu).
#
# These tests run a real agent process that paints a real permission dialog,
# then wait for the server-side detector to scan the grid and publish
# `state: "blocked"`. Every observed failure is the same shape — the record
# arrives as `{"kind":"claude","name":"claude","state":"idle"}`, meaning the
# identity was detected but the derivation never ran in time. That is a
# scheduling symptom, not a logic one.
#
# Measured on a developer box deliberately loaded to a ~18 load average (many
# concurrent cargo builds): 2 of 5 runs failed, and all three detector tests
# failed together when they failed. The same runs on an idle machine pass.
# `pty-serial` alone does not help here for the reason the block above already
# documents: a `max-threads = 1` group only serialises members against EACH
# OTHER, so these still ran alongside every non-group test in the pool.
#
# The convergence poll in the test (`await_agent_state`) is a real and separate
# fix — sampling only the FIRST published record raced the detector's
# idle-then-blocked convergence — but it is not sufficient on its own, because
# under starvation the detector does not converge within the deadline at all.
# Lengthening DETECT_DEADLINE would only hide that.
[[profile.default.overrides]]
filter = 'package(phux-server) & binary(agent_detect)'
threads-required = 'num-cpus'

# The `hub::link` ssh-transport tests need it too, and this one is contention,
# not a race — the measurement says so plainly.
#
# These are LIB tests, so `kind(test)` above does not reach them, and each of
# them spawns a real child process: a `/bin/sh` stub standing in for `ssh` via
# the `$PHUX_SSH` seam. Their assertions poll `wait_for_real_status`, whose
# deadline is 10s.
#
# Measured across full-suite `cargo nextest run -p phux-server` runs on a
# 14-core box under a 70-120 load average (many concurrent cargo builds):
#
#   ssh_transport_holds_a_live_child_as_connected              0.56s -> 5.65s
#   ssh_transport_drains_stderr_past_the_pipe_buffer...        0.31s -> 6.32s
#   ssh_transport_spawns_the_planned_argv_and_treats_exit...   0.38s -> 6.44s
#   ssh_transport_missing_program_is_a_failed_attempt...       0.30s -> 0.12s
#
# The three that spawn a stub degraded 15-20x together, to within a third of
# the 10s deadline; the fourth — which deliberately spawns NOTHING, pointing
# `ssh_program` at a nonexistent path — was unaffected. That split is the
# whole diagnosis: the cost is child-process startup under an oversubscribed
# pool, not anything in the link supervisor. Nothing here races. The one
# ordering hazard the code could have had (the argv-recording stub being
# re-spawned by a redial and truncating `argv.txt` under the reader) cannot
# occur: the supervisor task and the polling test share one current-thread
# runtime, and there is no await between observing `Backoff` and reading the
# file, so the supervisor cannot run in that gap.
#
# `threads-required` and not `pty-serial`, for the reason the two blocks above
# already establish: a `max-threads = 1` group only serialises members against
# EACH OTHER, and the load starving these tests comes from the whole pool.
# Lengthening the 10s deadline is the other obvious move and is the wrong one
# — it does not stop the starvation, it just waits longer for it, and the
# margin it would need is unbounded in the load.
#
# The prefix filter takes all four rather than naming the three, so a future
# ssh-transport test is covered without maintenance; including the
# non-spawning one costs ~0.1s of exclusive machine time.
[[profile.default.overrides]]
filter = 'package(phux-server) & test(ssh_transport_)'
threads-required = 'num-cpus'

# The auto-spawn suites in `package(phux)` need it too, and it is the same
# product-budget-versus-starvation shape the three blocks above describe.
#
# These drive the REAL binary through `phux new --socket ...` (via the shared
# `common::AutoSpawnedServer` helper), which auto-spawns a server and waits
# `AUTO_SPAWN_SOCKET_TIMEOUT` for it to bind. That 2s is a deliberate product
# budget — `commands/server.rs` says so: "the server's bind is sub-ms on a
# healthy system; 2s tolerates a slow-CI host without making a failed spawn
# feel like a hang." Under an oversubscribed pool a cold process spawn plus
# socket bind does not fit in it, and the test fails at its FIRST assertion
# with the CLI's own no-server document:
#
#   phux new must start a server.
#   stderr: {"error":{"code":"no_server", ...}}
#
# Measured on this 14-core box, isolated versus inside a full-suite run:
#
#   service_reconcile reconcile_corrects_the_policy_without_stopping_server  6.23s -> 21.23s (pass)
#   service_reconcile reconcile_says_whether_the_new_policy_is_in_force      6.39s -> 10.86s FAIL
#   stale_socket_recovery a_second_invocation_reuses_the_live_server         6.61s -> 10.12s FAIL
#   stale_socket_recovery auto_spawn_reaps_a_stale_socket_instead_of_wedging 5.03s -> 12.22s FAIL
#   stale_socket_recovery sigterm_unlinks_the_socket...                      4.37s -> 17.44s FAIL
#
# All of them pass isolated. Nothing here races — the degradation is uniform,
# and it is process-startup cost, exactly as the `ssh_transport_` block above
# diagnoses for its own stubs.
#
# The filter names every binary that uses `AutoSpawnedServer`, not just the
# ones observed failing. That distinction is load-bearing: covering only the
# observed two left `kill_server_e2e` — same helper, same budget — to fail on
# the very next full run as the pool composition shifted. The property is
# "drives the CLI auto-spawn path against a shipped 2s budget", so the filter
# is the set that has that property. (`first_five_minutes_e2e` and
# `idle_exit_e2e` are `#[ignore]`d into the e2e lane, which is already
# `--test-threads=1`, so their entry is inert today and correct if they are
# ever un-ignored.)
#
# `threads-required` and not `pty-serial`, for the reason already established
# twice above: a `max-threads = 1` group only serialises members against EACH
# OTHER, and the load starving these comes from the whole pool. Lengthening
# `AUTO_SPAWN_SOCKET_TIMEOUT` is the other obvious move and is the wrong one —
# it changes shipped behavior to suit a test, and the margin it would need is
# unbounded in the load.
[[profile.default.overrides]]
filter = """package(phux) & (
    binary(stale_socket_recovery) + binary(service_reconcile)
  + binary(kill_server_e2e) + binary(service_install_guard)
  + binary(first_five_minutes_e2e) + binary(idle_exit_e2e)
)"""
threads-required = 'num-cpus'

# The `ci` profile is behavior-identical to `default` — nextest consults the
# selected profile's settings first and falls back to profile.default, so the
# retry policy and the pty-serial override above still apply. It exists only
# to emit a junit report that scripts/ci/summarize-job.sh folds into the CI
# job's step summary (slowest tests, flaky-retry counts). CI lanes opt in
# with NEXTEST_PROFILE=ci; local runs never select it.
[profile.ci.junit]
path = "junit.xml"
