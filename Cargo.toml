[workspace]
resolver = "3"
members = ["crates/*"]
# Browser/wasm consumers (phux-486) live under clients/ and target wasm32 only.
# They are their own cargo workspaces so the native `cargo build --workspace`
# (and CI) never tries to build wasm-bindgen crates for the host.
exclude = ["clients"]

[workspace.package]
version = "0.19.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/phall1/phux"
authors = ["Phil Hall <phallsignup@gmail.com>"]
homepage = "https://github.com/phall1/phux"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Pedantic exceptions: too noisy for our style.
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[workspace.dependencies]
# Internal.
phux-protocol = { path = "crates/phux-protocol" }
phux-record = { path = "crates/phux-record" }
phux-core = { path = "crates/phux-core" }
phux-server = { path = "crates/phux-server" }
phux-client = { path = "crates/phux-client" }
phux-client-core = { path = "crates/phux-client-core" }
phux-client-ffi = { path = "crates/phux-client-ffi" }
phux-config = { path = "crates/phux-config" }
phux-dial = { path = "crates/phux-dial" }
phux-relay = { path = "crates/phux-relay" }
phux-plugin = { path = "crates/phux-plugin" }
phux-mcp = { path = "crates/phux-mcp" }
# Fatal-signal (SIGSEGV/SIGBUS/SIGABRT) terminal restore. Apache-2.0 ONLY —
# vendored, unlike every other crate here; see crates/phux-crash/NOTICE.
phux-crash = { path = "crates/phux-crash" }
# Dev-only: phux-server's integration-test scaffolding, extracted from
# `tests/common/` so it compiles once instead of once per test binary.
phux-server-testkit = { path = "crates/phux-server-testkit" }
portable-pty-adopt = { path = "crates/portable-pty-adopt" }

# External.
thiserror = "2"
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# Non-blocking, file-backed `tracing` sink. The telemetry foundation needs
# to write logs to a file off the hot path — for the client (which must
# never touch stderr while the alt screen is up) and for a daemonized
# server whose crash must be durable on disk. `tracing-appender` is the
# canonical companion to `tracing-subscriber` (same maintainers, same
# repo), pure-safe Rust, and its `non_blocking` writer offloads file I/O
# to a background thread so a slow disk never stalls a render/PTY-pump
# thread. No alternative in the ecosystem pairs a non-blocking writer with
# the `MakeWriter` trait `tracing-subscriber` expects.
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
# `phux completion <shell>` renders the clap command tree as a shell
# completion script. First-party to clap, shares its version train, and is
# only reachable from that one subcommand — no runtime cost elsewhere.
clap_complete = "4"
bytes = "1"
slotmap = "1"
smallvec = "1.15"
proptest = "1"
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
# East Asian Width + Emoji presentation width lookup for the predict
# layer (phux-9gw.1.4). The predictive-echo state needs to know how many
# terminal cells a Unicode scalar consumes before queueing a prediction —
# width-2 CJK / emoji must advance the predict cursor by 2 cells and
# refuse to predict at `cursor_col + 2 > cols`. `unicode-width` is the
# canonical zero-dep crate for this (Unicode 16, single small table),
# used by `ratatui`, `crossterm`, and `tui-rs`. No alternative ships
# both EAW and emoji presentation tables in a single lookup.
unicode-width = "0.2"
# Grapheme-cluster segmentation for the predict layer (phux-9gw.1.6).
# Multi-codepoint graphemes (flag emoji, ZWJ family sequences, base +
# combining mark) arrive in a key event's `text` as several scalars; the
# predictive-echo state must split that text into clusters with
# `unicode-segmentation`'s `Graphemes` iterator before it can queue and
# later reconcile them as single visual cells. `unicode-width` answers
# "how wide is one scalar"; it does not group scalars into clusters, so
# the two crates are complementary. `unicode-segmentation` is the
# canonical UAX #29 implementation (used by `ratatui`, `bat`, `helix`),
# is pure-safe Rust with no C deps, and is already present in Cargo.lock
# transitively — adding it as a direct dep compiles no new crate.
unicode-segmentation = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
dhat = "0.3"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "sync", "signal", "time", "process"] }
portable-pty = "0.9"
# QR-code generation for `phux pair --qr` (phux-a9s / ADR-0031, which calls
# for showing the pairing token "as a QR / short code" with the cert
# fingerprint alongside). Encoding a QR is not a few-lines job — it needs
# Reed-Solomon error correction, bit placement, and data masking — so a
# library is the right tool. `qrcode` is pure-safe Rust (no `unsafe`, no C
# deps) and ships a built-in Unicode half-block string renderer
# (`render::unicode::Dense1x2`), exactly what a terminal QR needs. Default
# features (the `image` / `svg` renderers) are disabled — we only use the
# text renderer — so it compiles no image stack.
qrcode = { version = "0.14", default-features = false }
# Chrome-layer TUI toolkit for phux-client (status bar, dividers, overlays).
# The boundary (ADR-0020) is now compiler-enforced by the crate split: only
# `phux-client` declares `ratatui`; the pane-interior substrate lives in
# `phux-client-core`, which has no `ratatui` dependency, so a stray
# `use ratatui` there fails to compile. See epic phux-5ke. Default features
# plus `unstable-rendered-line-info`, which gates `Paragraph::line_count` —
# the wrapped-display-row count the help overlay's scroll window needs
# (phux-9adu); counting logical lines undercounts whenever a row wraps.
# "Unstable" here means semver-exempt upstream (ratatui#293), so a ratatui
# bump must re-check it; the alternative was reimplementing ratatui's word
# wrapper to count rows, which would drift from the renderer.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
# Provider-native agent restoration needs a caller-chosen UUID before spawn:
# Claude Code and Gemini both expose documented `--session-id` fresh-session
# flags, and replay the same value through `--resume`. `uuid` supplies the
# OS-random RFC 4122 v4 generation and formatting; it is already present in
# Cargo.lock transitively, so this adds no package and avoids a collision-prone
# timestamp/PID identifier.
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
# `unbounded_depth` is a feature on a dependency we already have, not a new
# crate: it adds no row to `Cargo.lock`. `phux-server`'s graceful-upgrade blob
# needs `Deserializer::disable_recursion_limit` — see the `# Depth` note in
# `crates/phux-server/src/upgrade/blob.rs` for why the default 128-level cap is
# wrong for that one parse.
serde_json = { version = "1", features = ["unbounded_depth"] }
toml = "1"
# Comment-preserving edits for user-owned config.toml. The plugin lifecycle
# commands need to toggle/add/remove `[[plugins]]` entries without flattening a
# hand-written config into a generated document; `toml_edit` is the maintained
# mutable-document companion to the TOML stack.
toml_edit = "0.23"
# The config schema already rejects unknown keys (`deny_unknown_fields`),
# but serde's error names only the leaf field — `unknown field \`wich-key\``,
# with no parent table — which is ambiguous the moment two tables share a
# key name (`enabled`, `width`, `position`). `serde_path_to_error` wraps the
# deserializer and reports the full dotted path (`keybindings.wich-key`) for
# both unknown-field and wrong-type errors. Deriving the path from the
# schema walk is the only approach that cannot drift; a hand-maintained key
# list is exactly the kind of thing that rots. One small pure-Rust crate.
serde_path_to_error = "0.1"
# libghostty is our canonical terminal backend (ADR-0008). Both phux-protocol
# and phux-server depend on it — phux-protocol re-exports types, phux-server
# drives the emulator.
libghostty-vt = { version = "0.2", git = "https://github.com/phall1/libghostty-rs.git", rev = "4404be57805aa843d04c69f5470e110e7481dd0d", default-features = false }
# PNG decoder used by the Kitty graphics replay bridge (ADR-0034). This
# matches libghostty-vt's optional PNG dependency and is enabled only for
# in-workspace/server-feature consumers that need to ingest `f=100` APC images.
png = "0.18"
# QUIC transport (phux-y8v6, ADR-0007). Shared by phux-server (the
# `QuicListener`) and phux-client (the dialer) so both ends speak the same
# stack at the same version. `rustls-ring` keeps us off quinn's default
# aws-lc-rs/cmake path; the `log` feature is deliberately omitted — it
# resolves to `tracing/log`, which feature-unification would turn on
# workspace-wide, inflating every `tracing` macro's expansion.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
# rustls 0.23 + `ring` provider: TLS 1.3 termination on the server, and the
# client-side cert verifier (fingerprint pin / loopback skip) on the dialer.
# Same features both ends so feature-unification is a no-op.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3

# Production profile for the C ABI artifact. Workspace binaries keep the
# release profile's abort policy; the FFI boundary requires unwinding so its
# catch_unwind guards can return PHUX_CLIENT_PANIC without terminating a host.
# Build with: cargo build --profile ffi-release -p phux-client-ffi
[profile.ffi-release]
inherits = "release"
panic = "unwind"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# Profile for sampling profilers (samply, perf). Inherits release codegen
# so the hot path matches production, but keeps line-table debug info and
# symbols so flame views resolve to source. See `just profile`.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
