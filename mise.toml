# The Mise environment: managed toolchains on top of your own system packages.
# `flake.nix` is the other supported environment and the fully provisioned one.
# docs/development.md#choosing-an-environment says which to pick and what each covers.
#
# Both environments are held together rather than merely documented as similar:
# `just toolchain-check` (a `just guards` gate) checks this file against the
# manifests their native consumers actually read AND against flake.nix, and
# `just toolchain-parity` compares the two resolved environments tool by tool
# when both are installed.

[tools]
# --- Compilers and runtimes -------------------------------------------------
# These change build OUTPUT, so Nix, Mise, CI and the container builders must
# resolve the same release. Rust and Zig appear here only as a convenience
# mirror: `rust-toolchain.toml` stays Cargo/rustup's authoritative input and
# `.config/zig-toolchain.json` stays the verified Zig release-and-digest input.
# `mr_boxington` routes every `cargo` this environment hands out through mbx
# (the pinned `mr-boxington` below): one shared, disk-budgeted compiler-output
# store across worktrees, managed `target/` directories that are collected when
# a checkout goes away, and a machine-wide compiler pool. See
# docs/development.md#build-cache-mbx for why phux needs it.
rust = { version = "1.99.1", mr_boxington = true }
# Ghostty's build rejects Zig 0.17; advance when its build API migration ships.
zig = "0.16.0"
node = "26"
# flake.nix reads this value directly, so the Nix shell cannot lag behind it
# the way it did at 1.3.13 while this said 1.4.0. The demo image in
# no-phux/website pins the same tag; this file does not check that image.
bun = "1.4.4"

# --- Root gate tools --------------------------------------------------------
# With these installed, the Mise path runs `just check`, not just `cargo` loops.
# Each is pinned to the release the Nix shell currently resolves, so a gate
# cannot pass in one environment and fail in the other over a linter version.
# `just toolchain-parity` is what catches them diverging on a nixpkgs bump.
just = "1.59.0"
cargo-deny = "0.20.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"
jq = "1.8.2"
python = "3.15.2"
# The usage CLI (jdx/usage) lints and renders the portable spec the phux
# binary emits. Pin the same train as the `usage-rs` crate. nixpkgs
# has lagged this CLI, so flake.nix reads this value and fetches the
# GitHub release until nixpkgs catches up — the bun pin, applied to a CLI.
usage = "7.1.4"

# --- Build cache --------------------------------------------------------------
# mbx (jdx/mr-boxington), the Cargo wrapper the `rust` entry above enables.
# flake.nix reads this pin and fetches the same release, so both environments
# wrap Cargo with the same mbx. Exact release, never `latest`.
mr-boxington = "1.29.0"

# --- Deliberately absent ----------------------------------------------------
# cargo-nextest has no prebuilt entry in Mise's registry, and the `cargo:`
# backend would build it from source — which docs/development.md specifically warns
# against, since nextest's source releases can need a newer compiler than this
# repository's Rust pin. Install the official prebuilt binary instead:
# https://nexte.st/docs/installation/pre-built-binaries/. `bash
# scripts/doctor.sh ci` reports it missing.
#
# The browser-client tools (wasm-pack, wasm-bindgen-cli, binaryen, trunk,
# chromedriver), the build-observability crates
# (cargo-llvm-lines, cargo-bloat, cargo-watch, cargo-insta, cargo-mutants),
# mold and lldb stay Nix-only or native-install. They are area tools, not root
# gate tools; `bash scripts/doctor.sh web` names browser tools with remedies.
