<!doctype html>
<!-- Interactive concept architecture: three views via ?variant=A|B|C.
     Proposed generalized substrate; not an implementation or shipping-status claim.
     Grounding: ADR-0102, ADR-0070, docs/vision.md. Open this file directly.
     Self-contained: no network requests, dependencies, or persistent state. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phux / Resource atlas</title>
<style>
:root{color-scheme:dark;--bg:#090d11;--ink:#edf3ee;--muted:#9baaa6;--green:#b5f775;--line:#33423f;--purple:#b7a3ff;--orange:#ffb077}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,#b5f77507,transparent 65%)}header{display:flex;align-items:center;justify-content:space-between;padding:28px 36px 20px;border-bottom:1px solid #25312e;gap:20px}.brand{font-size:25px;font-weight:800;letter-spacing:-2px}.brand span{color:var(--green)}.edition{font-size:10px;letter-spacing:2px;color:var(--muted)}.badge{border:1px solid #ffb07760;color:var(--orange);padding:8px 11px;font-size:10px;letter-spacing:2px}main{max-width:1640px;margin:auto;padding:26px 32px 100px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px;gap:20px}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--green)}h1{margin:9px 0 0;font-family:system-ui,sans-serif;font-weight:650;font-size:clamp(25px,3.3vw,48px);letter-spacing:-2px}.legend{display:flex;gap:20px;font-size:10px;color:var(--muted);flex-wrap:wrap}.legend i{display:inline-block;width:16px;border-top:2px solid var(--green);vertical-align:middle;margin-right:7px}.legend .future{border-top:2px dashed var(--orange)}.canvas{border:1px solid #293630;background:radial-gradient(circle,#65786d22 .7px,transparent .8px);background-size:20px 20px;border-radius:5px;overflow:auto}svg{display:block;width:100%;min-width:850px;height:auto}svg text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:var(--ink);font-size:15px}svg .small{font-size:11px;letter-spacing:1.4px;fill:var(--muted)}svg .tiny{font-size:10px;fill:var(--muted)}svg .title{font-size:24px;letter-spacing:-.7px;font-weight:650}svg .green{fill:var(--green)}svg .orange{fill:var(--orange)}svg .purple{fill:var(--purple)}.box{fill:#10171b;stroke:#34463e;stroke-width:1.3}.proposed{stroke:var(--orange);stroke-dasharray:6 5;fill:#1c1712}.shared{fill:#121d17;stroke:#b5f77580;stroke-width:1.3}.edge{fill:none;stroke:#718b7a;stroke-width:1.4;marker-end:url(#arrow)}.back{stroke:var(--purple);marker-end:url(#violet)}.future-edge{stroke:var(--orange);stroke-dasharray:5 5}.rail{stroke:#b5f775;stroke-width:2;fill:none}.pulse{stroke:var(--green);stroke-width:3;fill:none;stroke-dasharray:5 95;animation:flow 6s linear infinite;pointer-events:none}.socket{fill:#0b110e;stroke:var(--green);stroke-width:1.5}.pin{fill:var(--green)}.selectable{cursor:pointer}.selectable:hover .box,.selectable:focus-visible .box{stroke:var(--green);stroke-width:2}.selected .box{stroke:var(--green);fill:#1b2b1b}.selectable:focus-visible{outline:none}.dock{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#141d1bf5;border:1px solid #52604e;border-radius:40px;padding:7px;box-shadow:0 12px 50px #0009;max-width:calc(100vw - 24px)}button{font:inherit;cursor:pointer;color:var(--muted);background:transparent;border:0;border-radius:22px;padding:11px 18px;font-size:11px;white-space:nowrap}button:hover,button:focus-visible{color:var(--ink);background:#ffffff0b}button[aria-pressed=true]{background:var(--green);color:#11180e}.arrow{font-size:16px;padding:7px 12px}.footer{display:flex;justify-content:space-between;gap:14px;margin-top:15px;font-size:10px;letter-spacing:1px;color:var(--muted);flex-wrap:wrap}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}@keyframes flow{to{stroke-dashoffset:-200}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}@media(max-width:650px){header{padding:18px}.edition{display:none}main{padding:20px 12px 100px}.heading{display:block}.legend{margin-top:20px}button{padding:10px 11px;font-size:10px}h1{letter-spacing:-1px}.badge{font-size:8px}.footer{font-size:9px}}@media print{.dock{display:none}main{padding-bottom:0}.pulse{animation:none}}
</style>
</head>
<body>
<header><div class="brand">phux<span> /</span></div><div class="edition">RESOURCE ATLAS / 001</div><div class="badge">CONCEPT ARCHITECTURE</div></header>
<main>
<div class="heading"><div><div class="eyebrow" id="eyebrow">01 / SHARED MACHINERY</div><h1 id="heading">One substrate. Any resource.</h1></div><div class="legend"><span><i></i>EXISTING KINDS</span><span><i class="future"></i>PROPOSED EXTENSIONS</span></div></div>
<div class="canvas"><svg id="atlas" viewBox="0 0 1500 970" role="img" aria-labelledby="diagram-title diagram-description"></svg></div>
<div class="footer"><span>AUTHORITY → REPLICA · COMMANDS → AUTHORITY</span><span><a href="../adr/0102-resources-the-server-serves-kinds.md">ADR-0102</a> / <a href="../adr/0070-native-engine-state-bootstrap.md">ADR-0070</a> / <a href="../vision.md">VISION</a></span></div>
</main>
<nav class="dock" aria-label="Architecture views"><button class="arrow" id="prev" aria-label="Previous view">←</button><button data-view="A" aria-pressed="true">01 Substrate</button><button data-view="B" aria-pressed="false">02 Resource slot</button><button data-view="C" aria-pressed="false">03 Federation</button><button class="arrow" id="next" aria-label="Next view">→</button></nav>
<script>
'use strict';
const kinds=[{name:'Terminal',codec:'VT / ENGINE STATE',state:'GRID + MODES',command:'KEY / PASTE / RESIZE',mode:'STATE + REPLAY',existing:true},{name:'AgentSession',codec:'AGENT RECORDS',state:'TRANSCRIPT + STATUS',command:'KIND-DEFINED',mode:'ORDERED RECORDS',existing:true},{name:'Build',codec:'BUILD RECORDS',state:'PHASE + ARTIFACTS',command:'CANCEL',mode:'STATE + LOG',existing:false},{name:'Document',codec:'DOCUMENT OPS',state:'DOCUMENT + VERSION',command:'EDIT',mode:'KIND-DEFINED MERGE',existing:false},{name:'Telemetry',codec:'METRIC SAMPLES',state:'LATEST + WINDOW',command:'CONFIGURE',mode:'BOUNDED SAMPLES',existing:false},{name:'Your resource',codec:'YOUR CODEC',state:'YOUR STATE',command:'YOUR COMMANDS',mode:'YOUR CONTRACT',existing:false}];
let selected=2;
const svg=document.querySelector('#atlas');
let view=new URLSearchParams(location.search).get('variant')||'A';
if(!['A','B','C'].includes(view))view='A';
const defs=`<title id="diagram-title">Generalized distributed resource substrate</title><desc id="diagram-description">Concept architecture. Terminal and AgentSession are existing resource kinds. Dashed orange resources and generalized federation are proposed. Select a resource to inspect its adapter slot.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718b7a"/></marker><marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b7a3ff"/></marker></defs>`;
const text=(x,y,value,cls='',anchor='start')=>`<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${value}</text>`;
const rect=(x,y,w,h,cls='box',r=8)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" class="${cls}"/>`;
const path=(d,cls='edge')=>`<path d="${d}" class="${cls}"/>`;
const label=(x,y,value,cls='small')=>text(x,y,value,cls,'middle');
function card(x,y,w,h,title,sub,cls='box'){return rect(x,y,w,h,cls)+text(x+20,y+34,title)+text(x+20,y+58,sub,'tiny');}
function resourceRow(y){return kinds.map((k,i)=>{const x=42+i*238;return `<g class="selectable ${i===selected?'selected':''}" data-kind="${i}" tabindex="0" role="button" aria-label="Inspect ${k.name}" aria-pressed="${i===selected}">${rect(x,y,222,90,k.existing?'box':'box proposed')}${text(x+15,y+31,k.name)}${text(x+15,y+54,k.codec,'tiny')}${text(x+15,y+75,k.existing?'EXISTING KIND':'PROPOSED KIND',k.existing?'tiny green':'tiny orange')}</g>`;}).join('');}
function substrate(){
let s=text(42,38,'RESOURCE KINDS','small')+resourceRow(58);
for(let i=0;i<6;i++){const x=153+i*238;s+=path(`M${x} 148 V198`,i<2?'edge':'edge future-edge')+rect(x-9,198,18,10,'socket',2);}
s+=rect(42,216,1416,398,'shared')+text(68,253,'PHUX / RESOURCE SUBSTRATE','title green')+text(1430,250,'GENERALIZED CONTRACT','small','end');
s+=rect(68,278,1364,66,'box')+label(750,304,'RESOURCE INTERFACE','small green')+label(750,327,'IDENTITY  /  LIFECYCLE  /  BOOTSTRAP  /  OUTPUT  /  COMMANDS  /  EVENTS  /  METADATA');
const modules=[['ADDRESS + ROUTE','AUTHORITY / INCARNATION / ID'],['ATTACH + RECOVER','BOOTSTRAP / SEQUENCE / GENERATION'],['FLOW CONTROL','BOUNDS / SLOW CONSUMERS'],['AUTHORIZATION','IDENTITY / SCOPE / PERMISSION'],['DELIVERY OUTCOMES','ACCEPTED / REFUSED / UNKNOWN'],['REPLICA LIFECYCLE','SUBSCRIBE / CATCH UP / DETACH']];
modules.forEach((m,i)=>{const x=68+(i%3)*462,y=365+Math.floor(i/3)*104;s+=card(x,y,440,86,...m);});
s+=label(750,595,'KIND-DEFINED SEMANTICS · SHARED CONNECTION MACHINERY','small green');
s+=path('M750 614 V660')+rect(250,666,1000,76,'box')+label(750,694,'TRANSPORT','small')+label(750,722,'UNIX SOCKET     /     QUIC     /     TLS     /     WEBSOCKET');
s+=path('M750 742 V782')+path('M153 806 V782 H1343 V806','rail');
['DESKTOP','CLI / TUI','WEB','MOBILE','AGENT','YOUR CLIENT'].forEach((v,i)=>{const x=42+i*238;s+=card(x,806,222,86,v,'REPLICA / PROJECTION')+path(`M${x+111} 782 V806`);});
s+=path('M750 615 V660','pulse')+label(750,937,'N RESOURCE KINDS × M CLIENTS × K ROUTES','small');return s;
}
function slot(){
const k=kinds[selected];
let s=text(42,38,'RESOURCE ADAPTERS','small')+resourceRow(58);
s+=path(`M${153+selected*238} 148 V178 H750 V213`,'edge future-edge');
s+=rect(210,216,1080,242,k.existing?'box':'box proposed')+text(240,255,k.name.toUpperCase(),'title')+text(1260,251,k.existing?'EXISTING KIND':'PROPOSED KIND',k.existing?'small green':'small orange','end');
s+=card(240,278,310,84,'AUTHORITATIVE STATE',k.state)+card(595,278,310,84,'CODEC',k.codec)+card(950,278,310,84,'COMMAND HANDLER',k.command);
s+=rect(240,384,1020,49,'box')+label(750,415,'REPLICATION CONTRACT / '+k.mode,'small orange');
const pins=['IDENTITY','LIFECYCLE','BOOTSTRAP','OUTPUT','COMMANDS','EVENTS','METADATA'];
s+=text(42,494,'EXTENSION SEAM','small green')+text(1458,494,'RESOURCE-KIND SLOT','small green','end');
pins.forEach((p,i)=>{const x=300+i*150;s+=rect(x-5,450,10,25,'pin',1)+path(`M${x} 478 V526`,'rail')+rect(x-10,526,20,12,'socket',2)+label(x,564,p,'tiny');});
s+=rect(150,590,1200,225,'shared')+text(180,634,'SHARED SUBSTRATE','title green');
[['ROUTING','ADDRESS / AUTHORITY'],['RECOVERY','BOOTSTRAP / RESUME'],['SECURITY','IDENTITY / SCOPE'],['FLOW','BOUNDS / CATCH-UP']].forEach((m,i)=>s+=card(180+i*292,660,264,87,...m));
s+=label(750,790,'ONE CONNECTION MODEL · ONE RESOURCE LIFECYCLE','small green');
s+=path('M750 815 V859')+rect(380,863,740,62,'box')+label(750,901,'LOCAL CLIENT  ↔  REMOTE CLIENT  ↔  FEDERATED ROUTE');
return s;
}
function federation(){
let s=text(42,38,'GENERALIZED FEDERATION','small orange')+text(1458,38,'PROPOSED TOPOLOGY','small orange','end');
s+=rect(42,70,410,283,'box')+text(68,109,'LAPTOP','title')+text(68,136,'AUTHORITY / A','small');
s+=card(68,163,358,73,'Terminal','AUTHORITATIVE RESOURCE')+card(68,251,358,73,'AgentSession','AUTHORITATIVE RESOURCE');
s+=rect(1048,70,410,283,'box proposed')+text(1074,109,'DEVBOX','title')+text(1074,136,'AUTHORITY / B','small');
s+=card(1074,163,358,73,'Build','AUTHORITATIVE RESOURCE','box proposed')+card(1074,251,358,73,'Your resource','AUTHORITATIVE RESOURCE','box proposed');
s+=rect(545,380,410,186,'shared')+label(750,424,'PHUX HUB','title green')+label(750,458,'IDENTITY + AUTHORIZATION','small')+label(750,487,'RESOURCE ROUTING','small')+label(750,536,'OPAQUE PAYLOADS','small green');
s+=path('M247 353 V473 H545')+path('M1253 353 V473 H955','edge future-edge')+label(389,452,'RESOURCE STREAM','tiny')+label(1114,452,'RESOURCE STREAM','tiny');
s+=rect(545,70,410,225,'box proposed')+label(750,109,'EDGE / VM','title')+label(750,136,'AUTHORITY / C','small')+card(573,163,354,94,'Telemetry','AUTHORITATIVE RESOURCE','box proposed');
s+=path('M750 295 V380','edge future-edge')+text(770,340,'QUIC / TLS','tiny');
s+=path('M670 566 V648 H375 V723')+path('M830 566 V648 H1125 V723')+label(375,680,'BOOTSTRAP + CHANGES','small green')+label(1125,680,'BOOTSTRAP + CHANGES','small green');
s+=rect(150,729,450,145,'box')+label(375,766,'HUMAN CLIENT','title')+label(375,803,'REPLICA / VIEW','small')+label(375,841,'A:TERMINAL  /  B:BUILD  /  C:TELEMETRY','tiny');
s+=rect(900,729,450,145,'box')+label(1125,766,'AGENT CLIENT','title')+label(1125,803,'REPLICA / CONTROL','small')+label(1125,841,'A:AGENTSESSION  /  B:YOUR RESOURCE','tiny');
s+=path('M610 794 H715 V586','edge back')+path('M890 794 H785 V586','edge back')+label(750,709,'COMMANDS','tiny purple');
s+=path('M247 353 V473 H545','pulse')+path('M750 566 V620','pulse');
s+=label(750,922,'RESOURCE ADDRESS / AUTHORITY + INCARNATION + RESOURCE ID','small');return s;
}
const views={A:{title:'One substrate. Any resource.',eyebrow:'01 / SHARED MACHINERY',render:substrate},B:{title:'The parking spot.',eyebrow:'02 / RESOURCE-KIND SLOT',render:slot},C:{title:'Same contract. Anywhere.',eyebrow:'03 / FEDERATED AUTHORITIES',render:federation}};
function render(){const current=views[view];document.querySelector('#heading').textContent=current.title;document.querySelector('#eyebrow').textContent=current.eyebrow;svg.innerHTML=defs+current.render();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));}
function navigate(next){view=next;const url=new URL(location.href);url.searchParams.set('variant',view);history.replaceState(null,'',url);render();}
function cycle(delta){const keys=Object.keys(views);navigate(keys[(keys.indexOf(view)+delta+keys.length)%keys.length]);}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.view)));
document.querySelector('#prev').addEventListener('click',()=>cycle(-1));document.querySelector('#next').addEventListener('click',()=>cycle(1));
function inspect(target){const item=target.closest('[data-kind]');if(!item)return;selected=Number(item.dataset.kind);navigate('B');const focused=svg.querySelector(`[data-kind="${selected}"]`);focused.focus();}
svg.addEventListener('click',e=>inspect(e.target));
svg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inspect(e.target);}});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowRight')cycle(1);if(e.key==='ArrowLeft')cycle(-1);});
window.addEventListener('popstate',()=>{const next=new URLSearchParams(location.search).get('variant');view=views[next]?next:'A';render();});
render();
</script>
</body>
</html>
